<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>間違い探し</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; touch-action: none; background: #000; font-family: sans-serif; }
    #game-container {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }
    #game-container canvas {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1 !important;
    }
    #ui-layer {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      color: white;
      font-size: 24px;
      font-weight: bold;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
      pointer-events: none;
    }
    #start-overlay, #result-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      pointer-events: auto;
    }
    /* エラー表示用のオーバーレイ */
    #error-overlay {
      position: fixed;
      inset: 0;
      background: #e74c3c;
      display: none; /* 初期は非表示 */
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 99999;
      pointer-events: auto;
      text-align: center;
      padding: 20px;
    }
    #error-overlay h1 {
      color: white;
      font-size: 30px;
      margin-bottom: 20px;
      text-shadow: 0 2px 5px rgba(0,0,0,0.5);
      white-space: normal;
    }
    #error-overlay p {
      color: white;
      font-size: 20px;
      font-weight: bold;
    }

    button {
      padding: 15px 40px;
      font-size: 24px;
      font-weight: bold;
      color: white;
      background: #ff4757;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      transition: transform 0.1s;
    }
    button:active {
      transform: scale(0.95);
    }
    h1:not(#error-overlay h1) {
      color: white;
      margin-bottom: 30px;
      font-size: 32px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
      text-align: center;
      white-space: pre-wrap;
      line-height: 1.5;
    }

    #result-title {
      color: #FFF500;
      font-weight: 900;
      font-size: 38px;
      text-shadow: 
        2px 2px 0 #FF4757, -2px -2px 0 #FF4757, 
        2px -2px 0 #FF4757, -2px 2px 0 #FF4757, 
        0 8px 15px rgba(0,0,0,0.8);
      animation: pulse 1s infinite alternate ease-in-out;
      padding: 0 10px;
    }
    
    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.08); }
    }

    @media (max-width: 600px) {
      #result-title { font-size: 26px; }
      #error-overlay h1 { font-size: 24px; }
    }
  </style>
  <script id="dc-ui-texts" type="application/json">
  {
    "sourceLang": "ja",
    "texts": {
      "ja": {
        "ui.start": "スタート",
        "ui.instruction": "間違いは3つあるよ！見つけてね！",
        "ui.sub_instruction": "（下の写真で間違いと思う部分をタッチしてね）",
        "hud.found": "みつけた！ {found} / {total}",
        "result.clear": "素晴らしい！全部見つけられたね！！\nスタッフにこの画面を見せてね♪",
        "result.timeup": "タイムアップ！残念、、、\n答え合わせはボタンをクリック！",
        "ui.answer": "答え合わせ",
        "ui.already_played": "すでにプレイ済みです。"
      }
    }
  }
  </script>
</head>
<body>
  <!-- ブラウザバック等検知時のエラー画面 -->
  <div id="error-overlay">
    <h1>🚫不正な操作が検出されました</h1>
    <p>複数回のプレイはできません。</p>
  </div>

  <div id="game-container">
    <div id="ui-layer"></div>
  </div>

  <div id="start-overlay">
    <p id="start-instruction" style="color: white; font-size: 28px; font-weight: bold; margin-bottom: 10px; text-align: center; text-shadow: 0 2px 10px rgba(0,0,0,0.5);"></p>
    <p id="start-sub-instruction" style="color: white; font-size: 20px; font-weight: bold; margin-bottom: 30px; text-align: center; text-shadow: 0 2px 10px rgba(0,0,0,0.5);"></p>
    <button id="start-btn" style="display:none;"></button>
  </div>

  <div id="result-overlay" style="display:none;">
    <h1 id="result-title"></h1>
    <button id="answer-btn" style="display:none; margin-top: 20px;"></button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.0/p5.min.js"></script>
  <script>
    // ==========================================
    // セキュリティ・リセマラ防止・リセット処理
    // ==========================================

    // 不正操作（戻る/スワイプ）検知時の処理
    function triggerSecurityError() {
      const errorOverlay = document.getElementById('error-overlay');
      if (errorOverlay) errorOverlay.style.display = 'flex';
      ['game-container', 'start-overlay', 'result-overlay', 'ui-layer'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.style.display = 'none';
      });
    }

    // 1. History API によるブラウザバック検知
    window.history.pushState(null, null, window.location.href);
    window.addEventListener('popstate', () => {
      triggerSecurityError();
      window.history.pushState(null, null, window.location.href); // さらに戻るのを防ぐ
    });

    // 2. BFCache (pageshow) による戻り検知
    window.addEventListener('pageshow', (e) => {
      if (e.persisted) {
        triggerSecurityError();
      }
    });

    // 3. Navigation API による戻る/進む検知
    if (window.performance && window.performance.getEntriesByType) {
      const navEntries = window.performance.getEntriesByType('navigation');
      if (navEntries.length > 0 && navEntries[0].type === 'back_forward') {
        triggerSecurityError();
      }
    }

    // リセット条件の確認 (特定URLアクセス & セッション内で未リセット)
    const targetReferrer = "010m-xtech.github.io/TEST2/boteko2";
    if (document.referrer.includes(targetReferrer) || window.location.href.includes(targetReferrer)) {
      if (!sessionStorage.getItem('hasResetInThisSession')) {
        localStorage.removeItem('spotTheDiffState'); // ゲーム状態をリセット
        localStorage.removeItem('hasPlayedSpotTheDiff'); // 旧仕様のフラグも念のため削除
        sessionStorage.setItem('hasResetInThisSession', 'true');
      }
    }

    // 以前のゲーム状態の取得
    let savedState = null;
    try {
      const savedStr = localStorage.getItem('spotTheDiffState');
      if (savedStr) savedState = JSON.parse(savedStr);
    } catch(e) {}
    
    // 互換性のため旧フラグ対応（もしあればTIMEUP扱いにする）
    if (!savedState && localStorage.getItem('hasPlayedSpotTheDiff') === 'true') {
      savedState = { status: 'TIMEUP', stageIndex: 0 };
    }

    // ==========================================
    // UIテキスト設定
    // ==========================================
    let uiPayload = {};
    try {
      const rawJSONText = document.getElementById('dc-ui-texts').textContent;
      uiPayload = JSON.parse(rawJSONText.replace(/\u00A0/g, ' '));
    } catch (e) {
      uiPayload = { sourceLang: 'ja', texts: { ja: { "ui.start": "スタート", "ui.instruction": "間違い探し", "ui.sub_instruction": "タッチしてね", "hud.found": "{found}/{total}", "result.clear": "クリア！", "result.timeup": "タイムアップ！", "ui.answer": "答え合わせ" } } };
    }
    
    const sourceLang = uiPayload.sourceLang || 'en';
    const uiTexts = uiPayload.texts || {};
    const currentLang = 'ja'; // 日本語固定化

    function t(key, vars) {
      let s = (uiTexts[currentLang] && uiTexts[currentLang][key]) || key;
      if (vars) Object.keys(vars).forEach(k => { s = s.split('{' + k + '}').join(String(vars[k])); });
      return s.split('\\n').join('\n');
    }

    class SynthAudio {
      constructor() { this.ctx = null; }
      init() {
        if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (this.ctx.state === 'suspended') this.ctx.resume();
      }
      playUnlock() {
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain); gain.connect(this.ctx.destination);
        gain.gain.value = 0; osc.start(); osc.stop(this.ctx.currentTime + 0.1);
      }
      play(freq, endFreq, duration, type = 'square', vol = 0.2) {
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type; osc.connect(gain); gain.connect(this.ctx.destination);
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(endFreq, this.ctx.currentTime + duration);
        gain.gain.setValueAtTime(vol, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
        osc.start(); osc.stop(this.ctx.currentTime + duration);
      }
      playTimeUp() { this.play(600, 400, 0.3, 'square', 0.2); setTimeout(() => this.play(600, 400, 0.8, 'square', 0.2), 400); }
      playCorrect() { this.play(800, 1200, 0.1, 'sine', 0.1); setTimeout(() => this.play(1200, 1600, 0.15, 'sine', 0.1), 100); }
      playClear() {
        this.play(500, 800, 0.2, 'sine', 0.2);
        setTimeout(() => this.play(600, 1000, 0.2, 'sine', 0.2), 200);
        setTimeout(() => this.play(800, 1200, 0.4, 'sine', 0.2), 400);
      }
    }
    const audio = new SynthAudio();
    document.addEventListener('pointerdown', () => audio.init(), { once: true });

    let gameState = 'WAITING';
    let img1 = null; let img2 = null;
    let currentStageIndex = -1;

    const stages = [
      {
        img1Url: 'https://i.postimg.cc/BZCSDV3c/hua-xiang5.jpg',
        img2Url: 'https://i.postimg.cc/4dJMTw0h/hua-xiang6.jpg',
        differences: [ { x: 0.783, y: 0.452, r: 0.06 }, { x: 0.918, y: 0.639, r: 0.06 }, { x: 0.740, y: 0.174, r: 0.06 } ]
      },
      {
        img1Url: 'https://i.postimg.cc/G903pvCN/hua-xiang1.png',
        img2Url: 'https://i.postimg.cc/jj9S1pF3/hua-xiang2.png',
        differences: [ { x: 0.659, y: 0.295, r: 0.06 }, { x: 0.635, y: 0.806, r: 0.06 }, { x: 0.056, y: 0.880, r: 0.06 } ]
      },
      {
        img1Url: 'https://i.postimg.cc/mgkRGdCZ/hua-xiang3.png',
        img2Url: 'https://i.postimg.cc/cJ8SvrF2/hua-xiang4.png',
        differences: [ { x: 0.615, y: 0.686, r: 0.06 }, { x: 0.516, y: 0.432, r: 0.06 }, { x: 0.336, y: 0.688, r: 0.06 } ]
      }
    ];

    let currentStage = null;
    let foundDiffs = [false, false, false];
    const TIME_LIMIT = 20;
    let timeLeft = TIME_LIMIT;
    let timerStartTime = 0;

    const sketch = (p) => {
      p.preload = () => {
        // 過去のデータがあればそのステージを、なければランダムに選ぶ
        if (savedState && savedState.stageIndex !== undefined) {
          currentStageIndex = savedState.stageIndex;
        } else {
          currentStageIndex = Math.floor(Math.random() * stages.length);
        }
        currentStage = stages[currentStageIndex];

        img1 = p.loadImage(currentStage.img1Url);
        img2 = p.loadImage(currentStage.img2Url);
      };

      p.setup = () => {
        const canvas = p.createCanvas(p.windowWidth, p.windowHeight);
        canvas.parent('game-container');
        p.imageMode(p.CENTER);

        if (savedState) {
          // すでにデータがある(プレイ済み)場合、スタート画面をスキップしていきなり結果を表示
          document.getElementById('start-overlay').style.display = 'none';
          document.getElementById('result-overlay').style.display = 'flex';
          
          if (savedState.status === 'CLEAR') {
            gameState = 'CLEAR';
            document.getElementById('result-title').innerText = t('result.clear');
            document.getElementById('answer-btn').style.display = 'none';
          } else {
            // プレイ中にリロードして逃げた場合も、強制的に TIMEUP 扱いで終了させる（リセマラ防止）
            gameState = 'TIMEUP';
            document.getElementById('result-title').innerText = t('result.timeup');
            document.getElementById('answer-btn').innerText = t('ui.answer');
            document.getElementById('answer-btn').style.display = 'block';
          }
        } else {
          // 未プレイの場合はスタート画面を表示
          document.getElementById('start-instruction').innerText = t('ui.instruction');
          document.getElementById('start-sub-instruction').innerText = t('ui.sub_instruction');
          document.getElementById('start-btn').innerText = t('ui.start');
          document.getElementById('start-btn').style.display = 'block';
        }
        
        document.getElementById('start-btn').addEventListener('click', () => {
            // ★ スタートボタンを押した瞬間に「PLAYING」としてlocalStorageに保存（リロード対策）
            localStorage.setItem('spotTheDiffState', JSON.stringify({ status: 'PLAYING', stageIndex: currentStageIndex }));

            document.getElementById('start-overlay').style.display = 'none';
            gameState = 'PLAYING';
            timerStartTime = p.millis();
            timeLeft = TIME_LIMIT;
            foundDiffs = [false, false, false];
            updateUI();
            audio.playUnlock();
        });

        document.getElementById('answer-btn').addEventListener('click', () => {
            document.getElementById('result-overlay').style.display = 'none';
            foundDiffs = [true, true, true];
            gameState = 'ANSWER_VIEW';
            updateUI();
        });
      };

      function updateUI() {
        if (gameState === 'ANSWER_VIEW') {
          document.getElementById('ui-layer').innerText = t('ui.answer');
        } else {
          let foundCount = foundDiffs.filter(f => f).length;
          document.getElementById('ui-layer').innerText = t('hud.found', { found: foundCount, total: currentStage.differences.length });
        }
      }

      function checkClear() {
        let foundCount = foundDiffs.filter(f => f).length;
        if (foundCount === currentStage.differences.length) {
          gameState = 'CLEAR';
          // ★ クリア状態を確実に保存
          localStorage.setItem('spotTheDiffState', JSON.stringify({ status: 'CLEAR', stageIndex: currentStageIndex }));
          audio.playClear();
          setTimeout(() => {
            document.getElementById('result-title').innerText = t('result.clear');
            document.getElementById('answer-btn').style.display = 'none';
            document.getElementById('result-overlay').style.display = 'flex';
          }, 1000);
        }
      }

      p.windowResized = () => p.resizeCanvas(p.windowWidth, p.windowHeight);

      function calculateImageBounds(img, boxX, boxY, boxW, boxH) {
        if (!img || !img.width || !img.height) return null;
        const imgRatio = img.width / img.height;
        const boxRatio = boxW / boxH;
        let drawW, drawH;
        if (imgRatio > boxRatio) { drawW = boxW; drawH = boxW / imgRatio; } 
        else { drawH = boxH; drawW = boxH * imgRatio; }
        return { x: boxX + (boxW - drawW) / 2, y: boxY + (boxH - drawH) / 2, w: drawW, h: drawH };
      }

      // タッチとマウスの両方に対応するための共通判定関数
      function handleInteraction(x, y) {
        if (gameState !== 'PLAYING') return;

        let box2 = { x: 0, y: p.windowHeight / 2, w: p.windowWidth, h: p.windowHeight / 2 };
        let bounds2 = calculateImageBounds(img2, box2.x, box2.y, box2.w, box2.h);
        if (!bounds2) return;

        if (x >= bounds2.x && x <= bounds2.x + bounds2.w && y >= bounds2.y && y <= bounds2.y + bounds2.h) {
            for (let i = 0; i < currentStage.differences.length; i++) {
              if (foundDiffs[i]) continue;
              let diff = currentStage.differences[i];
              let targetX = bounds2.x + diff.x * bounds2.w;
              let targetY = bounds2.y + diff.y * bounds2.h;
              
              let targetR = diff.r * Math.max(bounds2.w, bounds2.h);

              if (p.dist(x, y, targetX, targetY) <= targetR) {
                foundDiffs[i] = true;
                updateUI();
                audio.playCorrect();
                checkClear();
                break; 
              }
            }
        }
      }

      p.mousePressed = () => {
        handleInteraction(p.mouseX, p.mouseY);
      };

      p.touchStarted = (event) => {
        // HTML要素（スタートボタン等）をタッチした場合はクリックイベントを阻害しない
        if (event && event.target && event.target.tagName !== 'CANVAS') {
          return;
        }

        // ★ スマホでは touchStarted の方がクリックよりも早く反応するため感度が向上する
        if (p.touches && p.touches.length > 0) {
          handleInteraction(p.touches[0].x, p.touches[0].y);
        } else {
          handleInteraction(p.mouseX, p.mouseY);
        }
        return false; // デフォルトのスクロールやダブルタップなどの挙動を防ぐ
      };

      p.draw = () => {
        p.background(10);
        let box1 = { x: 0, y: 0, w: p.windowWidth, h: p.windowHeight / 2 };
        let box2 = { x: 0, y: p.windowHeight / 2, w: p.windowWidth, h: p.windowHeight / 2 };

        let bounds1 = calculateImageBounds(img1, box1.x, box1.y, box1.w, box1.h);
        let bounds2 = calculateImageBounds(img2, box2.x, box2.y, box2.w, box2.h);

        if (img1 && bounds1) p.image(img1, bounds1.x + bounds1.w / 2, bounds1.y + bounds1.h / 2, bounds1.w, bounds1.h);
        else { p.fill(50); p.rect(box1.x + 20, box1.y + 20, box1.w - 40, box1.h - 40); }

        if (img2 && bounds2) p.image(img2, bounds2.x + bounds2.w / 2, bounds2.y + bounds2.h / 2, bounds2.w, bounds2.h);
        else { p.fill(50); p.rect(box2.x + 20, box2.y + 20, box2.w - 40, box2.h - 40); }

        p.noFill(); p.stroke(255, 50, 50); p.strokeWeight(6);
        for (let i = 0; i < currentStage.differences.length; i++) {
          if (foundDiffs[i]) {
            if (bounds1) p.circle(bounds1.x + currentStage.differences[i].x * bounds1.w, bounds1.y + currentStage.differences[i].y * bounds1.h, currentStage.differences[i].r * Math.max(bounds1.w, bounds1.h) * 2);
            if (bounds2) p.circle(bounds2.x + currentStage.differences[i].x * bounds2.w, bounds2.y + currentStage.differences[i].y * bounds2.h, currentStage.differences[i].r * Math.max(bounds2.w, bounds2.h) * 2);
          }
        }

        p.stroke(40); p.strokeWeight(4);
        p.line(0, p.windowHeight / 2, p.windowWidth, p.windowHeight / 2);

        if (gameState === 'PLAYING') {
          let elapsed = (p.millis() - timerStartTime) / 1000;
          timeLeft = Math.max(0, TIME_LIMIT - elapsed);
          
          if (timeLeft === 0) {
            gameState = 'TIMEUP';
            // ★ タイムアップ状態を保存
            localStorage.setItem('spotTheDiffState', JSON.stringify({ status: 'TIMEUP', stageIndex: currentStageIndex }));
            audio.playTimeUp();
            setTimeout(() => {
              document.getElementById('result-title').innerText = t('result.timeup');
              document.getElementById('answer-btn').innerText = t('ui.answer');
              document.getElementById('answer-btn').style.display = 'block';
              document.getElementById('result-overlay').style.display = 'flex';
            }, 1000);
          }
        }

        if (gameState !== 'WAITING') {
          p.push();
          p.translate(p.windowWidth / 2, p.windowHeight / 2);
          p.fill(0, 0, 0, 180); p.noStroke(); p.rectMode(p.CENTER);
          p.rect(0, 0, 100, 50, 25);
          p.fill(255); p.textSize(32); p.textAlign(p.CENTER, p.CENTER); p.textStyle(p.BOLD);
          
          if (timeLeft <= 10 && timeLeft > 0 && gameState === 'PLAYING') {
            if (Math.floor(p.millis() / 250) % 2 === 0) p.fill(255, 71, 87);
          }
          p.text(Math.ceil(timeLeft), 0, 2);
          p.pop();
        }
      };
    };

    new p5(sketch);
  </script>
</body>
</html>
