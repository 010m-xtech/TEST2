        // --- 景品データ定義 (V2 新構造) ---

        // --- ハズレ（名所ガチャ用） ---
        const MISS = {

        // --- 岡崎めぐり乾杯旅：名所ごとのガチャ（URLの ?stop= で決まる。各名所1回ずつ・計3回） ---
        // 確率は %（ハズレ・1等・2等・3等の合計が100になるように）
        // 演出の動画（このフォルダに置く）：1・2回目は gacha.mp4、3回目（本光寺）は intro1.mp4
        const GACHA_VIDEO = 'gacha.mp4';
        const STOPS = {
            2: { name: '02 岡崎城', miss: 90, p1: 1, p2: 2, p3: 7, video: GACHA_VIDEO },
            3: { name: '03 幸田の公園', miss: 20, p1: 10, p2: 20, p3: 50, video: GACHA_VIDEO },
            4: { name: '04 本光寺', miss: 0, p1: 10, p2: 30, p3: 60, video: 'intro1.mp4' }
        };
        const STOP_KEYS = Object.keys(STOPS);
        // 結果の保存先（同じサイトのほかのガチャと混ざらないように、専用の名前にする）
        // 旅（ラウンド）ごとに分けるので、次の旅になればまた回せる（1回の旅で各名所1回ずつ）
        const KEY_RESULT = (stop) => {
            let round = 0;
            try { round = (JSON.parse(localStorage.getItem('boteko_kota_reached') || 'null') || {}).round || 0; } catch (e) {}
            return `boteko_kota_gacha_r${round}_s${stop}`;
        };
        const KEY_SURVEY = 'boteko_kota_gacha_survey_completed';
        const ALL_PRIZES = [MISS, ...PRIZES];
        // 旅の画面にもどる（ガチャは別のタブで開いているので、閉じれば旅の画面。閉じられないときは旅の画面へ移動）
        const JOURNEY_URL = 'https://010m-xtech.github.io/TEST2/bubble_052940/';
        const backToJourney = () => {
            try { window.close(); } catch (e) {}
            setTimeout(() => { location.href = JOURNEY_URL; }, 300);
        };
        // 悪用対策：旅の画面が記録した「この端末で着いた名所」を確認（12時間以内・その名所以降に着いていること）
        const REACHED_KEY = 'boteko_kota_reached';
        const canPlay = (stopNo) => {
            try {
                const r = JSON.parse(localStorage.getItem(REACHED_KEY) || 'null');
                return !!r && Date.now() - r.at < 12 * 60 * 60 * 1000 && r.stop >= Number(stopNo);
            } catch (e) { return false; }
        };

        // --- 黄金に輝くテキスト用スタイル ---
        const customStyles = `

        /* 🌟 変更箇所：透明度を使わず、直接濃い色で塗りつぶした完全な静止画サンバースト */

        // --- ビールグラスを描画するSVGコンポーネント ---

            return (

                    <defs>
                        <linearGradient id={`grad-${rank}`} x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stopColor={colors[0]} />
                            <stop offset="50%" stopColor={colors[1]} />
                            <stop offset="100%" stopColor={colors[2]} />

                    </defs>
                    <path d="M75 40 C 100 40, 100 75, 75 75" fill="none" stroke="rgba(255,255,255,0.4)" strokeWidth="6" strokeLinecap="round" />
                    <path d="M25 25 C 25 25, 20 85, 35 90 C 50 95, 60 95, 75 90 C 90 85, 85 25, 85 25 Z" fill={`url(#grad-${rank})`} stroke="rgba(255,255,255,0.6)" strokeWidth="3" />
                    <path d="M35 30 Q 30 60 40 85" fill="none" stroke="rgba(255,255,255,0.3)" strokeWidth="4" strokeLinecap="round" />
                    <React.Fragment>
                        <path d="M20 25 Q 30 5 55 15 Q 75 5 90 25 Q 95 35 85 40 Q 55 45 25 40 Q 15 35 20 25 Z" fill="#FFFFFF" />
                        <circle cx="35" cy="15" r="8" fill="#FFFFFF" />
                        <circle cx="65" cy="12" r="10" fill="#FFFFFF" />
                        <circle cx="50" cy="8" r="12" fill="#FFFFFF" />

            );
        };

        // --- 詐欺対策用の現在時刻表示コンポーネント ---
        const RealTimeClock = () => {
            const [time, setTime] = useState(new Date());
            useEffect(() => {
                const timer = setInterval(() => setTime(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);
            
            const formattedTime = time.toLocaleString('ja-JP', { 
                year: 'numeric', month: '2-digit', day: '2-digit', 
                hour: '2-digit', minute: '2-digit', second: '2-digit' 
            });

            return (
                <div 
                    className="text-white font-mono text-xl sm:text-2xl md:text-3xl font-black tracking-widest drop-shadow-[0_3px_6px_rgba(0,0,0,0.95)] whitespace-nowrap"
                    style={{ WebkitTextStroke: '0.8px black', paintOrder: 'stroke fill' }}
                >
                    {formattedTime}
                </div>
            );
        };

        // --- アンケート画面コンポーネント ---
        const SurveyScreen = ({ shopName, deviceId, gameResult, onComplete }) => {
            const [gender, setGender] = useState('');
            const [age, setAge] = useState('');
            const [guests, setGuests] = useState('');
            const [relation, setRelation] = useState('');
            const [score, setScore] = useState('');
            const [comment, setComment] = useState('');
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [isCompleted, setIsCompleted] = useState(false);

            const isValid = gender && age && guests && relation && score && comment.trim() !== '';
            const GAS_URL = "https://script.google.com/macros/s/AKfycby3kedbIZhyhUTAFaLnl04ME9VmyjXRs6NgNXbFz2jxHrger9frn0u6AALvH2RzLFR2eA/exec";

            useEffect(() => {
                const sendStepLog = async () => {
                    try {
                        await fetch(GAS_URL, {
                            method: "POST",
                            mode: "no-cors",
                            body: JSON.stringify({ shop: shopName, step: "①URLアクセス(アンケート単体)", deviceId: deviceId })
                        });
                    } catch (e) { console.error(e); }
                };
                sendStepLog();
                window.scrollTo(0, 0);
            }, [GAS_URL, shopName, deviceId]);

            const submitSurvey = async () => {
                setIsSubmitting(true);
                
                try {
                    await fetch(GAS_URL, {
                        method: "POST",
                        mode: "no-cors",
                        body: JSON.stringify({ shop: shopName, step: "③アンケート回答完了(単体)", deviceId: deviceId })
                    });
                } catch (e) { console.error(e); }

                const surveyData = {
                    shop: shopName,
                    gender: gender,   
                    age: age,         
                    guests: guests,   
                    relation: relation, 
                    score: score,
                    comment: comment,
                    gameResult: gameResult ? `ガチャ結果: ${gameResult}` : 'アンケート単体完了',
                    deviceId: deviceId 
                };
                
                try {
                    await fetch(GAS_URL, { 
                        method: "POST", 
                        mode: "no-cors", 
                        body: JSON.stringify(surveyData) 
                    });
                    setIsCompleted(true);
                    
                    setTimeout(() => {
                        if (onComplete) onComplete();
                    }, 1500);
                } catch (e) { 
                    console.error(e); 
                    setIsSubmitting(false);
                }
            };

            return (
                <div className="min-h-screen bg-[#fff8e1] p-5 text-[#333] font-sans flex flex-col items-center w-full">
                    <div className="w-full max-w-[450px] bg-white p-5 md:p-8 rounded-2xl shadow-[0_4px_10px_rgba(0,0,0,0.1)] mx-auto text-left relative overflow-hidden">
                        
                        <div className="absolute top-0 left-0 w-full h-2 bg-amber-400"></div>

                        <h2 className="text-2xl font-bold text-center mb-6 text-amber-600">🍺 生ビールアンケート</h2>
                        
                        <label className="block font-bold mt-5 text-left text-sm md:text-base text-gray-700">A. あなたの性別を教えてください</label>
                        <select className="w-full p-3 mt-2 rounded-lg border border-gray-300 text-base bg-white focus:outline-none focus:ring-2 focus:ring-amber-400" value={gender} onChange={e => setGender(e.target.value)} disabled={isCompleted || isSubmitting}>
                            <option value="">-- 性別を選択してください --</option>
                            <option value="男性">男性</option>
                            <option value="女性">女性</option>
                        </select>

                        <label className="block font-bold mt-5 text-left text-sm md:text-base text-gray-700">B. あなたの年齢を教えてください</label>
                        <select className="w-full p-3 mt-2 rounded-lg border border-gray-300 text-base bg-white focus:outline-none focus:ring-2 focus:ring-amber-400" value={age} onChange={e => setAge(e.target.value)} disabled={isCompleted || isSubmitting}>
                            <option value="">-- 年齢を選択してください --</option>
                            <option value="20代以下">20代以下</option>
                            <option value="30-40代">30-40代</option>
                            <option value="50-60代">50-60代</option>
                            <option value="70代以上">70代以上</option>
                        </select>

                        <label className="block font-bold mt-5 text-left text-sm md:text-base text-gray-700">C. 本日のご来店人数を教えてください</label>
                        <select className="w-full p-3 mt-2 rounded-lg border border-gray-300 text-base bg-white focus:outline-none focus:ring-2 focus:ring-amber-400" value={guests} onChange={e => setGuests(e.target.value)} disabled={isCompleted || isSubmitting}>
                            <option value="">-- 人数を選択してください --</option>
                            <option value="1人">1人</option>
                            <option value="2人">2人</option>
                            <option value="3人以上">3人以上</option>
                        </select>

                        <label className="block font-bold mt-5 text-left text-sm md:text-base text-gray-700">D. 一緒に来店された方とのご関係を教えてください</label>
                        <select className="w-full p-3 mt-2 rounded-lg border border-gray-300 text-base bg-white focus:outline-none focus:ring-2 focus:ring-amber-400" value={relation} onChange={e => setRelation(e.target.value)} disabled={isCompleted || isSubmitting}>
                            <option value="">-- ご関係を選択してください --</option>
                            <option value="家族">家族</option>
                            <option value="友人">友人</option>
                            <option value="仕事仲間">仕事仲間</option>
                            <option value="他">他</option>
                        </select>

                        <label className="block font-bold mt-5 text-left text-sm md:text-base text-gray-700">1. 当店の生ビールは何点ですか？</label>
                        <select className="w-full p-3 mt-2 rounded-lg border border-gray-300 text-base bg-white focus:outline-none focus:ring-2 focus:ring-amber-400" value={score} onChange={e => setScore(e.target.value)} disabled={isCompleted || isSubmitting}>
                            <option value="">-- 点数を選択してください --</option>
                            <option value="5">5点（最高！）</option>
                            <option value="4">4点</option>
                            <option value="3">3点</option>
                            <option value="2">2点</option>
                            <option value="1">1点</option>
                        </select>

                        <label className="block font-bold mt-5 text-left text-sm md:text-base text-gray-700">2. 生ビールを飲んだ感想を教えてください</label>
                        <textarea className="w-full p-3 mt-2 rounded-lg border border-gray-300 text-base h-[100px] resize-none focus:outline-none focus:ring-2 focus:ring-amber-400" placeholder="感想をメッセージお聞かせください" value={comment} onChange={e => setComment(e.target.value)} disabled={isCompleted || isSubmitting}></textarea>
                        
                        {!isCompleted ? (
                            <button 
                                onClick={submitSurvey} 
                                disabled={!isValid || isSubmitting}
                                className="w-full py-3 px-2 mt-8 bg-[#ffc107] text-[#333] rounded-full font-bold text-sm sm:text-base md:text-lg disabled:opacity-50 disabled:bg-[#ccc] disabled:cursor-not-allowed hover:bg-[#e0a800] transition-colors shadow-md leading-normal"
                            >
                                {isSubmitting ? "送信中..." : (
                                    <span className="block whitespace-nowrap">
                                        アンケートに答えてボタン押してね！<br />
                                        景品画面に変わるよ♪
                                    </span>
                                )}
                            </button>
                        ) : (
                            <div className="mt-8 p-4 bg-green-50 border border-green-200 rounded-lg text-[#00aa6e] font-bold text-center text-lg animate-[popZoom_0.4s_ease-out_forwards]">
                                アンケートのご協力ありがとうございました！
                            </div>
                        )}

                        <div className="text-[10px] text-[#777] text-left mt-8 leading-relaxed border-t border-dashed border-[#ddd] pt-4">
                            ※当システムではローカルストレージを使用しこのアプリ専用の識別番号を発行しています。個人を特定する情報は一切取得いたしません。
                        </div>
                    </div>
                </div>
            );
        };

        // --- アプリケーションのメイン ---
        const App = () => {
          const [view, setView] = useState('gacha'); 
          const [stage, setStage] = useState('idle');
          
          // 🌟 V2 新構造: resultオブジェクトではなく、引いたIDのみをステートで管理する
          const [prizeId, setPrizeId] = useState(null);
          
          const [isSurveyCompleted, setIsSurveyCompleted] = useState(false); 
          const [isLoaded, setIsLoaded] = useState(false); 
          
          const [shopName, setShopName] = useState("不明な店舗");
          const [stop, setStop] = useState(null);
          const [deviceId, setDeviceId] = useState("");

          const videoRef = useRef(null);
          const [muted, setMuted] = useState(true);
          const audioCtxRef = useRef(null);

          // 🌟 常にメモリ上の最新のPRIZESマスタデータを直接参照する
          const activePrize = useMemo(() => {
              if (prizeId === null) return null;
              return ALL_PRIZES.find(p => p.id === prizeId) || PRIZES[2]; // 万が一見つからなければ3等をフォールバック
          }, [prizeId]);

          // 名所ごとの確率で引く
          const drawPrize = (stopNo) => {
            const t = STOPS[stopNo] || STOPS[STOP_KEYS[0]];
            const table = [[MISS, t.miss], [PRIZES[0], t.p1], [PRIZES[1], t.p2], [PRIZES[2], t.p3]];
            const total = table.reduce((a, [, p]) => a + p, 0);
            const rand = Math.random() * total;
            let sum = 0;
            for (const [prize, p] of table) {
                sum += p;
                if (p > 0 && rand < sum) return prize;
            }
            return PRIZES[PRIZES.length - 1];
          };

          useEffect(() => {
              const urlParams = new URLSearchParams(window.location.search);
              
              // どの名所のガチャか（?stop=2 / 3 / 4）。指定が無いときは岡崎城
              const stopNo = STOPS[urlParams.get('stop')] ? urlParams.get('stop') : STOP_KEYS[0];
              setStop(stopNo);

              if (urlParams.get('action') === 'reset') {
                  // この名所ガチャの結果とアンケートをクリア（スタッフ確認用）
                  Object.keys(localStorage).filter(k => k.startsWith('boteko_kota_gacha_')).forEach(k => localStorage.removeItem(k));
                  localStorage.removeItem(KEY_SURVEY);
                  
                  const shopParam = urlParams.get('shop');
                  const baseUrl = 'https://010m-xtech.github.io/TEST2/bubblegacha_052940/';
                  const q = new URLSearchParams();
                  if (shopParam) q.set('shop', shopParam);
                  q.set('stop', stopNo);
                  const newUrl = baseUrl + '?' + q.toString();
                  window.history.replaceState({}, document.title, newUrl);
              }

              setShopName(urlParams.get('shop') || "不明な店舗");

              let savedId = localStorage.getItem('beer_app_device_id');
              if (!savedId) {
                  savedId = 'dev_' + Date.now() + '_' + Math.random().toString(36).substring(2, 11);
                  localStorage.setItem('beer_app_device_id', savedId);
              }
              setDeviceId(savedId); 

              // この名所ですでに回していたら、その結果を出す（名所ごとに1回）
              const savedPrizeId = localStorage.getItem(KEY_RESULT(stopNo));
              const savedSurvey = localStorage.getItem(KEY_SURVEY);
              
              if (savedPrizeId !== null) {
                  setPrizeId(parseInt(savedPrizeId, 10));
                  setStage('result');
              } else if (!canPlay(stopNo)) {
                  // まだその名所に着いていない（URLを書き換えて開いた など）
                  setStage('locked');
              } else {
                  // 旅の画面でボタンを押したら、そのまま動画の演出から始める（ガチャの絵を押す手順はなし）
                  const prize = drawPrize(stopNo);
                  setPrizeId(prize.id);
                  localStorage.setItem(KEY_RESULT(stopNo), prize.id.toString());
                  setStage('playing_video');
              }
              if (savedSurvey === 'true') {
                  setIsSurveyCompleted(true);
              }
              
              setIsLoaded(true);
          }, []);

          const bubbles = useMemo(() => {
            return Array.from({ length: 400 }).map((_, i) => {
                const size = Math.random() * 20 + 5; 
                const left = Math.random() * 100;
                const duration = Math.random() * 4 + 2; 
                const delay = Math.random() * -10; 
                return { size, left, duration, delay };
            });
          }, []);



          const playFanfare = (ctx) => {
              if (!ctx) return;
              try {
                  const playNote = (freq, startTime, duration) => {
                      const osc = ctx.createOscillator();
                      const gain = ctx.createGain();
                      osc.connect(gain);
                      gain.connect(ctx.destination);
                      osc.type = 'triangle'; 
                      osc.frequency.value = freq;
                      
                      gain.gain.setValueAtTime(0, startTime);
                      gain.gain.linearRampToValueAtTime(0.2, startTime + 0.05);
                      gain.gain.setValueAtTime(0.2, startTime + duration - 0.05);
                      gain.gain.linearRampToValueAtTime(0, startTime + duration);
                      
                      osc.start(startTime);
                      osc.stop(startTime + duration);
                  };
                  
                  const now = ctx.currentTime;
                  playNote(523.25, now, 0.15);
                  playNote(659.25, now + 0.15, 0.15);
                  playNote(783.99, now + 0.30, 0.15);
                  playNote(1046.50, now + 0.45, 0.5);
              } catch (e) {
                  console.error("Audio playback error:", e);
              }
          };

          // 演出が始まったら動画を再生（開いた直後は音なしでしか自動再生できないので、音は「音を出す」ボタンで）
          useEffect(() => {
            if (stage !== 'playing_video' || !videoRef.current) return;
            const v = videoRef.current;
            v.muted = true;
            v.currentTime = 0;
            v.play().catch(e => { console.error("動画の再生に失敗しました:", e); setStage('result'); });
          }, [stage]);

          useEffect(() => {
            if (stage === 'result' && activePrize && activePrize.soundType === 'fanfare') {
                playFanfare(audioCtxRef.current);
            }
          }, [stage, activePrize]);

          if (!isLoaded) return null;

          if (view === 'survey') {
              return <SurveyScreen 
                  shopName={shopName} 
                  deviceId={deviceId} 
                  gameResult={activePrize ? `${activePrize.rank}（${STOPS[stop] ? STOPS[stop].name : ''}）` : ''} 
                  onComplete={() => {
                      setIsSurveyCompleted(true);
                      localStorage.setItem(KEY_SURVEY, 'true');
                      setView('gacha');
                  }}
              />;
          }

          return (
            <React.Fragment>
              <style>{customStyles}</style>
              
              <div className="min-h-screen bg-gradient-to-b from-yellow-100 via-yellow-400 to-amber-600 font-sans overflow-x-hidden relative selection:bg-amber-800 selection:text-white">
                
                <div className="fixed inset-0 overflow-hidden pointer-events-none z-0">
                    {bubbles.map((bubble, i) => (
                        <div key={i}
                             className="absolute bottom-0 bg-white/50 rounded-full border border-white/40 backdrop-blur-[2px] shadow-[0_0_8px_rgba(255,255,255,0.6)]"
                             style={{
                                 width: `${bubble.size}px`, height: `${bubble.size}px`, left: `${bubble.left}%`,
                                 animation: `riseUp ${bubble.duration}s linear infinite ${bubble.delay}s`
                             }}
                        />
                    ))}
                    <div className="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-white/60 rounded-full blur-[100px] mix-blend-overlay"></div>
                    <div className="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-orange-600/30 rounded-full blur-[120px] mix-blend-color-burn"></div>
                </div>

                <div className="w-full mx-auto flex flex-col items-center justify-center min-h-[100dvh] relative z-10">
                    {stage === 'locked' && (
                        <div className="w-full max-w-[360px] mx-4 p-6 rounded-3xl bg-zinc-900/90 border-2 border-amber-400 text-center shadow-2xl">
                            <p className="text-4xl mb-2">🚚</p>
                            <p className="text-amber-300 font-black text-xl leading-snug">{STOPS[stop] ? STOPS[stop].name.slice(3) : 'この名所'}には<br />まだ到着していません</p>
                            <p className="mt-3 text-white/85 text-sm font-bold leading-relaxed">旅の画面で乾杯の写真を撮って、<br />名所に着いたらガチャを回せます！</p>
                            <button
                                onClick={backToJourney}
                                className="mt-5 w-full py-3 bg-yellow-400 text-black font-black rounded-full border-4 border-yellow-200 active:scale-95"
                            >
                                旅にもどる
                            </button>
                        </div>
                    )}
                </div>

                <div 
                    className={`fixed inset-0 bg-black z-50 flex items-center justify-center transition-opacity duration-300 ${stage === 'playing_video' ? 'opacity-100 pointer-events-auto' : 'opacity-0 pointer-events-none'}`}
                    style={{ visibility: stage === 'playing_video' ? 'visible' : 'hidden' }}
                >
                    <video 
                        ref={videoRef}
                        src={STOPS[stop] ? STOPS[stop].video : GACHA_VIDEO}
                        className="w-full h-full object-contain"
                        playsInline
                        muted={muted}
                        preload="auto"
                        onEnded={() => setStage('result')}
                    ></video>
                    {muted && (
                        <button
                            type="button"
                            onClick={() => {
                                setMuted(false);
                                if (videoRef.current) videoRef.current.muted = false;
                                const AudioContext = window.AudioContext || window.webkitAudioContext;
                                if (!audioCtxRef.current && AudioContext) audioCtxRef.current = new AudioContext();
                            }}
                            className="absolute left-4 px-4 py-2 rounded-full bg-black/60 border border-white/50 text-white text-sm font-bold active:scale-95"
                            style={{ top: 'calc(env(safe-area-inset-top) + 16px)' }}
                        >
                            🔊 音を出す
                        </button>
                    )}
                    {STOPS[stop] && (
                        <div className="absolute left-1/2 -translate-x-1/2 px-4 py-2 rounded-full bg-zinc-900/80 border-2 border-amber-400 text-amber-300 font-black text-xs whitespace-nowrap pointer-events-none" style={{ bottom: 'calc(env(safe-area-inset-bottom) + 18px)' }}>
                            🚚 {STOPS[stop].name}のガチャ（{STOP_KEYS.indexOf(String(stop)) + 1} / 3 回目）
                        </div>
                    )}
                    <button
                        type="button"
                        onClick={() => {
                            try { videoRef.current && videoRef.current.pause(); } catch (e) {}
                            const AudioContext = window.AudioContext || window.webkitAudioContext;
                            if (!audioCtxRef.current && AudioContext) audioCtxRef.current = new AudioContext();
                            setStage('result');
                        }}
                        className="absolute right-4 px-4 py-2 rounded-full bg-black/60 border border-white/50 text-white text-sm font-bold active:scale-95"
                        style={{ top: 'calc(env(safe-area-inset-top) + 16px)' }}
                    >
                        スキップ ›
                    </button>
                </div>

                {stage === 'result' && (
                    /* 🌟 変更箇所: 背景を強制的に真っ黒で塗りつぶし、後ろの映像が透けるのを完全に防ぐ */
                    <div 
                        className="fixed inset-0 z-50 flex flex-col justify-between items-center p-4 overflow-y-auto min-h-[100dvh]"
                        style={{ backgroundColor: '#000000' }} 
                    >
                        
                        {/* 🌟 変更箇所: 透明度を使わない静止画の濃いサンバーストを配置 */}
                        <div className="absolute inset-0 sunburst -z-10 pointer-events-none"></div>
                        
                        {activePrize && (
                            <div className="flex-grow flex flex-col items-center justify-center w-full max-w-[340px] md:max-w-xl py-4 animate-[popZoom_0.6s_cubic-bezier(0.175,0.885,0.32,1.275)_forwards]">
                                
                                <div className="flex items-center justify-center gap-3 md:gap-8 mb-4 relative">
                                    <div className={`w-20 h-20 md:w-36 md:h-36 rounded-full border-4 md:border-8 ${activePrize.border} flex flex-col items-center justify-center bg-zinc-900/95 ${activePrize.glow || 'shadow-[0_10px_40px_rgba(0,0,0,0.8)]'} relative z-10`}>
                                        <div className="absolute inset-0 rounded-full bg-gradient-to-b from-white/20 to-transparent pointer-events-none"></div>
                                        <span 
                                            className={`text-2xl md:text-5xl font-black ${activePrize.text} drop-shadow-[0_0_15px_rgba(255,255,255,0.4)] tracking-tighter`}
                                            style={{ WebkitTextStroke: '1.5px #000', paintOrder: 'stroke fill' }}
                                        >
                                            {activePrize.rank}
                                        </span>
                                        {activePrize.id !== 0 && <React.Fragment>
                                            <span className="absolute -top-6 md:-top-8 text-3xl md:text-6xl drop-shadow-[0_10px_20px_rgba(0,0,0,0.8)] animate-bounce">👑</span>
                                            <span className="absolute top-1 left-1 text-base animate-ping">✨</span>
                                            <span className="absolute bottom-2 right-1 text-xl animate-pulse">✨</span>
                                        </React.Fragment>}
                                    </div>
                                    
                                    <div className="relative z-10 flex items-center justify-center w-20 h-20 md:w-36 md:h-36">
                                        {activePrize.id === 0 ? (
                                            <div className="w-full h-full flex items-center justify-center text-5xl md:text-7xl">🍺</div>
                                        ) : activePrize.imgUrl ? (
                                            <img 
                                                src={activePrize.imgUrl} 
                                                alt={activePrize.rank} 
                                                className="w-full h-full object-contain filter drop-shadow-[0_15px_25px_rgba(0,0,0,0.8)] animate-[imagePop_0.8s_cubic-bezier(0.175,0.885,0.32,1.275)_forwards]" 
                                            />
                                        ) : (
                                            <div className="w-full h-full filter drop-shadow-[0_15px_25px_rgba(0,0,0,0.8)] bg-white/5 rounded-3xl p-1.5 backdrop-blur-sm border border-white/10 relative">
                                                <BeerGlass rank={activePrize.rank} />
                                            </div>
                                        )}
                                        <div className="absolute inset-0 bg-yellow-400 mix-blend-overlay animate-pulse rounded-full blur-2xl opacity-20 pointer-events-none"></div>
                                    </div>
                                </div>

                                {activePrize.name && (
                                    <h2 className={`text-2xl md:text-4xl font-black mb-2 drop-shadow-[0_5px_10px_rgba(0,0,0,0.9)] ${activePrize.text} tracking-tight text-center`} style={{ WebkitTextStroke: '1.5px #000', paintOrder: 'stroke fill' }}>
                                        {activePrize.name}
                                    </h2>
                                )}
                                
                                <div className="bg-zinc-900/90 px-4 py-4 md:px-12 md:py-6 rounded-2xl border-2 border-amber-500/30 text-center backdrop-blur-md shadow-[0_15px_30px_rgba(0,0,0,0.8)] relative z-10 w-full">
                                    
                                    {activePrize.id === 0 ? (
                                        <div className="text-xl md:text-3xl font-black text-zinc-200 tracking-tight leading-snug">
                                            {activePrize.resultTitle}
                                            <p className="mt-3 text-sm md:text-lg font-bold text-amber-300 leading-relaxed">次の名所のガチャで、また挑戦してね！<br />旅を進めるほど、当たりやすくなるよ♪</p>
                                        </div>
                                    ) : isSurveyCompleted ? (
                                        // 🌟 変更箇所: 配列で完全分離したテキストを呼び出し、文字消えバグを100%根絶
                                        <div className="text-xl md:text-3xl font-black gold-text-shimmer tracking-tight leading-snug px-1">
                                            <div>{activePrize.giftLine1}</div>
                                            <div className="text-2xl md:text-4xl font-extrabold my-1">{activePrize.giftLine2}</div>
                                            <div className="text-3xl md:text-5xl font-black mt-1">
                                                {activePrize.giftLine3}
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="text-xl md:text-4xl font-black text-yellow-400 tracking-tight leading-snug drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)]">
                                            {activePrize.resultTitle}
                                        </div>
                                    )}
                                    
                                    {activePrize.id === 0 ? (
                                        <button
                                            onClick={backToJourney}
                                            className="mt-4 w-full py-2.5 px-3 bg-yellow-400 text-black font-black text-sm md:text-xl rounded-full border-4 border-yellow-200 active:scale-95"
                                        >
                                            旅にもどる
                                        </button>
                                    ) : isSurveyCompleted ? (
                                        <div className="mt-4 flex flex-col gap-2.5 items-center justify-center w-full">
                                            <div className="py-2.5 px-3 bg-gradient-to-r from-green-500 to-green-600 rounded-xl border-2 border-green-300 animate-[popZoom_0.5s_ease-out_forwards] shadow-[0_0_20px_rgba(34,197,94,0.5)] w-full">
                                                <p className="text-base md:text-xl font-black text-white drop-shadow-md leading-snug">
                                                    会計時にこの画面を見せて<br />
                                                    景品もらってね！
                                                </p>
                                            </div>
                                            <p className="text-yellow-300 font-black text-xs md:text-lg drop-shadow-[0_2px_5px_rgba(0,0,0,0.9)] whitespace-nowrap tracking-wide">
                                                ※スクショか写真を撮って後で見せてください
                                            </p>
                                            <button onClick={backToJourney} className="mt-1 w-full py-2.5 bg-yellow-400 text-black font-black text-sm rounded-full border-4 border-yellow-200 active:scale-95">
                                                旅にもどる
                                            </button>
                                            <p className="text-white/70 text-[10px] font-bold leading-snug">この画面は、名所の紹介ページの「ガチャ」ボタンからいつでも見られます</p>
                                        </div>
                                    ) : (
                                        <button 
                                            onClick={() => setView('survey')}
                                            className="mt-4 w-full py-2.5 px-3 bg-yellow-400 hover:bg-yellow-500 text-black font-black text-sm md:text-xl rounded-full shadow-[0_0_15px_rgba(250,204,21,0.6)] transform transition active:scale-95 border-4 border-yellow-200"
                                        >
                                            <div>{activePrize.subLine1}</div>
                                            <div>{activePrize.subLine2}</div>
                                            <span className="block text-[9px] md:text-xs font-bold mt-1 text-black/70">＞ ボタンを押してアンケートへ ＜</span>
                                        </button>
                                    )}
                                    {activePrize.id !== 0 && !isSurveyCompleted && (
                                        <button onClick={backToJourney} className="mt-3 text-white/80 text-xs font-bold underline underline-offset-4">
                                            あとでアンケートに答える（旅にもどる）
                                        </button>
                                    )}
                                </div>
                            </div>
                        )}
                        
                        <div className="w-full max-w-[360px] mb-3 px-3 py-2.5 rounded-2xl bg-zinc-900/85 border border-amber-500/40 text-center relative z-10">
                            <p className="text-amber-300 font-black text-xs mb-1.5">🚚 名所ガチャは3回！旅を進めるほど当たりやすい</p>
                            <div className="flex justify-center gap-1.5 text-[10.5px] font-bold">
                                {STOP_KEYS.map(k => (
                                    <span key={k} className={`px-2 py-1 rounded-lg ${String(stop) === k ? 'bg-amber-400 text-black' : 'bg-white/10 text-white/80'}`}>
                                        {STOPS[k].name.slice(3)}<br />{['チャンス', '大チャンス', 'ハズレなし！'][STOP_KEYS.indexOf(k)]}
                                    </span>
                                ))}
                            </div>
                        </div>
                        <div className="w-full text-center pb-2 z-50">
                            {activePrize && <RealTimeClock />}
                        </div>
                    </div>
                )}
              </div>
            </React.Fragment>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
