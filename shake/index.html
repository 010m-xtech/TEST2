<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ビール泡ガチャ</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&family=Playfair+Display:wght@700&display=swap');
    
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --sphere-top: 33.8%;
      --sphere-left: 50%;
      --sphere-size: 80.5%;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      touch-action: manipulation;
      overscroll-behavior: none;
      background: #080503;
    }

    /* Glass Dome Outer Rim & Glow */
    .glass-dome {
      box-shadow: 
        inset 0 0 20px rgba(255, 255, 255, 0.2),
        inset 0 -10px 25px rgba(0, 0, 0, 0.5),
        0 10px 30px rgba(0, 0, 0, 0.6);
      transition: box-shadow 0.4s ease, transform 0.3s ease;
    }

    .pulse-ready {
      animation: ready-pulse 1.8s infinite ease-in-out;
    }

    @keyframes ready-pulse {
      0%, 100% {
        box-shadow: 
          inset 0 0 35px rgba(255, 255, 255, 0.45),
          inset 0 0 50px rgba(245, 158, 11, 0.45),
          0 0 45px rgba(251, 191, 36, 0.7),
          0 20px 50px rgba(0, 0, 0, 0.9);
        transform: translate(-50%, -50%) scale(1.02);
      }
      50% {
        box-shadow: 
          inset 0 0 20px rgba(255, 255, 255, 0.2),
          inset 0 0 30px rgba(245, 158, 11, 0.2),
          0 0 20px rgba(251, 191, 36, 0.3),
          0 15px 40px rgba(0, 0, 0, 0.9);
        transform: translate(-50%, -50%) scale(1);
      }
    }

    /* Crank Handle Styles */
    .handle-idle {
      cursor: default;
    }

    .handle-idle #crank-knob-visual {
      opacity: 0;
    }

    .handle-ready {
      cursor: pointer;
      animation: handle-glow-pulse 1.4s infinite ease-in-out;
    }

    .handle-ready #crank-knob-visual {
      opacity: 1;
    }

    .handle-ready .handle-glow {
      border-color: rgba(251, 191, 36, 0.9);
      box-shadow: 0 0 25px rgba(245, 158, 11, 0.9), inset 0 0 15px rgba(251, 191, 36, 0.6);
    }

    @keyframes handle-glow-pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.05); }
    }

    /* Chute Ejection Animations */
    @keyframes chute-roll {
      0% {
        transform: translateY(-36px) scale(0.35) rotate(-140deg);
        opacity: 0;
      }
      55% {
        transform: translateY(6px) scale(1.08) rotate(15deg);
        opacity: 1;
      }
      75% {
        transform: translateY(-2px) scale(0.97) rotate(-4deg);
      }
      100% {
        transform: translateY(0) scale(1) rotate(0deg);
        opacity: 1;
      }
    }

    .chute-eject {
      animation: chute-roll 0.75s cubic-bezier(0.25, 1.4, 0.5, 1) forwards;
    }

    .capsule-waiting {
      animation: capsule-float-glow 1.5s infinite ease-in-out;
    }

    @keyframes capsule-float-glow {
      0%, 100% {
        transform: translateY(0) scale(1);
        filter: drop-shadow(0 0 8px rgba(251, 191, 36, 0.7));
      }
      50% {
        transform: translateY(-3px) scale(1.04);
        filter: drop-shadow(0 0 16px rgba(245, 158, 11, 0.95));
      }
    }

    /* Ultra-Realistic 3D Spherical Capsule Styles */
    .capsule-3d-sphere {
      position: relative;
      border-radius: 9999px;
      overflow: hidden;
      box-shadow: 
        inset 2px 3px 6px rgba(255, 255, 255, 0.5),
        inset -3px -4px 8px rgba(0, 0, 0, 0.6),
        0 6px 14px rgba(0, 0, 0, 0.6);
    }

    .capsule-specular-gloss {
      position: absolute;
      top: 10%;
      left: 18%;
      width: 46%;
      height: 24%;
      border-radius: 9999px;
      background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.85) 0%, rgba(255, 255, 255, 0) 75%);
      transform: rotate(-35deg);
      pointer-events: none;
      z-index: 10;
    }

    .capsule-bounce-light {
      position: absolute;
      bottom: 6%;
      right: 14%;
      width: 42%;
      height: 20%;
      border-radius: 9999px;
      background: radial-gradient(ellipse at center, rgba(251, 191, 36, 0.45) 0%, rgba(251, 191, 36, 0) 80%);
      pointer-events: none;
      z-index: 10;
    }

    .capsule-center-rim {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 3px;
      transform: translateY(-50%);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.8) 0%, rgba(50, 30, 10, 0.6) 100%);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
      z-index: 8;
      pointer-events: none;
    }

    .capsule-dome-top {
      width: 100%;
      height: 50%;
      background: radial-gradient(circle at 40% 30%, #ffffff 0%, #f4f4f6 50%, #d4d6db 85%, #9fa4af 100%);
    }

    .capsule-dome-bottom {
      width: 100%;
      height: 50%;
      background: radial-gradient(circle at 45% 65%, #fde68a 0%, #f59e0b 45%, #b45309 80%, #5c2404 100%);
      position: relative;
    }

    .capsule-inner-depth {
      position: absolute;
      inset: 0;
      border-radius: 9999px;
      background: radial-gradient(circle at 75% 75%, rgba(0, 0, 0, 0.45) 0%, transparent 60%);
      pointer-events: none;
      z-index: 5;
    }

    @keyframes drop-bounce {
      0% { transform: translateY(-30px) scale(0.6) rotate(-20deg); opacity: 0; }
      55% { transform: translateY(12px) scale(1.08) rotate(10deg); opacity: 1; }
      75% { transform: translateY(-6px) scale(0.97) rotate(-4deg); }
      100% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
    }

    .capsule-drop {
      animation: drop-bounce 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
  </style>
</head>
<body class="h-[100dvh] w-screen text-slate-100 flex flex-col items-center justify-center p-0 m-0 select-none box-border bg-[#080503] overflow-hidden">

  <main id="main-stage" class="w-full h-[100dvh] flex items-center justify-center relative overflow-hidden">
    
    <div id="machine-wrapper" class="relative h-[100dvh] max-w-full flex items-center justify-center transition-transform duration-200">
      
      <!-- Gacha Machine Background Image -->
      <img 
        id="gacha-bg" 
        src="./gacha.png" 
        alt="Gacha Machine" 
        onerror="this.onerror=null; this.src='https://raw.githubusercontent.com/010m-xtech/TEST2/main/shake/gacha.png';"
        class="h-[100dvh] w-auto max-w-full object-contain pointer-events-none drop-shadow-[0_15px_35px_rgba(0,0,0,0.9)]"
      />

      <!-- Dynamic Beer Glass Sphere Layered over Machine Image -->
      <div 
        id="tank-container" 
        style="top: var(--sphere-top); left: var(--sphere-left); width: var(--sphere-size); aspect-ratio: 1 / 1;"
        class="absolute -translate-x-1/2 -translate-y-1/2 rounded-full border-2 border-amber-100/60 glass-dome overflow-hidden flex items-center justify-center cursor-pointer active:scale-95 transition-transform"
      >
        <canvas id="bubble-canvas" class="w-full h-full block"></canvas>

        <!-- Specular Highlights -->
        <div class="absolute top-4 left-6 w-24 sm:w-32 h-12 sm:h-16 rounded-full bg-gradient-to-b from-white/60 to-transparent transform -rotate-45 pointer-events-none"></div>
        <div class="absolute bottom-6 right-8 w-14 sm:w-18 h-7 sm:h-9 rounded-full bg-gradient-to-t from-white/25 to-transparent transform -rotate-45 pointer-events-none"></div>
        
        <!-- Live Beer Meter Badge -->
        <div class="absolute bottom-4 bg-stone-950/85 backdrop-blur-md text-white px-3.5 py-1 rounded-full text-[11px] font-bold tracking-wider flex items-center gap-2 shadow-2xl border border-amber-500/40 pointer-events-none transition-all">
          <span id="bubble-status-dot" class="inline-block w-2 h-2 rounded-full bg-amber-400 animate-ping"></span>
          泡＆ビール: <span id="bubble-percent" class="text-amber-300 text-xs font-extrabold w-10 text-right">0%</span>
        </div>
      </div>

      <!-- Crank Handle Layer -->
      <div 
        id="crank-handle" 
        class="absolute -translate-x-1/2 -translate-y-1/2 rounded-full flex items-center justify-center z-30 handle-idle active:scale-95 transition-all"
        style="top: 67.5%; left: 50.0%; width: 22.5%; aspect-ratio: 1 / 1;"
      >
        <div id="crank-knob-visual" class="w-full h-full rounded-full relative flex items-center justify-center pointer-events-none transition-all duration-700 ease-in-out">
          <div class="absolute inset-0 rounded-full border-2 border-amber-400/0 handle-glow transition-all"></div>
          
          <div class="w-[82%] h-[22%] rounded-full bg-gradient-to-b from-amber-200 via-amber-400 to-amber-700 shadow-[0_5px_12px_rgba(0,0,0,0.7),inset_0_1px_2px_rgba(255,255,255,0.9)] border border-amber-300/70 relative flex items-center justify-center">
            <div class="w-4 h-4 rounded-full bg-gradient-to-br from-amber-100 to-amber-600 shadow-md border border-amber-200"></div>
          </div>
        </div>

        <div id="handle-prompt" class="absolute -top-7 px-2.5 py-0.5 rounded-full bg-gradient-to-r from-amber-400 to-amber-500 text-stone-950 font-black text-[10px] whitespace-nowrap shadow-xl border border-amber-200 animate-bounce hidden pointer-events-none tracking-wider">
          タップして回してね！
        </div>
      </div>

      <!-- Chute Area -->
      <div 
        id="chute-area" 
        class="absolute -translate-x-1/2 pointer-events-none z-30 flex items-center justify-center overflow-visible"
        style="top: 83.2%; left: 50.4%; width: 23%; height: 14%;"
      >
        <div id="dispensed-capsule" class="hidden pointer-events-auto cursor-pointer relative flex flex-col items-center justify-center active:scale-95 transition-transform">
          <div class="absolute -bottom-1.5 w-12 h-3 rounded-full bg-black/80 blur-[2px] pointer-events-none"></div>

          <!-- Ultra-Realistic 3D Beer Capsule -->
          <div class="w-[52px] h-[52px] sm:w-[60px] sm:h-[60px] capsule-3d-sphere flex flex-col">
            <div class="capsule-specular-gloss"></div>
            <div class="capsule-bounce-light"></div>
            <div class="capsule-inner-depth"></div>
            <div class="capsule-center-rim"></div>
            
            <div class="capsule-dome-top"></div>
            <div class="capsule-dome-bottom"></div>
          </div>
          
          <div id="capsule-tap-guide" class="absolute -top-7 px-2.5 py-0.5 rounded-full bg-gradient-to-r from-amber-400 to-yellow-300 text-stone-950 font-black text-[9px] whitespace-nowrap shadow-2xl border border-white/90 animate-pulse hidden tracking-wider">
            タップして開封！
          </div>
        </div>
      </div>

      <!-- Instruction Guide directly above sphere -->
      <div 
        class="absolute left-1/2 -translate-x-1/2 z-40 pointer-events-none w-full max-w-[95%] text-center px-1"
        style="top: max(3.8%, calc(var(--safe-top) + 6px));"
      >
        <p id="shake-instruction" class="text-[11px] sm:text-xs md:text-sm font-bold text-amber-200 bg-stone-950/85 backdrop-blur-md py-1.5 px-3 sm:px-4 rounded-full inline-block shadow-2xl border border-amber-500/40 transition-all duration-300 pointer-events-auto tracking-tight sm:tracking-wide whitespace-nowrap">
          スマホを振ってね！生ビールが溜まっていくよ
        </p>
      </div>

    </div>

  </main>

  <!-- Result Modal -->
  <div id="result-modal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 hidden flex-col items-center justify-center p-4">
    <div id="modal-card" class="w-full max-w-sm bg-gradient-to-b from-stone-900 via-stone-950 to-amber-950/90 border-2 border-amber-500/50 rounded-3xl p-6 text-center shadow-[0_25px_60px_rgba(0,0,0,0.9)] relative overflow-hidden flex flex-col items-center">
      
      <div class="absolute -top-24 -left-24 w-48 h-48 bg-amber-500/15 rounded-full blur-3xl pointer-events-none"></div>
      
      <div id="res-rarity" class="px-4 py-1 rounded-full text-xs font-extrabold tracking-widest uppercase mb-4 shadow-md bg-amber-500 text-stone-950">
        SSR
      </div>

      <div class="w-28 h-28 mb-3 flex items-center justify-center relative">
        <div class="absolute bottom-0 w-16 h-3 rounded-full bg-black/90 blur-[3px]"></div>
        
        <div id="res-capsule" class="w-[86px] h-[86px] capsule-3d-sphere capsule-drop flex flex-col border border-white/40">
          <div class="capsule-specular-gloss"></div>
          <div class="capsule-bounce-light"></div>
          <div class="capsule-inner-depth"></div>
          <div class="capsule-center-rim"></div>
          
          <div class="capsule-dome-top"></div>
          <div class="capsule-dome-bottom"></div>
        </div>
      </div>

      <h3 id="res-name" class="text-xl sm:text-2xl font-black text-amber-300 mb-1 tracking-wide">
        ゴールドプレミアム生
      </h3>
      <div id="res-type" class="text-xs text-amber-200/70 mb-3 font-serif tracking-wider">CRAFT BEER SELECTION</div>
      
      <p id="res-desc" class="text-sm text-stone-300 mb-6 bg-stone-900/80 p-3 rounded-xl border border-stone-800 leading-relaxed">
        最高峰の麦芽と希少ホップが奏でる極上のコクと香り。
      </p>

      <button id="close-modal-btn" class="w-full py-3.5 bg-gradient-to-r from-amber-500 via-amber-400 to-amber-500 hover:from-amber-400 hover:to-amber-300 active:scale-95 text-stone-950 font-black rounded-2xl text-sm tracking-wider shadow-[0_4px_20px_rgba(245,158,11,0.4)] transition-all">
        もう一度注ぐ
      </button>
    </div>
  </div>

  <script>
    let audioReady = false;
    let fizzNoise = null;
    let fizzFilter = null;
    let crankSynth = null;
    let fanfareSynth = null;

    function initAudio() {
      if (audioReady) return;
      try {
        Tone.start();

        fizzNoise = new Tone.Noise('pink');
        fizzFilter = new Tone.Filter({
          frequency: 1800,
          type: 'bandpass',
          Q: 2.5
        });
        const fizzGain = new Tone.Gain(0.08).toDestination();
        fizzNoise.connect(fizzFilter);
        fizzFilter.connect(fizzGain);
        fizzNoise.start();
        fizzGain.gain.setValueAtTime(0, Tone.now());

        crankSynth = new Tone.MembraneSynth({
          pitchDecay: 0.05,
          octaves: 3,
          oscillator: { type: 'sine' },
          envelope: { attack: 0.001, decay: 0.15, sustain: 0, release: 0.1 }
        }).toDestination();
        crankSynth.volume.value = -6;

        fanfareSynth = new Tone.PolySynth(Tone.Synth).toDestination();
        fanfareSynth.volume.value = -8;

        audioReady = true;
      } catch (e) {
        console.warn('Audio Init Notice:', e);
      }
    }

    function playFizz(intensity = 0.5) {
      if (!audioReady) return;
      try {
        const now = Tone.now();
        fizzFilter.frequency.setValueAtTime(1400 + intensity * 1600, now);
      } catch (e) {}
    }

    function playCrankSound() {
      if (!audioReady) return;
      try {
        crankSynth.triggerAttackRelease('C2', '8n');
      } catch (e) {}
    }

    function playFanfare() {
      if (!audioReady) return;
      try {
        const now = Tone.now();
        fanfareSynth.triggerAttackRelease(['C4', 'E4', 'G4', 'C5'], '8n', now);
        fanfareSynth.triggerAttackRelease(['E4', 'G4', 'B4', 'E5'], '8n', now + 0.2);
        fanfareSynth.triggerAttackRelease(['G4', 'C5', 'E5', 'G5'], '4n', now + 0.4);
      } catch (e) {}
    }

    const canvas = document.getElementById('bubble-canvas');
    const ctx = canvas.getContext('2d');
    let width = 320;
    let height = 320;
    let tankRadius = 150;

    let bubblePower = 0;
    const MAX_POWER = 100;
    let isFull = false;
    let isCranking = false;

    // Fluid dynamics variables
    let liquidLevel = 0; 
    let liquidAngle = 0; 
    let targetLiquidAngle = 0;
    let liquidWavePhase = 0;
    let waveAmplitude = 0;
    let shakeVelocity = { x: 0, y: 0 };
    let targetTiltX = 0;
    let targetTiltY = 0;

    const bubbles = [];
    const CAPSULE_COUNT = 10;
    const capsules = [];

    function initBubbles() {
      bubbles.length = 0;
      for (let i = 0; i < 65; i++) {
        bubbles.push({
          x: (Math.random() - 0.5) * (tankRadius * 1.6),
          y: Math.random() * (tankRadius * 1.6),
          radius: Math.random() < 0.75 ? Math.random() * 1.5 + 0.6 : Math.random() * 2.8 + 1.8,
          speed: Math.random() * 1.8 + 0.9,
          wobble: Math.random() * Math.PI * 2,
          wobbleSpeed: Math.random() * 0.09 + 0.03,
          alpha: Math.random() * 0.6 + 0.35,
          isStream: Math.random() < 0.25
        });
      }

      capsules.length = 0;
      for (let i = 0; i < CAPSULE_COUNT; i++) {
        const angle = (i / CAPSULE_COUNT) * Math.PI * 2;
        const dist = Math.random() * (tankRadius * 0.45) + (tankRadius * 0.15);

        capsules.push({
          x: Math.cos(angle) * dist,
          y: Math.sin(angle) * dist + (tankRadius * 0.25),
          vx: (Math.random() - 0.5) * 0.8,
          vy: (Math.random() - 0.5) * 0.8,
          radius: 19,
          angle: Math.random() * Math.PI * 2,
          va: (Math.random() - 0.5) * 0.03,
          submergeDepth: 0.68 + Math.random() * 0.12
        });
      }
    }

    function handleResize() {
      const gachaBg = document.getElementById('gacha-bg');
      const machineWrapper = document.getElementById('machine-wrapper');
      
      if (gachaBg && machineWrapper) {
        const bgRect = gachaBg.getBoundingClientRect();
        if (bgRect.width > 0 && bgRect.height > 0) {
          machineWrapper.style.width = `${bgRect.width}px`;
          machineWrapper.style.height = `${bgRect.height}px`;
        }
      }

      const container = document.getElementById('tank-container');
      if (!container) return;
      const rect = container.getBoundingClientRect();
      const rawDim = Math.max(120, Math.min(rect.width || 260, rect.height || 260));
      
      const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
      canvas.width = rawDim * dpr;
      canvas.height = rawDim * dpr;
      width = rawDim;
      height = rawDim;

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      tankRadius = Math.max(10, width / 2 - 3);

      const adaptiveRadius = Math.max(12, Math.min(22, tankRadius * 0.12));
      capsules.forEach(c => c.radius = adaptiveRadius);
    }
    window.addEventListener('resize', handleResize);

    const gachaBg = document.getElementById('gacha-bg');
    if (gachaBg) {
      gachaBg.addEventListener('load', handleResize);
    }

    function updatePhysics() {
      const targetLevel = (bubblePower / MAX_POWER);
      liquidLevel += (targetLevel - liquidLevel) * 0.09;
      liquidAngle += (targetLiquidAngle - liquidAngle) * 0.18;

      liquidWavePhase += 0.08 + Math.min(0.2, waveAmplitude * 0.05);
      waveAmplitude *= 0.94;
      shakeVelocity.x *= 0.92;
      shakeVelocity.y *= 0.92;

      const currentSurfaceY = tankRadius - (liquidLevel * tankRadius * 1.88);

      for (let i = 0; i < capsules.length; i++) {
        const c = capsules[i];

        const tiltXForce = Math.sin(liquidAngle) * 0.45 + targetTiltX * 0.28;
        c.vx += tiltXForce + shakeVelocity.x * 0.08;
        c.vy += 0.24 + shakeVelocity.y * 0.08;

        const dxFromCenter = c.x;
        const slopeY = Math.tan(-liquidAngle) * dxFromCenter;
        const wave1 = Math.sin(liquidWavePhase + c.x * 0.035) * waveAmplitude;
        const wave2 = Math.cos(liquidWavePhase * 1.4 - c.x * 0.07) * (waveAmplitude * 0.25);
        const localSurfaceY = currentSurfaceY + slopeY + wave1 + wave2;

        if (liquidLevel > 0.02) {
          const depthInLiquid = c.y - localSurfaceY;
          if (depthInLiquid > -c.radius * (1 - c.submergeDepth)) {
            const buoyancyStrength = Math.min(1.5, (depthInLiquid + c.radius * c.submergeDepth) * 0.055);
            c.vy -= buoyancyStrength * 0.72;
            c.vx *= 0.925;
            c.vy *= 0.905;
            c.va *= 0.93;
          } else {
            c.vx *= 0.985;
            c.vy *= 0.985;
          }
        }

        c.x += c.vx;
        c.y += c.vy;
        c.angle += c.va + c.vx * 0.02;

        const distFromCenter = Math.sqrt(c.x * c.x + c.y * c.y);
        const maxDist = tankRadius - c.radius - 2;
        if (distFromCenter > maxDist) {
          const nx = c.x / distFromCenter;
          const ny = c.y / distFromCenter;
          c.x = nx * maxDist;
          c.y = ny * maxDist;

          const dot = c.vx * nx + c.vy * ny;
          if (dot > 0) {
            c.vx -= 1.35 * dot * nx;
            c.vy -= 1.35 * dot * ny;
            c.va += (Math.random() - 0.5) * 0.06;
          }
        }

        for (let j = i + 1; j < capsules.length; j++) {
          const other = capsules[j];
          const cdx = other.x - c.x;
          const cdy = other.y - c.y;
          const cdist = Math.sqrt(cdx * cdx + cdy * cdy);
          const minDist = c.radius + other.radius;

          if (cdist < minDist && cdist > 0.001) {
            const overlap = (minDist - cdist) * 0.5;
            const normX = cdx / cdist;
            const normY = cdy / cdist;

            c.x -= normX * overlap;
            c.y -= normY * overlap;
            other.x += normX * overlap;
            other.y += normY * overlap;

            const relVx = c.vx - other.vx;
            const relVy = c.vy - other.vy;
            const impulse = (relVx * normX + relVy * normY) * 0.55;

            c.vx -= impulse * normX;
            c.vy -= impulse * normY;
            other.vx += impulse * normX;
            other.vy += impulse * normY;
          }
        }
      }
    }

    function render() {
      updatePhysics();

      ctx.clearRect(0, 0, width, height);

      const cx = width / 2;
      const cy = height / 2;

      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, tankRadius, 0, Math.PI * 2);
      ctx.clip();

      const chamberGrad = ctx.createRadialGradient(cx, cy * 0.75, tankRadius * 0.2, cx, cy, tankRadius);
      chamberGrad.addColorStop(0, '#1c1007');
      chamberGrad.addColorStop(0.65, '#0e0804');
      chamberGrad.addColorStop(1, '#050302');
      ctx.fillStyle = chamberGrad;
      ctx.fillRect(0, 0, width, height);

      const currentSurfaceY = tankRadius - (liquidLevel * tankRadius * 1.88);
      const spanW = tankRadius * 1.6;
      const steps = 36;
      const foamThickness = Math.max(16, liquidLevel * 36);

      function traceSurfaceWave(targetCtx) {
        for (let s = 0; s <= steps; s++) {
          const px = -spanW + (spanW * 2 * s) / steps;
          const py = currentSurfaceY 
            + Math.sin(liquidWavePhase + px * 0.038) * waveAmplitude
            + Math.cos(liquidWavePhase * 1.5 - px * 0.065) * (waveAmplitude * 0.22);
          targetCtx.lineTo(px, py);
        }
      }

      // Background Beer Liquid
      if (liquidLevel > 0.005) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(-liquidAngle);

        const beerGrad = ctx.createLinearGradient(0, currentSurfaceY, 0, tankRadius * 1.2);
        beerGrad.addColorStop(0, '#ffb81c');
        beerGrad.addColorStop(0.18, '#f59e0b');
        beerGrad.addColorStop(0.45, '#d97706');
        beerGrad.addColorStop(0.75, '#b45309');
        beerGrad.addColorStop(1, '#662402');

        ctx.fillStyle = beerGrad;
        ctx.beginPath();
        ctx.moveTo(-spanW, tankRadius * 1.5);
        ctx.lineTo(-spanW, currentSurfaceY);
        traceSurfaceWave(ctx);
        ctx.lineTo(spanW, tankRadius * 1.5);
        ctx.closePath();
        ctx.fill();

        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        const causticGrad = ctx.createRadialGradient(0, currentSurfaceY + 45, 10, 0, currentSurfaceY + 60, spanW * 0.8);
        causticGrad.addColorStop(0, 'rgba(251, 191, 36, 0.45)');
        causticGrad.addColorStop(0.6, 'rgba(217, 119, 6, 0.15)');
        causticGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = causticGrad;
        ctx.beginPath();
        ctx.ellipse(0, currentSurfaceY + 50, spanW * 0.75, tankRadius * 0.4, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        bubbles.forEach((b, idx) => {
          b.y -= b.speed * (0.85 + waveAmplitude * 0.12);
          b.wobble += b.wobbleSpeed;
          const bubbleX = b.x + Math.sin(b.wobble) * (b.isStream ? 1.2 : 3.5);

          if (b.y < currentSurfaceY + 6) {
            b.y = tankRadius * (0.85 + Math.random() * 0.35);
            b.x = b.isStream ? (Math.random() - 0.5) * (tankRadius * 0.9) : (Math.random() - 0.5) * (tankRadius * 1.6);
          }

          if (idx % 5 < 3 && b.y > currentSurfaceY) {
            ctx.fillStyle = `rgba(255, 250, 220, ${b.alpha * 0.85})`;
            ctx.beginPath();
            ctx.arc(bubbleX, b.y, b.radius, 0, Math.PI * 2);
            ctx.fill();
          }
        });

        ctx.restore();
      }

      // Render Floating Capsules
      ctx.save();
      ctx.translate(cx, cy);

      capsules.forEach(c => {
        ctx.save();
        ctx.translate(c.x, c.y);
        ctx.rotate(c.angle);

        const r = c.radius;

        ctx.save();
        ctx.shadowColor = liquidLevel > 0.1 ? 'rgba(80, 30, 5, 0.45)' : 'rgba(0, 0, 0, 0.6)';
        ctx.shadowBlur = 12;
        ctx.shadowOffsetY = 5;
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
        ctx.fill();
        ctx.restore();

        ctx.save();
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.clip();

        const topGrad = ctx.createLinearGradient(-r * 0.4, -r, r * 0.4, 0);
        if (liquidLevel > 0.1) {
          topGrad.addColorStop(0, '#fffbf0');
          topGrad.addColorStop(0.5, '#fef3c7');
          topGrad.addColorStop(0.85, '#fde68a');
          topGrad.addColorStop(1, '#fcd34d');
        } else {
          topGrad.addColorStop(0, '#ffffff');
          topGrad.addColorStop(0.5, '#f5f5f7');
          topGrad.addColorStop(0.85, '#e2e5ea');
          topGrad.addColorStop(1, '#cbd1da');
        }
        ctx.fillStyle = topGrad;
        ctx.fillRect(-r, -r, r * 2, r);

        const btmGrad = ctx.createLinearGradient(-r * 0.3, 0, r * 0.4, r);
        btmGrad.addColorStop(0, '#f59e0b');
        btmGrad.addColorStop(0.4, '#d97706');
        btmGrad.addColorStop(0.75, '#b45309');
        btmGrad.addColorStop(1, '#78350f');
        ctx.fillStyle = btmGrad;
        ctx.fillRect(-r, 0, r * 2, r);

        const amberCore = ctx.createRadialGradient(0, r * 0.45, 1, 0, r * 0.45, r * 0.7);
        amberCore.addColorStop(0, 'rgba(254, 215, 170, 0.7)');
        amberCore.addColorStop(0.6, 'rgba(217, 119, 6, 0.3)');
        amberCore.addColorStop(1, 'rgba(0, 0, 0, 0.4)');
        ctx.fillStyle = amberCore;
        ctx.beginPath();
        ctx.arc(0, r * 0.45, r * 0.65, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
        ctx.fillRect(-r, -1.5, r * 2, 1.2);
        ctx.fillStyle = 'rgba(30, 20, 10, 0.5)';
        ctx.fillRect(-r, -0.3, r * 2, 1.6);

        const sphereShade = ctx.createRadialGradient(r * 0.3, r * 0.3, r * 0.35, 0, 0, r);
        sphereShade.addColorStop(0, 'rgba(0, 0, 0, 0)');
        sphereShade.addColorStop(0.7, 'rgba(0, 0, 0, 0.15)');
        sphereShade.addColorStop(1, 'rgba(0, 0, 0, 0.55)');
        ctx.fillStyle = sphereShade;
        ctx.fillRect(-r, -r, r * 2, r * 2);

        ctx.save();
        ctx.rotate(-0.6);
        ctx.fillStyle = liquidLevel > 0.1 ? 'rgba(255, 250, 220, 0.75)' : 'rgba(255, 255, 255, 0.85)';
        ctx.beginPath();
        ctx.ellipse(-r * 0.28, -r * 0.5, r * 0.48, r * 0.18, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        ctx.restore();

        ctx.strokeStyle = liquidLevel > 0.1 ? 'rgba(253, 230, 138, 0.6)' : 'rgba(255, 255, 255, 0.6)';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.stroke();

        ctx.restore();
      });

      if (liquidLevel > 0.02) {
        ctx.save();
        ctx.rotate(-liquidAngle);

        ctx.beginPath();
        ctx.moveTo(-spanW, tankRadius * 1.5);
        ctx.lineTo(-spanW, currentSurfaceY);
        traceSurfaceWave(ctx);
        ctx.lineTo(spanW, tankRadius * 1.5);
        ctx.closePath();
        ctx.clip();

        const submersionVeil = ctx.createLinearGradient(0, currentSurfaceY, 0, tankRadius * 1.2);
        submersionVeil.addColorStop(0, 'rgba(251, 191, 36, 0.28)');
        submersionVeil.addColorStop(0.3, 'rgba(245, 158, 11, 0.38)');
        submersionVeil.addColorStop(0.7, 'rgba(217, 119, 6, 0.48)');
        submersionVeil.addColorStop(1, 'rgba(180, 83, 9, 0.55)');

        ctx.fillStyle = submersionVeil;
        ctx.fillRect(-spanW, currentSurfaceY, spanW * 2, tankRadius * 1.6);

        bubbles.forEach((b, idx) => {
          if (idx % 5 >= 3 && b.y > currentSurfaceY) {
            const bubbleX = b.x + Math.sin(b.wobble) * (b.isStream ? 1.2 : 3.5);
            ctx.fillStyle = `rgba(255, 252, 235, ${b.alpha * 0.95})`;
            ctx.beginPath();
            ctx.arc(bubbleX, b.y, b.radius, 0, Math.PI * 2);
            ctx.fill();

            if (b.radius > 1.6) {
              ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
              ctx.beginPath();
              ctx.arc(bubbleX - b.radius * 0.3, b.y - b.radius * 0.3, b.radius * 0.35, 0, Math.PI * 2);
              ctx.fill();
            }
          }
        });

        ctx.restore();
      }

      ctx.restore();

      // Velvet Foam Head
      if (liquidLevel > 0.005) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(-liquidAngle);

        const transGrad = ctx.createLinearGradient(0, currentSurfaceY - 4, 0, currentSurfaceY + 8);
        transGrad.addColorStop(0, 'rgba(254, 243, 199, 0.95)');
        transGrad.addColorStop(1, 'rgba(245, 158, 11, 0.1)');
        ctx.fillStyle = transGrad;
        ctx.beginPath();
        ctx.moveTo(-spanW, currentSurfaceY + 8);
        traceSurfaceWave(ctx);
        ctx.lineTo(spanW, currentSurfaceY + 12);
        ctx.lineTo(-spanW, currentSurfaceY + 12);
        ctx.closePath();
        ctx.fill();

        const foamGrad = ctx.createLinearGradient(0, currentSurfaceY - foamThickness, 0, currentSurfaceY + 4);
        foamGrad.addColorStop(0, '#ffffff');
        foamGrad.addColorStop(0.35, '#fffdf7');
        foamGrad.addColorStop(0.7, '#fef9e7');
        foamGrad.addColorStop(1, '#fde68a');

        ctx.fillStyle = foamGrad;
        ctx.beginPath();
        ctx.moveTo(-spanW, currentSurfaceY + 4);

        for (let s = 0; s <= steps; s++) {
          const px = -spanW + (spanW * 2 * s) / steps;
          const mound = Math.sin(s * 0.55) * 2.5;
          const py = currentSurfaceY - foamThickness + mound
            + Math.sin(liquidWavePhase + px * 0.045 + 1) * (waveAmplitude * 0.65);
          ctx.lineTo(px, py);
        }

        for (let s = steps; s >= 0; s--) {
          const px = -spanW + (spanW * 2 * s) / steps;
          const py = currentSurfaceY 
            + Math.sin(liquidWavePhase + px * 0.038) * waveAmplitude
            + Math.cos(liquidWavePhase * 1.5 - px * 0.065) * (waveAmplitude * 0.22);
          ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();

        ctx.restore();
      }

      // Ambient Glass Dome Vignette
      ctx.save();
      const glassVignette = ctx.createRadialGradient(cx, cy, tankRadius * 0.8, cx, cy, tankRadius);
      glassVignette.addColorStop(0, 'rgba(0, 0, 0, 0)');
      glassVignette.addColorStop(0.85, 'rgba(25, 14, 5, 0.2)');
      glassVignette.addColorStop(1, 'rgba(10, 5, 2, 0.6)');
      ctx.fillStyle = glassVignette;
      ctx.beginPath();
      ctx.arc(cx, cy, tankRadius, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      ctx.restore();

      requestAnimationFrame(render);
    }

    function addBubblePower(amount, isShake = false) {
      if (isFull) return;

      bubblePower = Math.min(MAX_POWER, bubblePower + amount);
      waveAmplitude = Math.min(22, waveAmplitude + amount * 3.5);

      if (isShake) {
        playFizz(bubblePower / MAX_POWER);
      }

      updateUI();

      if (bubblePower >= MAX_POWER && !isFull) {
        onTankFull();
      }
    }

    function updateUI() {
      const pct = Math.floor(bubblePower);
      const pctElem = document.getElementById('bubble-percent');
      if (pctElem) pctElem.textContent = `${pct}%`;

      const tankContainer = document.getElementById('tank-container');
      const dot = document.getElementById('bubble-status-dot');

      if (bubblePower >= MAX_POWER) {
        if (tankContainer) tankContainer.classList.add('pulse-ready');
        if (dot) {
          dot.className = 'inline-block w-2.5 h-2.5 rounded-full bg-emerald-400 shadow-[0_0_10px_#34d399]';
        }
      } else {
        if (tankContainer) tankContainer.classList.remove('pulse-ready');
        if (dot) {
          dot.className = 'inline-block w-2.5 h-2.5 rounded-full bg-amber-400 animate-ping';
        }
      }
    }

    function onTankFull() {
      isFull = true;

      const handle = document.getElementById('crank-handle');
      const knob = document.getElementById('crank-knob-visual');
      const handlePrompt = document.getElementById('handle-prompt');
      if (handle) {
        handle.classList.remove('handle-idle');
        handle.classList.add('handle-ready');
      }
      if (knob) {
        knob.style.opacity = '1';
      }
      if (handlePrompt) {
        handlePrompt.classList.remove('hidden');
      }
      
      if (navigator.vibrate) {
        navigator.vibrate([100, 50, 100, 50, 200]);
      }
      confetti({
        particleCount: 40,
        spread: 70,
        origin: { y: 0.6 },
        colors: ['#f59e0b', '#fbbf24', '#ffffff', '#d97706']
      });
    }

    let lastX = null, lastY = null, lastZ = null;
    let lastShakeTime = 0;

    function handleMotion(e) {
      const acc = e.accelerationIncludingGravity || e.acceleration;
      if (!acc) return;

      const now = performance.now();
      if (now - lastShakeTime < 70) return;

      const curX = acc.x ?? 0;
      const curY = acc.y ?? 0;
      const curZ = acc.z ?? 0;

      if (lastX !== null) {
        const dx = curX - lastX;
        const dy = curY - lastY;
        const dz = curZ - lastZ;
        const delta = Math.sqrt(dx * dx + dy * dy + dz * dz);

        if (delta > 8.0) {
          const gain = Math.min(2.2, (delta - 8.0) * 0.18 + 0.6);
          shakeVelocity.x += (Math.random() - 0.5) * 10;
          shakeVelocity.y -= 6;
          addBubblePower(gain, true);
          lastShakeTime = now;
        }
      }

      lastX = curX;
      lastY = curY;
      lastZ = curZ;
    }

    function handleOrientation(e) {
      if (e.gamma !== null && e.gamma !== undefined) {
        const rad = (e.gamma * Math.PI) / 180;
        targetLiquidAngle = Math.max(-1.25, Math.min(1.25, rad * 1.4));
        targetTiltX = Math.max(-1.5, Math.min(1.5, rad * 1.6));
      }
      if (e.beta !== null && e.beta !== undefined) {
        targetTiltY = (e.beta - 45) * 0.02;
      }
    }

    let sensorActive = false;
    async function activateSensors() {
      initAudio();
      if (sensorActive) return;

      try {
        if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
          const permissionState = await DeviceMotionEvent.requestPermission();
          if (permissionState === 'granted') {
            window.addEventListener('devicemotion', handleMotion, { passive: true });
            sensorActive = true;

            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
              try {
                const orientState = await DeviceOrientationEvent.requestPermission();
                if (orientState === 'granted') {
                  window.addEventListener('deviceorientation', handleOrientation, { passive: true });
                }
              } catch (err) {}
            }
          }
        } else {
          window.addEventListener('devicemotion', handleMotion, { passive: true });
          window.addEventListener('deviceorientation', handleOrientation, { passive: true });
          sensorActive = true;
        }
      } catch (err) {
        console.warn('Sensor request error:', err);
      }
    }

    window.addEventListener('touchstart', activateSensors, { passive: true });
    window.addEventListener('click', activateSensors);
    activateSensors();

    window.addEventListener('mousemove', (e) => {
      const normX = (e.clientX / window.innerWidth) * 2 - 1;
      const normY = (e.clientY / window.innerHeight) * 2 - 1;
      targetLiquidAngle = normX * 0.85;
      targetTiltX = normX * 1.2;
      targetTiltY = normY * 0.6;
    });

    const tankContainer = document.getElementById('tank-container');
    if (tankContainer) {
      tankContainer.addEventListener('click', () => {
        activateSensors();
        if (!isFull) {
          shakeVelocity.x = (Math.random() - 0.5) * 12;
          shakeVelocity.y = -8;
          addBubblePower(3.0, false);
        }
      });
    }

    const shakeInstruction = document.getElementById('shake-instruction');
    if (shakeInstruction) {
      shakeInstruction.addEventListener('click', () => {
        activateSensors();
        if (!isFull) {
          addBubblePower(3.5, false);
        }
      });
    }

    const crankHandle = document.getElementById('crank-handle');
    if (crankHandle) {
      crankHandle.addEventListener('click', () => {
        initAudio();

        if (!isFull) {
          playCrankSound();
          const knob = document.getElementById('crank-knob-visual');
          if (knob) {
            knob.style.opacity = '0.7';
            knob.style.transform = 'rotate(10deg)';
            setTimeout(() => {
              knob.style.transform = 'rotate(-8deg)';
              setTimeout(() => {
                knob.style.transform = 'rotate(0deg)';
                knob.style.opacity = '0';
              }, 120);
            }, 120);
          }
          return;
        }

        if (isCranking) return;
        isCranking = true;

        playCrankSound();
        if (navigator.vibrate) {
          navigator.vibrate([60, 40, 60, 40, 100]);
        }

        const handlePrompt = document.getElementById('handle-prompt');
        if (handlePrompt) handlePrompt.classList.add('hidden');

        crankHandle.classList.remove('handle-ready');
        const knob = document.getElementById('crank-knob-visual');
        if (knob) {
          knob.style.opacity = '1';
          knob.style.transform = 'rotate(360deg)';
        }

        setTimeout(() => playCrankSound(), 280);

        setTimeout(() => {
          ejectCapsuleToChute();
        }, 750);
      });
    }

    function ejectCapsuleToChute() {
      playCrankSound();

      const dispensed = document.getElementById('dispensed-capsule');
      const tapGuide = document.getElementById('capsule-tap-guide');

      if (dispensed) {
        dispensed.classList.remove('hidden');
        dispensed.classList.remove('chute-eject', 'capsule-waiting');
        void dispensed.offsetWidth;
        dispensed.classList.add('chute-eject');

        setTimeout(() => {
          dispensed.classList.add('capsule-waiting');
          if (tapGuide) tapGuide.classList.remove('hidden');
        }, 800);
      }
    }

    const dispensedCapsule = document.getElementById('dispensed-capsule');
    if (dispensedCapsule) {
      dispensedCapsule.addEventListener('click', () => {
        initAudio();
        dispenseCapsule();

        dispensedCapsule.classList.add('hidden');
        dispensedCapsule.classList.remove('chute-eject', 'capsule-waiting');
        const tapGuide = document.getElementById('capsule-tap-guide');
        if (tapGuide) tapGuide.classList.add('hidden');
      });
    }

        }

        const dispensed = document.getElementById('dispensed-capsule');
        if (dispensed) dispensed.classList.add('hidden');
        const tapGuide = document.getElementById('capsule-tap-guide');
        if (tapGuide) tapGuide.classList.add('hidden');

        updateUI();
      });
    }

    window.onload = () => {
      handleResize();
      initBubbles();
      updateUI();
      render();
    };
  </script>
</body>
</html>
