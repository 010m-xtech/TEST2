<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>極上生ビール泡ガチャ | スマホを振って黄金の泡を注ごう！</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Tone.js CDN for interactive sound effects -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.min.js"></script>
  <!-- Canvas Confetti for winning fanfare -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;900&display=swap');

    body {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      overflow-x: hidden;
      background: radial-gradient(circle at 50% 20%, #fef3c7 0%, #fde68a 45%, #f59e0b 100%);
    }

    /* Bubble Pulse Animation */
    @keyframes pulse-glow {
      0%, 100% {
        box-shadow: 0 0 15px rgba(245, 158, 11, 0.7), 0 0 30px rgba(251, 191, 36, 0.5);
        transform: scale(1);
      }
      50% {
        box-shadow: 0 0 25px rgba(245, 158, 11, 0.95), 0 0 50px rgba(217, 119, 6, 0.8);
        transform: scale(1.04);
      }
    }

    .pulse-ready {
      animation: pulse-glow 1.2s infinite ease-in-out;
    }

    /* Beer Stein / Glass Dome reflections */
    .glass-dome {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.65) 0%, rgba(255, 255, 255, 0.12) 60%, rgba(255, 255, 255, 0.45) 100%);
      box-shadow: inset 0 4px 25px rgba(255, 255, 255, 0.9),
                  inset 0 -8px 25px rgba(180, 83, 9, 0.35),
                  0 15px 35px rgba(146, 64, 14, 0.3);
    }

    /* Crank Handle rotation animation */
    @keyframes crank-spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .cranking {
      animation: crank-spin 0.9s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Capsule bounce */
    @keyframes drop-bounce {
      0% { transform: translateY(-120px) scale(0.6); opacity: 0; }
      60% { transform: translateY(15px) scale(1.08); opacity: 1; }
      80% { transform: translateY(-8px) scale(0.96); }
      100% { transform: translateY(0px) scale(1); }
    }
    .capsule-drop {
      animation: drop-bounce 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
  </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col items-center justify-between p-3 sm:p-5 select-none pt-6 sm:pt-8">

  <main class="w-full max-w-xl flex-1 flex flex-col items-center justify-center relative">
    
    <!-- Machine Frame -->
    <div class="w-full relative flex flex-col items-center">
      
      <!-- Top Beer Tap Cap of Machine -->
      <div class="w-56 sm:w-64 h-9 bg-gradient-to-r from-amber-600 via-amber-400 to-amber-600 rounded-t-3xl shadow-md border-t-2 border-white/80 flex items-center justify-center">
        <div class="w-20 h-2.5 bg-amber-800/40 rounded-full"></div>
      </div>
      
      <!-- Transparent Beer Glass Tank Dome Container (Enlarged) -->
      <div id="tank-container" class="relative w-[340px] sm:w-[420px] md:w-[460px] h-[340px] sm:h-[420px] md:h-[460px] rounded-full border-4 border-white/90 glass-dome overflow-hidden shadow-2xl flex items-center justify-center cursor-pointer">
        <!-- Canvas for dynamic golden beer, creamy white head, tilt liquid, and 10 capsules -->
        <canvas id="bubble-canvas" class="w-full h-full block"></canvas>

        <!-- Glass highlights and reflection overlays -->
        <div class="absolute top-6 left-9 w-28 h-14 rounded-full bg-gradient-to-b from-white/70 to-transparent transform -rotate-45 pointer-events-none"></div>
        <div class="absolute bottom-8 right-9 w-16 h-8 rounded-full bg-gradient-to-t from-white/40 to-transparent transform -rotate-45 pointer-events-none"></div>
        
        <!-- Beer Foam meter overlay floating indicator -->
        <div class="absolute bottom-5 bg-amber-950/75 backdrop-blur-md text-white px-4 py-1.5 rounded-full text-xs sm:text-sm font-black tracking-wider flex items-center gap-2 shadow-lg border border-amber-300/40 pointer-events-none">
          <span class="inline-block w-2.5 h-2.5 rounded-full bg-yellow-300 animate-ping"></span>
          泡＆ビール注ぎ率: <span id="bubble-percent" class="text-amber-300 text-sm sm:text-base font-extrabold w-12 text-right">0%</span>
        </div>
      </div>

      <div class="w-[350px] sm:w-[430px] md:w-[470px] bg-gradient-to-b from-amber-600 via-amber-700 to-amber-900 rounded-3xl p-5 shadow-2xl border-4 border-amber-200/90 relative -mt-6 z-10 flex flex-col items-center">
        <!-- Shiny Golden Trim Plate -->
        <div class="w-4/5 h-2.5 bg-gradient-to-r from-amber-300 via-yellow-200 to-amber-300 rounded-full mb-3.5 shadow"></div>

        <!-- Progress Bar Indicator -->
        <div class="w-full bg-amber-950/60 rounded-full h-4 sm:h-5 p-0.5 mb-4 shadow-inner overflow-hidden border border-amber-300/40">
          <div id="progress-fill" class="bg-gradient-to-r from-yellow-300 via-amber-300 to-white h-full rounded-full transition-all duration-150 w-0 relative">
            <div class="absolute inset-0 bg-white/40 animate-pulse"></div>
          </div>
        </div>

        <!-- Crank / Gacha Dispenser Area -->
        <div class="w-full flex items-center justify-between px-3 sm:px-6 gap-3">
          
          <!-- Dispenser Drop Chute -->
          <div class="w-24 sm:w-28 h-20 sm:h-24 bg-amber-950/90 rounded-2xl border-2 border-amber-400/50 shadow-inner flex items-center justify-center relative overflow-hidden">
            <span class="text-[10px] sm:text-xs text-amber-200/70 font-bold absolute top-1">注ぎ口</span>
            <div id="chute-exit" class="w-14 h-14 sm:w-16 sm:h-16 flex items-center justify-center transition-transform">
              <span class="text-xs sm:text-sm text-amber-400/50 font-mono font-bold">WAIT</span>
            </div>
          </div>

          <!-- Main Interactive Crank Wheel Button -->
          <div class="flex-1 flex flex-col items-center">
            <button id="gacha-crank-btn" disabled class="relative group disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-300 transform active:scale-95">
              <div id="crank-disc" class="w-20 h-20 sm:w-24 sm:h-24 rounded-full bg-gradient-to-tr from-amber-300 via-yellow-200 to-amber-500 border-4 border-white shadow-xl flex items-center justify-center relative">
                <!-- Inner crank bar (Beer Tap style lever) -->
                <div class="w-14 sm:w-16 h-4 sm:h-5 bg-gradient-to-r from-amber-700 via-amber-500 to-amber-700 rounded-full shadow-md border border-white/40"></div>
                <!-- Knob -->
                <div class="absolute top-1.5 sm:top-2 right-2 sm:right-2.5 w-5 h-5 sm:w-6 sm:h-6 bg-gradient-to-b from-white to-amber-200 rounded-full shadow border border-amber-400"></div>
              </div>
            </button>
            <span id="gacha-btn-label" class="mt-2 text-xs sm:text-sm font-black text-amber-100 text-shadow drop-shadow text-center">
              振って注いでね！
            </span>
          </div>

          <!-- Shake manual trigger button for desktop or accessibility -->
          <div class="flex flex-col items-center gap-1">
            <button id="manual-shake-btn" class="px-3 sm:px-4 py-2 sm:py-2.5 bg-amber-50 hover:bg-white text-amber-900 active:bg-amber-100 font-bold text-xs sm:text-sm rounded-xl shadow border border-amber-300 active:scale-95 transition flex flex-col items-center">
              <span class="text-lg sm:text-xl">🍺</span>
              <span class="text-[10px] sm:text-xs leading-tight">手動で泡注ぎ</span>
            </button>
          </div>

        </div>

      </div>

    </div>
  </main>

  <footer class="w-full max-w-xl text-center py-2">
    <p id="shake-instruction" class="text-xs sm:text-sm font-bold text-amber-950 bg-white/80 backdrop-blur-sm py-1.5 px-4 rounded-full inline-block shadow-sm border border-amber-200">
      💡 スマホをたくさんシャカシャカ振って、極上の黄金ビール泡をじっくり注ごう！
    </p>
  </footer>

  <div id="result-modal" class="fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-md hidden items-center justify-center p-4">
    <div class="w-full max-w-xs bg-gradient-to-b from-amber-50 via-white to-amber-100 rounded-3xl p-6 shadow-2xl border-4 border-amber-300 text-center flex flex-col items-center relative overflow-hidden">
      
      <!-- Sparkle Background Pattern -->
      <div class="absolute -top-12 -right-12 w-32 h-32 bg-amber-300/40 rounded-full blur-xl pointer-events-none"></div>
      
      <!-- Stage 1: Unopened Capsule Container -->
      <div id="capsule-stage" class="cursor-pointer my-4 flex flex-col items-center">
        <div id="bouncing-capsule" class="w-28 h-28 rounded-full border-4 border-white shadow-2xl relative overflow-hidden transition transform hover:scale-105 active:scale-95 capsule-drop">
          <div id="capsule-top-half" class="absolute top-0 inset-x-0 h-1/2 bg-white transition-transform origin-bottom duration-500 shadow-inner"></div>
          <div id="capsule-bottom-half" class="absolute bottom-0 inset-x-0 h-1/2 bg-gradient-to-b from-amber-400 to-amber-500 transition-transform origin-top duration-500"></div>
          <div class="absolute top-1/2 -mt-1 inset-x-0 h-2 bg-amber-900/20 z-10"></div>
          <div class="absolute inset-0 flex items-center justify-center z-20 text-3xl animate-pulse">🍻</div>
        </div>
        <p class="mt-4 text-xs font-extrabold text-amber-900 animate-bounce">
          👇 タップして泡カプセルを開けよう！
        </p>
      </div>

      <!-- Stage 2: Revealed Prize Stage (hidden initially) -->
      <div id="prize-stage" class="hidden flex flex-col items-center w-full">
        <!-- Rarity Badge -->
        <span id="prize-rarity" class="px-3 py-1 rounded-full text-xs font-black tracking-widest text-white shadow-sm mb-2">
          SSR
        </span>

        <!-- Prize Visual Icon/Card -->
        <div id="prize-card" class="w-24 h-24 rounded-2xl bg-white shadow-xl border-4 border-amber-400 flex items-center justify-center text-5xl mb-3 relative overflow-hidden">
          <span id="prize-icon">👑</span>
        </div>

        <h2 id="prize-name" class="text-lg font-black text-amber-950 mb-1">
          ゴールドプレミアム生ビール
        </h2>
        <p id="prize-desc" class="text-xs text-amber-800 font-bold mb-4 px-2">
          黄金比7:3の奇跡！泡まで旨い至高の1杯！
        </p>

        <!-- Claim / Retry Button -->
        <button id="close-modal-btn" class="w-full py-3 bg-gradient-to-r from-amber-500 via-amber-600 to-amber-700 hover:from-amber-600 hover:to-amber-800 text-white font-black rounded-xl shadow-lg active:scale-95 transition">
          もう一杯注ぐ！（振る）
        </button>
      </div>

    </div>
  </div>

  <script>
    /* Beer Gacha items */
    const GACHA_ITEMS = [
      { id: 'item_1', name: 'ゴールドプレミアム生', rarity: 'SSR', icon: '🏆', color: 'bg-gradient-to-r from-yellow-400 via-amber-400 to-yellow-500', desc: '麦芽100%！黄金比7:3の極上泡が立つ伝説のビール！' },
      { id: 'item_2', name: '職人の特大ジョッキ', rarity: 'SSR', icon: '🍺', color: 'bg-gradient-to-r from-amber-500 to-orange-500', desc: 'キンキンに凍りついたメガジョッキ！乾杯の主役！' },
      { id: 'item_3', name: '香るクラフトIPA', rarity: 'SR', icon: '🌿', color: 'bg-gradient-to-r from-emerald-500 to-amber-500', desc: 'ホップの華やかなアロマと心地よい苦味がたまらない。' },
      { id: 'item_4', name: 'コク旨黒ビール', rarity: 'SR', icon: '☕', color: 'bg-gradient-to-r from-stone-700 to-amber-900', desc: 'ロースト麦芽の香ばしい薫りとクリーミーな泡。' },
      { id: 'item_5', name: '茹でたて枝豆', rarity: 'R', icon: '🫛', color: 'bg-gradient-to-r from-green-500 to-emerald-600', desc: 'ビールに一番合う永遠のベストパートナー！' },
      { id: 'item_6', name: '香ばし焼き鳥盛り', rarity: 'R', icon: '🍢', color: 'bg-gradient-to-r from-amber-600 to-red-600', desc: 'タレの香りと炭火の煙がビールを無限に進ませる。' },
      { id: 'item_7', name: 'クリーミーな神泡', rarity: 'N', icon: '🫧', color: 'bg-amber-400', desc: 'きめ細やかでシルキーなビールの白い天使。' },
      { id: 'item_8', name: '黄金色の麦のしずく', rarity: 'N', icon: '🌾', color: 'bg-amber-400', desc: '大地の恵みたっぷりの美味しい麦汁。' }
    ];

    let bubblePower = 0; // 0 to 100
    const MAX_POWER = 100;
    let isFull = false;
    let isCranking = false;
    let soundEnabled = true;
    let currentPrize = null;

    let synthsInitialized = false;
    let bubblePopSynth, fanfareSynth, rattleSynth, clickSynth;

    function initAudio() {
      if (synthsInitialized) return;
      try {
        Tone.start();

        // Bubble burst / beer fizz synth
        bubblePopSynth = new Tone.MembraneSynth({
          pitchDecay: 0.08,
          octaves: 2.5,
          oscillator: { type: 'sine' },
          envelope: { attack: 0.001, decay: 0.12, sustain: 0, release: 0.05 }
        }).toDestination();
        bubblePopSynth.volume.value = -7;

        // Mechanical Click Synth for Tap Handle
        clickSynth = new Tone.PluckSynth({
          attackNoise: 1.6,
          dampening: 3800,
          resonance: 0.75
        }).toDestination();
        clickSynth.volume.value = -4;

        // Rattle/fizzy foam synth for shaking
        rattleSynth = new Tone.NoiseSynth({
          noise: { type: 'white' },
          envelope: { attack: 0.005, decay: 0.09, sustain: 0 }
        }).toDestination();
        rattleSynth.volume.value = -13;

        // Fanfare PolySynth for prize reveal
        fanfareSynth = new Tone.PolySynth(Tone.Synth, {
          oscillator: { type: 'triangle' },
          envelope: { attack: 0.02, decay: 0.3, sustain: 0.4, release: 0.8 }
        }).toDestination();
        fanfareSynth.volume.value = -5;

        synthsInitialized = true;
      } catch (err) {
        console.warn("Audio init deferred:", err);
      }
    }

    function playBubbleSound() {
      if (!soundEnabled || !synthsInitialized) return;
      try {
        const notes = ['D5', 'F#5', 'A5', 'B5', 'D6', 'E6'];
        const note = notes[Math.floor(Math.random() * notes.length)];
        bubblePopSynth.triggerAttackRelease(note, '16n');
      } catch (e) {}
    }

    function playShakeFizz() {
      if (!soundEnabled || !synthsInitialized) return;
      try {
        rattleSynth.triggerAttackRelease('32n');
      } catch (e) {}
    }

    function playCrankSound() {
      if (!soundEnabled || !synthsInitialized) return;
      try {
        clickSynth.triggerAttack('C3');
      } catch (e) {}
    }

    function playWinSound(rarity) {
      if (!soundEnabled || !synthsInitialized) return;
      try {
        const now = Tone.now();
        if (rarity === 'SSR') {
          fanfareSynth.triggerAttackRelease(['D4', 'F#4', 'A4', 'D5'], '4n', now);
          fanfareSynth.triggerAttackRelease(['G4', 'B4', 'D5', 'G5'], '4n', now + 0.22);
          fanfareSynth.triggerAttackRelease(['A4', 'C#5', 'E5', 'A5'], '2n', now + 0.45);
        } else if (rarity === 'SR') {
          fanfareSynth.triggerAttackRelease(['G4', 'B4', 'D5'], '8n', now);
          fanfareSynth.triggerAttackRelease(['C5', 'E5', 'G5'], '4n', now + 0.2);
        } else {
          fanfareSynth.triggerAttackRelease(['D5', 'A4'], '8n', now);
        }
      } catch (e) {}
    }

    const canvas = document.getElementById('bubble-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let bubbles = [];
    let liquidLevel = 0.12; // normalized from 0.10 to 0.82
    let shakeVelocity = { x: 0, y: 0 };

    // High precision tilt state
    let targetLiquidAngle = 0; // Target physical tilt angle in radians
    let liquidAngle = 0;        // Smoothed liquid surface angle
    let currentTiltX = 0;      // Direct gravity vector X
    let currentTiltY = 0;      // Direct gravity vector Y
    let targetTiltX = 0;
    let targetTiltY = 0;

    // Capsule class representing 10 buoyant capsules inside the tank
    class TankCapsule {
      constructor(index) {
        this.index = index;
        this.radius = 20;
        this.x = 0;
        this.y = 0;
        this.vx = (Math.random() - 0.5) * 2;
        this.vy = (Math.random() - 0.5) * 2;
        this.angle = Math.random() * Math.PI * 2;
        this.vAngle = (Math.random() - 0.5) * 0.05;
        // Density variation (0.76 - 0.94) so capsules naturally settle semi-submerged in beer
        this.density = 0.76 + (index % 4) * 0.06;
        this.beerColors = [
          ['#f59e0b', '#d97706'],
          ['#fbbf24', '#b45309'],
          ['#eab308', '#ca8a04'],
          ['#78350f', '#451a03'], // dark beer capsule
          ['#f97316', '#c2410c']
        ];
        this.colorPair = this.beerColors[index % this.beerColors.length];
      }

      initPosition(cx, cy, tankRadius) {
        const spawnRadius = tankRadius * 0.55;
        const angle = (this.index / 10) * Math.PI * 2;
        this.x = cx + Math.cos(angle) * (spawnRadius * (0.4 + Math.random() * 0.5));
        this.y = cy + Math.sin(angle) * (spawnRadius * 0.5) + (tankRadius * 0.2);
      }

      update(cx, cy, tankRadius, surfaceYFunc) {
        // Highly responsive gravity forces matching real device orientation
        const gx = currentTiltX * 0.92;
        const gy = 0.42 + Math.max(-0.25, currentTiltY * 0.5);

        this.vx += gx + (shakeVelocity.x * 0.08);
        this.vy += gy + (shakeVelocity.y * 0.08);

        // Buoyancy calculation
        const surfaceY = surfaceYFunc(this.x);
        const bottomY = this.y + this.radius;

        if (bottomY > surfaceY) {
          // Submerged in beer liquid: smooth partial sinking equilibrium
          const submergence = Math.min(this.radius * 2, bottomY - surfaceY);
          const submergedRatio = submergence / (this.radius * 2);

          const buoyancy = (submergedRatio / this.density) * 0.82;
          this.vy -= buoyancy;

          // Slide directly down the precise tilt slope
          this.vx += Math.sin(liquidAngle) * 0.95;

          // Viscous drag of beer liquid
          this.vx *= 0.92;
          this.vy *= 0.91;

          // Natural surface rolling
          this.angle += this.vx * 0.07;
        } else {
          // In air above the foam
          this.vx *= 0.985;
          this.vy *= 0.985;
          this.angle += this.vAngle;
        }

        this.x += this.vx;
        this.y += this.vy;
        this.vAngle *= 0.96;

        // Circular dome bounds
        const dx = this.x - cx;
        const dy = this.y - cy;
        const dist = Math.hypot(dx, dy);
        const maxDist = tankRadius - this.radius - 2;

        if (dist > maxDist) {
          const normalX = dx / dist;
          const normalY = dy / dist;
          this.x = cx + normalX * maxDist;
          this.y = cy + normalY * maxDist;

          const dot = this.vx * normalX + this.vy * normalY;
          this.vx = (this.vx - 1.6 * dot * normalX) * 0.62;
          this.vy = (this.vy - 1.6 * dot * normalY) * 0.62;
        }
      }

      draw(c) {
        c.save();
        c.translate(this.x, this.y);
        c.rotate(this.angle);

        // Soft drop shadow in liquid
        c.beginPath();
        c.arc(1.5, 2.5, this.radius, 0, Math.PI * 2);
        c.fillStyle = 'rgba(0, 0, 0, 0.16)';
        c.fill();

        // White Creamy Foam Top Half
        c.beginPath();
        c.arc(0, 0, this.radius, Math.PI, 0, false);
        c.closePath();
        const foamGrad = c.createLinearGradient(0, -this.radius, 0, 0);
        foamGrad.addColorStop(0, '#ffffff');
        foamGrad.addColorStop(0.7, '#fffbeb');
        foamGrad.addColorStop(1, '#fef3c7');
        c.fillStyle = foamGrad;
        c.fill();

        // Golden Beer Bottom Half
        c.beginPath();
        c.arc(0, 0, this.radius, 0, Math.PI, false);
        c.closePath();
        const beerGrad = c.createLinearGradient(0, 0, 0, this.radius);
        beerGrad.addColorStop(0, this.colorPair[0]);
        beerGrad.addColorStop(1, this.colorPair[1]);
        c.fillStyle = beerGrad;
        c.fill();

        // Capsule Center Seam
        c.beginPath();
        c.rect(-this.radius, -1.2, this.radius * 2, 2.4);
        c.fillStyle = 'rgba(255, 255, 255, 0.9)';
        c.fill();
        c.strokeStyle = 'rgba(180, 83, 9, 0.35)';
        c.lineWidth = 0.8;
        c.stroke();

        // Glass Gloss reflection highlight
        c.beginPath();
        c.arc(-this.radius * 0.35, -this.radius * 0.35, this.radius * 0.38, 0, Math.PI * 2);
        c.fillStyle = 'rgba(255, 255, 255, 0.55)';
        c.fill();

        // Outer rim highlight
        c.beginPath();
        c.arc(0, 0, this.radius, 0, Math.PI * 2);
        c.strokeStyle = 'rgba(255, 255, 255, 0.75)';
        c.lineWidth = 1.2;
        c.stroke();

        c.restore();
      }
    }

    let capsules = [];
    function initCapsules() {
      capsules = [];
      const dpr = window.devicePixelRatio || 1;
      const w = width > 0 ? (width / dpr) : (canvas.clientWidth || 300);
      const h = height > 0 ? (height / dpr) : (canvas.clientHeight || 300);
      const cx = w / 2;
      const cy = h / 2;
      const tankRadius = Math.max(10, Math.min(w, h) / 2 - 6);

      for (let i = 0; i < 10; i++) {
        const cap = new TankCapsule(i);
        cap.initPosition(cx, cy, tankRadius);
        capsules.push(cap);
      }
    }

    function resolveCapsuleCollisions() {
      for (let i = 0; i < capsules.length; i++) {
        for (let j = i + 1; j < capsules.length; j++) {
          const c1 = capsules[i];
          const c2 = capsules[j];
          const dx = c2.x - c1.x;
          const dy = c2.y - c1.y;
          const dist = Math.hypot(dx, dy);
          const minDist = c1.radius + c2.radius;

          if (dist < minDist && dist > 0.001) {
            const overlap = (minDist - dist) * 0.5;
            const nx = dx / dist;
            const ny = dy / dist;

            c1.x -= nx * overlap;
            c1.y -= ny * overlap;
            c2.x += nx * overlap;
            c2.y += ny * overlap;

            // Separate velocities
            const dvx = c2.vx - c1.vx;
            const dvy = c2.vy - c1.vy;
            const p = (dvx * nx + dvy * ny) * 0.55;

            c1.vx += p * nx;
            c1.vy += p * ny;
            c2.vx -= p * nx;
            c2.vy -= p * ny;
          }
        }
      }
    }

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const container = document.getElementById('tank-container');
      const dpr = window.devicePixelRatio || 1;
      const displayWidth = Math.max(rect.width || (container ? container.clientWidth : 0) || 300, 50);
      const displayHeight = Math.max(rect.height || (container ? container.clientHeight : 0) || 300, 50);

      width = canvas.width = Math.floor(displayWidth * dpr);
      height = canvas.height = Math.floor(displayHeight * dpr);
      initCapsules();
    }
    window.addEventListener('resize', resizeCanvas);

    class Bubble {
      constructor(isBurst = false) {
        this.reset(isBurst);
      }
      reset(isBurst = false) {
        const dpr = window.devicePixelRatio || 1;
        const w = width > 0 ? (width / dpr) : (canvas.clientWidth || 300);
        const h = height > 0 ? (height / dpr) : (canvas.clientHeight || 300);
        const currentLiquidHeight = h * liquidLevel;
        
        this.x = Math.random() * (w * 0.84) + (w * 0.08);
        this.y = h - (Math.random() * currentLiquidHeight);
        this.radius = Math.random() * 6 + 2.5; // Fine creamy bubbles
        this.speedY = -(Math.random() * 2.5 + 1.2); // Carbonation rises up fast
        this.speedX = (Math.random() - 0.5) * 1.2;
        this.wobble = Math.random() * Math.PI * 2;
        this.wobbleSpeed = Math.random() * 0.1 + 0.04;
        this.alpha = Math.random() * 0.55 + 0.35;
        this.isFoam = Math.random() > 0.4;
      }
      update(forceX, forceY) {
        this.wobble += this.wobbleSpeed;
        this.x += Math.sin(this.wobble) * 0.7 + this.speedX + forceX * 0.2;
        this.y += this.speedY + forceY * 0.2;

        const dpr = window.devicePixelRatio || 1;
        const w = width > 0 ? (width / dpr) : (canvas.clientWidth || 300);
        const h = height > 0 ? (height / dpr) : (canvas.clientHeight || 300);
        const surfaceY = h - (h * liquidLevel);

        if (this.y < surfaceY - 8 || this.y > h || this.x < 0 || this.x > w) {
          this.reset();
        }
      }
      draw(c) {
        c.save();
        c.beginPath();
        c.arc(this.x, this.y, Math.max(0.1, this.radius), 0, Math.PI * 2);
        if (this.isFoam) {
          c.fillStyle = `rgba(255, 255, 255, ${this.alpha * 1.1})`;
        } else {
          c.fillStyle = `rgba(254, 240, 138, ${this.alpha})`;
        }
        c.fill();
        c.strokeStyle = `rgba(255, 255, 255, ${this.alpha * 0.8})`;
        c.lineWidth = 1;
        c.stroke();

        // Shimmer highlight
        c.beginPath();
        c.arc(this.x - this.radius * 0.3, this.y - this.radius * 0.3, Math.max(0.1, this.radius * 0.25), 0, Math.PI * 2);
        c.fillStyle = 'rgba(255, 255, 255, 0.9)';
        c.fill();
        c.restore();
      }
    }

    function initBubbles() {
      bubbles = [];
      const count = 65;
      for (let i = 0; i < count; i++) {
        bubbles.push(new Bubble());
      }
    }

    let waveTime = 0;
    function render() {
      const dpr = window.devicePixelRatio || 1;
      const w = width > 0 ? (width / dpr) : (canvas.clientWidth || 300);
      const h = height > 0 ? (height / dpr) : (canvas.clientHeight || 300);

      if (w <= 20 || h <= 20) {
        requestAnimationFrame(render);
        return;
      }

      const cx = w / 2;
      const cy = h / 2;
      const tankRadius = Math.max(10, Math.min(w, h) / 2 - 4);

      ctx.save();
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, w, h);

      // High-precision smooth tilt interpolation
      currentTiltX += (targetTiltX - currentTiltX) * 0.18;
      currentTiltY += (targetTiltY - currentTiltY) * 0.18;
      liquidAngle += (targetLiquidAngle - liquidAngle) * 0.18;

      // Target liquid level moves with bubblePower
      const targetLevel = 0.15 + (bubblePower / MAX_POWER) * 0.68;
      liquidLevel += (targetLevel - liquidLevel) * 0.08;

      waveTime += 0.05 + Math.abs(shakeVelocity.x) * 0.02;

      // Surface height calculator at any horizontal X position accounting for precision tilt & subtle dynamic ripples
      const baseSurfaceY = h - (h * liquidLevel);
      const getSurfaceY = (x) => {
        const tiltOffset = (x - cx) * Math.tan(liquidAngle);
        const ripple = Math.sin(x * 0.035 + waveTime) * (2.2 + Math.abs(shakeVelocity.x) * 1.5) +
                       Math.cos(x * 0.025 - waveTime) * 1.5;
        return baseSurfaceY + tiltOffset + ripple;
      };

      // Clip all liquid and capsules strictly inside circular beer glass dome
      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, tankRadius, 0, Math.PI * 2);
      ctx.clip();

      // 1. Draw Golden Beer Body with Tilt
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(-20, h + 20);
      ctx.lineTo(-20, getSurfaceY(-20));

      for (let x = -20; x <= w + 20; x += 10) {
        ctx.lineTo(x, getSurfaceY(x));
      }
      ctx.lineTo(w + 20, h + 20);
      ctx.closePath();

      // Rich Golden Beer gradient aligned with liquid inclination
      const liquidGrad = ctx.createLinearGradient(0, baseSurfaceY - 20, 0, h);
      if (bubblePower >= MAX_POWER) {
        liquidGrad.addColorStop(0, 'rgba(251, 191, 36, 0.94)');
        liquidGrad.addColorStop(0.4, 'rgba(245, 158, 11, 0.96)');
        liquidGrad.addColorStop(1, 'rgba(180, 83, 9, 0.98)');
      } else {
        liquidGrad.addColorStop(0, 'rgba(253, 224, 71, 0.88)');
        liquidGrad.addColorStop(0.5, 'rgba(245, 158, 11, 0.92)');
        liquidGrad.addColorStop(1, 'rgba(217, 119, 6, 0.96)');
      }
      ctx.fillStyle = liquidGrad;
      ctx.fill();
      ctx.restore();

      // 2. Update and Draw 10 Floating Capsules
      resolveCapsuleCollisions();
      for (let cap of capsules) {
        cap.update(cx, cy, tankRadius, getSurfaceY);
        cap.draw(ctx);
      }

      // 3. Draw Thick Creamy White Foam Head (ビール泡層)
      const foamThickness = 16 + (bubblePower / MAX_POWER) * 22;
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(-20, getSurfaceY(-20) + 6);

      for (let x = -20; x <= w + 20; x += 10) {
        ctx.lineTo(x, getSurfaceY(x) - foamThickness);
      }
      ctx.lineTo(w + 20, getSurfaceY(w + 20) - foamThickness);
      ctx.lineTo(w + 20, getSurfaceY(w + 20) + 6);
      for (let x = w + 20; x >= -20; x -= 10) {
        ctx.lineTo(x, getSurfaceY(x) + 6);
      }
      ctx.closePath();
      
      const foamGrad = ctx.createLinearGradient(0, baseSurfaceY - foamThickness, 0, baseSurfaceY + 8);
      foamGrad.addColorStop(0, 'rgba(255, 255, 255, 0.98)');
      foamGrad.addColorStop(0.7, 'rgba(254, 252, 232, 0.92)');
      foamGrad.addColorStop(1, 'rgba(254, 240, 138, 0.45)');
      ctx.fillStyle = foamGrad;
      ctx.fill();

      // Creamy foam crown cloud bumps along the tilted surface
      for (let x = 6; x < w; x += 24) {
        const sy = getSurfaceY(x);
        ctx.beginPath();
        ctx.arc(x, sy - foamThickness + 2, 9, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.88)';
        ctx.fill();
      }
      ctx.restore();

      // 4. Update and draw carbonation bubbles
      for (let b of bubbles) {
        b.update(shakeVelocity.x + (currentTiltX * 2.5), shakeVelocity.y);
        b.draw(ctx);
      }

      ctx.restore(); // Restore clip
      ctx.restore(); // Restore transform

      // Decay shake momentum
      shakeVelocity.x *= 0.92;
      shakeVelocity.y *= 0.92;

      requestAnimationFrame(render);
    }

    function addBubblePower(amount, isPhysicalShake = false) {
      if (isFull || isCranking) return;

      initAudio();
      bubblePower = Math.min(MAX_POWER, bubblePower + amount);

      // Add extra splash bubble particle
      if (bubbles.length < 100) {
        bubbles.push(new Bubble(true));
      }

      if (isPhysicalShake) {
        playShakeFizz();
      } else {
        playBubbleSound();
      }

      updateUI();

      if (bubblePower >= MAX_POWER && !isFull) {
        onTankFull();
      }
    }

    function updateUI() {
      const pct = Math.floor(bubblePower);
      document.getElementById('bubble-percent').textContent = `${pct}%`;
      document.getElementById('progress-fill').style.width = `${pct}%`;

      const crankBtn = document.getElementById('gacha-crank-btn');
      const label = document.getElementById('gacha-btn-label');

      if (bubblePower >= MAX_POWER) {
        crankBtn.disabled = false;
        crankBtn.classList.add('pulse-ready');
        label.textContent = '✨ 黄金のレバーを回して乾杯！';
        label.className = 'mt-1.5 text-xs font-black text-yellow-300 text-shadow drop-shadow text-center';
      } else {
        crankBtn.disabled = true;
        crankBtn.classList.remove('pulse-ready');
        label.textContent = `振って注いでね！ (${pct}%)`;
        label.className = 'mt-1.5 text-xs font-black text-amber-100 text-shadow drop-shadow text-center';
      }
    }

    function onTankFull() {
      isFull = true;
      document.getElementById('shake-instruction').innerHTML = '🍺 <b>黄金ビールが満タンに注がれました！</b> レバーを回してガチャを引こう！';
      
      if (navigator.vibrate) {
        navigator.vibrate([100, 50, 100, 50, 200]);
      }
      confetti({
        particleCount: 30,
        spread: 50,
        origin: { y: 0.6 },
        colors: ['#f59e0b', '#fbbf24', '#ffffff', '#d97706']
      });
    }

    let lastX = null, lastY = null, lastZ = null;
    let lastShakeTime = 0;
    const SHAKE_THRESHOLD = 15;

    function handleOrientation(event) {
      // Precise real-world tilt angle calculation from device roll (gamma)
      if (event.gamma !== null) {
        // gamma ranges -90 to +90 degrees (left/right tilt)
        const rad = (event.gamma * Math.PI) / 180;
        // Allow broad liquid tilt angle up to ±1.1 rad (~63 degrees)
        targetLiquidAngle = Math.max(-1.1, Math.min(1.1, rad));
        targetTiltX = Math.max(-1.2, Math.min(1.2, Math.sin(rad) * 1.3));
      }
      if (event.beta !== null) {
        // Forward/backward tilt (relative to standard ~45 deg viewing angle)
        const pitchDiff = (event.beta - 45) * (Math.PI / 180);
        targetTiltY = Math.max(-1.0, Math.min(1.0, Math.sin(pitchDiff)));
      }
    }

    function handleMotion(event) {
      const current = event.accelerationIncludingGravity || event.acceleration;
      if (!current || current.x === null) return;

      // Direct gravity vector orientation for high precision fall-back
      if (event.accelerationIncludingGravity) {
        const ag = event.accelerationIncludingGravity;
        if (ag.x !== null && ag.y !== null) {
          // Angle of gravity vector in 2D plane
          const gravityAngle = Math.atan2(-ag.x, Math.max(1.0, ag.y));
          targetLiquidAngle = Math.max(-1.1, Math.min(1.1, gravityAngle));
          targetTiltX = Math.max(-1.2, Math.min(1.2, -ag.x / 7.5));
          targetTiltY = Math.max(-1.0, Math.min(1.0, (ag.y - 4.5) / 7.5));
        }
      }

      const currentTime = Date.now();
      if ((currentTime - lastShakeTime) < 55) return;

      if (lastX !== null) {
        const deltaX = Math.abs(current.x - lastX);
        const deltaY = Math.abs(current.y - lastY);
        const deltaZ = Math.abs(current.z - lastZ);
        const totalDelta = deltaX + deltaY + deltaZ;

        if (totalDelta > SHAKE_THRESHOLD) {
          const powerGain = Math.min(2.2, (totalDelta / SHAKE_THRESHOLD) * 0.65);
          shakeVelocity.x = (current.x - lastX) * 1.3;
          shakeVelocity.y = (current.y - lastY) * 1.3;

          addBubblePower(powerGain, true);
          lastShakeTime = currentTime;

          if (navigator.vibrate && Math.random() > 0.4) {
            navigator.vibrate(20);
          }
        }
      }

      lastX = current.x;
      lastY = current.y;
      lastZ = current.z;
    }

    // センサーの常時自動バインド（許可ボタン不要化）
    let sensorInitialized = false;
    function autoEnableSensors() {
      if (sensorInitialized) return;
      initAudio();

      const needOrientationPerm = typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function';
      const needMotionPerm = typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function';

      // iOS Safari (iOS 13+) などユーザー操作契機の許可が必要な端末向け
      if (needOrientationPerm || needMotionPerm) {
        if (needOrientationPerm) {
          DeviceOrientationEvent.requestPermission()
            .then(res => {
              if (res === 'granted') {
                window.addEventListener('deviceorientation', handleOrientation);
              }
            })
            .catch(() => {});
        }
        if (needMotionPerm) {
          DeviceMotionEvent.requestPermission()
            .then(res => {
              if (res === 'granted') {
                window.addEventListener('devicemotion', handleMotion);
                sensorInitialized = true;
              }
            })
            .catch(() => {});
        }
      } else {
        // Android / Chrome / 標準ブラウザ：無条件で常に許可・登録
        window.addEventListener('deviceorientation', handleOrientation);
        window.addEventListener('devicemotion', handleMotion);
        sensorInitialized = true;
      }
    }

    // Android/PC向け：ページロード時に即座に常時接続
    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission !== 'function') {
      window.addEventListener('devicemotion', handleMotion);
    }
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission !== 'function') {
      window.addEventListener('deviceorientation', handleOrientation);
    }

    // iOS Safari向け：画面のどこかを1度タッチした瞬間に裏で透過的に許可・初期化を実行
    window.addEventListener('touchstart', autoEnableSensors, { passive: true, once: true });
    window.addEventListener('pointerdown', autoEnableSensors, { passive: true, once: true });
    window.addEventListener('click', autoEnableSensors, { passive: true, once: true });

    // Mouse tilt simulation on desktop
    window.addEventListener('mousemove', (e) => {
      const normX = (e.clientX / window.innerWidth) * 2 - 1;
      const normY = (e.clientY / window.innerHeight) * 2 - 1;
      targetLiquidAngle = normX * 0.85; // Up to ~48 degrees on desktop mouse
      targetTiltX = normX * 1.1;
      targetTiltY = normY * 0.6;
    });

    const crankBtn = document.getElementById('gacha-crank-btn');
    const crankDisc = document.getElementById('crank-disc');

    crankBtn.addEventListener('click', () => {
      if (!isFull || isCranking) return;
      isCranking = true;

      initAudio();
      playCrankSound();

      crankDisc.classList.add('cranking');

      if (navigator.vibrate) {
        navigator.vibrate([80, 50, 80]);
      }

      setTimeout(() => playCrankSound(), 250);
      setTimeout(() => playCrankSound(), 550);

      setTimeout(() => {
        crankDisc.classList.remove('cranking');
        dispenseCapsule();
      }, 950);
    });

    document.getElementById('manual-shake-btn').addEventListener('click', () => {
      initAudio();
      shakeVelocity.x = (Math.random() - 0.5) * 16;
      shakeVelocity.y = -9;
      // 手動タップ時も少しずつ溜まるように調整
      addBubblePower(2.5, false);
    });

    document.getElementById('bubble-canvas').addEventListener('click', (e) => {
      initAudio();
      shakeVelocity.x = (Math.random() - 0.5) * 10;
      // ジョッキタップ時の上昇量も調整
      addBubblePower(1.5, false);
    });

    function rollGachaItem() {
      const rand = Math.random() * 100;
      let rarity = 'N';
      if (rand < 12) rarity = 'SSR';       // 12%
      else if (rand < 38) rarity = 'SR';   // 26%
      else if (rand < 68) rarity = 'R';    // 30%
      else rarity = 'N';                   // 32%

      const pool = GACHA_ITEMS.filter(it => it.rarity === rarity);
      return pool[Math.floor(Math.random() * pool.length)];
    }

    function dispenseCapsule() {
      currentPrize = rollGachaItem();

      const modal = document.getElementById('result-modal');
      const capsuleStage = document.getElementById('capsule-stage');
      const prizeStage = document.getElementById('prize-stage');
      const topHalf = document.getElementById('capsule-top-half');
      const bottomHalf = document.getElementById('capsule-bottom-half');

      // Set Capsule styling: White foam on top, amber beer on bottom
      if (currentPrize.rarity === 'SSR') {
        bottomHalf.className = "absolute bottom-0 inset-x-0 h-1/2 bg-gradient-to-r from-amber-500 via-yellow-400 to-amber-600 transition-transform origin-top duration-500";
      } else if (currentPrize.rarity === 'SR') {
        bottomHalf.className = "absolute bottom-0 inset-x-0 h-1/2 bg-gradient-to-r from-amber-600 to-orange-500 transition-transform origin-top duration-500";
      } else if (currentPrize.rarity === 'R') {
        bottomHalf.className = "absolute bottom-0 inset-x-0 h-1/2 bg-amber-500 transition-transform origin-top duration-500";
      } else {
        bottomHalf.className = "absolute bottom-0 inset-x-0 h-1/2 bg-yellow-600 transition-transform origin-top duration-500";
      }

      topHalf.style.transform = 'translateY(0)';
      bottomHalf.style.transform = 'translateY(0)';

      capsuleStage.classList.remove('hidden');
      prizeStage.classList.add('hidden');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    document.getElementById('bouncing-capsule').addEventListener('click', () => {
      const topHalf = document.getElementById('capsule-top-half');
      const bottomHalf = document.getElementById('capsule-bottom-half');

      topHalf.style.transform = 'translateY(-30px) rotate(-15deg)';
      bottomHalf.style.transform = 'translateY(30px) rotate(15deg)';

      playWinSound(currentPrize.rarity);

      setTimeout(() => {
        document.getElementById('capsule-stage').classList.add('hidden');
        const prizeStage = document.getElementById('prize-stage');
        prizeStage.classList.remove('hidden');

        const rarityBadge = document.getElementById('prize-rarity');
        rarityBadge.textContent = currentPrize.rarity;
        rarityBadge.className = `px-3 py-1 rounded-full text-xs font-black tracking-widest text-white shadow-sm mb-2 ${
          currentPrize.rarity === 'SSR' ? 'bg-gradient-to-r from-amber-500 via-yellow-500 to-amber-600' :
          currentPrize.rarity === 'SR' ? 'bg-amber-600' :
          currentPrize.rarity === 'R' ? 'bg-emerald-600' : 'bg-slate-400'
        }`;

        document.getElementById('prize-icon').textContent = currentPrize.icon;
        document.getElementById('prize-name').textContent = currentPrize.name;
        document.getElementById('prize-desc').textContent = currentPrize.desc;

        confetti({
          particleCount: currentPrize.rarity === 'SSR' ? 120 : currentPrize.rarity === 'SR' ? 70 : 40,
          spread: 80,
          origin: { y: 0.5 },
          colors: ['#f59e0b', '#fbbf24', '#fef08a', '#ffffff']
        });
      }, 400);
    });

    document.getElementById('close-modal-btn').addEventListener('click', () => {
      document.getElementById('result-modal').classList.add('hidden');
      document.getElementById('result-modal').classList.remove('flex');

      bubblePower = 0;
      isFull = false;
      isCranking = false;
      updateUI();
      document.getElementById('shake-instruction').textContent = '💡 スマホをたくさんシャカシャカ振って、極上の黄金ビール泡をじっくり注ごう！';
    });

    window.onload = () => {
      resizeCanvas();
      initBubbles();
      updateUI();
      render();
    };
  </script>
</body>
