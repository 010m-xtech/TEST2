            </div>
            <div id="pv-radar" class="flex justify-center mt-3"></div>
            ${state.diagnosed ? `
              <div class="flex justify-center gap-4 text-xs text-[#6b6056] -mt-1">
                <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full" style="background:${c}"></span>このお酒</span>
                <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full border-2 border-dashed border-[#6b6056] bg-white"></span>あなたの好み</span>
              </div>` : `<p class="text-center text-xs text-[#6b6056] -mt-1">外側ほど、その味が強め</p>`}
          </section>

          <!-- ここがおいしい（壱・弐・参） -->
          ${info.points.length ? `
          <section class="mt-7 pv-in" style="--d:${n++}">
            <h3 class="wa-rule mb-3"><span>ここがおいしい</span></h3>
            <ol class="space-y-2.5">
              ${info.points.map((pt, i) => `<li class="rd-point flex items-start gap-2.5"><span class="point-num">${POINT_NUMS[i] || i + 1}</span><span class="pt-0.5">${esc(pt)}</span></li>`).join("")}
            </ol>
          </section>` : ""}

          <!-- 店主からのひとこと -->
          ${d.comment ? `
          <section class="mt-7 pv-in" style="--d:${n++}">
            <h3 class="wa-rule mb-3"><span>店主からのひとこと</span></h3>
            <p class="rd-body">${esc(d.comment)}</p>
            ${d.specs && d.specs.length ? `<p class="text-xs text-[#6b6056] mt-2">${d.specs.map(esc).join("　/　")}</p>` : ""}
          </section>` : ""}

          <!-- 合わせたい肴 -->
          ${info.matching.length ? `
          <section class="mt-7 pv-in" style="--d:${n++}">
            <h3 class="wa-rule mb-3"><span>合わせたい肴</span></h3>
            <ul class="flex flex-wrap justify-center gap-2">${info.matching.map(m => `<li class="rd-chip">${esc(m)}</li>`).join("")}</ul>
          </section>` : ""}

          <!-- 豆知識（タップでひらく） -->
          ${info.trivia ? `
          <section class="mt-7 pv-in" style="--d:${n++}">
            <button class="trivia-btn" onclick="toggleTrivia(this)" aria-expanded="false">
              <span>豆知識をのぞく</span><i class="fa-solid fa-chevron-down text-[11px] transition-transform duration-300"></i>
            </button>
            <div class="grid grid-rows-[0fr] opacity-0 transition-all duration-500 ease-out" data-trivia>
              <div class="overflow-hidden"><p class="rd-body px-3 pt-3">${esc(info.trivia)}</p></div>
            </div>
          </section>` : ""}

          <!-- これが好きなら -->
          ${sims.length ? `
          <section class="mt-8 pv-in" style="--d:${n++}">
            <h3 class="wa-rule mb-1"><span>これが好きなら</span></h3>
            <p class="text-center text-xs text-[#6b6056] mb-3">六角形の形が近いお酒です</p>
            <div class="grid grid-cols-3 gap-2">
              ${sims.map(o => `
                <button class="menu-card board-cell p-2 flex flex-col items-center text-center" onclick="openProduct('${o.id}', this)">
                  <div class="flex items-end justify-center gap-1"><div data-hero-src>${bottleSvg(o, "w-7 h-20")}</div>${radar(o, 40)}</div>
                  <span class="block font-mincho font-extrabold text-[13px] mt-1 leading-tight">${esc(o.name)}</span>
                  <span class="block text-[10px] text-muted">${esc([o.category, o.prefecture].filter(Boolean).join("・"))}</span>
                </button>`).join("")}
            </div>
          </section>` : ""}

          <div class="flex gap-3 mt-8">
            <button class="btn-line" onclick="closeProduct()">お品書きに戻る</button>
            <button class="btn-line" onclick="closeProduct(); setTab('shindan')">${state.diagnosed ? "診断結果へ" : "好み診断へ"}</button>
          </div>
        </div>`;

      // 六角形は中心から育つように（診断済みなら、あなたの好みを点線で重ねる）
      const series = [{ values: d.taste, fill: c + "33", stroke: c }];
      if (state.diagnosed) series.push({ values: userProfile, fill: "none", stroke: "#6B6560", dashed: true });
      const radarBox = document.getElementById("pv-radar");
      setTimeout(() => animateRadarChart(radarBox, series, 240, { accent: c }), 650);
      // メーターの点は、まん中からそれぞれの位置へ
      setTimeout(() => body.querySelectorAll(".meter-dot").forEach(el => el.style.left = el.dataset.left), 750);
    }

    // ---- 注ぐ演出 ----
    // お酒の色（日本酒は山吹がかった透明、にごりは白、ワインは赤・白・ロゼ）
    function liquidColor(d) {
      if (d.category === "ワイン") return { red: "rgba(122,23,48,.92)", white: "rgba(232,212,130,.85)", rose: "rgba(229,143,160,.88)" }[d.color] || "rgba(122,23,48,.92)";
      if ((d.tags || []).includes("にごり")) return "rgba(250,248,240,.95)";
      return d.color === "brown" ? "rgba(228,190,110,.85)" : "rgba(236,214,140,.75)";
    }
    // 蛇の目のお猪口（日本酒）／ワイングラス（ワイン）。中のお酒は .pour-liquid
    function cupSvg(d) {
      if (d.category === "ワイン") return `
        <svg class="pour-cup is-glass" viewBox="0 0 60 90" aria-hidden="true">
          <defs><clipPath id="glass-bowl"><path d="M8 4 h44 c2 24 -6 40 -22 42 c-16 -2 -24 -18 -22 -42 z"/></clipPath></defs>
          <g clip-path="url(#glass-bowl)"><rect class="pour-liquid" x="0" y="4" width="60" height="44" style="fill:var(--liquid)"/></g>
          <path d="M8 4 h44 c2 24 -6 40 -22 42 c-16 -2 -24 -18 -22 -42 z" fill="rgba(255,255,255,.18)" stroke="#b9ad98" stroke-width="1.4"/>
          <path d="M30 46 v32" stroke="#b9ad98" stroke-width="2"/>
          <ellipse cx="30" cy="82" rx="16" ry="4" fill="rgba(255,255,255,.5)" stroke="#b9ad98" stroke-width="1.4"/>
          <path d="M14 10 c0 14 3 24 8 30" stroke="#fff" stroke-opacity=".7" stroke-width="2" fill="none" stroke-linecap="round"/>
        </svg>`;
      return `
        <svg class="pour-cup" viewBox="0 0 64 44" aria-hidden="true">
          <defs><clipPath id="choko-in"><ellipse cx="32" cy="12" rx="26" ry="8"/><path d="M6 12 q2 22 26 24 q24 -2 26 -24 z"/></clipPath></defs>
          <path d="M4 12 q2 26 28 28 q26 -2 28 -28 z" fill="#f6f1e6" stroke="#cfc3ad" stroke-width="1.2"/>
          <g clip-path="url(#choko-in)">
            <rect x="0" y="0" width="64" height="44" fill="#fffdf8"/>
            <ellipse cx="32" cy="22" rx="11" ry="4.5" fill="none" stroke="#2f4f8f" stroke-width="3"/>
            <rect class="pour-liquid" x="0" y="4" width="64" height="40" style="fill:var(--liquid)"/>
          </g>
          <ellipse cx="32" cy="12" rx="28" ry="9" fill="none" stroke="#cfc3ad" stroke-width="1.4"/>
        </svg>`;
    }
    // 瓶が持ち上がって傾き、お猪口に注いで、もとに戻る
    function pour() {
      const stage = document.querySelector("#product-body .pour-stage");
      if (!stage || stage.classList.contains("is-pouring")) return;
      const bottle = stage.querySelector(".pour-bottle");
      const stream = stage.querySelector(".pour-stream");
      const liquid = stage.querySelector(".pour-liquid");
      const glass = stage.querySelector(".pour-cup").classList.contains("is-glass");
      if (reduceMotion()) { liquid.style.transform = "scaleY(1)"; return; }
      stage.classList.add("is-pouring");
      const T = 2100;
      bottle.animate([
        { transform: "none", easing: "cubic-bezier(.45,.05,.3,1)" },
        { transform: "translate(6px,-34px) rotate(-6deg)", offset: .14, easing: "cubic-bezier(.45,.05,.3,1)" },
        { transform: "translate(13px,-4px) rotate(124deg) scale(.82)", offset: .34, easing: "ease-in-out" },
        { transform: "translate(14px,-2px) rotate(128deg) scale(.82)", offset: .7, easing: "cubic-bezier(.45,.05,.3,1)" },
        { transform: "translate(6px,-30px) rotate(-4deg)", offset: .86, easing: "cubic-bezier(.45,.05,.3,1)" },
        { transform: "none" }
      ], { duration: T });
      stream.animate([
        { transform: "scaleY(0)", opacity: 0 },
        { transform: "scaleY(0)", opacity: 1, offset: .33 },
        { transform: "scaleY(1)", opacity: 1, offset: .4 },
        { transform: "scaleY(1)", opacity: 1, offset: .68 },
        { transform: "scaleY(1) translateY(100%)", opacity: 0, offset: .76 },
        { transform: "scaleY(0)", opacity: 0 }
      ], { duration: T });
      const from = getComputedStyle(liquid).transform === "none" ? 0 : 1;
      liquid.animate([
        { transform: `scaleY(${from ? 0.15 : 0})` },
        { transform: `scaleY(${from ? 0.15 : 0})`, offset: .38 },
        { transform: "scaleY(1)", offset: .72 },
        { transform: "scaleY(1)" }
      ], { duration: T, fill: "forwards" }).onfinish = function () {
        liquid.style.transform = "scaleY(1)"; this.cancel();
        stage.classList.remove("is-pouring");
        // 注ぎ終わりに、表面がきらっと
        stage.querySelector(".pour-cup").animate([{ filter: "brightness(1)" }, { filter: "brightness(1.15)" }, { filter: "brightness(1)" }], { duration: 500 });
      };
    }

    function toggleTrivia(btn) {
      const open = btn.getAttribute("aria-expanded") !== "true";
      btn.setAttribute("aria-expanded", open);
      btn.querySelector("i").style.transform = open ? "rotate(180deg)" : "";
      const box = btn.nextElementSibling;
      box.classList.toggle("grid-rows-[0fr]", !open); box.classList.toggle("grid-rows-[1fr]", open);
      box.classList.toggle("opacity-0", !open); box.classList.toggle("opacity-100", open);
    }

    // ---- カードの演出：瓶が主役 ----
    //   押すと、カードの瓶だけが浮き上がり、弧を描いて商品ページの瓶の位置へ。まわりの中身はあとから出てくる
    //   閉じると、瓶が一覧のカードへ戻る
    const reduceMotion = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    let productOpen = false;
    let cardAnimating = false;
    let openedCardId = null;

    // 瓶の分身を作って、from の位置から to の位置へ飛ばす
    function flyBottle(fromEl, toRect, opts = {}, fromRect = null) {
      const r = fromRect || fromEl.getBoundingClientRect();
      const ghost = fromEl.cloneNode(true);
      ghost.removeAttribute("data-hero-src"); ghost.removeAttribute("data-hero-dst");
      Object.assign(ghost.style, { position: "fixed", left: r.left + "px", top: r.top + "px", width: r.width + "px", height: r.height + "px",
        margin: "0", zIndex: "75", pointerEvents: "none", transformOrigin: "0 0", visibility: "visible",
        mixBlendMode: "multiply" });   // 瓶の写真の白い背景を、下の紙になじませる
      ghost.querySelectorAll("img").forEach(img => { img.style.mixBlendMode = "normal"; img.style.filter = "url(#knockout-white)"; });
      document.body.appendChild(ghost);
      const sx = toRect.width / r.width, sy = toRect.height / r.height;
      const dx = toRect.left - r.left, dy = toRect.top - r.top;
      const lift = opts.lift ?? -60;   // 弧のふくらみ（上へ）
      const anim = ghost.animate([
        { transform: "translate(0,0) scale(1,1) rotate(0)" },
        { transform: `translate(${dx * 0.45}px, ${dy * 0.45 + lift}px) scale(${1 + (sx - 1) * 0.5}, ${1 + (sy - 1) * 0.5}) rotate(${opts.tilt ?? -6}deg)`, offset: .45 },
        { transform: `translate(${dx}px, ${dy}px) scale(${sx}, ${sy}) rotate(0)` }
      ], { duration: opts.duration || 680, easing: "cubic-bezier(.45,.05,.25,1)", fill: "forwards" });
      return { ghost, anim };
    }

    function openProduct(id, src) {
      const d = byId[id];
      if (!d || cardAnimating) return;
      const view = document.getElementById("product-view");
      const paper = document.getElementById("product-body");
      const srcBottle = src && src.querySelector("[data-hero-src]");
      // 商品ページの中から次のお酒を開くときは、ページを描き直す前に瓶の位置と姿を控えておく
      const fromInside = productOpen;
      const fromRect = srcBottle ? srcBottle.getBoundingClientRect() : null;
      const fromClone = srcBottle ? srcBottle.cloneNode(true) : null;

      renderProduct(d);
      view.classList.remove("hidden");
      view.scrollTop = 0;
      document.body.style.overflow = "hidden";
      productOpen = true;
      openedCardId = !fromInside && src && src.dataset.card ? id : openedCardId;

      if (reduceMotion() || !srcBottle) {
        paper.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 300 });
        setTimeout(pour, reduceMotion() ? 0 : 700);
        return;
      }
      const dst = paper.querySelector("[data-hero-dst]");
      dst.style.visibility = "hidden";
      cardAnimating = true;
      // 紙（ページ）はふわっと出る。瓶はカードから飛んでくる
      view.animate([{ backgroundColor: "rgba(241,234,220,0)" }, { backgroundColor: "rgba(241,234,220,1)" }], { duration: 420, easing: "ease-out" });
      paper.animate([{ opacity: 0, transform: "translateY(18px)" }, { opacity: 1, transform: "none" }], { duration: 480, easing: "ease-out" });
      srcBottle.style.visibility = "hidden";
      const { ghost, anim } = flyBottle(fromInside ? fromClone : srcBottle, dst.getBoundingClientRect(), {}, fromRect);
      anim.onfinish = () => {
        dst.style.visibility = "";
        // 着地したときに、瓶が少し弾む
        dst.animate([{ transform: "scale(1.05)" }, { transform: "scale(.98)" }, { transform: "scale(1)" }], { duration: 260, easing: "ease-out" });
        setTimeout(pour, 380);
        ghost.remove();
        srcBottle.style.visibility = "";
        cardAnimating = false;
      };
    }

    function closeProduct() {
      if (!productOpen || cardAnimating) return;
      const view = document.getElementById("product-view");
      const paper = document.getElementById("product-body");
      const done = () => {
        view.classList.add("hidden");
        document.body.style.overflow = "";
        productOpen = false;
        view.getAnimations().forEach(a => a.cancel());
        paper.getAnimations().forEach(a => a.cancel());
        cardAnimating = false;
      };
      if (reduceMotion()) { done(); return; }
      const dst = paper.querySelector("[data-hero-dst]");
      if (dst) dst.getAnimations().forEach(a => a.cancel());
      const card = openedCardId && document.querySelector(`[data-card="${openedCardId}"]`);
      const cardBottle = card && card.querySelector("[data-hero-src]");
      const cr = cardBottle && cardBottle.getBoundingClientRect();
      const dr = dst && dst.getBoundingClientRect();
      const inView = rect => rect && rect.width && rect.bottom > 0 && rect.top < window.innerHeight;
      cardAnimating = true;
      // 紙はふわっと消える
      paper.animate([{ opacity: 1 }, { opacity: 0, transform: "translateY(18px)" }], { duration: 300, easing: "ease-in", fill: "forwards" });
      view.animate([{ backgroundColor: "rgba(241,234,220,1)" }, { backgroundColor: "rgba(241,234,220,0)" }], { duration: 420, fill: "forwards" });
      if (inView(cr) && inView(dr)) {
        // 瓶は一覧のカードへ戻る
        cardBottle.style.visibility = "hidden";
        const { ghost, anim } = flyBottle(dst, cr, { lift: -40, tilt: 5, duration: 560 });
        dst.style.visibility = "hidden";
        anim.onfinish = () => {
          done();
          cardBottle.style.visibility = "";
          ghost.remove();
          cardBottle.animate([{ transform: "translateY(-4px)" }, { transform: "none" }], { duration: 200, easing: "ease-out" });
        };
      } else {
        setTimeout(done, 420);
      }
    }

    // ---- 相性をリセット（診断の答えを消して、相性％と相性順を出さない状態に戻す） ----
    function resetDiagnosis() {
      cancelAnalyzing();
      currentStep = 0; quizAnswers = []; userProfile = { ...NEUTRAL_PROFILE }; userAnswerCounts = {};
      state.diagnosed = false;
      state.sortByMatch = false;
      store.set("menu-diagnosis", null);
      if (state.tab === "shindan") showShindanStep("intro"); else renderMenu();
      showToast("相性をリセットしました");
    }

    let toastTimer = null;
    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.remove("opacity-0", "translate-y-4");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.add("opacity-0", "translate-y-4"), 2000);
    }

    // =============================================================
    //  季節のヘッダー：月ごとに 桜（春）・青楓（夏）・紅葉（秋）・雪（冬）
    //  試すときは URL の最後に ?season=spring / summer / autumn / winter を付ける
    // =============================================================
    // 葉のかたち（とがった先を n 個もつ星形。紅葉・青楓）
    function leafPath(n, rOut, rIn) {
      let d = "";
      for (let k = 0; k < n; k++) {
        const a = (k / n) * Math.PI * 2 - Math.PI / 2, b = ((k + .5) / n) * Math.PI * 2 - Math.PI / 2;
        d += `${k ? "L" : "M"}${(Math.cos(a) * rOut).toFixed(1)},${(Math.sin(a) * rOut).toFixed(1)} L${(Math.cos(b) * rIn).toFixed(1)},${(Math.sin(b) * rIn).toFixed(1)} `;
      }
      return d + "Z";
    }
    // 桜の花びら1枚（上向き。先に切れ込み）
    const SAKURA_PETAL = "M0 0 C-5 -2 -6.5 -8 -3 -10.5 L0 -8.6 L3 -10.5 C6.5 -8 5 -2 0 0 Z";
    const SEASON_SHAPES = {
      spring: { label: "春の品書き", color: "#f6c1cf", sakura: true },
      summer: { label: "夏の品書き", color: "#9fd3a8", path: leafPath(7, 10, 4.2) },
      autumn: { label: "秋の品書き", color: "#f0a04b", path: leafPath(7, 10, 4.2) },
      winter: { label: "冬の品書き", color: "#ffffff", snow: true }
    };
    function shapeSvg(sh, size, opacity) {
      const inner = sh.sakura
        ? [0, 72, 144, 216, 288].map(r => `<path transform="rotate(${r})" d="${SAKURA_PETAL}" fill="${sh.color}"/>`).join("") + `<circle r="1.6" fill="#fff" opacity=".8"/>`
        : sh.snow
        ? `<g stroke="${sh.color}" stroke-width="1.6" stroke-linecap="round" fill="none">${[0, 60, 120].map(r => `<path transform="rotate(${r})" d="M0 -9 V9 M0 -6 l-3 -3 M0 -6 l3 -3 M0 6 l-3 3 M0 6 l3 3"/>`).join("")}</g>`
        : `<path d="${sh.path}" fill="${sh.color}"/><path d="M0 3 V12" stroke="${sh.color}" stroke-width="1.4"/>`;
      return `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="-12 -12 24 24" opacity="${opacity}">${inner}</svg>`;
    }
    function currentSeason() {
      const q = new URLSearchParams(location.search).get("season") || MENU_CONFIG.season;
      if (SEASON_SHAPES[q]) return q;
      const m = new Date().getMonth() + 1;
      return m >= 3 && m <= 5 ? "spring" : m >= 6 && m <= 8 ? "summer" : m >= 9 && m <= 11 ? "autumn" : "winter";
    }
    function applySeason() {
      const key = currentSeason(), sh = SEASON_SHAPES[key];
      const hero = document.querySelector(".hero");
      // 柄：大小の形を散らしたタイル
      const tile = `<svg xmlns="http://www.w3.org/2000/svg" width="120" height="90">` +
        [[18, 20, 22, .22, 10], [78, 14, 14, .16, 40], [56, 62, 26, .18, -20], [104, 70, 12, .14, 70], [10, 74, 10, .12, 0]]
          .map(([x, y, sz, op, rot]) => `<g transform="translate(${x} ${y}) rotate(${rot}) translate(${-sz / 2} ${-sz / 2})">${shapeSvg(sh, sz, op)}</g>`).join("") + `</svg>`;
      hero.style.backgroundImage = `url("data:image/svg+xml,${encodeURIComponent(tile)}"), linear-gradient(to bottom, #b4452f, #a63d2a 45%, #8f3020)`;
      document.getElementById("season-label").textContent = sh.label;
      // 舞い散るもの
      const fx = document.getElementById("season-fx");
      if (reduceMotion()) { fx.innerHTML = ""; return; }
      fx.innerHTML = Array.from({ length: 11 }, (_, k) => {
        const size = 10 + (k * 7) % 9, left = (k * 37) % 100, dur = 7 + (k * 13) % 6, delay = -((k * 17) % 11);
        return `<span class="fx-fall" style="left:${left}%; --sx:${(k % 2 ? 1 : -1) * (14 + k % 4 * 6)}px; animation-duration:${dur}s; animation-delay:${delay}s">${shapeSvg(sh, size, .85)}</span>`;
      }).join("");
    }

    // =============================================================
    //  はじめに
    // =============================================================
    // ---- オープニング ----
    let openingAnims = [];
    function playOpening() {
      const op = document.getElementById("opening");
      if (!op) return;
      if (reduceMotion()) { op.remove(); return; }
      const L = op.querySelector(".noren-l"), R = op.querySelector(".noren-r"), crest = op.querySelector(".noren-crest"), rod = op.querySelector(".noren-rod");
      const texts = op.querySelectorAll(".noren-text");
      // 0〜0.55秒：暖簾が上から下りて、ふわっと揺れる
      openingAnims.push(rod.animate([{ transform: "translateY(-20px)" }, { transform: "none" }], { duration: 300, easing: "ease-out" }));
      [L, R].forEach((el, i) => openingAnims.push(el.animate([
        { transform: "translateY(-105%)" },
        { transform: `translateY(2%) rotate(${i ? -1.2 : 1.2}deg)`, offset: .7 },
        { transform: `rotate(${i ? .5 : -.5}deg)`, offset: .88 },
        { transform: "none" }
      ], { duration: 650, easing: "cubic-bezier(.3,.8,.3,1)", fill: "backwards" })));
      texts.forEach((t, i) => openingAnims.push(t.animate([{ opacity: 0, transform: "translateY(10px)" }, { opacity: 1, transform: "none" }],
        { duration: 400, delay: 420 + i * 120, easing: "ease-out", fill: "backwards" })));
      // 0.75秒：真ん中に「酒」の紋が、はんこのように押される
      openingAnims.push(crest.animate([
        { opacity: 0, transform: "scale(2.2) rotate(-18deg)" },
        { opacity: 1, transform: "scale(.9) rotate(-4deg)", offset: .6 },
        { opacity: 1, transform: "scale(1) rotate(0)" }
      ], { duration: 380, delay: 750, easing: "cubic-bezier(.3,1.4,.5,1)", fill: "backwards" }));
      // 1.35〜2.05秒：紋が消えて、暖簾が左右に分かれて開く
      openingAnims.push(crest.animate([{ opacity: 1 }, { opacity: 0, transform: "scale(.8)" }], { duration: 200, delay: 1350, fill: "forwards" }));
      [L, R].forEach((el, i) => openingAnims.push(el.animate([
        { transform: "none" },
        { transform: `translateX(${i ? 108 : -108}%) skewX(${i ? -6 : 6}deg) rotate(${i ? 4 : -4}deg)` }
      ], { duration: 650, delay: 1400, easing: "cubic-bezier(.6,0,.3,1)", fill: "forwards" })));
      const bg = op.animate([{ backgroundColor: "rgba(241,234,220,1)" }, { backgroundColor: "rgba(241,234,220,0)" }], { duration: 500, delay: 1450, fill: "forwards" });
      openingAnims.push(bg);
      openingAnims.push(rod.animate([{ opacity: 1 }, { opacity: 0, transform: "translateY(-16px)" }], { duration: 300, delay: 1800, fill: "forwards" }));
      bg.finished.then(() => setTimeout(endOpening, 120)).catch(() => {});
    }
    // タップで飛ばす／終わったら外す
    function endOpening() {
      const op = document.getElementById("opening");
      if (!op || op.classList.contains("is-done")) return;
      op.classList.add("is-done");
      // 動きは取り消さずに（取り消すと暖簾が元の位置に戻って一瞬映る）、そのまま全体を薄くして外す
      if (reduceMotion()) { op.remove(); return; }
      op.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 220, fill: "forwards" }).onfinish = () => op.remove();
    }

    (function init() {
      document.title = MENU_CONFIG.title;
      applySeason();
      playOpening();
      document.getElementById("menu-title").textContent = MENU_CONFIG.title;


      // 前に診断していれば、その結果を使う
      const saved = store.get("menu-diagnosis", null);
      if (Array.isArray(saved) && saved.length === QUESTIONS.length) {
        quizAnswers = saved;
        userProfile = computeUserProfile();
        state.diagnosed = true;
      }
      document.querySelectorAll(".q-count").forEach(el => el.textContent = QUESTIONS.length);
      setTab("menu");
    })();
  </script>
</body>
