<!DOCTYPE html>
<html lang="ja">
<head>

  <title>味覚マップ & テロワールストーリー</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Shippori+Mincho:wght@400;600;700;800&family=Cinzel:wght@500;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans JP"', 'sans-serif'],
            mincho: ['"Shippori Mincho"', 'serif'],
            serifEn: ['"Cinzel"', 'serif'],
          }
        }
      }
    }

  <style>
    :root { --app-height: 100dvh; }
    html, body { height: 100%; height: 100dvh; overflow: hidden; touch-action: manipulation; }
    
    @keyframes pingSlow {
      0% { transform: scale(0.85); opacity: 0.9; }
      80%, 100% { transform: scale(2.4); opacity: 0; }
    }
    .animate-ping-slow { animation: pingSlow 1.8s cubic-bezier(0, 0, 0.2, 1) infinite; }
    
    @keyframes coinFloat {
      0%, 100% { transform: translateY(0px) rotateX(10deg); }
      50% { transform: translateY(-6px) rotateX(15deg); }
    }
    .animate-coin-float { animation: coinFloat 2.6s ease-in-out infinite; }
    
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-950 text-slate-800 font-sans h-full w-full select-none overflow-hidden flex flex-col justify-center items-center">

        <div class="w-7 h-7 rounded-full bg-gradient-to-tr from-emerald-800 to-teal-600 flex items-center justify-center text-white shadow-xs">
          <i class="fa-solid fa-compass text-xs"></i>
        </div>
        <div>
          <span class="text-[9px] uppercase tracking-widest text-emerald-800 font-bold block leading-none font-serifEn">TERROIR & TASTE</span>

      </div>

          </div>
          <h2 id="quiz-title" class="text-[17px] font-mincho font-bold text-slate-800 leading-snug">
            質問タイトル
          </h2>
        </div>
        <div id="quiz-options-container" class="space-y-2.5 my-auto py-2">
          <!-- Options injected via JS -->
        </div>
        <div class="pb-3 flex-shrink-0">
          <div class="w-full bg-emerald-200/80 h-1.5 rounded-full overflow-hidden">
            <div id="quiz-progress-bar" class="bg-gradient-to-r from-teal-500 to-emerald-700 h-full w-1/4 transition-all duration-300"></div>
          </div>
        </div>
      </div>

              <span class="text-[11px] font-bold text-emerald-950 font-mincho">あなたの現在地</span>
            </div>
            <span class="text-[10px] text-slate-500 font-medium">お酒を選択</span>
          </div>
        </div>

            <div class="bg-amber-50 border-b border-dashed border-slate-300"></div>
            <div class="bg-cyan-50 border-r border-dashed border-slate-300"></div>
            <div class="bg-emerald-50"></div>
          </div>
          
          <div class="absolute top-1.5 left-1/2 -translate-x-1/2 px-2.5 py-0.5 bg-rose-50/95 rounded-full border border-rose-200 text-[9px] font-bold text-rose-900 z-10">華やか</div>
          <div class="absolute bottom-1.5 left-1/2 -translate-x-1/2 px-2.5 py-0.5 bg-slate-100/95 rounded-full border border-slate-200 text-[9px] font-bold text-slate-700 z-10">ドライ</div>

          <div class="text-right">

            </div>
            
            <div class="relative w-full rounded-2xl overflow-hidden shadow-lg border border-stone-200 my-3 aspect-[16/10] bg-stone-900">
              <img id="story-hero-dish-img" src="" class="w-full h-full object-cover">
              <div class="absolute inset-0 bg-gradient-to-t from-stone-950/80 via-transparent flex flex-col justify-end p-3 text-white">
                <span class="text-[9px] text-amber-300 font-bold">ペアリング</span>
                <p id="story-pairing-dish-title" class="text-sm font-mincho font-bold text-white"></p>
              </div>
            </div>
            
            <h1 id="story-drink-title-main" class="text-xl font-mincho font-extrabold text-stone-900 leading-tight"></h1>

          </section>

          <section class="p-4 bg-[#f8f6f0]">
            <div class="flex items-center gap-1.5 text-xs font-bold text-stone-900 font-mincho mb-2">
              <span class="w-1.5 h-3.5 bg-amber-600 rounded-full"></span><span>産地の風土と旅情</span>
            </div>
            <div class="flex gap-2.5 overflow-x-auto no-scrollbar pb-1" id="gallery-container">
              <!-- JS Injected -->
            </div>
          </section>
        </div>

        <div class="absolute bottom-0 inset-x-0 p-3 bg-white/95 backdrop-blur-md border-t border-stone-200 shadow-xl flex items-center justify-between gap-3 z-30">
          <div class="min-w-0">

          </div>
          <button onclick="orderDrinkModal()" class="px-5 py-2.5 rounded-xl bg-emerald-800 text-white text-xs font-bold shadow-lg flex-shrink-0">
            注文する
          </button>
        </div>
      </div>
    </main>
  </div>

          { text: "① 水のようにサラリと喉を通る、軽快で雑味のないタッチ", x: -25, y: 0 },
          { text: "② ほどよい瑞々しさがあり、重すぎず軽すぎない心地よさ", x: -10, y: 0 },
          { text: "③ トロッとした舌触りや、口いっぱいに広がる濃密な旨味", x: 15, y: 0 },
          { text: "④ 舌の上にズシッと残る、飲みごたえ抜群の濃厚な重厚感", x: 25, y: 0 }
        ]
      },
      {
        q: "ゴクリと飲み干したあとの「余韻」はどうしたい？",
        options: [
          { text: "① 一瞬でスパッと消え去り、次の一口や箸が進むキレ", x: -10, y: 15 },
          { text: "② 鼻腔からフワッと心地よい果実やボタニカルの香りが抜けていく", x: -5, y: -15 },
          { text: "③ 喉の奥にじんわりとお酒本来のふくよかな温かみが続く", x: 15, y: 5 },
          { text: "④ 何層にも変化する濃厚な深みやビター感を長く味わいたい", x: 20, y: -10 }
        ]
      }
    ];

    let currentStep = 0;
    let userScore = { x: 50, y: 50 };
    let selectedDrinkId = null;

    function renderQuiz() {
      const qObj = QUESTIONS[currentStep];
      document.getElementById('quiz-step-label').innerText = `QUESTION ${currentStep + 1} / ${QUESTIONS.length}`;
      document.getElementById('quiz-title').innerText = qObj.q;
      
      const container = document.getElementById('quiz-options-container');
      container.innerHTML = '';
      qObj.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = "w-full text-left p-3.5 bg-white rounded-xl shadow-sm border border-emerald-100/80 active:bg-emerald-50 active:border-emerald-300 transition text-sm font-medium text-slate-700 font-mincho hover:shadow-md leading-relaxed";
        btn.innerText = opt.text;
        btn.onclick = () => answerQuestion(opt.x, opt.y);
        container.appendChild(btn);
      });
      
      const progress = ((currentStep + 1) / QUESTIONS.length) * 100;
      document.getElementById('quiz-progress-bar').style.width = `${progress}%`;
    }

    function answerQuestion(xDelta, yDelta) {
      userScore.x = Math.max(5, Math.min(95, userScore.x + xDelta));
      userScore.y = Math.max(5, Math.min(95, userScore.y + yDelta));
      
      currentStep++;
      if (currentStep < QUESTIONS.length) {
        renderQuiz();
      } else {
        showMapScreen();
      }
    }

    function restartDiagnosis() {
      currentStep = 0;
      userScore = { x: 50, y: 50 };
      document.getElementById('view-quiz').style.opacity = '1';
      document.getElementById('view-quiz').style.pointerEvents = 'auto';
      document.getElementById('view-map').style.opacity = '0';
      document.getElementById('view-map').style.pointerEvents = 'none';
      renderQuiz();
    }

    function showMapScreen() {
      document.getElementById('view-quiz').style.opacity = '0';
      document.getElementById('view-quiz').style.pointerEvents = 'none';
      document.getElementById('view-map').style.opacity = '1';
      document.getElementById('view-map').style.pointerEvents = 'auto';
      
      const userMarker = document.getElementById('user-position-marker');
      userMarker.style.left = `${userScore.x}%`;
      userMarker.style.top = `${userScore.y}%`;
      
      drawDrinkPins();
    }

    function drawDrinkPins() {
      const layer = document.getElementById('drink-pins-layer');
      layer.innerHTML = '';
      
      DRINKS_DATABASE.forEach(drink => {
        const pin = document.createElement('div');
        pin.className = "absolute -translate-x-1/2 -translate-y-1/2 cursor-pointer transition-transform duration-300 hover:scale-110 z-10";
        pin.style.left = `${drink.x}%`;
        pin.style.top = `${drink.y}%`;
        
        pin.innerHTML = `
          <div class="relative w-14 h-14 rounded-full border-2 border-white shadow-md bg-white overflow-hidden flex items-center justify-center group">
            <img src="${drink.imageUrl}" class="w-full h-full object-cover">
            <div class="absolute inset-0 bg-black/10 group-active:bg-black/30 transition"></div>
          </div>
        `;
        pin.onclick = () => selectDrink(drink, pin);
        layer.appendChild(pin);
      });
    }

    function selectDrink(drink, pinElement) {
      selectedDrinkId = drink.id;
      document.querySelectorAll('#drink-pins-layer > div > div:first-child').forEach(el => el.classList.remove('ring-4', 'ring-emerald-400', 'ring-opacity-50'));
      pinElement.querySelector('div').classList.add('ring-4', 'ring-emerald-400', 'ring-opacity-50');
      
      document.getElementById('card-drink-img').src = drink.imageUrl;
      document.getElementById('card-drink-category').innerText = drink.category;
      document.getElementById('card-pref-text').innerText = drink.prefecture;
      document.getElementById('card-drink-name').innerText = drink.name;
      
      const card = document.getElementById('quick-drink-card');
      card.classList.remove('opacity-0', 'pointer-events-none');
      card.classList.add('opacity-100', 'pointer-events-auto');
    }

    let chargeTimer = null;
    let chargePercent = 0;

    function startJourneyChargeModal() {
      const drink = DRINKS_DATABASE.find(d => d.id === selectedDrinkId);
      document.getElementById('charge-coin-img').src = drink.imageUrl;
      document.getElementById('view-charge').style.opacity = '1';
      document.getElementById('view-charge').style.pointerEvents = 'auto';
      chargePercent = 0;
      updateChargeUI();
    }

    function cancelCharge() {
      document.getElementById('view-charge').style.opacity = '0';
      document.getElementById('view-charge').style.pointerEvents = 'none';
      stopCharge();
    }

    function startCharge(e) {
      if(e) e.preventDefault();
      document.getElementById('charge-coin').classList.add('scale-95');
      document.getElementById('charge-glow').classList.add('bg-yellow-300/40');
      chargeTimer = setInterval(() => {
        chargePercent += 2;
        if (chargePercent >= 100) { chargePercent = 100; stopCharge(); finishChargeAndFly(); }
        updateChargeUI();
      }, 25);
    }

    function stopCharge(e) {
      if(e) e.preventDefault();
      clearInterval(chargeTimer);
      document.getElementById('charge-coin').classList.remove('scale-95');
      document.getElementById('charge-glow').classList.remove('bg-yellow-300/40');
      if (chargePercent < 100) { chargePercent = 0; updateChargeUI(); }
    }

    function updateChargeUI() {
      document.getElementById('charge-progress-bar').style.width = `${chargePercent}%`;
      document.getElementById('charge-percent-text').innerText = `${chargePercent}%`;
    }

    function finishChargeAndFly() {
      setTimeout(() => { showStoryScreen(); cancelCharge(); }, 200);
    }

    const triggerBtn = document.getElementById('btn-hold-trigger');
    const coinObj = document.getElementById('charge-coin');
    ['mousedown', 'touchstart'].forEach(evt => {
      triggerBtn.addEventListener(evt, startCharge, {passive: false});
      coinObj.addEventListener(evt, startCharge, {passive: false});
    });
    ['mouseup', 'mouseleave', 'touchend'].forEach(evt => {
      triggerBtn.addEventListener(evt, stopCharge);
      coinObj.addEventListener(evt, stopCharge);
    });

    function showStoryScreen() {
      const drink = DRINKS_DATABASE.find(d => d.id === selectedDrinkId);
      document.getElementById('story-region-header-tag').innerText = drink.prefecture;
      document.getElementById('story-drink-type-badge').innerText = drink.typeBadge;
      document.getElementById('story-drink-price').innerText = drink.price;
      document.getElementById('story-editorial-lead').innerText = drink.editorialLead;
      document.getElementById('story-hero-dish-img').src = drink.dishImageUrl;
      document.getElementById('story-pairing-dish-title').innerText = drink.pairingDishTitle;
      document.getElementById('story-drink-title-main').innerText = drink.name;
      document.getElementById('story-drink-maker-name').innerText = drink.brandMaker;
      document.getElementById('bar-bottom-drink-name').innerText = drink.name;

      const galleryContainer = document.getElementById('gallery-container');
      galleryContainer.innerHTML = '';
      drink.gallery.forEach(img => {
        const item = document.createElement('div');
        item.className = "flex-shrink-0 w-44 bg-white rounded-xl overflow-hidden shadow-xs border border-stone-200";
        item.innerHTML = `
          <div class="h-28 overflow-hidden bg-stone-200">
            <img src="${img.url}" class="w-full h-full object-cover">
          </div>
          <div class="p-2">
            <p class="text-[10px] font-bold text-stone-800 font-mincho truncate">${img.caption}</p>
          </div>
        `;
        galleryContainer.appendChild(item);
      });

      document.getElementById('view-story').style.opacity = '1';
      document.getElementById('view-story').style.pointerEvents = 'auto';
    }

    function backToFlavorMap() {
      document.getElementById('view-story').style.opacity = '0';
      document.getElementById('view-story').style.pointerEvents = 'none';
    }

    function orderDrinkModal() {
      alert("ご注文ありがとうございます！店員がグラスをお持ちいたします。");
    }

    window.onload = () => { renderQuiz(); };
  </script>
</body>
</html>
