<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>味覚マップ & テロワールストーリー</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Shippori+Mincho:wght@400;600;700;800&family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans JP"', 'sans-serif'],
            mincho: ['"Shippori Mincho"', 'serif'],
            serifEn: ['"Cinzel"', 'serif'],
          }
        }
      }
    }
  </script>

  <style>
    :root { --app-height: 100dvh; }
    html, body { height: 100%; height: 100dvh; overflow: hidden; touch-action: manipulation; }
    
    @keyframes pingSlow {
      0% { transform: scale(0.85); opacity: 0.9; }
      80%, 100% { transform: scale(2.4); opacity: 0; }
    }
    .animate-ping-slow { animation: pingSlow 1.8s cubic-bezier(0, 0, 0.2, 1) infinite; }
    
    @keyframes coinFloat {
      0%, 100% { transform: translateY(0px) rotateX(10deg); }
      50% { transform: translateY(-6px) rotateX(15deg); }
    }
    .animate-coin-float { animation: coinFloat 2.6s ease-in-out infinite; }
    
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-950 text-slate-800 font-sans h-full w-full select-none overflow-hidden flex flex-col justify-center items-center">

  <div class="relative w-full max-w-md h-[100dvh] bg-[#f8faf9] flex flex-col overflow-hidden shadow-2xl">

    <header class="relative z-30 px-4 py-2.5 flex items-center justify-between bg-white/95 backdrop-blur-md border-b border-emerald-950/10 flex-shrink-0">
      <div class="flex items-center gap-2">
        <div class="w-7 h-7 rounded-full bg-gradient-to-tr from-emerald-800 to-teal-600 flex items-center justify-center text-white shadow-xs">
          <i class="fa-solid fa-compass text-xs"></i>
        </div>
        <div>
          <span class="text-[9px] uppercase tracking-widest text-emerald-800 font-bold block leading-none font-serifEn">TERROIR & TASTE</span>
          <h1 class="text-xs font-mincho font-bold text-slate-800 leading-snug">味覚を巡る1杯</h1>
        </div>
      </div>
      <button onclick="restartDiagnosis()" class="text-[11px] bg-emerald-50 active:bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full font-medium transition flex items-center gap-1 border border-emerald-200/60">
        <i class="fa-solid fa-rotate-right text-[10px]"></i><span>再診断</span>
      </button>
    </header>

    <main class="relative flex-1 w-full h-full overflow-hidden">
      
      <div id="view-quiz" class="absolute inset-0 z-20 flex flex-col justify-between p-5 bg-gradient-to-b from-[#eef7f5] via-[#e2f2ee] to-[#d3ede2] transition-all duration-500">
        <div class="pt-2">
          <div class="inline-flex items-center gap-1.5 px-3 py-0.5 bg-emerald-800 text-white text-[10px] font-bold rounded-full mb-2 tracking-wide">
            <i class="fa-solid fa-sparkles text-[9px]"></i>
            <span id="quiz-step-label">QUESTION 1 / 4</span>
          </div>
          <h2 id="quiz-title" class="text-[17px] font-mincho font-bold text-slate-800 leading-snug">
            質問タイトル
          </h2>
        </div>
        <div id="quiz-options-container" class="space-y-2.5 my-auto py-2">
          <!-- Options injected via JS -->
        </div>
        <div class="pb-3 flex-shrink-0">
          <div class="w-full bg-emerald-200/80 h-1.5 rounded-full overflow-hidden">
            <div id="quiz-progress-bar" class="bg-gradient-to-r from-teal-500 to-emerald-700 h-full w-1/4 transition-all duration-300"></div>
          </div>
        </div>
      </div>

      <div id="view-map" class="absolute inset-0 flex flex-col justify-between p-3 opacity-0 pointer-events-none transition-all duration-500 bg-[#f4f7f6]">
        <div class="z-10 flex-shrink-0 mb-1">
          <div class="flex items-center justify-between px-1">
            <div class="flex items-center gap-1.5">
              <span class="inline-flex w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
              <span class="text-[11px] font-bold text-emerald-950 font-mincho">あなたの現在地</span>
            </div>
            <span class="text-[10px] text-slate-500 font-medium">お酒を選択</span>
          </div>
        </div>

        <div class="relative flex-1 bg-white rounded-2xl shadow-sm border border-slate-200/80 overflow-hidden flex flex-col min-h-0 mb-2">
          <!-- Background Grid -->
          <div class="absolute inset-0 grid grid-cols-2 grid-rows-2 opacity-30 pointer-events-none">
            <div class="bg-rose-50 border-r border-b border-dashed border-slate-300"></div>
            <div class="bg-amber-50 border-b border-dashed border-slate-300"></div>
            <div class="bg-cyan-50 border-r border-dashed border-slate-300"></div>
            <div class="bg-emerald-50"></div>
          </div>
          
          <div class="absolute top-1.5 left-1/2 -translate-x-1/2 px-2.5 py-0.5 bg-rose-50/95 rounded-full border border-rose-200 text-[9px] font-bold text-rose-900 z-10">華やか</div>
          <div class="absolute bottom-1.5 left-1/2 -translate-x-1/2 px-2.5 py-0.5 bg-slate-100/95 rounded-full border border-slate-200 text-[9px] font-bold text-slate-700 z-10">ドライ</div>
          <div class="absolute left-1.5 top-1/2 -translate-y-1/2 px-1 py-2 bg-cyan-50/95 rounded-lg border border-cyan-200 text-[9px] font-bold text-cyan-900 z-10 [writing-mode:vertical-rl]">スッキリ</div>
          <div class="absolute right-1.5 top-1/2 -translate-y-1/2 px-1 py-2 bg-amber-50/95 rounded-lg border border-amber-200 text-[9px] font-bold text-amber-900 z-10 [writing-mode:vertical-rl]">重厚・コク</div>

          <div class="absolute inset-x-6 top-1/2 h-[1px] bg-slate-200 pointer-events-none"></div>
          <div class="absolute inset-y-6 left-1/2 w-[1px] bg-slate-200 pointer-events-none"></div>

          <!-- Pins Layer -->
          <div id="drink-pins-layer" class="relative w-full h-full p-4"></div>
          
          <!-- User Marker -->
          <div id="user-position-marker" class="absolute pointer-events-none transition-all duration-700 -translate-x-1/2 -translate-y-1/2 z-20 flex flex-col items-center">
            <div class="relative flex items-center justify-center">
              <span class="absolute w-7 h-7 rounded-full bg-emerald-400 animate-ping-slow"></span>
              <div class="w-6 h-6 rounded-full bg-gradient-to-tr from-emerald-700 to-teal-500 text-white flex items-center justify-center shadow-md border-2 border-white text-[10px]"><i class="fa-solid fa-star"></i></div>
            </div>
          </div>
        </div>

        <!-- Selected Drink Card -->
        <div id="quick-drink-card" class="bg-white rounded-2xl p-2.5 shadow-md border border-emerald-100 flex items-center justify-between flex-shrink-0 transition-opacity opacity-0 pointer-events-none">
          <div class="flex items-center gap-2.5 overflow-hidden">
            <div class="w-11 h-11 rounded-full bg-emerald-50 border border-emerald-100 overflow-hidden flex-shrink-0">
              <img id="card-drink-img" src="" class="w-full h-full object-cover">
            </div>
            <div class="min-w-0 pr-1">
              <div class="flex items-center gap-1.5">
                <span id="card-drink-category" class="text-[9px] px-1 py-0.2 bg-slate-100 text-slate-700 rounded font-medium"></span>
                <span class="text-[10px] text-emerald-900 font-semibold truncate flex items-center gap-0.5">
                  <i class="fa-solid fa-location-dot text-[9px] text-rose-500"></i> <span id="card-pref-text"></span>
                </span>
              </div>
              <h3 id="card-drink-name" class="font-bold text-xs text-slate-900 font-mincho truncate leading-tight mt-0.5"></h3>
            </div>
          </div>
          <button onclick="startJourneyChargeModal()" class="flex-shrink-0 px-3.5 py-2.5 bg-gradient-to-r from-amber-500 to-emerald-700 text-white rounded-xl text-[11px] font-bold shadow-md transition flex items-center gap-1.5">
            <span>物語をひらく</span>
          </button>
        </div>
      </div>
      <div id="view-charge" class="absolute inset-0 z-40 bg-[#f4f7f6] flex flex-col items-center justify-between opacity-0 pointer-events-none transition-all duration-400 select-none overflow-hidden">
        
        <!-- 背景の日本地図 (アスペクト比固定でズレを完全に防止) -->
        <div class="absolute inset-0 z-0 flex items-center justify-center pointer-events-none overflow-hidden">
          <div id="map-container" class="relative w-full max-h-full aspect-[9/16] flex items-center justify-center">
            <img id="charge-japan-map-img" src="./japan.jpg" class="absolute inset-0 w-full h-full object-contain opacity-70" alt="日本地図">
            
            <!-- 目的地ピン -->
            <div id="charge-dest-pin" class="absolute w-8 h-8 -translate-x-1/2 -translate-y-1/2 opacity-0 transition-opacity duration-500 z-10 flex items-center justify-center">
                <span class="absolute w-full h-full rounded-full bg-emerald-400 animate-ping"></span>
                <div class="w-3 h-3 rounded-full bg-emerald-400 shadow-[0_0_8px_rgba(52,211,153,1)] border border-white"></div>
            </div>

            <!-- 飛んでいくオーブ -->
            <div id="charge-orb" class="absolute w-6 h-6 rounded-full bg-gradient-to-tr from-amber-200 to-white shadow-[0_0_25px_15px_rgba(251,191,36,0.8)] -translate-x-1/2 -translate-y-1/2 opacity-0 z-20"></div>
          </div>
        </div>

        <div class="relative z-30 w-full flex items-center justify-between p-4 pt-6">
          <div class="w-8"></div>
          <div class="flex flex-col items-center">
            <p class="text-white/90 text-base font-bold tracking-wide drop-shadow mt-2">長押しして産地の物語へ</p>
          </div>
          <button onclick="cancelCharge()" class="w-8 h-8 rounded-full bg-white/10 text-white hover:bg-white/20 flex items-center justify-center text-sm backdrop-blur-md transition">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <div class="relative z-30 w-full flex flex-col items-center mt-auto pb-12">
          <div id="charge-coin-wrapper" class="relative mb-6 transition-all duration-300">
            <div id="charge-glow" class="absolute -inset-5 rounded-full bg-yellow-300/0 blur-2xl transition-all duration-200 pointer-events-none"></div>
            <div id="charge-coin" class="w-36 h-36 rounded-full bg-gradient-to-tr from-[#d48b11] via-[#fcd34d] to-[#fffbeb] p-1.5 shadow-[0_14px_32px_rgba(0,0,0,0.65)] cursor-pointer select-none transition-transform duration-150 animate-coin-float flex items-center justify-center relative overflow-hidden">
              <div class="w-full h-full rounded-full overflow-hidden relative border-2 border-amber-200/80 shadow-inner bg-slate-900 flex items-center justify-center">
                <img id="charge-coin-img" src="" class="w-full h-full object-cover brightness-95">
              </div>
            </div>
          </div>
          <div id="charge-percent-text" class="text-sm font-mono font-bold text-white tracking-widest drop-shadow mb-3">0%</div>
          <div id="btn-hold-trigger" class="relative w-64 h-12 rounded-full border border-white/40 overflow-hidden shadow-lg cursor-pointer active:scale-98 transition-transform select-none bg-black/40 backdrop-blur-md flex items-center justify-center">
            <div id="charge-progress-bar" class="absolute left-0 top-0 bottom-0 bg-gradient-to-r from-amber-400 via-amber-300 to-yellow-200 w-0 transition-all duration-75"></div>
            <span class="relative z-10 text-white font-bold text-xs tracking-wider drop-shadow">長押ししてはなす</span>
          </div>
        </div>
      </div>

      <div id="view-story" class="absolute inset-0 z-30 flex flex-col bg-[#fdfcf9] text-slate-900 opacity-0 pointer-events-none transition-all duration-500 overflow-hidden">
        <header class="px-4 py-2.5 flex items-center justify-between bg-[#fdfcf9]/95 backdrop-blur-md border-b border-stone-200/80 flex-shrink-0 z-20">
          <button onclick="backToFlavorMap()" class="px-3 py-1 rounded-full bg-stone-100 text-stone-800 text-[11px] font-medium flex items-center gap-1.5 transition">
            <i class="fa-solid fa-arrow-left text-[10px]"></i><span>戻る</span>
          </button>
          <div class="text-right">
            <span id="story-region-header-tag" class="text-[11px] font-mincho font-bold text-stone-700"></span>
          </div>
        </header>

        <div class="flex-1 overflow-y-auto overscroll-contain pb-12 text-stone-800">
          <section class="p-4 bg-gradient-to-b from-[#fdfcf9] to-[#f4f1ea]">
            <div class="flex items-center gap-2 mb-2">
              <span id="story-drink-type-badge" class="px-2 py-0.5 rounded text-[10px] font-bold bg-stone-800 text-stone-100 tracking-wider"></span>
            </div>
            <div class="border-l-2 border-stone-800 pl-3 py-1 my-2">
              <h2 id="story-editorial-lead" class="text-base font-mincho font-bold text-stone-900 leading-snug"></h2>
            </div>
            
            <h1 id="story-drink-title-main" class="text-2xl font-mincho font-extrabold text-stone-900 leading-tight mt-4"></h1>
            <p id="story-drink-maker-name" class="text-sm text-stone-600 font-medium mt-1 mb-4"></p>

            <div id="story-rich-description" class="text-[13px] text-stone-700 leading-relaxed space-y-3 font-mincho mb-6">
              <!-- JS Injected -->
            </div>

            <div class="relative w-full rounded-2xl overflow-hidden shadow-lg border border-stone-200 my-4 aspect-[4/3] bg-stone-900">
              <img id="story-hero-dish-img" src="" class="w-full h-full object-cover">
              <div class="absolute inset-0 bg-gradient-to-t from-stone-950/90 via-stone-900/40 to-transparent flex flex-col justify-end p-4 text-white">
                <span class="inline-block px-2 py-1 bg-amber-500/90 text-stone-950 text-[10px] font-bold rounded-sm mb-1.5 w-max">極上のペアリング</span>
                <p id="story-pairing-dish-title" class="text-base font-mincho font-bold text-white leading-tight"></p>
                <p id="story-pairing-description" class="text-xs text-stone-200 mt-1.5 font-mincho leading-relaxed opacity-90"></p>
              </div>
            </div>
            
          </section>

          <section class="p-4 bg-[#f8f6f0] border-t border-stone-200/60">
            <div class="flex items-center gap-1.5 text-sm font-bold text-stone-900 font-mincho mb-4">
              <span class="w-1.5 h-4 bg-emerald-700 rounded-full"></span><span>テロワールを巡る風景</span>
            </div>
            
            <!-- スライド式ギャラリーに変更 -->
            <div class="relative w-full bg-white rounded-xl overflow-hidden shadow-sm border border-stone-200/80">
              <div class="h-52 overflow-hidden bg-stone-200 relative">
                <img id="gallery-slide-img" src="" class="w-full h-full object-cover transition-opacity duration-300">
                
                <!-- 左右のナビゲーションボタン -->
                <button onclick="prevGallerySlide()" class="absolute left-2 top-1/2 -translate-y-1/2 w-8 h-8 flex items-center justify-center rounded-full bg-black/40 text-white backdrop-blur-md hover:bg-black/60 active:scale-95 transition z-10">
                  <i class="fa-solid fa-chevron-left text-xs"></i>
                </button>
                <button onclick="nextGallerySlide()" class="absolute right-2 top-1/2 -translate-y-1/2 w-8 h-8 flex items-center justify-center rounded-full bg-black/40 text-white backdrop-blur-md hover:bg-black/60 active:scale-95 transition z-10">
                  <i class="fa-solid fa-chevron-right text-xs"></i>
                </button>
                
                <!-- ドットインジケーター（いま何枚目か） -->
                <div id="gallery-indicators" class="absolute bottom-2.5 left-0 right-0 flex justify-center gap-1.5 z-10">
                  <!-- JS Injected -->
                </div>
              </div>
              <div class="p-4 h-[104px]">
                <h4 id="gallery-slide-title" class="text-sm font-bold text-stone-900 font-mincho mb-1.5 line-clamp-1"></h4>
                <p id="gallery-slide-caption" class="text-[11px] text-stone-600 font-mincho leading-relaxed line-clamp-3"></p>
              </div>
            </div>
          </section>
        </div>
      </div>
    </main>
  </div>

    let currentStep = 0;
    let userScore = { x: 50, y: 50 };
    let selectedDrinkId = null;
    let chargeTimer = null;
    let chargePercent = 0;
    
    let currentGalleryIndex = 0;
    let currentGalleryData = [];

    function renderQuiz() {
      const qObj = QUESTIONS[currentStep];
      document.getElementById('quiz-step-label').innerText = `QUESTION ${currentStep + 1} / ${QUESTIONS.length}`;
      document.getElementById('quiz-title').innerText = qObj.q;
      
      const container = document.getElementById('quiz-options-container');
      container.innerHTML = '';
      qObj.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = "w-full text-left p-3.5 bg-white rounded-xl shadow-sm border border-emerald-100/80 active:bg-emerald-50 active:border-emerald-300 transition text-sm font-medium text-slate-700 font-mincho hover:shadow-md leading-relaxed";
        btn.innerText = opt.text;
        btn.onclick = () => answerQuestion(opt.x, opt.y);
        container.appendChild(btn);
      });
      
      const progress = ((currentStep + 1) / QUESTIONS.length) * 100;
      document.getElementById('quiz-progress-bar').style.width = `${progress}%`;
    }

    function answerQuestion(xDelta, yDelta) {
      userScore.x = Math.max(5, Math.min(95, userScore.x + xDelta));
      userScore.y = Math.max(5, Math.min(95, userScore.y + yDelta));
      
      currentStep++;
      if (currentStep < QUESTIONS.length) {
        renderQuiz();
      } else {
        showMapScreen();
      }
    }

    function restartDiagnosis() {
      currentStep = 0;
      userScore = { x: 50, y: 50 };
      document.getElementById('view-quiz').style.opacity = '1';
      document.getElementById('view-quiz').style.pointerEvents = 'auto';
      document.getElementById('view-map').style.opacity = '0';
      document.getElementById('view-map').style.pointerEvents = 'none';
      renderQuiz();
    }

    function showMapScreen() {
      document.getElementById('view-quiz').style.opacity = '0';
      document.getElementById('view-quiz').style.pointerEvents = 'none';
      document.getElementById('view-map').style.opacity = '1';
      document.getElementById('view-map').style.pointerEvents = 'auto';
      
      const userMarker = document.getElementById('user-position-marker');
      userMarker.style.left = `${userScore.x}%`;
      userMarker.style.top = `${userScore.y}%`;
      
      drawDrinkPins();
    }

    function drawDrinkPins() {
      const layer = document.getElementById('drink-pins-layer');
      layer.innerHTML = '';
      
      DRINKS_DATABASE.forEach(drink => {
        const pin = document.createElement('div');
        pin.className = "absolute -translate-x-1/2 -translate-y-1/2 cursor-pointer transition-transform duration-300 hover:scale-110 z-10";
        pin.style.left = `${drink.x}%`;
        pin.style.top = `${drink.y}%`;
        
        pin.innerHTML = `
          <div class="relative w-14 h-14 rounded-full border-2 border-white shadow-md bg-white overflow-hidden flex items-center justify-center group">
            <img src="${drink.imageUrl}" class="w-full h-full object-cover">
            <div class="absolute inset-0 bg-black/10 group-active:bg-black/30 transition"></div>
          </div>
        `;
        pin.onclick = () => selectDrink(drink, pin);
        layer.appendChild(pin);
      });
    }

    function selectDrink(drink, pinElement) {
      selectedDrinkId = drink.id;
      document.querySelectorAll('#drink-pins-layer > div > div:first-child').forEach(el => el.classList.remove('ring-4', 'ring-emerald-400', 'ring-opacity-50'));
      pinElement.querySelector('div').classList.add('ring-4', 'ring-emerald-400', 'ring-opacity-50');
      
      document.getElementById('card-drink-img').src = drink.imageUrl;
      document.getElementById('card-drink-category').innerText = drink.category;
      document.getElementById('card-pref-text').innerText = drink.prefecture;
      document.getElementById('card-drink-name').innerText = drink.name;
      
      const card = document.getElementById('quick-drink-card');
      card.classList.remove('opacity-0', 'pointer-events-none');
      card.classList.add('opacity-100', 'pointer-events-auto');
    }

    function startJourneyChargeModal() {
      const drink = DRINKS_DATABASE.find(d => d.id === selectedDrinkId);
      document.getElementById('charge-coin-img').src = drink.imageUrl;
      
      // 47都道府県の自動マッピング（データベースに設定されていない場合は東京をデフォルトに）
      const coords = PREFECTURE_COORDS[drink.prefecture] || {x: 64, y: 58};
      
      const destPin = document.getElementById('charge-dest-pin');
      destPin.style.left = `${coords.x}%`;
      destPin.style.top = `${coords.y}%`;
      destPin.style.opacity = '1';

      document.getElementById('view-charge').style.opacity = '1';
      document.getElementById('view-charge').style.pointerEvents = 'auto';
      chargePercent = 0;
      updateChargeUI();
    }

    function cancelCharge() {
      document.getElementById('view-charge').style.opacity = '0';
      document.getElementById('view-charge').style.pointerEvents = 'none';
      stopCharge();
    }

    function startCharge(e) {
      if(e) e.preventDefault();
      document.getElementById('charge-coin').classList.add('scale-95');
      document.getElementById('charge-glow').classList.add('bg-yellow-300/40');
      chargeTimer = setInterval(() => {
        chargePercent += 2;
        if (chargePercent >= 100) { chargePercent = 100; stopCharge(); finishChargeAndFly(); }
        updateChargeUI();
      }, 25);
    }

    function stopCharge(e) {
      if(e) e.preventDefault();
      clearInterval(chargeTimer);
      document.getElementById('charge-coin').classList.remove('scale-95');
      document.getElementById('charge-glow').classList.remove('bg-yellow-300/40');
      if (chargePercent < 100) { chargePercent = 0; updateChargeUI(); }
    }

    function updateChargeUI() {
      document.getElementById('charge-progress-bar').style.width = `${chargePercent}%`;
      document.getElementById('charge-percent-text').innerText = `${chargePercent}%`;
    }

    // チャージ完了後、光のオーブが産地へ飛んでいくアニメーション
    function finishChargeAndFly() {
      const drink = DRINKS_DATABASE.find(d => d.id === selectedDrinkId);
      const coords = PREFECTURE_COORDS[drink.prefecture] || {x: 65, y: 58};
      
      // コインを消す
      document.getElementById('charge-coin-wrapper').style.opacity = '0';
      document.getElementById('charge-coin-wrapper').style.transform = 'scale(0.5)';
      
      // オーブを出現させるための座標計算（ズレ防止のためコンテナ基準で計算）
      const orb = document.getElementById('charge-orb');
      const coinRect = document.getElementById('charge-coin').getBoundingClientRect();
      const mapContainer = document.getElementById('map-container');
      const mapRect = mapContainer.getBoundingClientRect();
      
      // コインの中心位置を コンテナに対する % で取得
      const startX = ((coinRect.left + coinRect.width / 2 - mapRect.left) / mapRect.width) * 100;
      const startY = ((coinRect.top + coinRect.height / 2 - mapRect.top) / mapRect.height) * 100;
      
      // 初期位置にセット
      orb.style.transition = 'none';
      orb.style.left = `${startX}%`;
      orb.style.top = `${startY}%`;
      orb.style.opacity = '1';
      
      // 少し待ってから目的地へ飛ばす
      setTimeout(() => {
        orb.style.transition = 'all 0.9s cubic-bezier(0.25, 0.1, 0.25, 1)';
        orb.style.left = `${coords.x}%`;
        orb.style.top = `${coords.y}%`;
        
        // 目的地に到着後、弾けてストーリー画面へ
        setTimeout(() => {
          orb.style.opacity = '0';
          orb.style.transform = 'translate(-50%, -50%) scale(4)';
          
          setTimeout(() => {
            showStoryScreen();
            resetChargeView(); // 裏でチャージ画面を初期状態に戻しておく
          }, 300);
        }, 900);
      }, 50);
    }
    
    function resetChargeView() {
      document.getElementById('view-charge').style.opacity = '0';
      document.getElementById('view-charge').style.pointerEvents = 'none';
      
      setTimeout(() => {
        document.getElementById('charge-coin-wrapper').style.opacity = '1';
        document.getElementById('charge-coin-wrapper').style.transform = 'scale(1)';
        document.getElementById('charge-dest-pin').style.opacity = '0';
        
        const orb = document.getElementById('charge-orb');
        orb.style.transition = 'none';
        orb.style.opacity = '0';
        orb.style.transform = 'translate(-50%, -50%) scale(1)';
      }, 500);
    }

    const triggerBtn = document.getElementById('btn-hold-trigger');
    const coinObj = document.getElementById('charge-coin');
    ['mousedown', 'touchstart'].forEach(evt => {
      triggerBtn.addEventListener(evt, startCharge, {passive: false});
      coinObj.addEventListener(evt, startCharge, {passive: false});
    });
    ['mouseup', 'mouseleave', 'touchend'].forEach(evt => {
      triggerBtn.addEventListener(evt, stopCharge);
      coinObj.addEventListener(evt, stopCharge);
    });

      const drink = DRINKS_DATABASE.find(d => d.id === selectedDrinkId);
      document.getElementById('story-region-header-tag').innerText = drink.prefecture;
      document.getElementById('story-drink-type-badge').innerText = drink.typeBadge;

      document.getElementById('story-rich-description').innerHTML = drink.richDescription;
      document.getElementById('story-pairing-description').innerText = drink.pairingDescription;

      document.getElementById('story-hero-dish-img').src = drink.dishImageUrl;
      document.getElementById('story-pairing-dish-title').innerText = drink.pairingDishTitle;
      document.getElementById('story-drink-title-main').innerText = drink.name;
      document.getElementById('story-drink-maker-name').innerText = drink.brandMaker;

      currentGalleryData = drink.gallery;
      currentGalleryIndex = 0;
      updateGallerySlide();

      document.getElementById('view-story').style.opacity = '1';
      document.getElementById('view-story').style.pointerEvents = 'auto';
    }

    function updateGallerySlide() {
      if (!currentGalleryData || currentGalleryData.length === 0) return;
      
      const slide = currentGalleryData[currentGalleryIndex];
      const imgEl = document.getElementById('gallery-slide-img');
      const titleEl = document.getElementById('gallery-slide-title');
      const captionEl = document.getElementById('gallery-slide-caption');
      
      // 画像切り替え時のふんわりアニメーション
      imgEl.style.opacity = '0.4';
      setTimeout(() => {
        imgEl.src = slide.url;
        imgEl.style.opacity = '1';
        titleEl.innerText = slide.title;
        captionEl.innerText = slide.caption;
      }, 150);

      // 下部のドット（インジケーター）を更新
      const indicatorsContainer = document.getElementById('gallery-indicators');
      indicatorsContainer.innerHTML = '';
      currentGalleryData.forEach((_, idx) => {
        const dot = document.createElement('div');
        dot.className = `h-1.5 rounded-full transition-all duration-300 shadow-sm ${idx === currentGalleryIndex ? 'bg-white w-4' : 'bg-white/60 w-1.5'}`;
        indicatorsContainer.appendChild(dot);
      });
    }

    function nextGallerySlide() {
      if (!currentGalleryData || currentGalleryData.length === 0) return;
      currentGalleryIndex = (currentGalleryIndex + 1) % currentGalleryData.length;
      updateGallerySlide();
    }

    function prevGallerySlide() {
      if (!currentGalleryData || currentGalleryData.length === 0) return;
      currentGalleryIndex = (currentGalleryIndex - 1 + currentGalleryData.length) % currentGalleryData.length;
      updateGallerySlide();
    }

    function backToFlavorMap() {
      document.getElementById('view-story').style.opacity = '0';
      document.getElementById('view-story').style.pointerEvents = 'none';
    }

    function orderDrinkModal() {
      // alertは使用せずメッセージボックスの代わりとして、簡単なUIを作っても良いですが今回は簡略化しています
      console.log("ご注文ありがとうございます！");
    }

    window.onload = () => { renderQuiz(); };
  </script>
</body>
