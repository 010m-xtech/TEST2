<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>味覚マップ & テロワールストーリー</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Shippori+Mincho:wght@400;600;700;800&family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans JP"', 'sans-serif'],
            mincho: ['"Shippori Mincho"', 'serif'],
            serifEn: ['"Cinzel"', 'serif'],
          }
        }
      }
    }
  </script>

  <style>
    :root { --app-height: 100dvh; }
    html, body { height: 100%; height: 100dvh; overflow: hidden; touch-action: manipulation; }
    
    @keyframes pingSlow {
      0% { transform: scale(0.85); opacity: 0.9; }
      80%, 100% { transform: scale(2.4); opacity: 0; }
    }
    .animate-ping-slow { animation: pingSlow 1.8s cubic-bezier(0, 0, 0.2, 1) infinite; }
    
    @keyframes expandCircle {
      0% { clip-path: circle(0% at 50% 50%); }
      100% { clip-path: circle(150% at 50% 50%); }
    }

    @keyframes fadeInStory {
      0% { opacity: 0; transform: scale(0.95); }
      100% { opacity: 1; transform: scale(1); }
    }
    
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>

<body class="bg-slate-950 text-slate-800 font-sans h-full w-full select-none overflow-hidden flex flex-col justify-center items-center">

  <div class="relative w-full max-w-md h-[100dvh] bg-[#f8faf9] flex flex-col overflow-hidden shadow-2xl">

    <header class="relative z-50 px-4 py-2.5 flex items-center justify-between bg-white/95 backdrop-blur-md border-b border-emerald-950/10 flex-shrink-0">
      <div class="flex items-center gap-2">
        <div class="w-7 h-7 rounded-full bg-gradient-to-tr from-emerald-800 to-teal-600 flex items-center justify-center text-white shadow-xs">
          <i class="fa-solid fa-compass text-xs"></i>
        </div>
        <div>
          <span class="text-[9px] uppercase tracking-widest text-emerald-800 font-bold block leading-none font-serifEn">YOUR TASTE POSITION</span>
          <h1 class="text-xs font-mincho font-bold text-slate-800 leading-snug"><span id="app-title">あなたの味覚MAP</span><span id="app-subtitle" class="text-[10px] text-stone-500 font-sans ml-1 font-normal">〜味覚を巡る1杯〜</span></h1>
        </div>
      </div>
      <button onclick="restartDiagnosis()" class="text-[11px] bg-emerald-50 active:bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full font-medium transition flex items-center gap-1 border border-emerald-200/60 relative z-50">
        <i class="fa-solid fa-rotate-right text-[10px]"></i><span>再診断</span>
      </button>
    </header>

    <main class="relative flex-1 w-full h-full overflow-hidden">
      
      <div id="view-quiz" class="absolute inset-0 z-40 flex flex-col justify-between p-5 bg-gradient-to-b from-[#eef7f5] via-[#e2f2ee] to-[#d3ede2] transition-all duration-500">
        <div class="pt-2">
          <div class="inline-flex items-center gap-1.5 px-3 py-0.5 bg-emerald-800 text-white text-[10px] font-bold rounded-full mb-2 tracking-wide">
            <span id="quiz-step-label">QUESTION 1 / 4</span>
          </div>
          <h2 id="quiz-title" class="text-[17px] font-mincho font-bold text-slate-800 leading-snug"></h2>
        </div>
        <div id="quiz-options-container" class="space-y-2.5 my-auto py-2">
          <!-- Options injected via JS -->
        </div>
        <div class="pb-3 flex-shrink-0">
          <div class="w-full bg-emerald-200/80 h-1.5 rounded-full overflow-hidden">
            <div id="quiz-progress-bar" class="bg-gradient-to-r from-teal-500 to-emerald-700 h-full w-1/4 transition-all duration-300"></div>
          </div>
        </div>
      </div>

      <div id="view-map" class="absolute inset-0 z-30 flex flex-col p-3 pt-4 opacity-0 pointer-events-none transition-all duration-500 bg-[#fbfaf7]">
        
        <div class="relative flex-1 min-h-0 rounded-[24px] overflow-hidden border border-stone-200 shadow-sm bg-white">
          <div class="absolute inset-0 grid grid-cols-2 grid-rows-2">
            <div class="relative bg-gradient-to-br from-pink-50 to-pink-100/50 overflow-hidden" id="bg-top-left"></div>
            <div class="relative bg-gradient-to-bl from-sky-50 to-blue-100/40 overflow-hidden" id="bg-top-right"></div>
            <div class="relative bg-gradient-to-tr from-emerald-50 to-teal-50/50 overflow-hidden" id="bg-bottom-left"></div>
            <div class="relative bg-gradient-to-tl from-stone-100 to-stone-200/40 overflow-hidden" id="bg-bottom-right"></div>
          </div>

          <div class="absolute inset-0 pointer-events-none">
            <div class="absolute inset-x-0 top-1/2 h-px border-t border-dashed border-stone-300/80"></div>
            <div class="absolute inset-y-0 left-1/2 w-px border-l border-dashed border-stone-300/80"></div>
          </div>
          
          <div class="absolute top-3 left-1/2 -translate-x-1/2 text-[10px] font-bold text-pink-700 bg-white/80 px-2.5 py-1 rounded-full backdrop-blur-sm z-10 shadow-sm">華やか・香り</div>
          <div class="absolute bottom-3 left-1/2 -translate-x-1/2 text-[10px] font-bold text-stone-500 bg-white/80 px-2.5 py-1 rounded-full backdrop-blur-sm z-10 shadow-sm">ドライ・キレ</div>
          <div class="absolute left-2 top-1/2 -translate-y-1/2 text-[10px] font-bold text-teal-700 bg-white/80 px-1 py-2 rounded-full backdrop-blur-sm [writing-mode:vertical-rl] z-10 shadow-sm">スッキリ・軽快</div>
          <div class="absolute right-2 top-1/2 -translate-y-1/2 text-[10px] font-bold text-stone-600 bg-white/80 px-1 py-2 rounded-full backdrop-blur-sm [writing-mode:vertical-rl] z-10 shadow-sm">濃厚・コク</div>

          <div id="drink-pins-layer" class="absolute inset-0 z-20"></div>
          
          <div id="user-position-marker" class="absolute pointer-events-none transition-all duration-700 -translate-x-1/2 -translate-y-1/2 z-40 flex flex-col items-center">
            <span class="absolute w-16 h-16 rounded-full bg-emerald-400/30 animate-ping-slow"></span>
            <div class="relative w-11 h-11 rounded-full bg-gradient-to-tr from-emerald-800 to-teal-500 text-white flex items-center justify-center shadow-lg border-2 border-white text-[10px] font-bold uppercase tracking-wider">
              YOU
            </div>
          </div>
        </div>

        <div class="flex-shrink-0 pt-3 pb-20">
          <div id="recommendation-list" class="grid grid-cols-3 gap-2.5"></div>
        </div>

        <div id="action-journey-container" class="absolute bottom-6 left-0 right-0 px-4 z-50 opacity-0 pointer-events-none transition-all duration-500 translate-y-12">
          <button id="journey-btn" onclick="startJourney()" class="w-full py-3.5 rounded-2xl bg-stone-900 text-white font-mincho font-bold shadow-[0_10px_25px_rgba(0,0,0,0.3)] flex items-center justify-center gap-2 hover:bg-stone-800 active:scale-95 transition-all">
            <span>美味しいを巡る旅へ</span>
            <i class="fa-solid fa-plane text-sm"></i>
          </button>
        </div>
      </div>

      <div id="view-trip" onclick="skipTrip()" class="absolute inset-0 z-0 opacity-0 pointer-events-none transition-opacity duration-700 bg-[#f3efe6] overflow-hidden">
        <svg id="trip-map" class="absolute inset-0 w-full h-full" preserveAspectRatio="xMidYMid meet">
          <g id="trip-prefectures"></g>
          <path id="trip-route" d="" fill="none" stroke="#047857" stroke-width="2.5" stroke-dasharray="2 7" stroke-linecap="round" vector-effect="non-scaling-stroke"></path>
        </svg>

        <div id="trip-origin-marker" class="absolute -translate-x-1/2 -translate-y-1/2 flex flex-col items-center pointer-events-none">
          <div class="w-3 h-3 rounded-full bg-stone-700 border-2 border-white shadow"></div>
          <span id="trip-origin-label" class="mt-1 text-[10px] font-bold text-stone-600 bg-white/80 px-1.5 rounded"></span>
        </div>

        <div id="trip-dest-marker" class="absolute -translate-x-1/2 -translate-y-1/2 opacity-0 transition-opacity duration-300 pointer-events-none">
          <span class="absolute -inset-4 rounded-full bg-emerald-500/40 animate-ping-slow"></span>
          <div class="relative w-4 h-4 rounded-full bg-emerald-700 border-2 border-white shadow-lg"></div>
        </div>

        <div id="trip-plane" class="absolute w-9 h-9 -ml-[18px] -mt-[18px] flex items-center justify-center rounded-full bg-white text-emerald-800 shadow-lg pointer-events-none">
          <i class="fa-solid fa-plane text-base"></i>
        </div>

        <div class="absolute top-0 inset-x-0 pt-6 px-5 pointer-events-none">
          <span class="font-serifEn text-[10px] tracking-[0.3em] text-emerald-800 font-bold">NOW TRAVELING TO</span>
          <p id="trip-destination-label" class="font-mincho font-extrabold text-2xl text-stone-900 mt-1"></p>
        </div>

        <div id="trip-arrival-card" class="absolute bottom-8 inset-x-5 bg-white rounded-2xl shadow-[0_10px_30px_rgba(0,0,0,0.15)] border border-stone-200 p-4 pr-20 opacity-0 translate-y-8 transition-all duration-500 pointer-events-none">
          <span class="font-serifEn text-[10px] tracking-[0.3em] text-stone-500 font-bold">ARRIVAL</span>
          <p id="trip-arrival-name" class="font-mincho font-extrabold text-lg text-stone-900 leading-snug mt-1"></p>
          <p id="trip-arrival-maker" class="text-[11px] text-stone-500 mt-0.5"></p>
          <div id="trip-arrival-stamp" class="absolute right-4 top-1/2 -translate-y-1/2 w-14 h-14 rounded-full border-2 border-red-700 text-red-700 flex items-center justify-center font-mincho font-extrabold text-sm -rotate-12 opacity-0 scale-150 transition-all duration-300">到着</div>
        </div>

        <button onclick="event.stopPropagation(); skipTrip()" class="absolute top-6 right-4 px-3 py-1.5 bg-stone-900/70 text-white text-[10px] font-bold rounded-full backdrop-blur-md active:scale-95 transition-transform">
          SKIP <i class="fa-solid fa-forward-step ml-1"></i>
        </button>
      </div>

      <div id="view-story" class="absolute inset-0 z-0 flex flex-col bg-[#f2f7f4] text-slate-900 opacity-0 pointer-events-none transition-opacity duration-1000 overflow-hidden">
        <header class="px-4 py-2.5 flex items-center justify-between bg-[#f2f7f4]/95 backdrop-blur-md border-b border-emerald-900/10 flex-shrink-0 z-20">
          <button onclick="backToFlavorMap()" class="px-3 py-1 rounded-full bg-white/80 text-emerald-900 text-[11px] font-medium flex items-center gap-1.5 transition active:bg-emerald-50 shadow-sm border border-emerald-100">
            <i class="fa-solid fa-arrow-left text-[10px]"></i><span>マップに戻る</span>
          </button>
          <div class="text-right">
            <span id="story-region-header-tag" class="text-[11px] font-mincho font-bold text-emerald-800"></span>
          </div>
        </header>

        <div id="story-scroll-area" class="flex-1 overflow-y-auto overscroll-contain text-stone-800 pb-8">
          <section class="p-4 bg-gradient-to-b from-[#fdfcf9] to-[#f4f1ea]">
            
            <h1 id="story-drink-title-main" class="text-2xl font-mincho font-extrabold text-stone-900 leading-tight mt-2"></h1>
            <p id="story-drink-maker-name" class="text-sm text-stone-600 font-medium mt-1 mb-4"></p>

            <div id="story-rich-description" class="text-[13px] text-stone-700 leading-relaxed space-y-3 font-mincho mb-6"></div>

            <div class="relative w-full rounded-xl overflow-hidden shadow-sm border border-stone-200 my-4 bg-black">
              <!-- Removed aspect-[4/3] and changed inner padding/object-fit -->
              <div class="relative w-full pb-[66.66%]"> <!-- 3:2 aspect ratio container -->
                <img id="story-hero-dish-img-1" src="" class="absolute inset-0 w-full h-full object-contain transition-opacity duration-1000 opacity-100">
                <img id="story-hero-dish-img-2" src="" class="absolute inset-0 w-full h-full object-contain transition-opacity duration-1000 opacity-0">
              </div>
            </div>
          </section>

          <section id="story-gallery-section" class="p-4 bg-[#f8f6f0] border-t border-stone-200/60 pb-8">
            
            <div class="relative w-full bg-white rounded-xl overflow-hidden shadow-sm border border-emerald-100">
              <div class="h-52 overflow-hidden bg-stone-200 relative">
                <img id="gallery-slide-img" src="" class="w-full h-full object-cover transition-opacity duration-300">
                
                <button onclick="prevGallerySlide()" class="absolute left-2 top-1/2 -translate-y-1/2 w-8 h-8 flex items-center justify-center rounded-full bg-black/40 text-white backdrop-blur-md hover:bg-black/60 active:scale-95 transition z-10">
                  <i class="fa-solid fa-chevron-left text-xs"></i>
                </button>
                <button onclick="nextGallerySlide()" class="absolute right-2 top-1/2 -translate-y-1/2 w-8 h-8 flex items-center justify-center rounded-full bg-black/40 text-white backdrop-blur-md hover:bg-black/60 active:scale-95 transition z-10">
                  <i class="fa-solid fa-chevron-right text-xs"></i>
                </button>
                
                <div id="gallery-indicators" class="absolute bottom-2.5 left-0 right-0 flex justify-center gap-1.5 z-10"></div>
              </div>
              <div class="p-4 min-h-[104px]">
                <p id="gallery-slide-caption" class="text-[12px] text-stone-700 font-mincho leading-relaxed"></p>
              </div>
            </div>
          </section>
        </div>
      </div>
    </main>
  </div>

  <script src="japan-map.js"></script>
  <script src="drinks.js"></script>
  <script>
    let currentStep = 0;
    let userScore = { x: 50, y: 50 };
    let selectedDrinkId = null;
    let currentGalleryIndex = 0;
    let currentGalleryData = [];
    let slideshowInterval = null;
    let currentSlideIndex = 0;
    let drinkImages = [];
    let tripAnimationFrame = null;
    let tripTimers = [];

    const QUESTIONS = [
      {
        q: "Q1. いまの気分に一番フィットする飲み心地は？",
        options: [
          { text: "① 気分をシャキッとリフレッシュする、爽やかな1杯", dx: -15, dy: -5 },
          { text: "② 会話が弾むような、香り立ちの良いワクワクする1杯", dx: 0, dy: -15 },
          { text: "③ ペースを落として、じっくり深く浸れる落ち着いた1杯", dx: 15, dy: 5 },
          { text: "④ ここで一度口内をリセットする、キレ味鋭いクリアな1杯", dx: -10, dy: 10 }
        ]
      },
      {
        q: "Q2. グラスを近づけた時、ふわりと感じたい香りは？",
        options: [
          { text: "① 果実やお花、柑橘のようなフルーティーで華やかなアロマ", dx: -5, dy: -15 },
          { text: "② ハーブや山椒、和スパイスのような心地よい清涼感", dx: -5, dy: -5 },
          { text: "③ 自然な甘みや麦の香ばしさ、食事に寄り添う控えめな香り", dx: 5, dy: 10 },
          { text: "④ 香りは極力主張せず、澄み切ったクリーンな印象", dx: -5, dy: 15 }
        ]
      },
      {
        q: "Q3. 口に含んだ瞬間の「ボディ感」はどれが理想？",
        options: [
          { text: "① 水のようにサラリと喉を通る、軽快で雑味のないタッチ", dx: -15, dy: 5 },
          { text: "② ほどよい瑞々しさがあり、重すぎず軽すぎない心地よさ", dx: -5, dy: 0 },
          { text: "③ トロッとした舌触りや、口いっぱいに広がる濃密な旨味", dx: 10, dy: -5 },
          { text: "④ 舌の上にズシッと残る、飲みごたえ抜群の濃厚な重厚感", dx: 15, dy: 0 }
        ]
      },
      {
        q: "Q4. ゴクリと飲み干したあとの「余韻」はどうしたい？",
        options: [
          { text: "① 一瞬でスパッと消え去り、次の一口や箸が進むキレ", dx: -10, dy: 10 },
          { text: "② 鼻腔からフワッと心地よい果実やボタニカルの香りが抜けていく", dx: 0, dy: -10 },
          { text: "③ 喉の奥にじんわりとお酒本来のふくよかな温かみが続く", dx: 10, dy: 0 },
          { text: "④ 何層にも変化する濃厚な深みやビター感を長く味わいたい", dx: 15, dy: -5 }
        ]
      }
    ];

    const PLACEHOLDER_IMAGE = 'https://placehold.co/300x300/e2e8f0/64748b?text=Drink';

    const isDomestic = drink => drink.origin.country === '日本' && drink.origin.lat != null && drink.origin.lon != null;
    const getThumbnail = drink => (drink.images && drink.images[0]) || PLACEHOLDER_IMAGE;
    // 産地の短い表示（例：岐阜県 ／ フランス）
    const getOriginLabel = drink => drink.origin.country === '日本' ? drink.origin.prefecture : drink.origin.country;
    // 産地の詳しい表示（例：岐阜県中津川市 ／ フランス・ボルドー）
    const getOriginDetail = drink => drink.origin.country === '日本'
      ? `${drink.origin.prefecture}${drink.origin.area || ''}`
      : [drink.origin.country, drink.origin.area].filter(Boolean).join('・');
    const getMakerLine = drink => `${drink.maker}（${getOriginDetail(drink)}）`;

    function applyStoreConfig() {
      document.title = STORE_CONFIG.pageTitle;
      document.getElementById('app-title').innerText = STORE_CONFIG.appTitle;
      document.getElementById('app-subtitle').innerText = STORE_CONFIG.appSubtitle;
    }

    function renderQuiz() {
      if (!QUESTIONS || currentStep >= QUESTIONS.length) {
        showMapScreen();
        return;
      }
      const qObj = QUESTIONS[currentStep];
      document.getElementById('quiz-step-label').innerText = `QUESTION ${currentStep + 1} / ${QUESTIONS.length}`;
      document.getElementById('quiz-title').innerText = qObj.q;
      
      const container = document.getElementById('quiz-options-container');
      container.innerHTML = '';
      
      qObj.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = "w-full text-left p-3.5 bg-white rounded-xl shadow-sm border border-emerald-100/80 active:bg-emerald-50 active:border-emerald-300 transition text-sm font-medium text-slate-700 font-mincho hover:shadow-md leading-relaxed";
        btn.innerText = opt.text;
        btn.onclick = function() { answerQuestion(opt.dx, opt.dy); };
        container.appendChild(btn);
      });
      
      const progress = ((currentStep + 1) / QUESTIONS.length) * 100;
      document.getElementById('quiz-progress-bar').style.width = `${progress}%`;
    }

    function answerQuestion(xDelta, yDelta) {
      userScore.x = Math.max(5, Math.min(95, userScore.x + xDelta));
      userScore.y = Math.max(5, Math.min(95, userScore.y + yDelta));
      currentStep++;
      if (currentStep < QUESTIONS.length) {
        renderQuiz();
      } else {
        showMapScreen();
      }
    }

    function getNearestDrinks() {
      return [...DRINKS_DATABASE].sort((a,b) => Math.hypot(a.x-userScore.x,a.y-userScore.y)-Math.hypot(b.x-userScore.x,b.y-userScore.y)).slice(0,3);
    }
    
    function restartDiagnosis() {
      currentStep=0; userScore={x:50,y:50}; selectedDrinkId=null;
      cancelTrip();
      if(slideshowInterval) clearInterval(slideshowInterval);
      ['view-quiz','view-map','view-trip','view-story'].forEach(id=>{
        const el = document.getElementById(id);
        if(el){ el.style.opacity='0'; el.style.pointerEvents='none'; el.style.zIndex='0'; el.style.animation='none'; }
      });
      const journeyBtn = document.getElementById('action-journey-container');
      if (journeyBtn) {
        journeyBtn.classList.remove('opacity-100', 'pointer-events-auto', 'translate-y-0');
        journeyBtn.classList.add('opacity-0', 'pointer-events-none', 'translate-y-12');
      }

      const q = document.getElementById('view-quiz'); 
      q.style.opacity='1'; q.style.pointerEvents='auto'; q.style.zIndex='40'; 
      renderQuiz();
    }
    
    function showMapScreen() {
      const q = document.getElementById('view-quiz'); q.style.opacity='0'; q.style.pointerEvents='none'; q.style.zIndex='0';
      const m = document.getElementById('view-map'); m.style.opacity='1'; m.style.pointerEvents='auto'; m.style.zIndex='30';
      const u = document.getElementById('user-position-marker'); u.style.left=`${userScore.x}%`; u.style.top=`${userScore.y}%`;
      drawDrinkPins();
      renderRecommendations();
    }
    
    function drawDrinkPins(){
      const layer = document.getElementById('drink-pins-layer');
      layer.innerHTML = '';
      DRINKS_DATABASE.forEach(drink => {
        const pin = document.createElement('button');
        pin.className = 'absolute -translate-x-1/2 -translate-y-1/2 w-14 h-14 rounded-full border-2 border-white shadow-md bg-white overflow-hidden transition-transform duration-300 hover:scale-110 active:scale-95';
        pin.style.left = `${drink.x}%`;
        pin.style.top = `${drink.y}%`;
        pin.title = drink.name;
        pin.innerHTML = `<img src="${getThumbnail(drink)}" class="w-full h-full object-cover" onerror="this.src='${PLACEHOLDER_IMAGE}'">`;
        pin.onclick = () => selectDrink(drink, pin);
        layer.appendChild(pin);
      });
    }

    function renderRecommendations(){
      const list = document.getElementById('recommendation-list');
      list.innerHTML = '';
      getNearestDrinks().forEach((drink, index) => {
        const card = document.createElement('button');
        card.id = `rec-card-${drink.id}`;
        card.className = 'text-left bg-white rounded-xl border border-stone-200 overflow-hidden shadow-sm active:scale-[.98] transition flex flex-col h-full';
        card.innerHTML = `<div class="h-24 w-full overflow-hidden shrink-0 bg-stone-50"><img src="${getThumbnail(drink)}" class="w-full h-full object-contain p-1" onerror="this.src='${PLACEHOLDER_IMAGE}'"></div><div class="p-2 flex-1 flex flex-col justify-center"><div class="text-[9px] text-emerald-700 font-bold">${index+1} / ${drink.category}</div><div class="text-[11px] font-mincho font-bold text-stone-900 line-clamp-1 mt-0.5">${drink.name}</div><div class="text-[9px] text-stone-500 truncate mt-1">${getOriginLabel(drink)}</div></div>`;
        card.onclick = () => selectDrink(drink, null);
        list.appendChild(card);
      });
    }

    function selectDrink(drink, pinElement){
      selectedDrinkId = drink.id;
      
      document.querySelectorAll('#drink-pins-layer button').forEach(el => el.classList.remove('ring-4','ring-emerald-400'));
      document.querySelectorAll('#recommendation-list button').forEach(el => el.classList.remove('ring-2','ring-emerald-400'));
      
      if(pinElement) {
        pinElement.classList.add('ring-4','ring-emerald-400');
      } else {
        const matchingPinIndex = DRINKS_DATABASE.findIndex(d => d.id === drink.id);
        const pins = document.querySelectorAll('#drink-pins-layer button');
        if(pins[matchingPinIndex]) pins[matchingPinIndex].classList.add('ring-4','ring-emerald-400');
      }
      const card = document.getElementById(`rec-card-${drink.id}`);
      if(card) card.classList.add('ring-2','ring-emerald-400');

      const journeyBtn = document.getElementById('action-journey-container');
      if (journeyBtn) {
        journeyBtn.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-12');
        journeyBtn.classList.add('opacity-100', 'pointer-events-auto', 'translate-y-0');
      }
    }

    function renderTripPrefectures() {
      document.getElementById('trip-prefectures').innerHTML = Object.entries(JAPAN_PREFECTURE_PATHS).map(([name, d]) =>
        `<path d="${d}" data-pref="${name}" fill="#dde8e1" stroke="#f3efe6" stroke-width="1" vector-effect="non-scaling-stroke" style="transition: fill 0.6s"></path>`
      ).join('');
    }

    const clamp01 = v => Math.max(0, Math.min(1, v));
    const easeInOut = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    const lerp = (a, b, t) => a + (b - a) * t;

    function cancelTrip() {
      if(tripAnimationFrame) cancelAnimationFrame(tripAnimationFrame);
      tripAnimationFrame = null;
      tripTimers.forEach(clearTimeout);
      tripTimers = [];
    }

    function startJourney() {
      if(!selectedDrinkId) return;
      const drink = DRINKS_DATABASE.find(d => d.id === selectedDrinkId);
      if(!drink) return;
      cancelTrip();

      const map = document.getElementById('view-map');
      const tripView = document.getElementById('view-trip');

      map.style.opacity = '0';
      map.style.pointerEvents = 'none';
      map.style.zIndex = '0';

      tripView.style.opacity = '1';
      tripView.style.pointerEvents = 'auto';
      tripView.style.zIndex = '50';

      tripView.style.animation = 'none';
      tripView.offsetHeight;
      tripView.style.animation = 'expandCircle 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards';

      // 表示内容をリセット
      document.getElementById('trip-destination-label').innerText = `${getOriginLabel(drink)}へ`;
      document.getElementById('trip-origin-label').innerText = STORE_CONFIG.tripOrigin.label;
      document.getElementById('trip-arrival-name').innerText = drink.name;
      document.getElementById('trip-arrival-maker').innerText = getMakerLine(drink);
      const card = document.getElementById('trip-arrival-card');
      const stamp = document.getElementById('trip-arrival-stamp');
      const destMarker = document.getElementById('trip-dest-marker');
      const plane = document.getElementById('trip-plane');
      const originMarker = document.getElementById('trip-origin-marker');
      const route = document.getElementById('trip-route');
      card.classList.add('opacity-0', 'translate-y-8');
      stamp.classList.add('opacity-0', 'scale-150');
      destMarker.style.opacity = '0';
      plane.style.opacity = '1';
      document.querySelectorAll('#trip-prefectures path').forEach(p => p.setAttribute('fill', '#dde8e1'));

      // 海外のお酒：地図は出さず、到着カードとスタンプだけ
      const mapLayers = [document.getElementById('trip-map'), originMarker, destMarker, plane];
      if(!isDomestic(drink)) {
        mapLayers.forEach(el => el.style.visibility = 'hidden');
        tripTimers.push(setTimeout(() => card.classList.remove('opacity-0', 'translate-y-8'), 300));
        tripTimers.push(setTimeout(() => stamp.classList.remove('opacity-0', 'scale-150'), 700));
        tripTimers.push(setTimeout(showStoryScreen, 2200));
        return;
      }
      mapLayers.forEach(el => el.style.visibility = '');
      const destPref = document.querySelector(`#trip-prefectures path[data-pref="${drink.origin.prefecture}"]`);

      // 出発地 → 目的地を結ぶ弧（2次ベジェ曲線）
      const p0 = projectLatLon(STORE_CONFIG.tripOrigin.lat, STORE_CONFIG.tripOrigin.lon);
      const p2 = projectLatLon(drink.origin.lat, drink.origin.lon);
      const dx = p2.x - p0.x, dy = p2.y - p0.y;
      const dist = Math.hypot(dx, dy) || 1;
      let nx = -dy / dist, ny = dx / dist;
      if(ny > 0) { nx = -nx; ny = -ny; } // 弧が北側にふくらむ向きにする
      const bend = Math.max(dist * 0.35, 40);
      const p1 = { x: (p0.x + p2.x) / 2 + nx * bend, y: (p0.y + p2.y) / 2 + ny * bend };
      const bezier = t => ({
        x: (1 - t) * (1 - t) * p0.x + 2 * (1 - t) * t * p1.x + t * t * p2.x,
        y: (1 - t) * (1 - t) * p0.y + 2 * (1 - t) * t * p1.y + t * t * p2.y
      });

      // カメラ：日本全体 → 航路全体 → 目的地へズーム（画面の縦横比に合わせたviewBox）
      const svg = document.getElementById('trip-map');
      const W = svg.clientWidth, H = svg.clientHeight, aspect = H / W;
      const M = JAPAN_MAP_PROJECTION;
      const fullW = Math.max(M.width, M.height / aspect) * 1.05;
      const fullVB = { x: M.width / 2 - fullW / 2, y: M.height / 2 - fullW * aspect / 2, w: fullW, h: fullW * aspect };
      const minX = Math.min(p0.x, p1.x, p2.x), maxX = Math.max(p0.x, p1.x, p2.x);
      const minY = Math.min(p0.y, p1.y, p2.y), maxY = Math.max(p0.y, p1.y, p2.y);
      const routeW = Math.min(fullW, Math.max(600, (maxX - minX) * 1.8, (maxY - minY) * 1.8 / aspect));
      const routeVB = { x: (minX + maxX) / 2 - routeW / 2, y: (minY + maxY) / 2 - routeW * aspect / 2, w: routeW, h: routeW * aspect };
      const zoomW = 480;
      const zoomVB = { x: p2.x - zoomW / 2, y: p2.y - zoomW * aspect * 0.4, w: zoomW, h: zoomW * aspect };
      const lerpVB = (a, b, t) => ({ x: lerp(a.x, b.x, t), y: lerp(a.y, b.y, t), w: lerp(a.w, b.w, t), h: lerp(a.h, b.h, t) });

      const INTRO_END = 800, FLY_START = 500, FLY_END = 2100, ZOOM_END = 2900, FINISH = 4000;
      const startTime = performance.now();

      function frame(now) {
        const t = now - startTime;
        const fly = easeInOut(clamp01((t - FLY_START) / (FLY_END - FLY_START)));
        const vb = t < FLY_END
          ? lerpVB(fullVB, routeVB, easeInOut(clamp01(t / INTRO_END)))
          : lerpVB(routeVB, zoomVB, easeInOut(clamp01((t - FLY_END) / (ZOOM_END - FLY_END))));
        svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
        const place = (el, p) => {
          el.style.left = `${(p.x - vb.x) / vb.w * W}px`;
          el.style.top = `${(p.y - vb.y) / vb.h * H}px`;
        };

        // ここまで飛んだ部分の弧だけを描く
        const c1 = { x: lerp(p0.x, p1.x, fly), y: lerp(p0.y, p1.y, fly) };
        const cur = bezier(fly);
        route.setAttribute('d', `M${p0.x},${p0.y} Q${c1.x},${c1.y} ${cur.x},${cur.y}`);

        const tx = 2 * (1 - fly) * (p1.x - p0.x) + 2 * fly * (p2.x - p1.x);
        const ty = 2 * (1 - fly) * (p1.y - p0.y) + 2 * fly * (p2.y - p1.y);
        place(plane, cur);
        plane.style.transform = `rotate(${Math.atan2(ty, tx) * 180 / Math.PI}deg)`;
        place(originMarker, p0);
        place(destMarker, p2);

        if(t < ZOOM_END) tripAnimationFrame = requestAnimationFrame(frame);
      }
      tripAnimationFrame = requestAnimationFrame(frame);

      tripTimers.push(setTimeout(() => {
        plane.style.opacity = '0';
        destMarker.style.opacity = '1';
        if(destPref) destPref.setAttribute('fill', '#10b981');
      }, FLY_END));
      tripTimers.push(setTimeout(() => card.classList.remove('opacity-0', 'translate-y-8'), FLY_END + 400));
      tripTimers.push(setTimeout(() => stamp.classList.remove('opacity-0', 'scale-150'), FLY_END + 800));
      tripTimers.push(setTimeout(showStoryScreen, FINISH));
    }

    function skipTrip() {
      showStoryScreen();
    }

    function showStoryScreen() {
      cancelTrip();
      const tripView = document.getElementById('view-trip');
      tripView.style.opacity = '0';
      tripView.style.pointerEvents = 'none';
      setTimeout(() => {
          tripView.style.zIndex = '0';
      }, 700);

      const drink = DRINKS_DATABASE.find(d => d.id === selectedDrinkId);
      if(!drink) return;

      document.getElementById('story-region-header-tag').innerText = getOriginLabel(drink);
      renderStoryDescription(drink);
      document.getElementById('story-drink-title-main').innerText = drink.name;
      document.getElementById('story-drink-maker-name').innerText = getMakerLine(drink);
      document.getElementById('story-scroll-area').scrollTop = 0;

      // クロスフェードスライドショーの初期化
      drinkImages = drink.images && drink.images.length ? drink.images : [PLACEHOLDER_IMAGE];
      currentSlideIndex = 0;
      const img1 = document.getElementById('story-hero-dish-img-1');
      const img2 = document.getElementById('story-hero-dish-img-2');
      img1.src = drinkImages[0];
      img1.onerror = () => { img1.src = 'https://placehold.co/800x600/e2e8f0/64748b?text=Drink'; };
      img1.style.opacity = 1;
      img2.style.opacity = 0;

      if(slideshowInterval) clearInterval(slideshowInterval);
      if(drinkImages.length > 1) {
        slideshowInterval = setInterval(() => {
          currentSlideIndex = (currentSlideIndex + 1) % drinkImages.length;
          const nextImgSrc = drinkImages[currentSlideIndex];
          
          if(img1.style.opacity == 1) {
            img2.src = nextImgSrc;
            img2.onerror = () => { img2.src = 'https://placehold.co/800x600/e2e8f0/64748b?text=Drink'; };
            img2.style.opacity = 1;
            img1.style.opacity = 0;
          } else {
            img1.src = nextImgSrc;
            img1.onerror = () => { img1.src = 'https://placehold.co/800x600/e2e8f0/64748b?text=Drink'; };
            img1.style.opacity = 1;
            img2.style.opacity = 0;
          }
        }, 3000); // 3秒間隔で切り替え（1500から変更）
      }

      currentGalleryData = drink.gallery || [];
      currentGalleryIndex = 0;
      document.getElementById('story-gallery-section').style.display = currentGalleryData.length ? '' : 'none';
      updateGallerySlide();

      const storyView = document.getElementById('view-story');
      storyView.style.opacity = '1';
      storyView.style.pointerEvents = 'auto';
      storyView.style.zIndex = '40';
      
      storyView.style.animation = 'none';
      storyView.offsetHeight; 
      storyView.style.animation = 'fadeInStory 1s cubic-bezier(0.25, 1, 0.5, 1) forwards';
    }

    // 説明文・受賞歴・スペックを描画
    function renderStoryDescription(drink) {
      const container = document.getElementById('story-rich-description');
      container.innerHTML = '';
      (drink.description || []).forEach(text => {
        const p = document.createElement('p');
        p.className = 'whitespace-pre-line';
        p.textContent = text;
        container.appendChild(p);
      });

      const columns = [];
      if(drink.awards && drink.awards.length) columns.push({ title: '受賞歴', lines: drink.awards });
      if(drink.specs && drink.specs.length) columns.push({ title: 'スペック', lines: drink.specs.map(s => `${s.label}：${s.value}`) });
      if(!columns.length) return;

      const box = document.createElement('div');
      box.className = 'mt-4 flex flex-wrap gap-4 text-[11px] text-stone-800 bg-white/60 p-3 rounded-lg border border-emerald-900/10 shadow-sm';
      columns.forEach(col => {
        const colEl = document.createElement('div');
        colEl.className = 'flex-1 min-w-[120px]';
        const title = document.createElement('p');
        title.className = 'font-bold mb-1.5 border-b border-emerald-900/20 pb-1 text-emerald-950';
        title.textContent = `●${col.title}`;
        const body = document.createElement('p');
        body.className = 'leading-relaxed whitespace-pre-line';
        body.textContent = col.lines.join('\n');
        colEl.append(title, body);
        box.appendChild(colEl);
      });
      container.appendChild(box);
    }

    function updateGallerySlide() {
      if (!currentGalleryData || currentGalleryData.length === 0) return;
      
      const slide = currentGalleryData[currentGalleryIndex];
      const imgEl = document.getElementById('gallery-slide-img');
      const captionEl = document.getElementById('gallery-slide-caption');
      
      imgEl.style.opacity = '0.4';
      setTimeout(() => {
        imgEl.src = slide.url;
        imgEl.onerror = () => { imgEl.src = 'https://placehold.co/800x400/e2e8f0/64748b?text=Landscape'; };
        imgEl.style.opacity = '1';
        captionEl.innerText = slide.caption;
      }, 150);

      const indicatorsContainer = document.getElementById('gallery-indicators');
      indicatorsContainer.innerHTML = '';
      currentGalleryData.forEach((_, idx) => {
        const dot = document.createElement('div');
        dot.className = `h-1.5 rounded-full transition-all duration-300 shadow-sm ${idx === currentGalleryIndex ? 'bg-white w-4' : 'bg-white/60 w-1.5'}`;
        indicatorsContainer.appendChild(dot);
      });
    }

    function nextGallerySlide() {
      if (!currentGalleryData || currentGalleryData.length === 0) return;
      currentGalleryIndex = (currentGalleryIndex + 1) % currentGalleryData.length;
      updateGallerySlide();
    }

    function prevGallerySlide() {
      if (!currentGalleryData || currentGalleryData.length === 0) return;
      currentGalleryIndex = (currentGalleryIndex - 1 + currentGalleryData.length) % currentGalleryData.length;
      updateGallerySlide();
    }

    function backToFlavorMap() {
      if(slideshowInterval) clearInterval(slideshowInterval);

      const story = document.getElementById('view-story');
      story.style.opacity = '0';
      story.style.pointerEvents = 'none';
      story.style.zIndex = '0';
      
      const map = document.getElementById('view-map');
      map.style.opacity = '1';
      map.style.pointerEvents = 'auto';
      map.style.zIndex = '30';
      
      drawDrinkPins();
      renderRecommendations();
    }

    window.onload = () => { 
      applyStoreConfig();
      renderTripPrefectures();
      renderQuiz(); 
    };
  </script>
