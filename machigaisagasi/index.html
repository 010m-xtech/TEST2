<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>間違い探し</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; touch-action: none; background: #000; font-family: sans-serif; }
    #game-container {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }
    #game-container canvas {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1 !important;
    }
    #ui-layer {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      color: white;
      font-size: 24px;
      font-weight: bold;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
      pointer-events: none;
    }
    #start-overlay, #result-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      pointer-events: auto;
    }
    button {
      padding: 15px 40px;
      font-size: 24px;
      font-weight: bold;
      color: white;
      background: #ff4757;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      transition: transform 0.1s;
    }
    button:active {
      transform: scale(0.95);
    }
    h1 {
      color: white;
      margin-bottom: 30px;
      font-size: 32px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
      text-align: center;
      white-space: pre-wrap;
      line-height: 1.5;
    }
  </style>
  <script id="dc-ui-texts" type="application/json">
  {
    "sourceLang": "ja",
    "texts": {
      "ja": {
        "ui.start": "スタート",
        "hud.found": "みつけた！ {found} / {total}",
        "result.clear": "ぜんぶみつけた！",
        "result.timeup": "タイムアップ！\n（答え合わせはスタッフまで♪）",
        "ui.retry": "もういちど"
      },
      "en": {
        "ui.start": "Start",
        "hud.found": "Found: {found} / {total}",
        "result.clear": "All Found!",
        "result.timeup": "Time's up!\n(Ask staff for the answers♪)",
        "ui.retry": "Retry"
      },
      "zh": {
        "ui.start": "开始",
        "hud.found": "找到: {found} / {total}",
        "result.clear": "全部找到！",
        "result.timeup": "时间到！\n（请向工作人员确认答案♪）",
        "ui.retry": "重试"
      },
      "ko": {
        "ui.start": "시작",
        "hud.found": "찾았다: {found} / {total}",
        "result.clear": "모두 찾음!",
        "result.timeup": "시간 종료!\n(정답은 직원에게 확인해 주세요♪)",
        "ui.retry": "다시하기"
      },
      "es": {
        "ui.start": "Empezar",
        "hud.found": "Encontrado: {found} / {total}",
        "result.clear": "¡Todos encontrados!",
        "result.timeup": "¡Se acabó el tempo!\n(¡Pregunta al personal para las respuestas♪)",
        "ui.retry": "Reintentar"
      },
      "pt": {
        "ui.start": "Começar",
        "hud.found": "Encontrado: {found} / {total}",
        "result.clear": "Todos Encontrados!",
        "result.timeup": "Tempo esgotado!\n(Pergunte à equipe pelas respostas♪)",
        "ui.retry": "Tentar novamente"
      }
    }
  }
  </script>
</head>
<body>
  <div id="game-container">
    <div id="ui-layer">
    </div>
  </div>

  <div id="start-overlay">
    <button id="start-btn" style="display:none;"></button>
  </div>

  <div id="result-overlay" style="display:none;">
    <h1 id="result-title"></h1>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.0/p5.min.js"></script>
  <script>
    // JSON構文エラーを防ぐために非改行スペースを通常のスペースに置換してクリーンアップ
    const rawJSONText = document.getElementById('dc-ui-texts').textContent;
    const cleanJSONText = rawJSONText.replace(/\u00A0/g, ' ');
    const uiPayload = JSON.parse(cleanJSONText);
    
    const sourceLang = uiPayload.sourceLang || 'en';
    const uiTexts = uiPayload.texts || {};
    const savedLang = (localStorage.getItem('dreamcore_lang') || '').slice(0, 2);
    const browserLang = (navigator.language || '').slice(0, 2);
    const currentLang = uiTexts[savedLang] ? savedLang : (uiTexts[browserLang] ? browserLang : sourceLang);
    
    function t(key, vars) {
      let s = (uiTexts[currentLang] && uiTexts[currentLang][key]) || (uiTexts[sourceLang] && uiTexts[sourceLang][key]) || key;
      if (vars) Object.keys(vars).forEach(k => { s = s.replaceAll('{' + k + '}', String(vars[k])); });
      return s;
    }

    class SynthAudio {
      constructor() { this.ctx = null; }
      init() {
        if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (this.ctx.state === 'suspended') this.ctx.resume();
      }
      play(freq, endFreq, duration, type = 'square', vol = 0.2) {
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(endFreq, this.ctx.currentTime + duration);
        gain.gain.setValueAtTime(vol, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
        osc.start();
        osc.stop(this.ctx.currentTime + duration);
      }
      playTimeUp() {
        this.play(600, 400, 0.3, 'square', 0.2);
        setTimeout(() => this.play(600, 400, 0.8, 'square', 0.2), 400);
      }
    }
    const audio = new SynthAudio();
    document.addEventListener('pointerdown', () => audio.init(), { once: true });

    let gameState = 'WAITING';
    let img1 = null;
    let img2 = null;

    // タイマー用変数
    const TIME_LIMIT = 30;
    let timeLeft = TIME_LIMIT;
    let timerStartTime = 0;

    const sketch = (p) => {
      p.preload = () => {
        // Postimagesの直接リンクを使用
        const img1Url = 'https://i.postimg.cc/CxRdBFDY/boteko-xing-tian-yuan-an.jpg';
        img1 = p.loadImage(img1Url, null, () => img1 = null);
        
        const img2Url = 'https://i.postimg.cc/YSf7jVdJ/boteko-xing-tian3ge-suo.jpg';
        img2 = p.loadImage(img2Url, null, () => img2 = null);
      };

      p.setup = () => {
        const canvas = p.createCanvas(p.windowWidth, p.windowHeight);
        canvas.parent('game-container');
        p.imageMode(p.CENTER);

        document.getElementById('start-btn').innerText = t('ui.start');
        document.getElementById('start-btn').style.display = 'block';
        
        document.getElementById('start-btn').addEventListener('click', () => {
            document.getElementById('start-overlay').style.display = 'none';
            gameState = 'PLAYING';
            timerStartTime = p.millis();
            timeLeft = TIME_LIMIT;
            audio.init();
        });
      };

      p.windowResized = () => {
        p.resizeCanvas(p.windowWidth, p.windowHeight);
      };

      function drawImageContain(img, boxX, boxY, boxW, boxH) {
        if (!img) return;
        const imgRatio = img.width / img.height;
        const boxRatio = boxW / boxH;
        let drawW, drawH;
        if (imgRatio > boxRatio) {
          drawW = boxW;
          drawH = boxW / imgRatio;
        } else {
          drawH = boxH;
          drawW = boxH * imgRatio;
        }
        const drawX = boxX + (boxW - drawW) / 2;
        const drawY = boxY + (boxH - drawH) / 2;
        // p5.jsのimageMode(CENTER)に合わせて中心座標を指定
        p.image(img, drawX + drawW / 2, drawY + drawH / 2, drawW, drawH);
      }

      p.draw = () => {
        p.background(10);

        // PCなどの大画面でも、常に上下の2段に配置
        let box1 = { x: 0, y: 0, w: p.windowWidth, h: p.windowHeight / 2 };
        let box2 = { x: 0, y: p.windowHeight / 2, w: p.windowWidth, h: p.windowHeight / 2 };

        // 上画像の描画
        if (img1) {
          drawImageContain(img1, box1.x, box1.y, box1.w, box1.h);
        } else {
          p.fill(50);
          p.rect(box1.x + 20, box1.y + 20, box1.w - 40, box1.h - 40);
        }

        // 下画像の描画
        if (img2) {
          drawImageContain(img2, box2.x, box2.y, box2.w, box2.h);
        } else {
          p.fill(50);
          p.rect(box2.x + 20, box2.y + 20, box2.w - 40, box2.h - 40);
        }

        // 区切り線（常に水平な横線に固定）
        p.stroke(40);
        p.strokeWeight(4);
        p.line(0, p.windowHeight / 2, p.windowWidth, p.windowHeight / 2);

        // タイマー処理と描画
        if (gameState === 'PLAYING') {
          let elapsed = (p.millis() - timerStartTime) / 1000;
          timeLeft = Math.max(0, TIME_LIMIT - elapsed);
          
          // 時間切れ処理
          if (timeLeft === 0) {
            gameState = 'TIMEUP';
            audio.playTimeUp();
            setTimeout(() => {
              document.getElementById('result-title').innerText = t('result.timeup');
              document.getElementById('result-overlay').style.display = 'flex';
            }, 1000);
          }
        }

        // タイマーUI表示
        if (gameState !== 'WAITING') {
          p.push();
          // 画面全体の真ん中にタイマーを配置
          p.translate(p.windowWidth / 2, p.windowHeight / 2);
          p.fill(0, 0, 0, 180);
          p.noStroke();
          p.rectMode(p.CENTER);
          p.rect(0, 0, 100, 50, 25);

          p.fill(255);
          p.textSize(32);
          p.textAlign(p.CENTER, p.CENTER);
          p.textStyle(p.BOLD);
          
          // 残り10秒以下で赤く点滅
          if (timeLeft <= 10 && timeLeft > 0 && gameState === 'PLAYING') {
            if (Math.floor(p.millis() / 250) % 2 === 0) {
              p.fill(255, 71, 87);
            }
          }
          p.text(Math.ceil(timeLeft), 0, 2);
          p.pop();
        }
      };
    };

    new p5(sketch);
  </script>
</body>
</html>
