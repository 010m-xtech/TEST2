<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>美乃寿し のお魚たち</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --kinari: #F2EEE3;
    --kinari-deep: #E9E2CF;
    --ai: #22385C;
    --ai-light: #4C6A94;
    --ai-pale: #DCE3EC;
    --umi: #185070;          /* ロゴの青緑 */
    --shu: #BD4630;
    --shu-pale: #F1DCD5;
    --sumi: #2A2620;
    --line: #D6CCB4;
    --muted: #a89d87;
    --font-mincho: 'Shippori Mincho', 'Hiragino Mincho ProN', 'Yu Mincho', serif;
    --font-gothic: 'Zen Kaku Gothic New', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
    --radius: 14px;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{
    margin:0; padding:0;
    background: #0d1b2a;
    color: var(--sumi);
    font-family: var(--font-gothic);
    -webkit-font-smoothing: antialiased;
  }

  body{ min-height:100vh; min-height:100dvh; display:flex; justify-content:center; }

  /* ============ 背景動画(全画面共通・ループ再生) ============ */
  .bg-video-wrap{
    position: fixed; inset: 0; z-index: 0;
    overflow: hidden; background: #0d1b2a;
  }
  .bg-video-wrap video{
    position:absolute; top:50%; left:50%;
    min-width:100%; min-height:100%;
    width:auto; height:auto;
    transform: translate(-50%, -50%);
    object-fit: cover;
    opacity: 0;
    transition: opacity 1.5s ease-in-out;
  }
  .bg-video-wrap video.show-bg {
    opacity: 1;
  }
  #bg-video-op {
    filter: brightness(2.5);
  }
  .bg-video-overlay{
    position:absolute; inset:0;
    background: linear-gradient(180deg, rgba(13,27,42,0.72), rgba(13,27,42,0.85));
  }

  .app{
    width:100%; min-height:100vh; min-height:100dvh;
    position:relative; z-index:1;
    display:flex; flex-direction:column;
  }

  header{
    position:sticky; top:0; z-index:20;
    background: rgba(13, 27, 42, 0.85);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-bottom:1px solid rgba(242,238,227,0.15);
    padding: 12px 20px 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .brand{ display:flex; align-items:center; gap:10px; cursor: pointer; }
  /* ロゴの細い線が潰れないよう、32px→44pxに拡大 */
  .seal{ width:44px; height:44px; flex:0 0 auto; object-fit: contain; }
  .brand h1{
    font-family: var(--font-mincho); font-weight:700; font-size:18.5px;
    letter-spacing:0.04em; margin:0; color:var(--kinari);
    line-height: 1.4;
  }

  .header-back-btn {
    background: transparent;
    border: none;
    color: var(--kinari);
    font-family: var(--font-gothic);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 6px 8px;
    margin-right: -8px;
    opacity: 0.8;
    transition: opacity 0.2s;
  }
  .header-back-btn:active { opacity: 0.5; }

  button:focus-visible, [role="button"]:focus-visible{ outline:2px solid var(--shu-pale); outline-offset:3px; }

  main{ flex:1; padding:26px 20px 48px; position:relative; }

  .screen{ display:none; animation: fadeUp .5s ease both; }
  .screen.active{ display:block; }
  .screen[data-screen="op"]{ animation: none; }
  @keyframes fadeUp{ from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:translateY(0);} }
  @media (prefers-reduced-motion: reduce){ .screen{ animation:none; } }

  .eyebrow{ font-size:12px; letter-spacing:.14em; color:var(--shu-pale); font-weight:700; margin:0 0 8px; }
  h2.title{ font-family:var(--font-mincho); font-size:24px; line-height:1.6; margin:0 0 16px; color:var(--kinari); }
  .lead{ font-size:15px; color:#ffffff; line-height:1.9; margin:0 0 22px; }

  /* ============ OP ============ */
  .op-wrapper {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .op-logo-img {
    opacity: 0; transition: opacity 1s ease-in-out;
    max-width: 250px; width: 60%; height: auto;
  }
  .skip-telop {
    position: absolute;
    bottom: 50px;
    left: 50%;
    color: rgba(242, 238, 227, 0.85);
    font-size: 13px;
    letter-spacing: 0.1em;
    pointer-events: none;
    white-space: nowrap;
    animation: floatBlink 3s ease-in-out infinite;
  }
  @keyframes floatBlink {
    0%, 100% { transform: translate(-50%, 0); opacity: 0.3; }
    50% { transform: translate(-50%, -10px); opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce){
    .skip-telop{ animation:none; transform:translateX(-50%); opacity:.8; }
  }

  /* ============ 魚選択(水族館) ============ */
  .screen[data-screen="select"] {
    position: relative;
    min-height: 100vh; min-height: 100dvh;
    overflow: hidden;
    /* 水槽を画面幅いっぱいに広げ、魚が見えない線で切れないようにする(文字の位置は従来どおり) */
    padding: 0px 20px 0;                       /* 文字の左右の余白を、ほかの画面(20px)と同じに。魚の吹き出しを広く使うため */
    margin: -12px -20px 0;
  }
  .screen[data-screen="select"] > .eyebrow,
  .screen[data-screen="select"] > .title,
  .screen[data-screen="select"] > .lead {
    position: relative;
    z-index: 20;
    text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    pointer-events: none;   /* 文字の下を泳ぐ魚もタップできるように */
  }
  .collect-counter{
    position: relative; z-index: 30; pointer-events: auto;
    display:inline-flex; align-items:center; gap:8px;
    margin: 0; padding: 8px 14px; border-radius: 999px;
    border:1px solid rgba(242,238,227,.35);
    background: rgba(13,27,42,.55);
    color: var(--kinari); font-family: inherit; font-size: 13px; font-weight: 700;
    cursor: pointer;
  }
  .collect-counter b{ font-size: 16px; color:#fff; }
  .aqua-wrap {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    overflow: visible;
    pointer-events: none;
    z-index: 10;
  }
  .aqua-item{
    position: absolute; top: 0; left: 0;
    width: 140px;
    cursor: pointer;
    pointer-events: auto;
    will-change: transform;
  }
  /* 未捕獲は淡いシルエット、捕まえると色が付く(filterの関数の並びを揃えて滑らかに遷移) */
  .aqua-fish{
    display:block; width:100%; height:auto;
    filter: brightness(1) invert(0) opacity(1) drop-shadow(0 4px 6px rgba(0,0,0,0.5));
    transition: filter .8s ease;
  }
  .aqua-fish.unknown{
    filter: brightness(0) invert(1) opacity(.28) drop-shadow(0 0 0 rgba(0,0,0,0));
  }
  .aqua-fish.pop{ animation: pop .7s ease; }
  @keyframes pop{ 0%{ scale:1; } 35%{ scale:1.28; } 100%{ scale:1; } }

  /* ============ 魚詳細 ============ */
  .fish-hero{ text-align:center; margin: 0 0 18px; }
  .fish-hero img{
    display:block; margin:0 auto 10px;
    max-width:72%; max-height:150px; width:auto; height:auto;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,.5));
  }
  .fish-hero.no-img img{ display:none; }
  .fish-header{ display:flex; align-items:baseline; justify-content:center; gap:10px; }
  .fish-header .name{ font-family: var(--font-mincho); font-size:26px; font-weight:700; color: var(--kinari); }

  .fish-story {
    background: rgba(242,238,227,0.04);
    border: 1px solid rgba(242,238,227,0.15);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 24px;
    color: #ffffff;
    overflow: hidden;
  }

  .story-highlight {
    margin: -20px -20px 20px;
    padding: 16px 20px;
    background: linear-gradient(135deg, rgba(189,70,48,0.15), transparent);
    border-left: 4px solid var(--shu);
  }
  .highlight-title {
    font-family: var(--font-mincho);
    font-size: 16.5px;
    color: var(--shu-pale);
    margin: 0 0 12px;
    font-weight: 700;
  }

  .story-taste { margin: 0 0 8px; }
  .story-basic { font-size: 14px; line-height: 1.8; margin: 0 0 18px; color: #ffffff; }
  .taste-title {
    font-family: var(--font-mincho);
    font-size: 15.5px;
    color: var(--kinari);
    margin: 0 0 8px;
    display: flex; align-items: center; gap: 8px;
  }
  .taste-title::before {
    content: ''; display: inline-block; width: 6px; height: 6px;
    background: var(--shu); transform: rotate(45deg);
  }
  .story-taste p.eating { font-size: 14px; line-height: 1.8; margin: 0; color: #ffffff; }

  /* --- クイズ --- */
  .quiz-question { font-size: 14.5px; font-weight: 700; margin-bottom: 12px; color: var(--kinari); line-height: 1.5; }
  .quiz-options { display: flex; gap: 10px; margin-bottom: 8px; }
  .quiz-btn {
    flex: 1; padding: 12px 8px; border-radius: 8px;
    border: 1px solid rgba(242,238,227,0.3);
    background: rgba(242,238,227,0.05);
    color: #fff; font-family: inherit; font-weight: 700; font-size: 14px;
    cursor: pointer; transition: all 0.2s;
    display: flex; align-items: center; justify-content: center;
  }
  .quiz-btn:active { transform: scale(0.95); }
  .quiz-btn.selected { border-color: var(--shu); background: var(--shu); }
  .quiz-btn:disabled { opacity: 0.7; pointer-events: none; }

  .quiz-result-box {
    display: none; padding: 14px; border-radius: 8px; font-size: 14px; line-height: 1.6;
    animation: fadeUp 0.4s ease; margin-top: 12px;
  }
  .quiz-result-box.show { display: block; }
  .quiz-result-title { font-weight: 700; font-size: 16px; margin-bottom: 6px; }
  .quiz-result-box.correct { background: rgba(46, 204, 113, 0.15); border: 1px solid rgba(46, 204, 113, 0.5); }
  .quiz-result-box.correct .quiz-result-title { color: #4ade80; }
  .quiz-result-box.incorrect { background: rgba(231, 76, 60, 0.15); border: 1px solid rgba(231, 76, 60, 0.5); }
  .quiz-result-box.incorrect .quiz-result-title { color: #f87171; }

  /* サーモンの切り身: 答えを選ぶと色が変わる */
  .slice-wrap{ margin-top: 12px; text-align:center; }
  .slice{ width: 240px; max-width: 100%; height:auto; }
  .slice-body{ fill:#E9E2CF; transition: fill 1.4s ease .3s; }
  .slice-line{ fill:none; stroke:rgba(255,255,255,.8); stroke-width:3; stroke-linecap:round; opacity:0; transition: opacity 1.4s ease .3s; }
  .slice.revealed .slice-body{ fill:#EE7A3C; }
  .slice.revealed .slice-line{ opacity:.8; }
  .slice-caption{ font-size:12px; color:rgba(255,255,255,.85); margin-top:4px; }

  /* 豆知識ブロックの表示制御(クイズ連動) */
  .story-trivia.hidden { display: none; }
  .story-trivia.show-animated { display: block; animation: fadeUp 0.6s ease both; }

  /* --- フリップカード --- */
  .flip-card { perspective: 1000px; cursor: pointer; margin-top: 8px; }
  .flip-card-inner { display: grid; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d; }
  .flip-card.is-flipped .flip-card-inner { transform: rotateY(180deg); }
  .flip-card-front, .flip-card-back {
    grid-area: 1 / 1;
    -webkit-backface-visibility: hidden; backface-visibility: hidden;
    border-radius: 12px; padding: 24px 20px;
    display: flex; flex-direction: column; justify-content: center;
    box-sizing: border-box; min-height: 130px;
  }
  .flip-card-front {
    background: rgba(189,70,48,0.2); border: 1px solid rgba(189,70,48,0.5);
    align-items: center; text-align: center;
  }
  .flip-card-front p { margin: 0; font-size: 15px; font-weight: 700; color: var(--kinari); line-height: 1.5; }
  .flip-card-front .hint { font-size: 11px; color: rgba(242,238,227,0.7); margin-top: 14px; font-weight: normal; }
  .flip-card-back {
    background: rgba(34,56,92,0.9); border: 1px solid rgba(76,106,148,0.6);
    transform: rotateY(180deg); align-items: flex-start; text-align: left;
  }
  .flip-card-back p { margin: 0; font-size: 14px; color: #fff; line-height: 1.6; }

  .story-trivia {
    background: rgba(34,56,92,0.4);
    border-radius: 8px;
    padding: 14px 16px;
    border: 1px solid rgba(76,106,148,0.3);
    margin-bottom: 24px;
  }
  .trivia-label {
    font-size: 11px; color: var(--ai-pale); font-weight: 700; letter-spacing: 0.1em;
    margin-bottom: 6px; display: flex; align-items: center; gap: 6px;
  }
  .story-trivia p { font-size: 13px; line-height: 1.7; margin: 0; color: #ffffff; }

  .trivia-illustration-wrap { margin-top: 16px; text-align: center; display: none; }
  .trivia-illustration-wrap img {
    width: 100%; max-width: 260px; height: auto;
    border-radius: 6px; background: transparent;
    border: 1px solid rgba(220,227,236,0.15);
    margin: 0 auto; display: block; cursor: zoom-in;
  }
  .trivia-illustration-caption { font-size: 11px; color: #ffffff; margin-top: 8px; opacity: 0.9; }
  .ill-legend { list-style:none; margin:12px 0 0; padding:0; text-align:left; }
  .ill-legend li { display:flex; align-items:center; gap:10px; font-size:13px; line-height:1.5; color:#fff; padding:4px 0; }
  .ill-legend .dot { flex:0 0 auto; width:14px; height:14px; border-radius:50%; border:2px solid rgba(255,255,255,.85); }

  /* --- 見分けカード --- */
  .story-compare { margin: 0 0 24px; }
  .compare-grid { display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .compare-card { background: rgba(0,0,0,.18); border-radius: 10px; padding: 10px 8px 12px; text-align:center; }
  .compare-card img { width:100%; height:auto; display:block; }
  .compare-card .label { font-family: var(--font-mincho); font-weight:700; color: var(--kinari); font-size:15px; margin-top:6px; }
  .compare-card .note { font-size:12px; color:#fff; line-height:1.5; margin-top:4px; }
  .compare-foot { font-size:13px; line-height:1.7; margin:10px 0 0; color:#fff; }

  /* --- マグロの部位図 --- */
  .parts { margin-top: 20px; }
  .parts-title { font-family: var(--font-mincho); font-size: 14.5px; color: var(--kinari); margin: 0 0 10px; }
  .parts-stage { position: relative; background: rgba(0,0,0,.18); border-radius: 10px; padding: 8px; }
  .parts-stage img { display:block; width:100%; height:auto; }
  .parts-stage svg { position:absolute; left:8px; top:8px; width:calc(100% - 16px); height:calc(100% - 16px); }
  .part { cursor:pointer; fill-opacity:.55; stroke:#fff; stroke-opacity:.85; stroke-width:3; transition: fill-opacity .2s, stroke-width .2s; }
  .part.active { fill-opacity:.9; stroke-width:6; }
  .parts-btns { display:flex; gap:8px; margin-top:10px; }
  .parts-btn {
    flex:1; padding:10px 0; border-radius:8px; border:1px solid rgba(242,238,227,.3);
    background: rgba(242,238,227,.05); color:#fff; font-family:inherit; font-weight:700; font-size:14px; cursor:pointer;
  }
  .parts-btn.active { background: var(--shu); border-color: var(--shu); }
  .parts-info { font-size:13.5px; line-height:1.7; margin:10px 0 0; min-height: 3.4em; color:#fff; }
  .parts-note { font-size:11px; color:rgba(242,238,227,.6); margin:4px 0 0; }

  /* --- 店主のひとこと --- */
  .story-owner { border-left: 3px solid var(--ai-light); padding: 2px 0 2px 12px; margin-top: 20px; }
  .story-owner .owner-label { font-size:11px; font-weight:700; color: var(--ai-pale); letter-spacing:.08em; margin-bottom:4px; }
  .story-owner p { margin:0; font-size:14px; line-height:1.8; color:#fff; }

  /* ============ メニュー・お酒 ============ */
  .menu-item{
    background: rgba(242,238,227,0.06);
    border:1px solid rgba(242,238,227,0.18);
    border-radius: 10px; padding: 16px; margin-bottom:12px; cursor: pointer;
    transition: background 0.2s ease;
  }
  .menu-item:hover{ background: rgba(242,238,227,0.1); }
  .menu-item .name{ font-family: var(--font-mincho); font-weight:700; font-size:16px; color: var(--kinari); display: flex; justify-content: space-between; align-items: center; }
  .menu-item .chevron { transition: transform 0.3s ease; opacity: 0.6; }
  .menu-item.open .chevron { transform: rotate(180deg); }
  .menu-item .desc{ font-size:13px; color: #ffffff; margin-top:6px; line-height:1.6; }
  .menu-item .tap-hint{ font-size:11.5px; color: var(--shu-pale); margin-top:8px; }
  .menu-item.open .tap-hint{ display:none; }
  .menu-empty{ font-size:14px; line-height:1.8; color:#fff; margin:0 0 20px; }

  .pairing-sake { display: none; margin-top: 14px; padding-top: 14px; border-top: 1px dashed rgba(242,238,227,0.2); }
  .menu-item.open .pairing-sake { display: block; animation: fadeInSake 0.3s ease both; }
  @keyframes fadeInSake { from{opacity:0; transform:translateY(-4px);} to{opacity:1; transform:translateY(0);} }

  .sake-group-label{
    font-size:11.5px; font-weight:700; color: var(--shu-pale);
    letter-spacing:.06em; margin: 18px 0 10px; display:flex; align-items:center; gap:6px;
  }
  .sake-card{
    background: rgba(242,238,227,0.08);
    border:1px solid rgba(242,238,227,0.2);
    border-radius: var(--radius); padding: 14px 16px; margin-bottom:12px;
  }
  .sake-card .tags{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
  .sake-card .tag{
    display:inline-block; font-size:10.5px; font-weight:700;
    background: var(--shu); color:#fff; padding:2px 9px; border-radius:20px;
  }
  .sake-card .tag.pair{ background: transparent; border:1px solid var(--shu-pale); color: var(--shu-pale); }
  .sake-card .name-row{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; margin-bottom:6px; }
  .sake-card .name{ font-family: var(--font-mincho); font-weight:700; font-size:16px; color: var(--kinari); }
  .sake-card .region{ font-size:11px; color: #ffffff; }
  .sake-card .pair-line{ font-size:13.5px; font-weight:700; color: var(--kinari); margin:0 0 6px; line-height:1.6; }
  .sake-card .taste{ font-size:12.5px; color: #ffffff; line-height:1.75; margin:0; }

  .btn-row{ display:flex; gap:10px; margin-top:30px; }
  button.btn{
    font-family:var(--font-gothic); font-weight:700; font-size:14px;
    padding:14px 18px; border-radius:10px; border:none; cursor:pointer;
    letter-spacing:.03em; transition:opacity .15s ease, transform .1s ease;
  }
  button.btn:active{ transform:scale(0.98); }
  .btn-primary{ flex:1; background:var(--shu); color:#fff; }
  .btn-primary:hover{ opacity:.92; }
  .btn-ghost{ background: rgba(242,238,227,0.08); color:var(--kinari); border:1px solid rgba(242,238,227,0.3); }
  button.btn:disabled{ opacity:.4; cursor:not-allowed; }

  /* ============ アンケート(やわらかい見た目) ============ */
  .talk-head{ position:relative; display:flex; align-items:center; gap:20px; margin:4px 0 30px; }
  /* 魚は、吹き出しの側(右)を向く。口の位置は JS で測って、吹き出しのしっぽの先をそこに合わせる */
  .talk-fish-wrap{ flex:0 0 auto; width:clamp(84px, 26vw, 104px); transform:scaleX(-1); }
  .talk-fish{
    display:block; width:100%; height:auto; transform-origin:50% 60%;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,.5));
    animation: fishBob 3.2s ease-in-out infinite;
  }
  @keyframes fishBob{ 0%,100%{ transform:translateY(0) rotate(-3deg); } 50%{ transform:translateY(-5px) rotate(3deg); } }
  .talk-fish.done{ animation: fishHop .8s ease 2; }
  @keyframes fishHop{ 0%,100%{ transform:translateY(0) rotate(0); } 40%{ transform:translateY(-22px) rotate(-8deg); } 70%{ transform:translateY(-4px) rotate(4deg); } }

  .talk-bubble{
    --tail-len:16px; --tail-y:40px;
    position:relative; flex:1; opacity:0;
    background: var(--kinari); color: var(--ai);
    border-radius: 18px; padding: 14px 16px;
    font-family: var(--font-mincho); font-weight:700; font-size:17px; line-height:1.6;
    box-shadow: 0 4px 0 rgba(0,0,0,.22);
    transform-origin: calc(-1 * var(--tail-len)) var(--tail-y);
  }
  /* 口から出るしっぽ */
  .talk-bubble::before{
    content:''; position:absolute; width:0; height:0;
    left: calc(-1 * var(--tail-len)); top: calc(var(--tail-y) - 9px);
    border-style:solid; border-width:9px var(--tail-len) 9px 0;
    border-color: transparent var(--kinari) transparent transparent;
  }
  /* 冒頭の質問: 話している間は、画面いっぱいに大きく(ステージ) */
  .stage-head{
    position:fixed; left:0; right:0; bottom:0; top:var(--stage-top, 66px); z-index:15;
    display:flex; align-items:center; justify-content:center; padding:0 22px 6vh;
  }
  .stage-head[hidden]{ display:none; }
  .stage-inner{ width:100%; max-width:520px; display:flex; flex-direction:column; align-items:center; gap:28px; will-change:transform, opacity; }
  .stage-head .talk-fish-wrap{ width:min(62vw, 250px); }
  .stage-head .talk-bubble{
    flex:none; width:100%; cursor:pointer;
    font-size:clamp(19px, 6.4vw, 29px); line-height:1.7; padding:24px 24px; border-radius:26px;
    --tail-len:30px; --tail-x:70%;
    transform-origin: var(--tail-x) calc(-1 * var(--tail-len));
  }
  /* しっぽは、上向き(魚の口へ) */
  .stage-head .talk-bubble::before{
    left:calc(var(--tail-x) - 12px); top:calc(-1 * var(--tail-len));
    border-width:0 12px var(--tail-len) 12px; border-color:transparent transparent var(--kinari) transparent;
  }
  .stage-head .talk-sub{ font-size:15px; margin-top:10px; }
  .stage-head .talk-bubble:focus-visible{ outline:2px solid var(--shu-pale); outline-offset:3px; }
  .talk-head.await{ visibility:hidden; }
  .talk-bubble.static{ opacity:1 !important; animation:none !important; }
  /* 最初の画面の案内役 */
  .select-talk{ position:relative; z-index:30; margin:6px 0 12px; min-height:146px; }   /* 吹き出しの行数が変わっても、下のボタンが動かないように */
  .select-talk .talk-fish-wrap{ width:clamp(70px, 21vw, 88px); }
  .talk-bubble.compact{ font-size:16px; padding:12px 14px; cursor:pointer; }
  .talk-bubble.compact:focus-visible{ outline:2px solid var(--shu-pale); outline-offset:3px; }
  @media (max-width:340px){ .talk-bubble.compact{ font-size:13.5px; padding:12px 12px; } }          /* 画面が特に狭い機種では、吹き出しの文字を少し小さく(行の途中で折り返さないように) */
  .talk-bubble.skip .ch, .talk-bubble.skip .ch.wave, .talk-bubble.skip .talk-sub{ animation:none !important; opacity:1; transform:none; }
  #surveyFoot.pop-in, #farewellForm.pop-in, #farewellDone.pop-in{ animation: fadeUp .45s ease both; }
  .note-input{
    display:block; width:100%; resize:vertical; min-height:112px;
    background: var(--kinari); color: var(--ai);
    border:0; border-radius:18px; padding:14px 16px;
    font-family: var(--font-gothic); font-size:15px; line-height:1.7;
    box-shadow: 0 4px 0 rgba(0,0,0,.28);
  }
  .note-input::placeholder{ color: var(--ai-light); }
  .note-input:focus-visible{ outline:2px solid var(--shu-pale); outline-offset:3px; }
  /* しっぽは魚の「うしろ」から出す: 魚を手前に、吹き出し(しっぽ)を奥に重ねるので、しっぽが魚に被らない */
  .talk-fish-wrap{ position:relative; z-index:2; }
  .talk-bubble{ z-index:1; }
  .talk-bubble.thanks{ font-size:clamp(13px, 3.9vw, 15.5px); }
  .talk-bubble.play{ animation: bubblePop .45s cubic-bezier(.22,.9,.3,1) .1s both; }   /* 文字が出はじめる(0.6秒)より前に、ふくらみきる */
  @keyframes bubblePop{ 0%{ transform:scale(.15); opacity:0; } 55%{ opacity:1; } 100%{ transform:scale(1); opacity:1; } }

  /* 吹き出しの文字: 1文字ずつ、ふわっと現れる(大きさや位置は動かさないので、行がずれて見えない)。
     強調したい言葉は、揺らさずに、お店の差し色(朱)で示す */
  .ch{
    display:inline-block; white-space:pre; opacity:0;
    animation: chIn .16s ease-out forwards;
    animation-delay: calc(var(--t0, .6s) + var(--i) * var(--ts, .04s));
  }
  @keyframes chIn{ to{ opacity:1; } }
  .ch.wave{ color: var(--shu); }
  .talk-sub{
    display:block; margin-top:4px;
    font-family: var(--font-gothic); font-weight:500; font-size:12.5px; color: var(--ai-light);
    opacity:0; animation: subIn .5s ease 1.6s forwards;
  }
  @keyframes subIn{ to{ opacity:1; } }
  .sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

  /* 口から出る小さな泡 */
  .air{
    position:absolute; border:1.5px solid rgba(242,238,227,.85); border-radius:50%;
    opacity:0; pointer-events:none;
  }
  .air.a1{ width:7px; height:7px; animation: airRise 2.6s ease-out 1.0s infinite; }
  .air.a2{ width:10px; height:10px; animation: airRise 2.6s ease-out 1.5s infinite; }
  .air.a3{ width:5px; height:5px; animation: airRise 2.6s ease-out 2.0s infinite; }
  @keyframes airRise{ 0%{ transform:translate(0,0) scale(.6); opacity:0; } 15%{ opacity:.9; } 100%{ transform:translate(8px,-38px) scale(1.1); opacity:0; } }

  .survey-q{ margin-bottom:26px; }
  .survey-q.pop-in{ animation: fadeUp .45s ease both; }
  .q-label{
    display:flex; align-items:center; gap:8px;
    font-family: var(--font-mincho); font-weight:700; font-size:17px; color: var(--kinari);
    margin:0 0 12px;
  }
  .q-label::before{
    content:''; display:inline-block; width:7px; height:7px; background: var(--shu); transform: rotate(45deg);
  }
  .chip-row{ display:flex; gap:10px; flex-wrap:wrap; }
  .chip{ flex:1; min-width:96px; cursor:pointer; position:relative; display:block; }
  .chip input{ position:absolute; opacity:0; pointer-events:none; }
  .chip-box{
    display:flex; align-items:center; justify-content:center; min-height:58px; padding:0 10px;
    border-radius:999px; background: var(--kinari); color: var(--ai);
    font-weight:700; font-size:16px;
    box-shadow: 0 4px 0 rgba(0,0,0,.28);
    transition: transform .12s ease, box-shadow .12s ease, background .2s ease, color .2s ease;
  }
  .chip:active .chip-box{ transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,.28); }
  .chip input:checked + .chip-box{
    background: var(--shu); color:#fff; transform: translateY(3px) scale(1.03);
    box-shadow: 0 1px 0 rgba(0,0,0,.28);
  }
  .chip input:checked + .chip-box::before{ content:'✓'; margin-right:6px; font-size:15px; }
  .chip input:focus-visible + .chip-box{ outline:2px solid var(--shu-pale); outline-offset:3px; }
  .chip input:disabled + .chip-box{ cursor:default; }
  @media (prefers-reduced-motion: reduce){
    .talk-fish, .talk-fish.done{ animation:none; }
    .talk-bubble{ opacity:1; }
    .talk-bubble.play{ animation:none; }
    .ch, .ch.wave, .talk-sub{ animation:none; opacity:1; transform:none; }
    .air{ display:none; }
    .chip-box{ transition:none; }
  }

  .note{ font-size:12px; color: rgba(242,238,227,0.6); margin-top:6px; line-height:1.6; text-align:center; }

  /* ============ 結果 ============ */
  .result-card{
    background: rgba(242,238,227,0.06); border:1px solid rgba(242,238,227,0.18);
    border-radius: var(--radius); padding: 22px 20px; margin-bottom: 18px; text-align:center;
  }
  .result-label{ font-size:12.5px; color: var(--shu-pale); font-weight:700; margin:0 0 6px; }
  .result-num{ font-family: var(--font-mincho); font-size:46px; font-weight:700; color:#fff; line-height:1.2; margin:0; }
  .result-num small{ font-size:20px; color:rgba(255,255,255,.7); margin-left:4px; }
  .result-sub{ font-size:14px; color:#fff; margin:14px 0 0; line-height:1.7; }
  .result-closing{
    font-family: var(--font-mincho); text-align:center; color: var(--kinari);
    font-size:20px; letter-spacing:.06em; margin: 28px 0 6px;
  }
  .result-actions{ display:flex; flex-direction:column; gap:10px; margin-top:22px; }
  .result-actions .btn{ width:100%; }

  /* ============ 画像の拡大表示 ============ */
  .lightbox{ position:fixed; inset:0; z-index:200; background: #08101c; display:none; flex-direction:column; }
  .lightbox.open{ display:flex; }
  .lb-bar{ display:flex; justify-content:space-between; align-items:center; padding:12px 16px; color: var(--kinari); font-size:12px; }
  .lb-close{
    background:none; border:1px solid rgba(242,238,227,.4); color: var(--kinari);
    border-radius:999px; padding:8px 18px; font-family:inherit; font-weight:700; font-size:13px; cursor:pointer;
  }
  .lb-scroll{ flex:1; overflow:auto; display:flex; align-items:center; -webkit-overflow-scrolling:touch; }
  .lb-scroll img{ flex:0 0 auto; width:min(180vw, 1000px); height:auto; margin:0 auto; }

  /* ===== 読みやすさ(文字の大きさ・行間・折り返し) =====
     ・小さすぎた文字(10〜13px)を13〜15.5pxに。長い文章は、行間と字間を少し広げ、太さも一段上げています
     ・折り返しは「禁則処理(行頭に。、ぁっー が来ない)」＋「文節の切れ目(JSが<wbr>を入れた所)」で行います */
  body{ font-weight:500; }
  main{ line-break:strict; overflow-wrap:anywhere; }
  .phrase{ word-break:keep-all; }
  .story-basic, .story-taste p.eating, .story-trivia p, .menu-item .desc, .sake-card .taste, .parts-info,
  .compare-foot, .story-owner p, .menu-empty, .result-sub, .quiz-result-text, .flip-card-back p, .ill-legend li{ text-wrap:pretty; letter-spacing:.02em; }
  h2.title, .fish-header .name, .q-label, .taste-title, .highlight-title, .parts-title, .compare-card .label{ text-wrap:balance; }

  .story-basic{ font-size:15.5px; line-height:1.9; }
  .story-taste p.eating{ font-size:15.5px; line-height:1.9; }
  .taste-title{ font-size:16.5px; }
  .highlight-title{ font-size:17.5px; }
  .quiz-question{ font-size:16px; line-height:1.65; }
  .quiz-btn{ font-size:15px; }
  .quiz-result-box{ font-size:15px; line-height:1.75; }
  .quiz-result-title{ font-size:16.5px; }
  .flip-card-front p{ font-size:16px; }
  .flip-card-front .hint{ font-size:13px; }
  .flip-card-back p{ font-size:15px; line-height:1.75; }
  .flip-sub{ margin-top:10px; font-size:14px; line-height:1.7; }
  .flip-cap{ display:flex; justify-content:space-around; margin-top:8px; font-size:13px; font-weight:700; color:#fff; }
  .story-trivia p{ font-size:14.5px; line-height:1.85; }
  .trivia-label{ font-size:13px; }
  .trivia-illustration-caption{ font-size:13px; line-height:1.65; }
  .ill-legend li{ font-size:14.5px; }
  .compare-card .label{ font-size:15.5px; }
  .compare-card .note{ font-size:13.5px; line-height:1.6; }
  .compare-foot{ font-size:14.5px; line-height:1.8; }
  .parts-title{ font-size:15.5px; }
  .parts-btn{ font-size:15px; }
  .parts-info{ font-size:14.5px; line-height:1.8; }
  .parts-note{ font-size:12.5px; color:rgba(242,238,227,.78); }
  .slice-caption{ font-size:13.5px; }
  .story-owner .owner-label{ font-size:13px; }
  .story-owner p{ font-size:15.5px; line-height:1.9; }

  .menu-notice{ color:#ff8787; font-size:14px; margin-bottom:24px; line-height:1.75; font-weight:700; }
  .menu-item .name{ font-size:17px; }
  .menu-item .desc{ font-size:14.5px; line-height:1.75; }
  .menu-item .tap-hint{ font-size:13px; }
  .menu-empty{ font-size:15px; line-height:1.85; }
  .sake-group-label{ font-size:13px; }
  .sake-card .tag{ font-size:12.5px; padding:3px 11px; }
  .sake-card .region{ font-size:13px; }
  .sake-card .name{ font-size:17px; }
  .sake-card .pair-line{ font-size:14.5px; line-height:1.7; }
  .sake-card .taste{ font-size:14.5px; line-height:1.85; }

  .btn, button.btn{ font-size:15px; }
  .note{ font-size:13.5px; color:rgba(242,238,227,.8); line-height:1.7; }
  .talk-sub{ font-size:13.5px; color:#3A5686; }
  .collect-counter{ font-size:14px; }
  .result-label{ font-size:14px; }
  .result-sub{ font-size:15px; line-height:1.85; }
  .skip-telop{ font-size:14px; text-shadow:0 1px 6px rgba(0,0,0,.6); }
  button.btn:disabled{ opacity:.55; }
  .quiz-btn:disabled{ opacity:.92; }          /* 答えを選んだあとも、選択肢の文字をはっきり読めるように */
  .note-input{ font-size:16px; }          /* 16px未満だと、iPhoneで入力時に画面が拡大されてしまう */

  /* ===== 本編: 文字を減らし、ひとめで分かる見せ方に ===== */
  .story-lead{
    font-family: var(--font-mincho); font-weight:700; font-size:18px; line-height:1.75;
    color: var(--kinari); text-align:center; margin:12px 4px 0; text-wrap:balance;
  }
  .points{ list-style:none; margin:0; padding:0; display:grid; gap:10px; }
  .points li{
    display:flex; align-items:center; gap:12px;
    background: rgba(242,238,227,.07); border:1px solid rgba(242,238,227,.18); border-radius:14px;
    padding:12px 14px; font-size:16px; font-weight:700; line-height:1.5; color:#fff;
  }
  .pt-mark{
    flex:0 0 26px; height:26px; border-radius:50%; background: var(--shu); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:700;
  }
  /* 大事なことばを、蛍光ペンのように */
  b.em, .em{
    font-weight:700; color: var(--kinari);
    background: linear-gradient(transparent 58%, rgba(189,70,48,.55) 58%);
    padding:0 .08em;
  }
  .story-trivia p{ font-size:15px; line-height:1.85; }
  .quiz-result-text{ font-size:15.5px; line-height:1.85; }
  .quiz-result-text .em, .flip-card-back .em{ color:#fff; }
  /* 解説図: 「拡大」の印 */
  .ill-box{ position:relative; display:block; max-width:260px; margin:0 auto; }
  .ill-box img{ display:block; width:100%; height:auto; cursor:zoom-in; }
  .zoom-badge{
    position:absolute; right:6px; bottom:6px; pointer-events:none;
    font-size:12px; font-weight:700; color:#fff; background:rgba(13,27,42,.78);
    border:1px solid rgba(242,238,227,.5); border-radius:999px; padding:2px 10px;
  }
  .trivia-illustration-wrap img{ max-width:none; }
  /* お酒の画面 */
  .sake-card .taste{ margin:0 0 10px; }
  .match{ display:flex; flex-wrap:wrap; align-items:center; gap:6px; }
  .match-label{ font-size:13px; font-weight:700; color:var(--shu-pale); margin-right:2px; }
  .chip-m{ font-size:13.5px; color:#fff; background:rgba(242,238,227,.12); border-radius:999px; padding:3px 11px; }

  /* ===== お魚のこと: 特徴・味わい・食べ方(ラベル + 2文ほどの説明) ===== */
  .about{ display:grid; gap:0; }
  .about-row{ padding:14px 2px; border-top:1px solid rgba(242,238,227,.16); }
  .about-row:first-child{ border-top:0; padding-top:4px; }
  .about-k{
    display:inline-block; margin:0 0 8px; padding:1px 11px;
    font-size:13.5px; font-weight:700; letter-spacing:.08em; color: var(--shu-pale);
    border:1px solid rgba(241,220,213,.55); border-radius:999px;
  }
  .about-v{ margin:0; font-size:15.5px; line-height:1.9; color:#fff; text-wrap:pretty; letter-spacing:.02em; }
  .about-v .em{ color:#fff; }
  .story-lead{ font-size:17.5px; }

  /* ===== 料理カード(魚の画面からの遷移先) ===== */
  .menu-more{ display:none; margin-top:14px; padding-top:12px; border-top:1px dashed rgba(242,238,227,.25); }
  .menu-item.open .menu-more{ display:block; animation: fadeInSake .3s ease both; }
  .menu-more .about-row{ padding:12px 2px; }
  .fish-jump-row{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:12px; padding-top:12px; border-top:1px solid rgba(242,238,227,.16); }
  .fish-jump{
    font-family:inherit; font-size:14px; font-weight:700; color:#fff; cursor:pointer;
    background:rgba(189,70,48,.35); border:1px solid rgba(241,220,213,.55); border-radius:999px; padding:6px 14px;
  }
  .fish-jump:active{ transform:scale(.96); }
  .menu-story p{ margin:0 0 12px; font-size:15.5px; line-height:1.95; color:#fff; letter-spacing:.02em; text-wrap:pretty; }
  .menu-story p:last-child{ margin-bottom:0; }
  .menu-story .em, .menu-secret .em{ color:#fff; }
  .menu-secret{ margin-top:16px; padding:10px 0 10px 14px; border-left:3px solid var(--shu); background:linear-gradient(90deg, rgba(189,70,48,.14), transparent); }
  .secret-label{ font-size:13px; font-weight:700; letter-spacing:.1em; color:var(--shu-pale); margin-bottom:4px; }
  .menu-secret p{ margin:0; font-size:15px; line-height:1.85; color:#fff; }
  /* 料理カード: 写真は小さなサムネイル。名前・説明を右に並べて、場所をとらないように */
  .menu-item{ padding:12px; margin-bottom:10px; }
  .menu-head{ display:flex; gap:12px; align-items:flex-start; }
  .menu-photo{ flex:0 0 88px; width:88px; height:88px; border-radius:10px; overflow:hidden; background:rgba(0,0,0,.25); }
  .menu-photo img{ display:block; width:100%; height:100%; object-fit:cover; }
  .menu-head-text{ flex:1; min-width:0; }
  .menu-head-text .name{ font-size:16px; line-height:1.4; }
  .menu-head-text .desc{ font-size:13.5px; line-height:1.6; margin-top:4px; }
  .menu-head-text .tap-hint{ font-size:12.5px; margin-top:6px; }
  .menu-more{ margin-top:12px; padding-top:10px; }
  .menu-story p{ font-size:15px; line-height:1.85; margin-bottom:10px; }
  .menu-notice{ font-size:12.5px; line-height:1.7; margin:0 0 14px; padding:8px 12px; }
  .menu-notice{ color:var(--shu-pale); font-weight:500; border:1px solid rgba(241,220,213,.35); border-radius:10px; background:rgba(0,0,0,.18); }

  /* ===== おすすめの日本酒(コンパクト) ===== */
  .sake-pick-label{ font-size:13.5px; font-weight:700; letter-spacing:.06em; color:var(--shu-pale); margin:18px 0 8px; }
  .sake-pick{ background:rgba(242,238,227,.08); border:1px solid rgba(242,238,227,.2); border-radius:12px; padding:10px 14px; margin-bottom:8px; }
  .sp-tags{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:4px; }
  .sp-tag{ font-size:12px; font-weight:700; background:var(--shu); color:#fff; padding:1px 9px; border-radius:20px; }
  .sp-tag.sub{ background:transparent; border:1px solid var(--shu-pale); color:var(--shu-pale); }
  .sp-name{ display:flex; align-items:baseline; gap:8px; }
  .sp-nm{ font-family:var(--font-mincho); font-weight:700; font-size:17px; color:var(--kinari); }
  .sp-region{ font-size:12.5px; color:#fff; }
  .sp-line{ margin:4px 0 0; font-size:14px; line-height:1.7; color:#fff; text-wrap:pretty; }
  .sake-pick-note{ margin:6px 0 0; font-size:12.5px; line-height:1.7; color:rgba(242,238,227,.8); }

  /* ===== 見出し・ほかのメニュー ===== */
  .menu-sec-label{ font-size:13.5px; font-weight:700; letter-spacing:.06em; color:var(--shu-pale); margin:16px 0 8px; }
  .menu-sec-label:first-child{ margin-top:0; }
  .other-row{ display:flex; flex-wrap:wrap; gap:6px 8px; }
  .other-chip{ font-size:13.5px; color:#fff; background:rgba(242,238,227,.08); border:1px solid rgba(242,238,227,.2); border-radius:999px; padding:4px 12px; line-height:1.5; }
  .menu-more-note{ margin:10px 0 0; font-size:12.5px; line-height:1.7; color:rgba(242,238,227,.8); }

  /* ===== こだわりの一品: 一言 + 番号つきのポイント ===== */
  .mp-catch{ margin:0 0 10px !important; font-family:var(--font-mincho); font-weight:700; font-size:17px !important; line-height:1.6 !important; color:var(--kinari); text-wrap:balance; }
  .mp-list{ list-style:none; margin:0; padding:0; display:grid; gap:10px; }
  .mp-item{ display:flex; gap:10px; align-items:flex-start; }
  .mp-no{ flex:0 0 24px; height:24px; margin-top:1px; border-radius:50%; background:var(--shu); color:#fff; font-size:13px; font-weight:700; display:flex; align-items:center; justify-content:center; }
  .mp-body{ flex:1; min-width:0; }
  .mp-head{ font-size:15.5px; font-weight:700; line-height:1.5; color:var(--kinari); }
  .menu-story p.mp-text{ margin:2px 0 0; font-size:14.5px; line-height:1.8; }
  .mp-chips{ display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .mp-chip{ font-size:12.5px; font-weight:700; color:var(--shu-pale); border:1px solid rgba(241,220,213,.55); border-radius:999px; padding:2px 10px; }
  .menu-story p.mp-foot{ margin:10px 0 0; font-size:14px; color:rgba(242,238,227,.9); }

  /* ===== 瓶をふる ===== */
  .fish-hero{ position:relative; }
  .fish-hero.shakeable img{ cursor:pointer; -webkit-tap-highlight-color:transparent; transform-origin:50% 90%; }
  .shake-hint{ font-size:13px; color:var(--shu-pale); margin:-2px 0 8px; letter-spacing:.04em; animation:hintPulse 1.8s ease-in-out infinite; }
  @keyframes hintPulse{ 0%,100%{ opacity:.65 } 50%{ opacity:1 } }
  .fish-hero img.shaking{ animation:jarShake .95s cubic-bezier(.36,.07,.19,.97) both; }
  @keyframes jarShake{
    0%{ transform:rotate(0) translateY(0) } 10%{ transform:rotate(-14deg) translateY(-4px) } 22%{ transform:rotate(13deg) translateY(2px) }
    34%{ transform:rotate(-12deg) translateY(-4px) } 46%{ transform:rotate(11deg) translateY(2px) } 58%{ transform:rotate(-8deg) }
    70%{ transform:rotate(6deg) } 82%{ transform:rotate(-3deg) } 100%{ transform:rotate(0) } }
  .shake-bit{ position:absolute; width:34px; height:34px; margin-left:-17px; line-height:0; filter:drop-shadow(0 2px 3px rgba(0,0,0,.45)); pointer-events:none; opacity:0; animation:bitFly 1.7s ease-out both; }
  @keyframes bitFly{
    0%{ opacity:0; transform:translate(0,10px) scale(.5) rotate(0) }
    15%{ opacity:1 }
    60%{ opacity:1; transform:translate(var(--dx),-52px) scale(1.15) rotate(var(--rot)) }
    100%{ opacity:0; transform:translate(calc(var(--dx) * 1.3),-30px) scale(1) rotate(calc(var(--rot) * 1.4)) } }

  /* ===== 料理画面から、ほかの仲間の画面へ ===== */
  .menu-friends{ display:flex; align-items:center; gap:8px; margin-top:12px; padding-top:10px; border-top:1px solid rgba(242,238,227,.14); flex-wrap:wrap; }
  .friend-label{ font-size:12.5px; color:rgba(242,238,227,.8); margin-right:2px; }
  .friend-btn{ width:40px; height:40px; padding:4px; border-radius:50%; cursor:pointer; background:rgba(242,238,227,.12); border:1px solid rgba(242,238,227,.35); display:flex; align-items:center; justify-content:center; }
  .friend-btn img{ max-width:100%; max-height:100%; object-fit:contain; }
  .friend-btn:active{ transform:scale(.9); }

  /* ===== こだわりを、順に浮かび上がらせる ===== */
  .menu-item.open .menu-more .rv{ animation:rvIn .55s cubic-bezier(.2,.7,.2,1) both; animation-delay:var(--d,0ms); }
  @keyframes rvIn{ from{ opacity:0; transform:translateY(10px) } to{ opacity:1; transform:none } }
  .menu-item.open .menu-more .mp-no{ animation:noPop .5s cubic-bezier(.3,1.6,.5,1) both; animation-delay:var(--d,0ms); }
  @keyframes noPop{ from{ transform:scale(.3) } to{ transform:scale(1) } }
  .menu-item.open .menu-more .mp-chip{ animation:chipIn .5s cubic-bezier(.3,1.5,.5,1) both; animation-delay:var(--d,0ms); }
  @keyframes chipIn{ 0%{ opacity:0; transform:scale(.7) } 60%{ background:rgba(189,70,48,.55); color:#fff } 100%{ opacity:1; transform:scale(1) } }
  @media (prefers-reduced-motion: reduce){
    .menu-item.open .menu-more .rv, .menu-item.open .menu-more .mp-no, .menu-item.open .menu-more .mp-chip, .shake-hint, .fish-hero img.shaking, .shake-bit{ animation:none !important; }
  }

  /* ===== 切り絵風アイコン ===== */
  .ico{ display:inline-block; width:1.15em; height:1.15em; vertical-align:-.2em; margin-right:.38em; }
  .ico svg{ display:block; width:100%; height:100%; }
  .ico.turn{ transform:rotate(90deg); }
  .flip-card-front .hint .ico{ width:1.3em; height:1.3em; }

  /* ===== 捕まえたときの演出(魚ごと) ===== */
  .aqua-fish[class*="cj-"]{ transform-origin:50% 55%; }
  .cj-maguro{ animation:cjMaguro 1s cubic-bezier(.3,.6,.4,1) both; }
  @keyframes cjMaguro{ 0%{ translate:0 0; rotate:0deg; scale:1 } 12%{ scale:1.12 .88 } 40%{ translate:0 -92px; rotate:calc(var(--dir,1) * -16deg); scale:1.22 } 60%{ translate:0 -100px; rotate:calc(var(--dir,1) * 10deg); scale:1.2 } 85%{ translate:0 4px; rotate:0deg; scale:1.1 .9 } 100%{ translate:0 0; rotate:0deg; scale:1 } }
  .cj-amaebi{ animation:cjEbi .85s ease-in-out both; }
  @keyframes cjEbi{ 0%{ translate:0 0; rotate:0deg; scale:1 } 18%{ scale:.82 1.12; translate:0 4px } 55%{ translate:0 -56px; rotate:calc(var(--dir,1) * 200deg); scale:1.15 } 100%{ translate:0 0; rotate:calc(var(--dir,1) * 360deg); scale:1 } }
  .cj-kanpachi{ animation:cjKan .75s cubic-bezier(.2,.8,.3,1) both; }
  @keyframes cjKan{ 0%{ translate:0 0; scale:1 } 15%{ translate:calc(var(--dir,1) * -10px) 0; scale:.92 1.06 } 45%{ translate:calc(var(--dir,1) * 70px) -6px; scale:1.3 .88 } 100%{ translate:0 0; scale:1 } }
  .cj-hirame{ animation:cjHira .9s ease-in-out both; }
  @keyframes cjHira{ 0%{ scale:1 1; translate:0 0 } 30%{ scale:1 -.15; translate:0 -14px } 55%{ scale:1 -1; translate:0 -10px } 80%{ scale:1 1.1; translate:0 6px } 100%{ scale:1 1; translate:0 0 } }
  .cj-saba{ animation:cjSaba .85s linear both; }
  @keyframes cjSaba{ 0%{ rotate:0deg; scale:1 } 10%{ rotate:-9deg } 20%{ rotate:9deg } 30%{ rotate:-9deg } 40%{ rotate:9deg; scale:1.12 } 50%{ rotate:-7deg } 60%{ rotate:7deg } 70%{ rotate:-5deg } 80%{ rotate:4deg } 100%{ rotate:0deg; scale:1 } }
  .cj-madai{ animation:cjMadai 1.05s ease-in-out both; }
  @keyframes cjMadai{ 0%{ translate:0 0; scale:1; rotate:0deg } 45%{ translate:0 -26px; scale:1.28; rotate:calc(var(--dir,1) * -4deg) } 70%{ translate:0 -26px; scale:1.28; rotate:calc(var(--dir,1) * 3deg) } 100%{ translate:0 0; scale:1; rotate:0deg } }
  .cj-anago{ animation:cjAna .9s ease-in-out both; }
  @keyframes cjAna{ 0%{ rotate:0deg; scale:1 } 14%{ rotate:-14deg; scale:1.06 .92 } 30%{ rotate:12deg; scale:1.1 .9 } 46%{ rotate:-10deg; scale:1.06 .94 } 62%{ rotate:8deg } 80%{ rotate:-4deg } 100%{ rotate:0deg; scale:1 } }
  .cj-geso{ animation:cjGeso .9s cubic-bezier(.3,.7,.3,1) both; }
  @keyframes cjGeso{ 0%{ translate:0 0; scale:1 } 18%{ scale:.78 1.18; translate:0 6px } 50%{ translate:calc(var(--dir,1) * -34px) -56px; scale:1.12 .9 } 100%{ translate:0 0; scale:1 } }
  .cj-nazobin{ animation:cjBin .85s ease-in-out both; transform-origin:50% 90%; }
  @keyframes cjBin{ 0%{ rotate:0deg; translate:0 0 } 10%{ rotate:-12deg } 20%{ rotate:12deg } 30%{ rotate:-10deg } 40%{ rotate:10deg } 55%{ translate:0 -34px; rotate:0deg; scale:1.12 } 80%{ translate:0 2px; scale:1.05 .94 } 100%{ translate:0 0; rotate:0deg; scale:1 } }
  .cj-baigai{ animation:cjBai .95s ease-in-out both; }
  @keyframes cjBai{ 0%{ scale:1; rotate:0deg } 18%{ scale:.72; rotate:calc(var(--dir,1) * -8deg) } 60%{ scale:.72; rotate:calc(var(--dir,1) * 6deg) } 80%{ scale:1.22; rotate:0deg } 100%{ scale:1; rotate:0deg } }

  .fx{ position:absolute; pointer-events:none; z-index:5; opacity:0; animation:fxFly 1.1s ease-out both; margin:-4px 0 0 -4px; }
  @keyframes fxFly{ 0%{ opacity:0; translate:0 0; scale:.4 } 15%{ opacity:1 } 100%{ opacity:0; translate:var(--dx) calc(var(--up) * -1); scale:1.15 } }
  .fx.k-drop{ border-radius:50% 50% 50% 50% / 62% 62% 38% 38%; background:#CFE3F2; animation-name:fxDrop; animation-duration:1s; }
  @keyframes fxDrop{ 0%{ opacity:0; translate:0 0; scale:.5 } 12%{ opacity:1 } 45%{ translate:calc(var(--dx) * .6) calc(var(--up) * -1.5) } 100%{ opacity:0; translate:var(--dx) calc(var(--down) * 1.6); scale:.9 } }
  .fx.k-bubble{ border-radius:50%; border:2px solid #DCEBF5; background:rgba(220,235,245,.18); }
  .fx.k-line{ border-radius:2px; background:linear-gradient(90deg, rgba(239,235,221,0), #EFEBDD); height:3px; animation-duration:.55s; }
  .fx.k-sand{ border-radius:50%; background:#CDBFA3; }
  .fx.k-spark{ background:#EFEBDD; clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%); }
  .fx.k-star{ background:#F2D9A2; clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%); animation-duration:1.3s; }
  .fx.k-ink{ border-radius:50%; background:#1F2744; opacity:.0; animation-duration:1s; }
  @keyframes fxInk{ 0%{ opacity:0; scale:.3 } 20%{ opacity:.85 } 100%{ opacity:0; scale:1.5 } }
  .fx.k-ink{ animation-name:fxInk; translate:var(--dx) calc(var(--up) * -1); }
  @media (prefers-reduced-motion: reduce){ .fx, .aqua-fish[class*="cj-"]{ animation:none !important; } }
  .ico-hand-fix{ }
  .tap-hint .ico, .shake-hint .ico, .flip-card-front .hint .ico{ width:1.9em; height:1.9em; vertical-align:-.7em; margin:-.2em .35em -.2em 0; }

  /* ===== 文字だけのロゴ ===== */
  .seal-text{
    display:flex; align-items:center; justify-content:center; width:40px; height:40px; border-radius:8px;
    background:var(--shu); color:var(--kinari); font-family:var(--font-mincho); font-weight:700; font-size:24px; line-height:1;
    box-shadow: inset 0 0 0 2px rgba(239,235,221,.55);
  }
  .op-logo-text{ opacity:0; transition:opacity 1s ease-in-out; text-align:center; color:var(--kinari); text-shadow:0 2px 14px rgba(0,0,0,.55); }
  .op-name{ display:block; font-family:var(--font-mincho); font-weight:700; font-size:clamp(40px, 13vw, 58px); letter-spacing:.22em; margin-right:-.22em; line-height:1.2; }
  .op-line{ display:block; width:56px; height:2px; margin:14px auto 12px; background:var(--shu-pale); border-radius:2px; }
  .op-sub{ display:block; font-family:var(--font-mincho); font-size:clamp(15px, 4.6vw, 19px); letter-spacing:.3em; margin-right:-.3em; opacity:.92; }

  /* ===== スマホでの折り返し ===== */
  .about-v, .quiz-btn, .quiz-result-text, .story-trivia p, .menu-notice, .mp-text, .mp-head, .mp-catch, .flip-card-front p, .flip-card-back p, .story-lead{ text-wrap:balance; }
  .quiz-btn{ text-align:center; line-height:1.5; }
  /* 「ほかの仲間たち」: 見出しは1行、魚のアイコンは必ず1行に収める */
  .menu-friends{ flex-wrap:wrap; gap:8px; }
  .friend-label{ flex:0 0 100%; margin:0 0 -2px; }
  .friend-btn{ flex:0 1 42px; min-width:0; width:auto; height:auto; aspect-ratio:1/1; }
  /* 飾り包丁の3つのラベルは、1行に */
  .mp-chips{ flex-wrap:wrap; gap:5px; }
  .mp-chip{ white-space:nowrap; font-size:clamp(10.5px, 3.1vw, 12.5px); padding:2px clamp(5px, 1.8vw, 10px); }
  /* 長い選択肢は、縦に並べて1行で読めるように */
  .quiz-options.stack{ flex-direction:column; }
  .quiz-options.stack .quiz-btn{ padding:12px 14px; }

.mp-text, .mp-head{ overflow-wrap:anywhere; min-width:0; }
</style>
</head>
<body>

<div class="bg-video-wrap">
  <!-- OP動画: 初回のみ読み込む(preload=none。JSが再生を開始) -->
  <video id="bg-video-op" muted playsinline preload="none">
    <source src="title3.mp4" type="video/mp4">
  </video>
  <video id="bg-video-main-1" muted playsinline preload="auto">
    <source src="back.mp4" type="video/mp4">
  </video>
  <video id="bg-video-main-2" muted playsinline preload="auto">
    <source src="back.mp4" type="video/mp4">
  </video>
  <div class="bg-video-overlay"></div>
</div>

<div class="app">
  <header id="main-header" style="display: none;">
    <div class="brand" onclick="goScreen('select')">
      
      <div><h1>美乃寿し のお魚たち</h1></div>
    </div>
    <button id="header-back-btn" class="header-back-btn" onclick="goBack()" style="display: none;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      戻る
    </button>
  </header>
  <main>

    <!-- Screen: オープニング -->
    <section class="screen active" data-screen="op" onclick="finishOp()">
      <div class="op-wrapper">
        <div id="op-logo" class="op-logo-text" role="img" aria-label="美乃寿し"><span class="op-name">美乃寿し</span></div>
        <p class="skip-telop">画面をタップしてスキップ</p>
      </div>
    </section>

    <!-- Screen: サカナ選択 -->
    <section class="screen" data-screen="select">
      <div class="talk-head select-talk" id="selectHead">
        <div class="talk-fish-wrap"><img class="talk-fish" src="maguro.webp" alt=""></div>
        <div class="talk-bubble compact" role="button" tabindex="0" aria-label="お魚の案内(タップで次へ)">
          <span class="talk-main" aria-live="polite"></span>
        </div>
        <span class="air a1"></span><span class="air a2"></span><span class="air a3"></span>
      </div>
      <button class="collect-counter" id="collectCounter" type="button" onclick="goScreen('result')">
        捕まえた魚 <b id="caughtCount">0</b> / <span id="totalCount">0</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </button>
      <div class="aqua-wrap" id="aquaWrap"></div>
    </section>

    <!-- Screen: 魚詳細: 問い → 答え → 味わい -->
    <section class="screen" data-screen="detail">
      <div class="fish-hero" id="detailHero">
        <img id="detailImg" src="" alt="">
        <div class="fish-header">
          <span class="name" id="detailName"></span>
        </div>
        <p class="story-lead" id="detailLead"></p>
      </div>

      <article class="fish-story">
        <!-- 1. 問い(クイズ/めくりカード) -->
        <div class="story-highlight" id="detailHighlightBlock"></div>

        <!-- 2. 答え・豆知識 -->
        <div class="story-trivia" id="detailTriviaBlock">
          <div class="trivia-label">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
            豆知識
          </div>
          <p id="detailTrivia"></p>
          <div class="trivia-illustration-wrap" id="detailIllWrap">
            <div class="ill-box"><img id="detailIllImg" src="" alt=""><span class="zoom-badge" aria-hidden="true">拡大</span></div>
            <div class="trivia-illustration-caption" id="detailIllCaption"></div>
            <ul class="ill-legend" id="detailIllLegend" hidden></ul>
          </div>
        </div>

        <!-- 見分けカード(該当する魚のみ) -->
        <div class="story-compare" id="detailCompareBlock" hidden></div>

        <!-- 3. 味わい -->
        <div class="story-taste">
          <h4 class="taste-title" id="detailAboutTitle">お魚のこと</h4>
          <div class="about" id="detailAbout"></div>
          <div class="parts" id="detailParts" hidden></div>
        </div>

        <!-- 店主のひとこと(入力がある魚のみ) -->
        <div class="story-owner" id="detailOwnerBlock" hidden>
          <div class="owner-label">店主のひとこと</div>
          <p id="detailOwner"></p>
        </div>
      </article>

      <button class="btn btn-primary" style="width: 100%; margin-top: 12px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center;" onclick="goToMenu()">
        <span id="toMenuLabel">この魚の、おすすめの一品を見る</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </section>

    <!-- Screen: メニュー・お酒 -->
    <section class="screen" data-screen="menu">
      <h2 class="title" style="line-height: 1.6; word-break: keep-all;" id="menuTitle"></h2>

      <div class="menu-notice">※仕入れの都合により、内容が変わったり、品切れとなる場合がございます。あらかじめご了承ください。</div>
      <div id="menuScreenList"></div>

      <div class="btn-row" style="margin-top: 32px; flex-direction: column;">
        <button class="btn btn-primary" style="width:100%" id="finishButton" onclick="handleFinishClick()"></button>
      </div>
    </section>

    <!-- Screen: アンケート(初回のみ) -->
    <section class="screen" data-screen="survey">
      <div class="talk-head" id="surveyHead">
        <div class="talk-fish-wrap"><img class="talk-fish" id="surveyFish" src="maguro.webp" alt=""></div>
        <div class="talk-bubble" id="surveyBubble" aria-live="polite">
          <span class="talk-main" id="bubbleMain"></span>
          <span class="talk-sub">タップするだけです</span>
        </div>
        <span class="air a1"></span><span class="air a2"></span><span class="air a3"></span>
      </div>

      <div class="survey-q" id="group-gender" hidden>
        <p class="q-label">まずは、どちらの方でしょう？</p>
        <div class="chip-row">
          <label class="chip"><input type="radio" name="s-gender" value="男性" onchange="onSurveyChange()"><span class="chip-box">男性</span></label>
          <label class="chip"><input type="radio" name="s-gender" value="女性" onchange="onSurveyChange()"><span class="chip-box">女性</span></label>
          <label class="chip"><input type="radio" name="s-gender" value="無回答" onchange="onSurveyChange()"><span class="chip-box">内緒</span></label>
        </div>
      </div>

      <div class="survey-q" id="group-age" hidden>
        <p class="q-label">年齢は、どのあたりでしょう？</p>
        <div class="chip-row">
          <label class="chip"><input type="radio" name="s-age" value="34歳以下" onchange="onSurveyChange()"><span class="chip-box">34歳以下</span></label>
          <label class="chip"><input type="radio" name="s-age" value="35歳以上" onchange="onSurveyChange()"><span class="chip-box">35歳以上</span></label>
        </div>
      </div>

      <div id="surveyFoot" hidden>
        <p class="note">お店づくりの参考にさせていただきます</p>

        <div class="btn-row" style="flex-direction: column;">
          <button class="btn btn-ghost" id="surveyBackBtn" style="width:100%" disabled onclick="goScreen('select')">水槽をのぞく</button>
        </div>
      </div>
    </section>

    <!-- Screen: 最後のひとこと(任意・1問だけ) -->
    <section class="screen" data-screen="farewell">
      <div class="talk-head" id="farewellHead">
        <div class="talk-fish-wrap"><img class="talk-fish" src="maguro.webp" alt=""></div>
        <div class="talk-bubble" role="status" aria-live="polite">
          <span class="talk-main"></span>
        </div>
        <span class="air a1"></span><span class="air a2"></span><span class="air a3"></span>
      </div>

      <div id="farewellForm" hidden>
        <textarea id="farewellText" class="note-input" rows="4" maxlength="200" placeholder="どんなことでも、お気軽にどうぞ" aria-label="お店へのひとこと"></textarea>
        <p class="note">お名前や連絡先は、書かなくて大丈夫です</p>
        <div class="btn-row" style="flex-direction: column;">
          <button class="btn btn-primary" id="farewellSend" type="button" style="width:100%" disabled>送る</button>
          <button class="btn btn-ghost" id="farewellSkip" type="button" style="width:100%">このまま終わる</button>
        </div>
      </div>

      <div id="farewellDone" hidden>
        <div class="btn-row" style="flex-direction: column;">
          <button class="btn btn-primary" type="button" style="width:100%" onclick="goScreen('select')">最初の画面に戻る</button>
        </div>
      </div>
    </section>

    <!-- Screen: 結果 -->
    <section class="screen" data-screen="result">
      <h2 class="title">ここまでの結果</h2>
      <div class="result-card">
        <p class="result-label">捕まえた魚</p>
        <p class="result-num"><span id="resCaught">0</span><small>/ <span id="resTotal">0</span></small></p>
        <p class="result-sub" id="resMsg"></p>
      </div>
      <p class="result-closing">NO FISH, NO LIFE.</p>
      <div class="result-actions">
        <button class="btn btn-primary" id="orderBtn" type="button" hidden onclick="goOrder()">注文する</button>
        <button class="btn btn-ghost" type="button" onclick="goScreen('select')">もっと魚を見る</button>
      </div>
    </section>

  </main>
</div>

<!-- 冒頭の質問: 話している間は、魚と吹き出しを画面いっぱいに大きく表示し、話しおわると上に小さく移る -->
<div class="stage-head" id="surveyStage" data-orient="v" hidden>
  <div class="stage-inner">
    <div class="talk-fish-wrap"><img class="talk-fish" src="maguro.webp" alt=""></div>
    <div class="talk-bubble" role="button" tabindex="0" aria-live="polite" aria-label="お魚の案内(タップで次へ)">
      <span class="talk-main"></span>
      <span class="talk-sub"></span>
    </div>
  </div>
  <span class="air a1"></span><span class="air a2"></span><span class="air a3"></span>
</div>

<!-- 最後のひとこと: 話している間は、画面いっぱいに大きく -->
<div class="stage-head" id="farewellStage" data-orient="v" hidden>
  <div class="stage-inner">
    <div class="talk-fish-wrap"><img class="talk-fish" src="maguro.webp" alt=""></div>
    <div class="talk-bubble" role="button" tabindex="0" aria-live="polite" aria-label="お魚の言葉(タップで次へ)">
      <span class="talk-main"></span>
      <span class="talk-sub"></span>

const OP_FIRST_VISIT_ONLY = false;                // true: OPは端末ごとに初回だけ表示 / false: 毎回表示

const GAS_ENABLED = /^https:\/\//.test(GAS_URL);
const REDUCED_MOTION = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ============ 保存(失敗しても動くようにする) ============ */
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
  remove(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
function loadJSON(k, fallback){
  try{ const v = JSON.parse(store.get(k)); return v == null ? fallback : v; }catch(e){ return fallback; }
}

// 動作確認用: URLに ?reset を付けると、捕まえた魚やOP表示済みの記録を消します
if (/[?&]reset\b/.test(location.search)) {
  ['minozushi_survey','minozushi_caught','minozushi_op_seen','minozushi_farewell_done'].forEach(k => store.remove(k));
}

let fishDeviceId = store.get('minozushi_device_id');
if (!fishDeviceId) {
  fishDeviceId = 'mdev_' + Math.random().toString(36).slice(2, 11);
  store.set('minozushi_device_id', fishDeviceId);
}

function sendLog(action, extra) {
  if (!GAS_ENABLED) return;
  const payload = Object.assign({ shop: 'minozushi', deviceId: fishDeviceId, action: action }, extra || {});
  fetch(GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify(payload)
  }).catch(err => console.log('送信エラー:', err));
}

/* ============ 背景動画(本編) ============ */
let isMainVideoPlaying = false;
function startSeamlessLoop() {
  if (isMainVideoPlaying) return;
  isMainVideoPlaying = true;

  const vid1 = document.getElementById('bg-video-main-1');
  const vid2 = document.getElementById('bg-video-main-2');
  const fadeTime = 1.5;
  if (!vid1 || !vid2) return;

  vid1.currentTime = 0;
  vid1.play().catch(e => console.log('Video play error:', e));
  vid1.classList.add('show-bg');

  const checkTime = (currentVid, nextVid) => {
    if (currentVid.duration > 0 && currentVid.currentTime >= currentVid.duration - fadeTime) {
      if (nextVid.paused) {
        nextVid.currentTime = 0;
        nextVid.play().catch(e => console.log('Video play error:', e));
        nextVid.classList.add('show-bg');
        currentVid.classList.remove('show-bg');
      }
    }
    if (currentVid.currentTime >= currentVid.duration - 0.2) currentVid.pause();
  };
  vid1.addEventListener('timeupdate', () => checkTime(vid1, vid2));
  vid2.addEventListener('timeupdate', () => checkTime(vid2, vid1));
}

/* ============ 画面遷移 ============ */
function goScreen(name, isBack = false){
  // 冒頭の質問(必須)に答えるまでは、魚の画面へ進ませず、質問の画面に戻す
  if (name === 'select' && !surveyProfile && !surveyReview) { setSurveyFish(currentFishId || 'maguro'); name = 'survey'; }
  const currentScreen = document.querySelector('.screen.active')?.dataset.screen;

  if (!isBack && currentScreen && currentScreen !== name && currentScreen !== 'op') {
    screenHistory.push(currentScreen);
  }

  const backBtn = document.getElementById('header-back-btn');
  if (backBtn) {
    if (name === 'select' || name === 'op' || (name === 'survey' && !surveyReview)) {
      backBtn.style.display = 'none';
      screenHistory = [];
    } else {
      backBtn.style.display = 'flex';
    }
  }

  document.querySelectorAll('.screen').forEach(el => {
    el.classList.toggle('active', el.dataset.screen === name);
  });
  window.scrollTo({ top: 0, behavior: REDUCED_MOTION ? 'auto' : 'smooth' });

  const opVideo = document.getElementById('bg-video-op');
  const header = document.getElementById('main-header');

  if (name === 'op') {
    if (opVideo) opVideo.classList.add('show-bg');
    if (header) header.style.display = 'none';
  } else {
    if (opVideo) { opVideo.classList.remove('show-bg'); try{ opVideo.pause(); }catch(e){} }
    startSeamlessLoop();
    if (header) header.style.display = 'flex';
  }

  if (name === 'select') { refreshSelect(); startAquarium(); } else { stopAquarium(); }
  if (name === 'result') renderResult();
  if (name === 'survey') playSurveyIntro();
  if (name === 'select') startSelectTalk(); else selectTalk.stop();
  if (name === 'farewell') playFarewellIntro(); else { farewellTalk.stop(); farewellStageCtl.hide(); }
  if (name !== 'survey') { surveyTalk.stop(); surveyStageCtl.hide(); }
}

function goBack() {
  if (screenHistory.length > 0) {
    goScreen(screenHistory.pop(), true);
  } else {
    goScreen('select', true);
  }
}

/* ============ OP ============
   当初と同じ流れ: 動画を最後まで再生 → ロゴを表示(1秒かけて) → 3秒後に水槽へ。タップでスキップ。
   ※動画が再生できない・終わらない場合に備えて、ロゴを出して進む保険を入れています。 */
let opTimer = null, opGuard = null, opLogoShown = false;

function showOpLogo(){
  if (opLogoShown) return;
  opLogoShown = true;
  document.getElementById('op-logo').style.opacity = '1';
  opTimer = setTimeout(finishOp, 3000);
}

function startOp(){
  goScreen('op');
  const v = document.getElementById('bg-video-op');
  v.addEventListener('ended', showOpLogo);
  v.addEventListener('error', showOpLogo);
  const sources = v.querySelectorAll('source');
  if (!sources.length) showOpLogo();                // 動画ファイルが指定されていない
  sources.forEach(sr => sr.addEventListener('error', showOpLogo));   // 動画が読み込めない
  try {
    v.load();
    const p = v.play();
    if (p && p.catch) p.catch(showOpLogo);          // 自動再生が止められた場合
  } catch(e) { showOpLogo(); }
  opGuard = setTimeout(showOpLogo, 10000);          // 動画が終わらない場合の保険
}

function finishOp(){
  clearTimeout(opTimer); clearTimeout(opGuard);
  if (document.querySelector('.screen.active')?.dataset.screen === 'op') {
    store.set('minozushi_op_seen', '1');
    goScreen('select');
  }
}

  madai:    { ms: 1100, fx: [['star', 9, 200]] },                       // ゆったり浮かんで、金の星
  anago:    { ms: 950,  fx: [['bubble', 5, 100]] },                     // くねくねっと身をよじる
  geso:     { ms: 950,  fx: [['ink', 5, 40]] },                         // 墨をぷしゅっ
  nazobin:  { ms: 900,  fx: [['bubble', 8, 120]] },                     // ふたがカタカタ、ぽんと跳ねる
  baigai:   { ms: 950,  fx: [] }                                        // ぎゅっと殻にこもって、ぽんっ

function spawnFx(item, kind, n) {
  const dir = item.face > 0 ? 1 : -1;
  for (let i = 0; i < n; i++) {
    const p = document.createElement('span');
    p.className = 'fx k-' + kind;
    const a = (i / n) * Math.PI * 2 + Math.random() * 0.6;
    const r = 26 + Math.random() * 34;
    let dx = Math.cos(a) * r, up = 30 + Math.random() * 40, down = 20 + Math.random() * 30, top = 50, left = 50, size = 7 + Math.random() * 6;
    if (kind === 'drop')   { top = 40; dx = (Math.random() - 0.5) * 120; size = 6 + Math.random() * 5; }
    if (kind === 'bubble') { top = 55; dx = (Math.random() - 0.5) * 70; up = 50 + Math.random() * 40; size = 8 + Math.random() * 8; left = 30 + Math.random() * 40; }
    if (kind === 'line')   { top = 28 + i * 9; left = 50 - dir * 40; dx = -dir * (50 + Math.random() * 30); size = 34 + Math.random() * 26; }
    if (kind === 'sand')   { top = 88; dx = (Math.random() - 0.5) * 130; up = 14 + Math.random() * 18; size = 9 + Math.random() * 9; }
    if (kind === 'spark')  { size = 9 + Math.random() * 7; dx = Math.cos(a) * (40 + Math.random() * 40); up = Math.sin(a) * 50; }
    if (kind === 'star')   { size = 11 + Math.random() * 9; dx = Math.cos(a) * (46 + Math.random() * 40); up = Math.sin(a) * 44 + 10; }
    if (kind === 'ink')    { top = 55; left = 50 - dir * 30; dx = -dir * (20 + Math.random() * 60); size = 18 + Math.random() * 16; up = (Math.random() - 0.5) * 40; }
    p.style.cssText = `left:${left}%;top:${top}%;width:${size}px;height:${kind === 'line' ? 3 : size}px;--dx:${dx.toFixed(0)}px;--up:${up.toFixed(0)}px;--down:${down.toFixed(0)}px;animation-delay:${(i * 35).toFixed(0)}ms`;
    item.el.appendChild(p);
    setTimeout(() => p.remove(), 1700);
  }
}
function onFishTap(item){
  if (item.busy) return;
  // 捕まえた魚も、はじめての魚も、魚ごとの演出のあと、詳細画面へ

/* ============ 魚ごとの泳ぎ方 ============
   type: cruise=回遊 / shrimp=エビの後ずさり跳び / flat=海底の平たい魚 / eel=くねくね泳ぎ / squid=ジェット噴射 / float=ぷかぷか / snail=はう
   speed=速さ(px/フレーム) turn=1フレームで曲がれる最大の角度 wander=ふらつき band=泳ぐ高さの範囲(0=上〜1=下) */
const SWIM = {
  maguro:   { type: 'cruise', speed: 2.6, turn: 0.022, wander: 0.012 },                                   // 止まらず、大きな弧を描いて泳ぎ続ける
  kanpachi: { type: 'cruise', speed: 1.5, turn: 0.05, wander: 0.025, burst: { speed: 4.8, frames: 38, chance: 0.0035 } },   // ふだんは中くらい、ときどき急加速
  saba:     { type: 'cruise', speed: 2.0, turn: 0.09, wander: 0.07, wiggle: { amp: 7, freq: 0.5 }, band: [0.05, 0.6] },     // 細かくジグザグ、体をくねらせて素早く
  madai:    { type: 'cruise', speed: 0.8, turn: 0.012, wander: 0.006, bob: { amp: 0.28, freq: 0.02 }, band: [0.25, 0.75] }, // ゆったり優雅
  amaebi:   { type: 'shrimp' },
  hirame:   { type: 'flat' },
  anago:    { type: 'eel' },
  geso:     { type: 'squid' },
  nazobin:  { type: 'float' },
  baigai:   { type: 'snail' }
};
const rnd2 = (a, b) => a + Math.random() * (b - a);
const clampN = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const angDiffR = (to, from) => { let d = to - from; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; };
const angDiffD = (to, from) => { let d = (to - from) % 360; if (d > 180) d -= 360; if (d < -180) d += 360; return d; };
const DEG = 180 / Math.PI;

function aquaBounds(it) {
  const w = window.innerWidth || 400, h = window.innerHeight || 800;
  const counter = document.getElementById('collectCounter');
  const top = counter ? counter.offsetTop + counter.offsetHeight + 12 : 60;
  return { minX: -30, maxX: w - it.w + 30, minY: top, maxY: Math.max(top + 40, h - it.h - 16) };
}
// 向いている方向に、体を少し上げ下げ(魚は、進む向きに鼻先を向ける)
const pitchOf = (it, vx, vy, k = 1) => clampN(it.face * Math.atan2(vy, Math.max(0.3, Math.abs(vx))) * DEG * k, -30, 30);
const turnAtWalls = (it, b) => {
  if (it.x <= b.minX + 6 && it.face < 0) it.face = 1;
  else if (it.x >= b.maxX - 6 && it.face > 0) it.face = -1;
};

const STEP = {
  // --- 回遊魚: 進む向き(heading)をゆっくり変えながら、止まらず泳ぐ。壁の手前で大きく弧を描いて向きを変える ---
  cruise(f, dt, b) {
    const c = f.cfg; f.t += dt;
    f.heading += (Math.random() - 0.5) * c.wander * dt * 2;
    const range = b.maxY - b.minY;
    const top = b.minY + range * (c.band ? c.band[0] : 0.03), bot = b.minY + range * (c.band ? c.band[1] : 0.97);
    let ax = 0, ay = 0;
    const wm = Math.min(110, (b.maxX - b.minX) * 0.3);
    if (f.x < b.minX + wm) ax = 1; else if (f.x > b.maxX - wm) ax = -1;
    if (f.y < top) ay = 1; else if (f.y > bot) ay = -1;
    if (ax || ay) {
      const hx = ax || (Math.cos(f.heading) >= 0 ? 1 : -1);
      const want = Math.atan2(ay * 0.7, hx);
      const d = angDiffR(want, f.heading), m = c.turn * 1.6 * dt;     // 壁ぎわでは、少し小回りがきく
      f.heading += clampN(d, -m, m);
    } else if (Math.abs(Math.sin(f.heading)) > 0.5) {
      // ほぼ水平に泳ぐ(急な上下は、ゆるやかに戻す)。壁を避けている間は、この補正をしない
      f.heading += angDiffR(Math.cos(f.heading) >= 0 ? 0 : Math.PI, f.heading) * 0.02 * dt;
    }
    let s = c.speed;
    if (c.burst) {
      if (!f.burst && Math.random() < c.burst.chance * dt) f.burst = c.burst.frames;
      if (f.burst > 0) { f.burst -= dt; s = c.burst.speed; }
    }
    f.sp += (s - f.sp) * 0.08 * dt;
    f.vx = Math.cos(f.heading) * f.sp; f.vy = Math.sin(f.heading) * f.sp;
    f.x += f.vx * dt; f.y += f.vy * dt;
    if (c.bob) f.y += Math.sin(f.t * c.bob.freq + f.phase) * c.bob.amp * dt;
    if (Math.abs(Math.cos(f.heading)) > 0.25) f.face = Math.cos(f.heading) > 0 ? 1 : -1;
    f.rotT = pitchOf(f, f.vx, f.vy) + (c.wiggle ? Math.sin(f.t * c.wiggle.freq + f.phase) * c.wiggle.amp : 0);
  },

  // --- エビ: ふだんはゆっくり歩くように進み、ときどき、尾をはじいて後ろへピュッと跳ぶ ---
  shrimp(f, dt, b) {
    f.t += dt; f.timer -= dt;
    if (f.mode !== 'flick') {
      f.vx += (f.face * 0.32 - f.vx) * 0.05 * dt;
      f.vy += (0.06 + Math.sin(f.t * 0.012 + f.phase) * 0.16 - f.vy) * 0.03 * dt;
      f.rotT = f.face * (-2 + Math.sin(f.t * 0.05 + f.phase) * 2);
      if (f.timer <= 0) { f.mode = 'flick'; f.timer = 30; f.vx = -f.face * rnd2(7, 10); f.vy = rnd2(-3.4, -1.6); }
    } else {
      const k = Math.pow(0.93, dt); f.vx *= k; f.vy *= k;
      f.rotT = f.face * 16;                                  // 跳ぶとき、体を丸める
      if (f.timer <= 0) { f.mode = 'drift'; f.timer = rnd2(110, 340); }
    }
    f.x += f.vx * dt; f.y += f.vy * dt;
    const range = b.maxY - b.minY;
    if (f.y > b.minY + range * 0.85) f.vy -= 0.05 * dt;     // 沈みすぎたら、少し浮かぶ
    turnAtWalls(f, b);
  },

  // --- ヒラメ: 海底でじっと休み、ときどきゆっくり滑るように移動。たまに、ふわっと浮いて着地 ---
  flat(f, dt, b) {
    f.t += dt; f.timer -= dt;
    const floor = b.maxY;
    if (f.mode === 'rest') {
      f.vx *= Math.pow(0.9, dt); f.y += (floor - f.y) * 0.1 * dt;
      f.rotT = Math.sin(f.t * 0.03 + f.phase) * 1.2;          // 呼吸するように、わずかに揺れる
      if (f.timer <= 0) {
        if (Math.random() < 0.22) { f.mode = 'hop'; f.timer = f.hopLen = 120; f.vx = f.face * 0.8; }
        else { f.mode = 'glide'; f.timer = rnd2(100, 230); if (Math.random() < 0.4) f.face *= -1; }
      }
    } else if (f.mode === 'glide') {
      f.vx += (f.face * 0.6 - f.vx) * 0.04 * dt; f.y += (floor - f.y) * 0.1 * dt;
      f.rotT = Math.sin(f.t * 0.12) * 1.8;                    // ひれを波打たせて進む
      if (f.timer <= 0) { f.mode = 'rest'; f.timer = rnd2(200, 520); }
    } else {
      const p = 1 - f.timer / f.hopLen;
      f.y = floor - Math.sin(p * Math.PI) * 64;
      f.vx += (f.face * 0.9 - f.vx) * 0.05 * dt;
      f.rotT = Math.sin(f.t * 0.3) * 3.5;
      if (f.timer <= 0) { f.mode = 'rest'; f.timer = rnd2(220, 520); f.y = floor; }
    }
    f.x += f.vx * dt;
    turnAtWalls(f, b);
  },

  // --- アナゴ: 海底でじっと休み、ときどき、体を波打たせながらくねくね泳ぐ ---
  eel(f, dt, b) {
    f.t += dt; f.timer -= dt;
    const base = b.maxY - 4;
    if (f.mode === 'rest') {
      f.vx *= Math.pow(0.9, dt); f.y += (base - f.y) * 0.08 * dt;
      f.rotT = Math.sin(f.t * 0.025 + f.phase) * 3;
      if (f.timer <= 0) { f.mode = 'slither'; f.timer = f.slitherLen = rnd2(240, 480); if (Math.random() < 0.5) f.face *= -1; }
    } else {
      const a = Math.min(1, (f.slitherLen - f.timer) / 35, f.timer / 45);
      f.vx += (f.face * 1.0 - f.vx) * 0.05 * dt;
      const ph = f.t * 0.075;
      f.y = base - 32 * a - Math.sin(ph) * 24 * a;
      f.rotT = f.face * clampN(Math.atan2(-Math.cos(ph) * 24 * 0.075 * a * 3, Math.max(0.3, Math.abs(f.vx))) * DEG, -26, 26);
      if (f.timer <= 0) { f.mode = 'rest'; f.timer = rnd2(300, 640); }
    }
    f.x += f.vx * dt;
    turnAtWalls(f, b);
  },

  // --- イカ: 「プシュッ」と噴射して、すーっと進み、速度が落ちたら、また噴射。進む向きに体を向ける ---
  squid(f, dt, b) {
    f.t += dt; f.timer -= dt;
    const k = Math.pow(0.958, dt); f.vx *= k; f.vy *= k;
    f.vy += 0.012 * dt;                                       // 噴射のあいだは、ゆっくり沈む
    if (f.timer <= 0) {
      f.timer = rnd2(70, 160);
      const range = b.maxY - b.minY;
      let hx = Math.random() < 0.5 ? -1 : 1;
      if (f.x < b.minX + 130) hx = 1; else if (f.x > b.maxX - 130) hx = -1;
      const rel = (f.y - b.minY) / range;
      const hy = rel > 0.65 ? -rnd2(0.3, 1.0) : rel < 0.2 ? rnd2(0.3, 0.9) : rnd2(-0.6, 0.6);
      f.heading = Math.atan2(hy, hx);
      const sp = rnd2(5.5, 8);
      f.vx = Math.cos(f.heading) * sp; f.vy = Math.sin(f.heading) * sp;
    }
    f.x += f.vx * dt; f.y += f.vy * dt;
    if (f.x <= b.minX && f.vx < 0) { f.vx *= -1; f.heading = Math.PI - f.heading; }
    if (f.x >= b.maxX && f.vx > 0) { f.vx *= -1; f.heading = Math.PI - f.heading; }
    if (f.y <= b.minY && f.vy < 0) { f.vy *= -1; f.heading = -f.heading; }
    if (f.y >= b.maxY && f.vy > 0) { f.vy *= -1; f.heading = -f.heading; }
    f.face = Math.cos(f.heading) > 0 ? 1 : -1;
    // 絵は「頭が左下」を向いているので、噴射の向きに合わせて、回転させる
    f.rotT = angDiffD(f.heading * DEG, f.face > 0 ? 20.4 : 159.6);
  },

  // --- 瓶: 水に浮かぶブイのように、ぷかぷか上下しながら、ゆっくり漂う。ゆらゆら傾く ---
  float(f, dt, b) {
    f.t += dt;
    f.heading += (Math.random() - 0.5) * 0.01 * dt;
    if (f.x < b.minX + 100) f.heading += angDiffR(0, f.heading) * 0.02 * dt;
    if (f.x > b.maxX - 100) f.heading += angDiffR(Math.PI, f.heading) * 0.02 * dt;
    f.vx = Math.cos(f.heading) * 0.28;
    f.vy = Math.sin(f.t * 0.018 + f.phase) * 0.38 + ((b.minY + (b.maxY - b.minY) * 0.45) - f.y) * 0.0009;
    f.x += f.vx * dt; f.y += f.vy * dt;
    f.rotT = Math.sin(f.t * 0.022 + f.phase) * 7;
  },

  // --- 貝: 海底を、ゆっくり、はうように進む。長く休んでは、また少し進む ---
  snail(f, dt, b) {
    f.t += dt; f.timer -= dt;
    f.y += (b.maxY - f.y) * 0.1 * dt;
    if (f.mode === 'rest') {
      f.vx *= Math.pow(0.9, dt); f.rotT = 0;
      if (f.timer <= 0) { f.mode = 'crawl'; f.timer = rnd2(180, 420); if (Math.random() < 0.35) f.face *= -1; }
    } else {
      f.vx += (f.face * 0.16 - f.vx) * 0.05 * dt;
      f.rotT = Math.sin(f.t * 0.08) * 2.5;
      if (f.timer <= 0) { f.mode = 'rest'; f.timer = rnd2(240, 660); }
    }
    f.x += f.vx * dt;
    turnAtWalls(f, b);
  }
};
const BOTTOM_TYPES = ['flat', 'eel', 'snail'];

function startAquarium() {
  if (aquaAnimId) return;
  const wrap = document.getElementById('aquaWrap');
  if (!wrap) return;

  if (aquaFishes.length === 0) {
    wrap.innerHTML = '';
    fishList.forEach((f) => {
      const box = document.createElement('div');
      box.className = 'aqua-item';
      if (f.w) box.style.width = f.w + 'px';
      box.setAttribute('role', 'button');
      box.setAttribute('tabindex', '0');
      box.setAttribute('aria-label', f.name + 'を捕まえる');

      const img = document.createElement('img');
      img.src = f.img;
      img.alt = '';
      img.draggable = false;
      img.className = 'aqua-fish' + (caught.has(f.id) ? '' : ' unknown');
      box.appendChild(img);
      wrap.appendChild(box);

      const cfg = SWIM[f.id] || { type: 'cruise', speed: 1, turn: 0.03, wander: 0.02 };
      const item = {
        id: f.id, el: box, img: img, cfg: cfg,
        w: f.w || 140, h: (f.w || 140) * 0.55, noFlip: !!f.noFlip,
        x: 0, y: 0, vx: 0, vy: 0, sp: cfg.speed || 0,
        heading: Math.random() < 0.5 ? Math.PI : 0, face: Math.random() < 0.5 ? -1 : 1,
        rot: 0, rotT: 0, t: Math.random() * 200, phase: Math.random() * 6.28,
        mode: BOTTOM_TYPES.includes(cfg.type) || cfg.type === 'snail' ? 'rest' : 'drift', timer: rnd2(40, 300),
        frozen: false, busy: false
      };
      const fit = () => { if (img.naturalWidth) item.h = item.w * img.naturalHeight / img.naturalWidth; };
      img.addEventListener('load', fit); fit();
      aquaFishes.push(item);

      // 最初の位置
      const b = aquaBounds(item), range = b.maxY - b.minY;
      item.x = rnd2(b.minX, b.maxX);
      item.y = BOTTOM_TYPES.includes(cfg.type) ? b.maxY : b.minY + range * rnd2(cfg.band ? cfg.band[0] : 0.1, cfg.band ? cfg.band[1] : 0.85);
      if (cfg.type === 'cruise') item.heading = item.face > 0 ? 0 : Math.PI;
      if (cfg.type === 'squid') item.heading = item.face > 0 ? 0.3 : Math.PI - 0.3;

      box.addEventListener('click', () => onFishTap(item));
      box.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onFishTap(item); }
      });
    });
  }

  let lastTime = performance.now();
  const speedK = REDUCED_MOTION ? 0.25 : 1;

  function animate(now) {
    const dt = Math.min((now - lastTime) / 16.6, 2) * speedK;
    lastTime = now;

    aquaFishes.forEach(f => {
      if (f.frozen) return;
      const b = aquaBounds(f);
      (STEP[f.cfg.type] || STEP.cruise)(f, dt, b);
      f.x = clampN(f.x, b.minX, b.maxX);
      f.y = clampN(f.y, b.minY, b.maxY);
      f.rot += angDiffD(f.rotT, f.rot) * Math.min(1, 0.12 * dt);
      const flip = f.noFlip ? 1 : (f.face > 0 ? -1 : 1);     // 絵は左向き。右へ進むときは、左右反転
      f.el.style.transform = `translate(${f.x.toFixed(1)}px, ${f.y.toFixed(1)}px)`;
      f.img.style.transform = `rotate(${f.rot.toFixed(1)}deg) scaleX(${flip})`;
    });

    aquaAnimId = requestAnimationFrame(animate);
  }
  aquaAnimId = requestAnimationFrame(animate);
}


function stopAquarium() {
  if (aquaAnimId) { cancelAnimationFrame(aquaAnimId); aquaAnimId = null; }
}

// 文章の中の **ことば** を、蛍光ペンのような強調にして表示する(HTMLは使わず、安全に組み立てる)
function setRich(node, text){
  node.textContent = '';
  String(text).split('\n').forEach((line, li) => {
    if (li) node.appendChild(document.createElement('br'));
    line.split(/(⟦[^⟧]*⟧)/).forEach(part => {
      const nb = /^⟦([^⟧]*)⟧$/.exec(part);
      if (nb) { const s = document.createElement('span'); s.setAttribute('data-nb', ''); s.style.whiteSpace = 'nowrap'; s.textContent = nb[1]; node.appendChild(s); node.appendChild(document.createElement('wbr')); return; }
      part.split('**').forEach((seg, i) => {
        if (!seg) return;
        if (i % 2) { const b = document.createElement('b'); b.className = 'em'; b.textContent = seg; node.appendChild(b); }
        else node.appendChild(document.createTextNode(seg));
      });
    });
  });
}function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function answerQuiz(f, idx, buttons, result, rTitle, rText, rExtra){
  const q = f.interaction;

  result.className = 'quiz-result-box show ' + (correct ? 'correct' : 'incorrect');

    rExtra.innerHTML = salmonSliceHtml();
    const svg = rExtra.querySelector('.slice');
    requestAnimationFrame(() => requestAnimationFrame(() => svg.classList.add('revealed')));
  }

  document.getElementById('detailTriviaBlock').className = 'story-trivia show-animated';
