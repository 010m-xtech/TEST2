function setupShake(f, hero, img){
  hero.classList.remove('shakeable');
  img.classList.remove('shaking');
  hero.querySelectorAll('.shake-hint, .shake-bit').forEach(n => n.remove());
  img.onclick = null;
  if (!f.shake) return;
  hero.classList.add('shakeable');
  const hint = elH('div', 'shake-hint', ico('hand') + '瓶をタップして、ふってみよう');
  hero.insertBefore(hint, hero.querySelector('.fish-header'));
  let busy = false;
  img.onclick = () => {
    if (busy) return;
    busy = true;
    hint.textContent = '…ふりふり…';
    const done = () => {
      const card = document.querySelector('#detailHighlightBlock .flip-card');
      if (card) card.classList.add('is-flipped');
      hint.innerHTML = ico('hand') + 'もういちど、ふってみる';
      busy = false;
    };
    if (REDUCED_MOTION) { done(); return; }
    img.classList.remove('shaking'); void img.offsetWidth; img.classList.add('shaking');
    const cx = img.offsetLeft + img.offsetWidth / 2, top = img.offsetTop + img.offsetHeight * 0.22;
    SHAKE_BITS.forEach((ch, i) => {
      const b = el('span', 'shake-bit'); b.innerHTML = ch;
      b.style.left = (cx + (i - 2.5) * 14) + 'px';
      b.style.top = top + 'px';
      b.style.setProperty('--dx', ((i % 2 ? 1 : -1) * (14 + i * 9)) + 'px');
      b.style.setProperty('--rot', ((i % 2 ? 1 : -1) * (40 + i * 25)) + 'deg');
      b.style.animationDelay = (0.15 + i * 0.09) + 's';
      hero.appendChild(b);
      setTimeout(() => b.remove(), 2200);
    });
    setTimeout(() => { img.classList.remove('shaking'); }, 950);
    setTimeout(done, 1000);
  };
}

function selectFish(id){
  currentFishId = id;
  const f = fishById(id);
  if (!f) return;

  // 詳細を開いた魚は「捕まえた」扱い
  if (!caught.has(id)) { caught.add(id); saveCaught(); }

  // ヘッダー(魚の絵・名前・旬)
  const hero = document.getElementById('detailHero');
  const heroImg = document.getElementById('detailImg');
  hero.classList.toggle('no-img', !!f.hideHero);
  heroImg.src = f.hideHero ? '' : f.img;
  heroImg.alt = f.hideHero ? '' : f.name;
  document.getElementById('detailName').textContent = f.name;
  setupShake(f, hero, heroImg);

  // 1. 問い
  const triviaBlock = document.getElementById('detailTriviaBlock');
  if (f.interaction && f.interaction.type === 'quiz') {
    triviaBlock.className = 'story-trivia hidden';   // 答えるまで隠す
    renderQuiz(f);
  } else {
    triviaBlock.className = 'story-trivia';
    renderFlip(f);
  }

  // 2. 答え・豆知識
  setRich(document.getElementById('detailTrivia'), f.trivia);
  const illWrap = document.getElementById('detailIllWrap');
  const illImg = document.getElementById('detailIllImg');
  const illCaption = document.getElementById('detailIllCaption');
  if (f.illustration) {
    illImg.src = f.illustration;
    illImg.alt = f.illAlt || '';
    illCaption.textContent = f.illCaption || '';
    illWrap.style.display = 'block';
    const legend = document.getElementById('detailIllLegend');
    legend.innerHTML = '';
    if (f.illLegend) {
      f.illLegend.forEach(it => {
        const li = document.createElement('li');
        const dot = document.createElement('span'); dot.className = 'dot'; dot.style.background = it.color;
        li.append(dot, document.createTextNode(it.text));
        legend.appendChild(li);
      });
      legend.hidden = false;
    } else {
      legend.hidden = true;
    }
  } else {
    illWrap.style.display = 'none';
    illImg.removeAttribute('src');
  }

const SURVEY_LINES = [

  { text: 'その前に、最初に\nお二つだけ、\n聞かせてくださいね。', wave: 'お二つだけ', sub: 'タップするだけです' }

const TALK_T0 = 0.6, TALK_TS = 0.04;                                   // 1文字目が出るまで / 1文字ごとの間隔(秒)。CSSの --t0, --ts と同じ値
const talkSettle = (text) => TALK_T0 + [...text.replace(/\n/g, '')].length * TALK_TS + 0.25;   // 吹き出しの文字が出きるまでの秒数
const SURVEY_THANKS = 'ありがとうございます。\nそれでは、水槽へ\nご案内しますね。\nどうぞ、ごゆっくり\nお楽しみください。';
const THANKS_WAVE   = '';                  // お礼の言葉は、強調せず、そのまま
// 魚ごとの「口」の位置(画像の左端からの割合 x, 上端からの割合 y)。左向きの絵での位置
const MOUTH = {
  maguro:[.05,.62], amaebi:[.30,.43], kanpachi:[.07,.54], hirame:[.12,.60], saba:[.07,.54],
  madai:[.08,.56], anago:[.11,.60], geso:[.30,.62], nazobin:[.36,.55], baigai:[.22,.63]
};

function createFishTalk(root){
  const q = s => root.querySelector(s);
  const wrap = q('.talk-fish-wrap'), img = q('.talk-fish'), bubble = q('.talk-bubble'), main = q('.talk-main'), sub = q('.talk-sub');
  let fishId = 'maguro', timers = [], seq = null;
  const vertical = root.dataset.orient === 'v';

  function setFish(id){
    const f = fishById(id) || fishById('maguro');
    fishId = f.id; img.src = f.talkImg || f.img;
  }
  function build(text, waveWord){
    main.innerHTML = '';
    const sr = document.createElement('span'); sr.className = 'sr-only'; sr.textContent = text.replace(/\n/g, ' '); main.appendChild(sr);
    const w0 = waveWord ? text.indexOf(waveWord) : -1;
    let last = null;
    [...text].forEach((c, i) => {
      if (c === '\n') { main.appendChild(document.createElement('br')); last = null; return; }
      if (last && '、。，．！？!?'.includes(c)) { last.textContent += c; return; }   // 句読点は直前の文字と一緒に(行頭に残さない)
      const sp = document.createElement('span');
      sp.className = 'ch' + ((w0 >= 0 && i >= w0 && i < w0 + waveWord.length) ? ' wave' : '');
      sp.style.setProperty('--i', i); sp.textContent = c; sp.setAttribute('aria-hidden', 'true');
      main.appendChild(sp); last = sp;
    });
  }
  // 魚の口の位置を測り、吹き出しのしっぽの先と、口から出る泡の位置を合わせる
  function layout(){
    const m = MOUTH[fishId] || [.08,.58];
    const r = wrap.getBoundingClientRect(), b = bubble.getBoundingClientRect(), h = root.getBoundingClientRect();
    if (!r.width || !r.height || !b.height) return;
    const mx = r.left + (1 - m[0]) * r.width, my = r.top + m[1] * r.height;     // scaleX(-1) で反転するため、口は右側
    if (vertical) {                                                              // 魚が上、吹き出しが下: しっぽは上向き
      bubble.style.setProperty('--tail-x', Math.max(28, Math.min(b.width - 28, mx - b.left)) + 'px');
      bubble.style.setProperty('--tail-len', Math.max(12, Math.min(90, b.top - (r.bottom + 2))) + 'px');   // しっぽの先は、魚の下端で止める(魚の体に入り込まない)
      root.querySelectorAll('.air').forEach((a, i) => { a.style.left = (mx - h.left + 4 + i * 6) + 'px'; a.style.top = (my - h.top - 4) + 'px'; });
      return;
    }
    const len = Math.max(10, Math.min(36, b.left - mx));
    const ty  = Math.max(16, Math.min(b.height - 16, my - b.top));
    bubble.style.setProperty('--tail-len', len + 'px');
    bubble.style.setProperty('--tail-y', ty + 'px');
    root.querySelectorAll('.air').forEach((a, i) => { a.style.left = (mx - h.left + 2 + i * 6) + 'px'; a.style.top = (my - h.top - 4) + 'px'; });
  }
  // 吹き出しを引っ込めて、口からもう一度ふくらませ、ひとことしゃべる
  function say(text, opt = {}){
    bubble.classList.remove('play', 'skip', 'static'); void bubble.offsetWidth;
    build(text, opt.wave || '');
    if (sub) {
      sub.style.display = opt.withSub ? '' : 'none';
      if (opt.subText) sub.textContent = opt.subText;
      sub.style.animationDelay = Math.max(0, talkSettle(text) - 0.3) + 's';   // 本文が出きるころに、下の一言を出す
    }
    bubble.classList.toggle('thanks', opt.cls === 'thanks');
    void bubble.offsetWidth;
    layout();
    bubble.classList.add('play');
  }
  function whenReady(fn){ if (img.complete && img.naturalWidth) fn(); else img.onload = fn; }
  function stop(){ timers.forEach(clearTimeout); timers = []; seq = null; }

  // 複数のひとことを、順番にしゃべる。タップで次のひとことへ
  function speakCurrent(){
    if (!seq) return;
    const ln = seq.lines[seq.i];
    say(ln.text, { wave: ln.wave, withSub: !!ln.sub, subText: ln.sub });
    if (seq.i === seq.lines.length - 1 && seq.onLast) seq.onLast(ln);
    if (seq.i < seq.lines.length - 1) {
      const ms = (talkSettle(ln.text) + (ln.hold == null ? 1.9 : ln.hold)) * 1000;
      timers.push(setTimeout(() => { if (seq) { seq.i++; speakCurrent(); } }, ms));
    }
  }
  function sequence(lines, onLast){
    stop(); seq = { lines, i: 0, onLast };
    whenReady(speakCurrent);
  }
  function next(){
    if (!seq || seq.i >= seq.lines.length - 1) return;
    timers.forEach(clearTimeout); timers = [];
    seq.i++; speakCurrent();
  }
  function isLast(){ return !seq || seq.i >= seq.lines.length - 1; }
  return { root, img, bubble, setFish, say, layout, sequence, next, stop, whenReady, isLast };
}

// ---- 「画面いっぱいに話す → 話しおわったら上へ小さく移る」の共通部品(冒頭の質問・最後のひとことで使う) ----
function createStage(cfg){
  const { stageEl, headEl, talk, stageTalk, lines } = cfg;
  const inner = () => stageEl.querySelector('.stage-inner');
  let moveTimer = null, revealTimer = null;
  function resetInner(){ const i = inner(); i.style.transition = 'none'; i.style.transform = ''; i.style.opacity = ''; }
  function show(){
    const hh = document.getElementById('main-header').offsetHeight || 66;
    stageEl.style.setProperty('--stage-top', hh + 'px');
    resetInner();
    stageEl.hidden = false;
    headEl.classList.add('await'); headEl.classList.remove('pop-in');         // 小さい方の魚は、移ってくるまで隠す
  }
  function hide(){
    clearTimeout(moveTimer); clearTimeout(revealTimer); stageTalk.stop();
    stageEl.hidden = true; resetInner();
  }
  // 小さい吹き出し(上)には、最後のひとことを、そのまま表示しておく
  function compactFinal(){
    const last = lines[lines.length - 1];
    talk.say(last.text, { wave: last.wave, withSub: !!last.sub, subText: last.sub, cls: last.compactCls });
    talk.bubble.classList.add('skip', 'static');
  }
  // 話しおわり → 大きな魚と吹き出しが、上へ小さく移り、質問(入力欄)が現れる
  function finish(token){
    if (!cfg.valid(token) || stageEl.hidden) return;
    stageTalk.stop(); clearTimeout(revealTimer);
    compactFinal();
    headEl.classList.remove('await'); headEl.classList.add('pop-in');
    if (REDUCED_MOTION) { cfg.reveal(token); hide(); return; }
    setTimeout(() => cfg.reveal(token), 450);                  // 大きな魚が上へ移りはじめてから出す(重ならないように)
    const i = inner(), sr = i.getBoundingClientRect(), cr = headEl.getBoundingClientRect();
    const tx = (cr.left + cr.width / 2) - (sr.left + sr.width / 2), ty = (cr.top + cr.height / 2) - (sr.top + sr.height / 2);
    i.style.transition = 'transform .8s cubic-bezier(.45,.05,.25,1), opacity .45s ease .12s';
    i.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(.4)';
    i.style.opacity = '0';
    clearTimeout(moveTimer); moveTimer = setTimeout(hide, 900);
  }
  function start(token){
    clearTimeout(moveTimer); clearTimeout(revealTimer); stageTalk.stop();
    show();
    stageTalk.sequence(lines, (ln) => {
      if (!cfg.valid(token)) return;
      // 最後の吹き出しの文字が出きる → 下の一言が出きる、のあとに、上へ移る
      const ms = REDUCED_MOTION ? 500 : (talkSettle(ln.text) + (ln.sub ? 0.5 : 0) + 0.6) * 1000;
      clearTimeout(revealTimer); revealTimer = setTimeout(() => finish(token), ms);
    });
  }
  // 大きな吹き出しをタップすると、次の吹き出しへ(最後なら、話を飛ばして先へ)
  function skip(){
    if (cfg.blocked && cfg.blocked()) return;
    if (!stageTalk.isLast()) { stageTalk.next(); return; }
    stageTalk.bubble.classList.add('skip');
    clearTimeout(revealTimer);
    finish(cfg.token());
  }
  stageTalk.bubble.addEventListener('click', skip);
  stageTalk.bubble.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); skip(); } });
  return { show, hide, start, finish, compactFinal };
}

function startSelectTalk(){
  const f = fishById(currentFishId);
  selectTalk.setFish(f ? f.id : 'maguro');                // 案内役は、直前に見たお魚(はじめはまぐろ)
  const n = caught.size, total = fishList.length;
  let lines;
  if (selectNeedsExplain)  lines = [SELECT_LINES.action];                                                // 冒頭で説明を聞いたあとは、案内だけ
  else if (!selectGreeted) lines = [SELECT_LINES.welcome, SELECT_LINES.explain1, SELECT_LINES.explain2, SELECT_LINES.action];   // 回答済みの方が水槽を開いたとき   // ページを開いて最初は、捕まえた数にかかわらず、案内を最後まで話す
  else if (n === 0)        lines = [SELECT_LINES.action];
  else if (n >= total)     lines = [SELECT_LINES.all];
  else                     lines = [SELECT_LINES.more];
  selectGreeted = true; selectNeedsExplain = false;
  selectTalk.sequence(lines);
}
(function(){
  const b = selectTalk.bubble;
  b.addEventListener('click', () => selectTalk.next());
  b.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectTalk.next(); } });
})();

// ---- 最後のひとこと(任意・1問だけ)。魚が話して聞くので、アンケートっぽくならない ----
const FAREWELL_LINES = [
  { text: 'ここまで、\nありがとうございます。', wave: '', hold: 0.9, sub: 'タップで次へ' },
  { text: 'お店へ、ひとこと\nいただけませんか？', wave: 'ひとこと', hold: 0.7, sub: 'タップで次へ' },
  // 具体的に伝える: 料理・お酒・このコンテンツなど、何でもよいこと。上に残る小さい吹き出しは、長いので少し小さい文字に(compactCls)
  { text: '料理やお酒、\nこのコンテンツなど、\nどんなことでも\n感想をいただけたら\n嬉しいです。', wave: 'どんなことでも', compactCls: 'thanks' }
];
const FAREWELL_SENT = 'ありがとうございます。\n励みになります。\nこの後も、どうぞ\nお楽しみください。';
const FAREWELL_SKIP = 'ありがとうございます。\nまたお待ちしています。\nこの後も、どうぞ\nお楽しみください。';
let farewellDone = store.get('minozushi_farewell_done') === '1';          // 1端末1回: この端末で、すでに答えた(または「このまま終わる」を選んだ)か
let farewellToken = 0, farewellTimer = null, farewellFinished = false;
const fwEl = id => document.getElementById(id);
function hideFarewellForm(){ clearTimeout(farewellTimer); const f = fwEl('farewellForm'); f.hidden = true; f.classList.remove('pop-in'); }
function resetFarewellUI(){
  hideFarewellForm(); fwEl('farewellDone').hidden = true;
  fwEl('farewellText').value = ''; fwEl('farewellSend').disabled = true;
  farewellTalk.img.classList.remove('done'); farewellFinished = false;
}
function revealFarewellForm(token){
  if (token !== farewellToken || farewellFinished) return;
  if (document.querySelector('.screen.active')?.dataset.screen !== 'farewell') return;
  const f = fwEl('farewellForm'); if (f.hidden) { f.hidden = false; f.classList.add('pop-in'); }
}
const farewellStageCtl = createStage({
  stageEl: document.getElementById('farewellStage'), headEl: document.getElementById('farewellHead'),
  talk: farewellTalk, stageTalk: farewellStage, lines: FAREWELL_LINES,
  valid: (t) => t === farewellToken && !farewellFinished && document.querySelector('.screen.active')?.dataset.screen === 'farewell',
  reveal: (t) => revealFarewellForm(t),
  token: () => farewellToken,
  blocked: () => farewellFinished
});
function setFarewellFish(id){ farewellTalk.setFish(id); farewellStage.setFish(id); }
function playFarewellIntro(){
  const token = ++farewellToken;
  if (farewellFinished) return;
  hideFarewellForm();
  farewellStageCtl.start(token);
}
function finishFarewell(kind){
  if (farewellFinished) return;
  farewellFinished = true;
  if (!surveyReview) { farewellDone = true; store.set('minozushi_farewell_done', '1'); }   // 確認モードでは記録しない
  hideFarewellForm();
  farewellTalk.stop();
  farewellTalk.img.classList.add('done');
  farewellTalk.say(kind === 'sent' ? FAREWELL_SENT : FAREWELL_SKIP, { wave: '', cls: 'thanks' });
  fwEl('farewellDone').hidden = false; fwEl('farewellDone').classList.add('pop-in');
  document.getElementById('header-back-btn').style.display = 'none';
  screenHistory = [];
}
function farewellSend(){
  const msg = fwEl('farewellText').value.trim();
  if (!msg) return;
  if (!surveyReview) sendLog('ひとこと', { message: msg.slice(0, 200), fishId: currentFishId });   // 確認モードでは送信しない
  finishFarewell('sent');
}
(function(){
  fwEl('farewellText').addEventListener('input', () => { fwEl('farewellSend').disabled = !fwEl('farewellText').value.trim(); });
  fwEl('farewellSend').addEventListener('click', farewellSend);
  fwEl('farewellSkip').addEventListener('click', () => finishFarewell('skip'));
})();
function openFarewellReview(){            // 確認用: 最後のひとこと画面を、何度でも新品の状態で開く(送信されません)
  clearTimeout(opTimer); clearTimeout(opGuard);
  surveyReview = true;
  resetFarewellUI();
  setFarewellFish(currentFishId || 'maguro');
  screenHistory = [];
  goScreen('farewell');
}

// ---- アンケート画面の見た目確認用 ----
// 通常は「初回の1回だけ」しか見られないため、画面を確認するときは、何度でも新品の状態で開けるようにする。
// 使い方: アドレスの末尾に ?survey を付けて開く(本番でも可)。この間の回答は、保存もログ送信もしません。
let surveyReview = false;
function resetSurveyUI(){
  document.querySelectorAll('.screen[data-screen="survey"] input').forEach(i => { i.checked = false; i.disabled = false; });
  const q2 = document.getElementById('group-age'); q2.hidden = true; q2.classList.remove('pop-in');
  hideSurveyQuestions();
  surveyDone = false;
  surveyTalk.img.classList.remove('done');
  const b = document.getElementById('surveyBackBtn');
  b.disabled = true; b.classList.remove('btn-primary'); b.classList.add('btn-ghost');
}
function openSurveyReview(){
  clearTimeout(opTimer); clearTimeout(opGuard);
  surveyReview = true;
  resetSurveyUI();
  setSurveyFish(currentFishId);
  screenHistory = [];
  goScreen('survey');
}

// 初回はアンケートへ。回答済みなら最初の画面へ戻る
function handleFinishClick(){
  if (farewellDone && !surveyReview) { goScreen('select'); return; }   // この端末では、すでに聞いたので、そのまま戻る
  resetFarewellUI();
  setFarewellFish(currentFishId || 'maguro');                 // 最後にしゃべる魚は、いま見ていた魚
  goScreen('farewell');
}

function renderResult(){
  const total = fishList.length;
  const n = caught.size;
  document.getElementById('resCaught').textContent = n;
  document.getElementById('resTotal').textContent = total;

  document.getElementById('resMsg').textContent = (n >= total)
    ? 'すべての魚を捕まえました。魚博士です！'
    : `まだ ${total - n} 種類の魚が泳いでいます。`;

  document.getElementById('orderBtn').hidden = !ORDER_URL;
}

function goOrder(){ if (ORDER_URL) location.href = ORDER_URL; }


/* ============ 読みやすい折り返し: 文節の切れ目に <wbr> を入れる ============
   日本語は、そのままだと文字の途中どこでも折り返されます。「、」「。」「を」や、助詞(は・が・も・に・で・と・へ・や・の)の
   あと(次が漢字・カタカナ・数字のとき)でだけ折り返せるようにして、言葉が途中で切れないようにします。
   うまく動かない場合は PHRASE_ON を false にすると、通常の折り返しに戻ります。 */
const PHRASE_ON = true;
const PHRASE_SEL = '.story-lead, .about-v, .story-trivia p, .trivia-illustration-caption, .compare-card .note, .compare-foot, .parts-info, .parts-note, .story-owner p, .quiz-question, .quiz-result-text, .flip-card-front p, .flip-card-back p, .flip-sub, .quiz-btn, .menu-notice, .mp-catch, .mp-text, .mp-head, .mp-foot, .menu-more-note, .sp-line, .sake-pick-note, .menu-story p, .menu-secret p, .menu-item .desc, .menu-empty, .sake-card .taste, .sake-card .pair-line, .menu-notice, .note, .ill-legend li, .result-sub, .slice-caption';
const RE_NEXT_OK = /[\u4E00-\u9FFF\u3005\u30A0-\u30FF0-9A-Za-z]/;      // 漢字・々・カタカナ・数字・英字
const PARTICLES = 'がはもにでとへやの';
// 途中で切ると不自然になる語(この中の位置では折り返さない)
const PROTECT = ['ようやく','ともに','ところ','ほとんど','やはり','やがて','やわらか','やさしい','とても','どうも','ありがと','ありがた','それでは','おいしい','どんどん','ねっとり','ほっこり','もちもち','ぷりぷり','ふっくら','とろける','なめらか','酢の物','お刺身','ください','ご了承','ご案内','ご注文','ご紹介','ご用意','ご覧','ございます','いただ','にんにく','どんな','そのとき','ひとこと','ひとつ','ふたつ','マリアナ諸島','イクチオトキシン','アスタキサンチン','ホッコクアカエビ','という','として','について','によって','による','ために','ような','ように','られる','される'];
const RE_HIRA = /[\u3041-\u309F]/, RE_KATA = /[\u30A1-\u30FA\u30FC]/, RE_KANJI = /[\u4E00-\u9FFF\u3005]/;
function protectedAt(seg, i){                       // i と i+1 の間が、保護する語の内側かどうか
  for (const w of PROTECT) {
    let k = seg.indexOf(w);
    while (k >= 0) { if (i >= k && i < k + w.length - 1) return true; k = seg.indexOf(w, k + 1); }
  }
  return false;
}
// 長すぎる塊(12文字超)は、自然な切れ目のうち、なるべく真ん中に近い所で分ける
function quoteDepths(seg){                            // 「」の内側かどうか(内側では折り返さない)
  const d = []; let depth = 0;
  for (const ch of seg) { if (ch === '「') depth++; d.push(depth); if (ch === '」') depth = Math.max(0, depth - 1); }
  return d;
}
function splitLong(seg){
  if (seg.length <= 12) return [seg];
  let best = -1, bestScore = 1e9;
  const qd = quoteDepths(seg);
  for (let i = 2; i < seg.length - 2; i++) {
    const c = seg[i], n = seg[i + 1];
    if (qd[i] > 0 && qd[i + 1] > 0) continue;                                                   // 「…」の内側
    let ok = false;
    if (n === '「' || n === '（') ok = true;                                                  // 括弧の前
    else if (['ほど','から','まで','より','など'].includes(seg.slice(i - 1, i + 1)) && !(PARTICLES.includes(n) || n === 'を')) ok = true;   // 二文字の助詞のあと
    else if (['ような','ように'].includes(seg.slice(i - 2, i + 1))) ok = true;                  // 「〜のような|…」
    else if (RE_HIRA.test(c) && RE_HIRA.test(seg[i - 1]) && RE_KANJI.test(n)) ok = true;       // ひらがな2文字以上 → 漢字の境目
    else if ((PARTICLES.includes(c) || c === 'を') && !(PARTICLES.includes(n) || n === 'を')) ok = true;   // 助詞のあと(には・では・でも など続く所は除く)
    else if (RE_HIRA.test(c) && RE_HIRA.test(seg[i - 1]) && RE_KATA.test(n)) ok = true;       // ひらがな → カタカナの境目
    if (!ok || protectedAt(seg, i)) continue;
    if (i + 1 < 3 || seg.length - (i + 1) < 3) continue;
    const score = Math.abs((i + 1) - seg.length / 2);
    if (score < bestScore) { bestScore = score; best = i; }
  }
  if (best < 0) return [seg];
  return splitLong(seg.slice(0, best + 1)).concat(splitLong(seg.slice(best + 1)));
}
function splitJa(t){
  const parts = []; let cur = '', depth = 0;
  for (let i = 0; i < t.length; i++) {
    const c = t[i], n = t[i + 1]; cur += c;
    if (c === '「') depth++; else if (c === '」') depth = Math.max(0, depth - 1);
    if (n === undefined) break;
    if (depth > 0) continue;                                               // 「…」の内側では切らない
    const brk = '、。，．！？'.includes(c) || c === 'を' || (PARTICLES.includes(c) && RE_NEXT_OK.test(n) && !(c === 'の' && 'そこあど'.includes(t[i - 1] || '')) && !protectedAt(t, i));
    if (brk && !'、。，．！？）」』】'.includes(n)) { parts.push(cur); cur = ''; }
  }
  if (cur) parts.push(cur);
  return parts.flatMap(splitLong);
}
const phraseDone = new WeakSet();
function phraseNode(tn){
  if (phraseDone.has(tn)) return;
  phraseDone.add(tn);
  let t = tn.nodeValue; if (!t) return;
  t = t.replace(/([」）』】])(?=[はがをにでとのもへやか])/g, '$1' + WJ);
  if (t !== tn.nodeValue) tn.nodeValue = t;
  if (t.trim().length < 6) return;
  const parts = splitJa(t); if (parts.length < 2) return;
  const frag = document.createDocumentFragment();
  parts.forEach((p, i) => { const n = document.createTextNode(p); phraseDone.add(n); frag.appendChild(n); if (i < parts.length - 1) frag.appendChild(document.createElement('wbr')); });
  tn.parentNode.replaceChild(frag, tn);
}
const WJ = '\u2060';
const CLOSERS = '」）』】', PART_CH = 'はがをにでとのもへやか';
function emWbr(b){
  if (b.closest('[data-nb]')) return;                  // 「折り返さない」と指定された範囲では、何も入れない
  const p = b.previousSibling, nx = b.nextSibling, t = b.textContent;
  // 直前が助詞・句読点・ひらがなで、強調語が漢字・カタカナで始まるなら、その手前で折り返せる
  if (p && p.nodeType === 3 && p.nodeValue) {
    const ch = p.nodeValue.slice(-1);
    const startsHard = RE_KANJI.test(t[0]) || RE_KATA.test(t[0]) || '「（'.includes(t[0]);
    if ('、。，．！？'.includes(ch) || ((PARTICLES.includes(ch) || ch === 'を' || (RE_HIRA.test(ch) && !'おごみ'.includes(ch))) && startsHard))
      b.parentNode.insertBefore(document.createElement('wbr'), b);
  }
  if (nx && nx.nodeType === 3 && nx.nodeValue) {
    const last = t[t.length - 1], f = nx.nodeValue[0];
    if (CLOSERS.includes(last) && PART_CH.includes(f)) nx.nodeValue = WJ + nx.nodeValue;        // 「…」の直後の助詞は離さない
    else if (RE_HIRA.test(last) && (RE_KANJI.test(f) || RE_KATA.test(f))) b.parentNode.insertBefore(document.createElement('wbr'), nx);
  }
}
function applyPhrase(){
  if (!PHRASE_ON) return;
  document.querySelectorAll(PHRASE_SEL).forEach(el => {
    el.classList.add('phrase');
    const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), nodes = [];
    while (w.nextNode()) nodes.push(w.currentNode);
    nodes.forEach(phraseNode);
    el.querySelectorAll('b.em').forEach(emWbr);
  });
}
if (PHRASE_ON) {
  const mainEl = document.querySelector('main');
  const obs = new MutationObserver(() => { obs.disconnect(); applyPhrase(); obs.observe(mainEl, { childList: true, subtree: true, characterData: true }); });
  obs.observe(mainEl, { childList: true, subtree: true, characterData: true });
  applyPhrase();
}

/* ============ 初期化 ============ */
sendLog('アクセス');
document.getElementById('totalCount').textContent = fishList.length;
if (/[?&]survey\b/.test(location.search)) {
  openSurveyReview();      // 確認用: ?survey(冒頭の質問)
} else if (/[?&]farewell\b/.test(location.search)) {
  openFarewellReview();    // 確認用: ?farewell(最後のひとこと)
} else if (OP_FIRST_VISIT_ONLY && store.get('minozushi_op_seen')) {
  goScreen('select');      // 2回目以降はOPを飛ばす(OP_FIRST_VISIT_ONLYがtrueのとき)
} else {
  startOp();
}
</script>
