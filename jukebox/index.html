<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ご案内</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    /* 動画のスタイル：スマホやPCの画面に合わせて見やすく調整 */
    #promoVideo {
      width: 100%;
      max-width: 600px;
      max-height: 100vh;
      object-fit: contain;
    }
    /* 画像エリア：最初は非表示にしておき、動画終了後にフェードイン */
    #imageContainer {
      display: none;
      opacity: 0;
      /* より自然で滑らかなフェードイン効果に変更 (時間を2秒に延長し、イージングを調整) */
      transition: opacity 2s cubic-bezier(0.4, 0, 0.2, 1);
      text-align: center;
      width: 100%;
      max-width: 600px;
      padding: 20px;
      box-sizing: border-box;
    }
    .image-link {
      display: block;
      position: relative;
    }
    .image-link img {
      width: 100%;
      height: auto;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 255, 255, 0.15);
      display: block; /* 画像の下の隙間を消す */
    }
    /* 画像の中央に配置するテキスト */
    .overlay-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font-size: 28px; /* 文字を大きく */
      font-weight: bold;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.8), 0 0 4px rgba(0,0,0,0.5); /* どんな画像でも文字が見えるように影をつける */
      white-space: nowrap;
      pointer-events: none; /* テキストがタップの邪魔をしないようにする */
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { opacity: 0.7; }
      50% { opacity: 1; }
      100% { opacity: 0.7; }
    }
  </style>
</head>
<body>

  <video id="promoVideo" src="https://github.com/user-attachments/assets/8edf3852-0bec-4bf2-9a93-6efa97215c83" autoplay muted playsinline></video>

  <div id="imageContainer">
    <!-- プレビュー環境でのエラーを防ぐため target="_blank" を追加しています -->
    <a href="https://forms.gle/84NDDf5oUevEpTwS6" target="_blank" rel="noopener noreferrer" class="image-link">
      <img src="https://github.com/user-attachments/assets/e22a2534-cd79-4627-8201-18652af39c53" alt="アンケートへ進む">
      <div class="overlay-text">▼タップしてリクエストへ進む▼</div>
    </a>
  </div>

  <script>
    const video = document.getElementById('promoVideo');
    const imageContainer = document.getElementById('imageContainer');

    // 動画が最後まで再生されたときの処理
    video.addEventListener('ended', () => {
      video.style.display = 'none'; // 動画を非表示にする
      imageContainer.style.display = 'block'; // 画像エリアを配置する
      
      // 少し遅れて自然にフェードインさせる
      setTimeout(() => {
        imageContainer.style.opacity = '1';
      }, 50);
    });

    // 【保険機能】通信環境や省電力モード等で自動再生がストップした場合、
    // 画面のどこかをタップした瞬間に動画が再生されるようにしています。
    document.body.addEventListener('click', () => {
      if (video.paused && video.style.display !== 'none') {
        video.play();
      }
    }, { once: true });
  </script>

</body>
</html>
