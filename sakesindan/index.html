<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Night Sommelier</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Vue.js -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    
    <style>
        /* ========================================================
           スマホのスクロールを完全に封印する最強のCSS設定
        ======================================================== */
        html, body {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden !important; 
            background-color: #050814;
            margin: 0;
            padding: 0;
            touch-action: none; /* スワイプによる画面ズレを防止 */
        }

        /* 背景動画を「最背面」にピッタリ張り付ける */
        .bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -999 !important; /* 絶対に一番後ろ！ */
            opacity: 0.6; /* 文字や画像を見やすくするための暗さ調整 */
            pointer-events: none; /* タップの邪魔をしない */
        }

        /* コンテンツエリアの設定（中身だけスクロール可能にする） */
        .app-container {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            overflow-y: auto; /* スマホ画面が小さい場合のみ枠内スクロール */
            padding-bottom: 3rem; /* 下部の余白 */
        }

        /* 設問イラストを絶対に切らさず、枠内に収める */
        .question-image {
            width: 100%;
            height: 220px; /* イラストの高さをしっかり確保 */
            object-fit: contain !important; /* cover(切り抜き)ではなく全体表示 */
            background-color: transparent !important;
        }

        /* ガラス風の半透明パネルデザイン */
        .glass-panel {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

    <!-- ========================================================
         背景動画は絶対にここ！<body>の直下に単独で置く
    ======================================================== -->
    <video class="bg-video" src="haikei.mp4" autoplay loop muted playsinline></video>

    <!-- ここからアプリのメインコンテンツ -->
    <div id="app" class="app-container text-slate-100 font-serif flex flex-col items-center p-4">
        
        <!-- ▼ 1. トップ画面 ▼ -->
        <div v-if="step === 'start'" class="w-full max-w-lg mt-12 p-6 glass-panel rounded-2xl flex flex-col items-center text-center shadow-2xl">
            <h1 class="text-2xl text-amber-500 font-bold mb-4 tracking-widest">〜今夜のあなたに合う1杯を〜</h1>
            <p class="text-sm text-slate-300 mb-8 leading-relaxed">
                6つの簡単な直感クエスチョンに答えるだけで、<br>今のあなたにぴったりの味覚と時間をご提案。
            </p>
            
            <div class="grid grid-cols-3 gap-3 w-full mb-8">
                <div v-for="drink in drinks" :key="drink.id" 
                     @click="selectedDrink = drink.id"
                     class="cursor-pointer border-2 rounded-xl p-3 flex flex-col items-center transition-all duration-300"
                     :class="selectedDrink === drink.id ? 'border-amber-500 bg-slate-800/80 shadow-[0_0_15px_rgba(245,158,11,0.3)]' : 'border-transparent bg-slate-800/40 hover:bg-slate-800/60'">
                    <img :src="drink.img" :alt="drink.name" class="w-full h-24 object-contain mb-3 rounded">
                    <span class="text-sm font-bold tracking-wide" :class="selectedDrink === drink.id ? 'text-amber-500' : 'text-slate-300'">{{ drink.name }}</span>
                </div>
            </div>
            
            <button @click="startQuiz" :disabled="!selectedDrink"
                    class="w-full py-4 rounded-xl font-bold text-lg tracking-wider transition-all duration-300"
                    :class="selectedDrink ? 'bg-gradient-to-r from-amber-600 to-orange-500 hover:from-amber-500 hover:to-orange-400 text-white shadow-lg' : 'bg-slate-700 text-slate-500 cursor-not-allowed'">
                診断をスタートする →
            </button>
        </div>

        <!-- ▼ 2. 質問画面 ▼ -->
        <div v-else-if="step === 'quiz'" class="w-full max-w-lg mt-6 mb-8">
            <!-- プログレスバー（進行状況） -->
            <div class="mb-8">
                <div class="text-amber-500 font-bold text-sm tracking-widest mb-3">Q{{ currentQuestionIndex + 1 }} / 6</div>
                <div class="w-full h-1.5 bg-slate-800/80 rounded-full overflow-hidden">
                    <div class="h-full bg-amber-500 transition-all duration-500" :style="{ width: ((currentQuestionIndex + 1) / 6 * 100) + '%' }"></div>
                </div>
            </div>

            <!-- 質問文 -->
            <h2 class="text-xl md:text-2xl font-bold mb-8 text-center leading-relaxed tracking-wide text-white drop-shadow-md">
                Q{{ currentQuestionIndex + 1 }}. {{ currentQuestion.text }}
            </h2>

            <!-- 選択肢 A / B -->
            <div class="space-y-5">
                <div v-for="(option, idx) in currentQuestion.options" :key="idx"
                     @click="answerQuestion"
                     class="glass-panel rounded-2xl overflow-hidden cursor-pointer hover:border-amber-500/80 hover:shadow-[0_0_20px_rgba(245,158,11,0.2)] transition-all duration-300 border border-slate-600/50">
                    <!-- ここがイラストを切らさない設定！ -->
                    <img :src="option.img" class="question-image p-2" alt="Option Image" @error="handleImageError">
                    
                    <div class="p-5 bg-slate-900/60 border-t border-slate-700/50">
                        <div class="text-amber-500 text-xs font-bold mb-2 tracking-widest">OPTION {{ idx === 0 ? 'A' : 'B' }}</div>
                        <div class="font-bold text-base text-slate-100 tracking-wide">{{ option.text }}</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ▼ 3. 診断完了（モックアップ） ▼ -->
        <div v-else-if="step === 'result'" class="w-full max-w-lg mt-20 p-8 glass-panel rounded-2xl flex flex-col items-center text-center">
            <h2 class="text-3xl font-bold text-amber-500 mb-6 tracking-widest">診断完了</h2>
            <p class="text-slate-300 mb-10 leading-relaxed text-lg">
                あなたにぴったりのお酒が見つかりました。<br>
                素敵な夜をお過ごしください。
            </p>
            <button @click="resetQuiz" class="px-10 py-4 bg-slate-700 hover:bg-slate-600 text-white rounded-full font-bold tracking-widest transition-all">
                最初からやり直す
            </button>
        </div>

    </div>

    <!-- アプリの裏側の仕組み（Vue.js） -->
    <script>
        const { createApp, ref, computed } = Vue;

        createApp({
            setup() {
                const step = ref('start'); // start, quiz, result
                const selectedDrink = ref('');
                const currentQuestionIndex = ref(0);
                
                const drinks = [
                    { id: 'wine', name: 'ワイン', img: 'wine.jpg' },
                    { id: 'sake', name: '日本酒', img: 'nihonsyu.jpg' },
                    { id: 'craft', name: 'クラフト酒', img: 'craft.jpg' }
                ];

                const questions = [
                    {
                        text: '今夜のあなたに一番近い気分は？',
                        options: [
                            { text: 'スカッと弾けて、今日をリセットしたい！', img: '1-1.jpg' },
                            { text: '静かにほっこり、今日を癒やしたい…', img: '1-2.jpg' }
                        ]
                    },
                    {
                        text: '合わせたいおつまみのイメージは？',
                        options: [
                            { text: 'しっかり味の効いた、お肉やチーズ', img: '2-1.jpg' },
                            { text: 'さっぱりとした、魚介や野菜', img: '2-2.jpg' }
                        ]
                    },
                    {
                        text: 'ふと嗅ぎたくなる、惹かれる香りは？',
                        options: [
                            { text: 'みずみずしい柑橘やフルーティーな香り', img: '3-1.jpg' },
                            { text: 'スパイシーなハーブや深みある木の香り', img: '3-2.jpg' }
                        ]
                    },
                    {
                        text: '休日の過ごし方で理想なのは？',
                        options: [
                            { text: '外に出てアクティブにリフレッシュ', img: '4-1.jpg' },
                            { text: 'お家で映画や読書をしながらのんびり', img: '4-2.jpg' }
                        ]
                    },
                    {
                        text: '今日の疲れ具合は？',
                        options: [
                            { text: 'まだまだ元気！これからが本番', img: '5-1.jpg' },
                            { text: 'もうクタクタ…早くベッドにダイブしたい', img: '5-2.jpg' }
                        ]
                    },
                    {
                        text: '飲むペースはどれくらいがいい？',
                        options: [
                            { text: 'ゴクゴク爽快に飲みたい！', img: '6-1.jpg' },
                            { text: 'ちびちび味わって飲みたい', img: '6-2.jpg' }
                        ]
                    }
                ];

                const currentQuestion = computed(() => questions[currentQuestionIndex.value]);

                const startQuiz = () => {
                    if (selectedDrink.value) step.value = 'quiz';
                    window.scrollTo(0, 0); // スタート時に一番上へ
                };

                const answerQuestion = () => {
                    if (currentQuestionIndex.value < questions.length - 1) {
                        currentQuestionIndex.value++;
                        document.querySelector('.app-container').scrollTo({ top: 0, behavior: 'smooth' });
                    } else {
                        step.value = 'result';
                    }
                };

                const resetQuiz = () => {
                    step.value = 'start';
                    selectedDrink.value = '';
                    currentQuestionIndex.value = 0;
                };

                // 万が一画像が読み込めない場合の代替表示
                const handleImageError = (e) => {
                    e.target.style.display = 'none';
                };

                return {
                    step, selectedDrink, drinks,
                    currentQuestionIndex, currentQuestion,
                    startQuiz, answerQuestion, resetQuiz, handleImageError
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
