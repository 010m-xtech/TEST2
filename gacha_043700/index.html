<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>速達生ビールガチャ</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black select-none" style="-webkit-tap-highlight-color: transparent;">
    <div id="root"></div>

    <script type="text/babel" data-type="module" data-presets="react">
        const { useState, useMemo, useEffect, useRef } = React;

        // --- 景品データ定義 (V2 新構造) ---
        // 文章を配列や改行コードに頼らず、プロパティとして完全に分離して文字消えを防ぐ
        const PRIZES = [
          { 
            id: 1, rank: '1等', prob: 1, 
            border: 'border-yellow-300', text: 'text-yellow-400',
            name: '【仮】特上黒毛和牛ロース',
            resultTitle: '1等当選おめでとう！', 
            giftText: '次回のサービス品となります！！',
            imgUrl: 'https://placehold.co/600x400/facc15/000000?text=1st+Prize+Menu+Image',
            soundType: 'fanfare'
          },
          { 
            id: 2, rank: '2等', prob: 5, 
            border: 'border-gray-400', text: 'text-gray-300',
            name: '【仮】名物！厚切り牛タン塩',
            resultTitle: '2等当選おめでとう！', 
            giftText: '次回のサービス品となります！！',
            imgUrl: 'https://placehold.co/600x400/9ca3af/000000?text=2nd+Prize+Menu+Image',
            soundType: 'fanfare'
          },
          { 
            id: 3, rank: '3等', prob: 20, 
            border: 'border-amber-600', text: 'text-amber-500',
            name: '【仮】特選もつ鍋 (2人前)',
            resultTitle: '3等当選おめでとう！', 
            giftText: '次回のサービス品となります！！',
            imgUrl: 'https://placehold.co/600x400/d97706/ffffff?text=3rd+Prize+Menu+Image',
            soundType: 'fanfare'
          },
          { 
            id: 4, rank: '4等', prob: 30, 
            border: 'border-blue-400', text: 'text-blue-300',
            name: '【仮】若鶏の唐揚げ',
            resultTitle: '4等当選おめでとう！', 
            giftText: '次回のサービス品となります！！',
            imgUrl: 'https://placehold.co/600x400/60a5fa/000000?text=4th+Prize+Menu+Image',
            soundType: 'fanfare'
          },
          { 
            id: 5, rank: '5等', prob: 44, 
            border: 'border-green-400', text: 'text-green-300',
            name: '【仮】やみつき塩キャベツ',
            resultTitle: '5等当選おめでとう！', 
            giftText: '次回のサービス品となります！！',
            imgUrl: 'https://placehold.co/600x400/4ade80/000000?text=5th+Prize+Menu+Image',
            soundType: 'fanfare'
          }
        ];

        // --- 黄金に輝くテキスト用スタイル ---
        const customStyles = `
        @keyframes floatUp {
          0% { transform: translateY(80px) scale(0.6); opacity: 0; }
          100% { transform: translateY(0) scale(1); opacity: 1; }
        }
        @keyframes shake {
          0%, 100% { transform: translateX(0); }
          25% { transform: translateX(-8px) rotate(-5deg); }
          75% { transform: translateX(8px) rotate(5deg); }
        }
        @keyframes popZoom {
          0% { transform: scale(0.5); opacity: 0; }
          70% { transform: scale(1.1); opacity: 1; }
          100% { transform: scale(1); opacity: 1; }
        }
        @keyframes imagePop {
          0% { transform: scale(0.1) translateY(100px) rotate(-10deg); opacity: 0; }
          60% { transform: scale(1.1) translateY(-20px) rotate(5deg); opacity: 1; }
          80% { transform: scale(0.95) translateY(10px) rotate(-2deg); }
          100% { transform: scale(1) translateY(0) rotate(0deg); opacity: 1; }
        }
        @keyframes riseUp {
          0% { transform: translateY(100vh) scale(0.3); opacity: 0; }
          10% { opacity: 0.8; }
          90% { opacity: 0.8; }
          100% { transform: translateY(-20vh) scale(1.5); opacity: 0; }
        }
        
        /* 🌟 変更箇所：透明度を使わず、直接濃い色で塗りつぶした完全な静止画サンバースト */
        .sunburst {
          background: repeating-conic-gradient(
            from 0deg,
            #000000 0deg,
            #000000 10deg,
            #3d2500 10deg,
            #211400 20deg
          );
        }
        
        .glass-highlight {
          background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0) 100%);
        }
        
        .gold-text-shimmer {
          background: linear-gradient(to bottom, #fff 0%, #fede53 30%, #f1ad04 70%, #9a6500 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          filter: drop-shadow(0px 2px 4px rgba(0, 0, 0, 0.8));
        }
        `;

        // --- ガチャマシンのコンポーネント ---
        const GachaMachine = ({ onPlay }) => {
            const [isImageLoaded, setIsImageLoaded] = useState(false);

            useEffect(() => {
                const timer = setTimeout(() => setIsImageLoaded(true), 3000);
                return () => clearTimeout(timer);
            }, []);

            return (
                <div 
                    className="flex flex-col items-center justify-center cursor-pointer group w-full h-[100dvh] touch-manipulation select-none" 
                    onClick={onPlay}
                >
                    <div className="relative w-full h-full transition-transform duration-300 active:scale-95 md:group-hover:scale-[1.02] flex items-center justify-center">
                        {!isImageLoaded && (
                            <div className="absolute inset-0 flex flex-col items-center justify-center z-20 bg-zinc-900/50 backdrop-blur-sm">
                                <div className="w-12 h-12 border-4 border-amber-500 border-t-transparent rounded-full animate-spin mb-4 shadow-[0_0_15px_rgba(245,158,11,0.5)]"></div>
                                <p className="text-amber-400 font-bold animate-pulse drop-shadow-md">ガチャ準備中...</p>
                            </div>
                        )}

                        <img 
                            src="https://010m-xtech.github.io/TEST2/gacha_043700/top.jpg"
                            alt="速達生ビールガチャ" 
                            className={`w-full h-full max-h-[100dvh] object-contain drop-shadow-[0_20px_50px_rgba(0,0,0,0.8)] transition-opacity duration-700 ease-in-out ${isImageLoaded ? 'opacity-100' : 'opacity-0'}`}
                            onLoad={() => setIsImageLoaded(true)}
                            onError={(e) => {
                                e.target.onerror = null;
                                e.target.src = "https://placehold.co/1080x1080/27272a/f59e0b?text=Tap+to+Start!%5Cn(Your+Image+Here)";
                                setIsImageLoaded(true);
                            }}
                        />
                        <div className="absolute inset-0 bg-white opacity-0 active:opacity-10 md:group-hover:opacity-10 transition-opacity duration-300 pointer-events-none"></div>
                        
                        {isImageLoaded && (
                            <div className="absolute z-30 flex flex-col items-center justify-center pointer-events-auto w-full px-4">
                                
                                {/* 🐼 かわいいパンダ2匹の追加 */}
                                <div className="flex justify-center gap-12 md:gap-20 -mb-4 z-10 w-[90%] max-w-[450px] md:max-w-2xl">
                                    {/* 左のパンダ */}
                                    <div className="w-16 h-12 md:w-24 md:h-16 bg-white rounded-t-full relative shadow-[-5px_-5px_15px_rgba(0,0,0,0.5)] origin-bottom animate-[shake_3s_ease-in-out_infinite]">
                                        <div className="absolute -top-3 -left-2 w-6 h-6 md:w-8 md:h-8 bg-zinc-800 rounded-full"></div>
                                        <div className="absolute -top-3 -right-2 w-6 h-6 md:w-8 md:h-8 bg-zinc-800 rounded-full"></div>
                                        <div className="absolute top-4 left-3 w-3 h-4 md:w-5 md:h-6 bg-zinc-800 rounded-full transform -rotate-12"></div>
                                        <div className="absolute top-4 right-3 w-3 h-4 md:w-5 md:h-6 bg-zinc-800 rounded-full transform rotate-12"></div>
                                        <div className="absolute top-7 left-1/2 -translate-x-1/2 w-2 h-1.5 md:w-3 md:h-2 bg-zinc-800 rounded-full"></div>
                                    </div>
                                    {/* 右のパンダ */}
                                    <div className="w-16 h-12 md:w-24 md:h-16 bg-white rounded-t-full relative shadow-[5px_-5px_15px_rgba(0,0,0,0.5)] origin-bottom animate-[shake_3s_ease-in-out_infinite_0.5s]">
                                        <div className="absolute -top-3 -left-2 w-6 h-6 md:w-8 md:h-8 bg-zinc-800 rounded-full"></div>
                                        <div className="absolute -top-3 -right-2 w-6 h-6 md:w-8 md:h-8 bg-zinc-800 rounded-full"></div>
                                        <div className="absolute top-4 left-3 w-3 h-4 md:w-5 md:h-6 bg-zinc-800 rounded-full transform -rotate-12"></div>
                                        <div className="absolute top-4 right-3 w-3 h-4 md:w-5 md:h-6 bg-zinc-800 rounded-full transform rotate-12"></div>
                                        <div className="absolute top-7 left-1/2 -translate-x-1/2 w-2 h-1.5 md:w-3 md:h-2 bg-zinc-800 rounded-full"></div>
                                    </div>
                                </div>

                                {/* 四角っぽく大きくしたえんじ色のボタン */}
                                <div className="bg-gradient-to-b from-[#b91c1c] via-[#991b1b] to-[#7f1d1d] hover:from-[#dc2626] hover:via-[#b91c1c] hover:to-[#991b1b] text-white font-black text-3xl md:text-5xl py-8 px-12 md:py-12 md:px-24 rounded-xl md:rounded-2xl shadow-[0_15px_30px_rgba(0,0,0,0.9),inset_0_2px_4px_rgba(255,255,255,0.4)] border-4 md:border-6 border-[#fca5a5] flex flex-col items-center w-[90%] max-w-[450px] md:max-w-2xl text-center transition-all duration-300 relative z-20">
                                    <span style={{ WebkitTextStroke: '1.5px rgba(0,0,0,0.6)', paintOrder: 'stroke fill' }} className="drop-shadow-xl tracking-wider whitespace-nowrap animate-pulse">
                                        タップしてスタート！
                                    </span>
                                    {/* ボタンの光沢エフェクト */}
                                    <div className="absolute top-0 left-0 w-full h-1/2 bg-gradient-to-b from-white/20 to-transparent rounded-t-lg md:rounded-t-xl pointer-events-none"></div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // --- 詐欺対策用の現在時刻表示コンポーネント ---
        const RealTimeClock = ({ onReset }) => {
            const [time, setTime] = useState(new Date());
            const [tapCount, setTapCount] = useState(0);

            useEffect(() => {
                const timer = setInterval(() => setTime(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);
            
            // 🌟 管理者用裏ワザ：5回連続タップでリセット
            const handleTap = () => {
                setTapCount(prev => {
                    if (prev + 1 >= 5) {
                        if (onReset) onReset();
                        return 0;
                    }
                    return prev + 1;
                });
            };

            const formattedTime = time.toLocaleString('ja-JP', { 
                year: 'numeric', month: '2-digit', day: '2-digit', 
                hour: '2-digit', minute: '2-digit', second: '2-digit' 
            });

            return (
                <div 
                    className="text-white font-mono text-xl sm:text-2xl md:text-3xl font-black tracking-widest drop-shadow-[0_3px_6px_rgba(0,0,0,0.95)] whitespace-nowrap cursor-pointer active:scale-95 transition-transform"
                    style={{ WebkitTextStroke: '0.8px black', paintOrder: 'stroke fill' }}
                    onClick={handleTap}
                >
                    {formattedTime}
                </div>
            );
        };

        // --- アプリケーションのメイン ---
        const App = () => {
          const [stage, setStage] = useState('idle');
          const [prizeId, setPrizeId] = useState(null);
          const [isLoaded, setIsLoaded] = useState(false); 
          
          const [shopName, setShopName] = useState("不明な店舗");
          const [deviceId, setDeviceId] = useState("");

          // 🌟 スプレッドシート送信用URL (発行いただいた新しいURLに更新)
          const GAS_URL = "https://script.google.com/macros/s/AKfycbxWTGHlWyT3STpyvr-2A2w_kqcqurPten7-gzyJn2jJg0b267mbbC0FdWzk_exT21neSg/exec";
          
          const videoRef = useRef(null);
          const audioCtxRef = useRef(null);

          // 🌟 常にメモリ上の最新のPRIZESマスタデータを直接参照する
          const activePrize = useMemo(() => {
              if (!prizeId) return null;
              return PRIZES.find(p => p.id === prizeId) || PRIZES[PRIZES.length - 1]; // 万が一見つからなければ最下位をフォールバック
          }, [prizeId]);

          useEffect(() => {
              // 🌟 ズル防止機能を無効化するため、ページを開くたびに強制的に履歴をリセットする
              localStorage.removeItem('beer_app_gacha_result_v2');
              localStorage.removeItem('beer_app_gacha_result');

              // 📱 端末IDの取得・生成
              let savedId = localStorage.getItem('beer_app_device_id');
              if (!savedId) {
                  savedId = 'dev_' + Date.now() + '_' + Math.random().toString(36).substring(2, 11);
                  localStorage.setItem('beer_app_device_id', savedId);
              }
              setDeviceId(savedId);

              // 🏪 店舗名の取得 (URLパラメータ ?shop=店舗名 から)
              const urlParams = new URLSearchParams(window.location.search);
              const shop = urlParams.get('shop') || "不明な店舗";
              setShopName(shop);

              // 📊 【送信処理】QR読込み（アクセス）ログをスプレッドシートへ送信
              const sendAccessLog = async () => {
                  try {
                      await fetch(GAS_URL, {
                          method: "POST",
                          mode: "no-cors",
                          body: JSON.stringify({ 
                              shop: shop, 
                              step: "QR読込み", 
                              deviceId: savedId,
                              time: new Date().toLocaleString('ja-JP')
                          })
                      });
                  } catch (e) { console.error("Access log send error:", e); }
              };
              sendAccessLog();

              setIsLoaded(true);
          }, []);

          const bubbles = useMemo(() => {
            return Array.from({ length: 400 }).map((_, i) => {
                const size = Math.random() * 20 + 5; 
                const left = Math.random() * 100;
                const duration = Math.random() * 4 + 2; 
                const delay = Math.random() * -10; 
                return { size, left, duration, delay };
            });
          }, []);

          const drawPrize = () => {
            const rand = Math.random() * 100;
            let sum = 0;
            for (const prize of PRIZES) {
                sum += prize.prob;
                if (rand <= sum) return prize;
            }
            return PRIZES[PRIZES.length - 1];
          };

          // 🌟 テスト・管理者用のリセット処理
          const handleReset = () => {
              localStorage.removeItem('beer_app_gacha_result_v2');
              setPrizeId(null);
              setStage('idle');
          };

          const playFanfare = (ctx) => {
              if (!ctx) return;
              try {
                  const playNote = (freq, startTime, duration) => {
                      const osc = ctx.createOscillator();
                      const gain = ctx.createGain();
                      osc.connect(gain);
                      gain.connect(ctx.destination);
                      osc.type = 'triangle'; 
                      osc.frequency.value = freq;
                      
                      gain.gain.setValueAtTime(0, startTime);
                      gain.gain.linearRampToValueAtTime(0.2, startTime + 0.05);
                      gain.gain.setValueAtTime(0.2, startTime + duration - 0.05);
                      gain.gain.linearRampToValueAtTime(0, startTime + duration);
                      
                      osc.start(startTime);
                  osc.stop(startTime + duration);
              };
              
              const now = ctx.currentTime;
              playNote(523.25, now, 0.15);
              playNote(659.25, now + 0.15, 0.15);
              playNote(783.99, now + 0.30, 0.15);
              playNote(1046.50, now + 0.45, 0.5);
          } catch (e) {
              console.error("Audio playback error:", e);
          }
      };

      useEffect(() => {
        if (stage === 'result' && activePrize) {
            // ファンファーレ再生
            if (activePrize.soundType === 'fanfare') {
                playFanfare(audioCtxRef.current);
            }
            
            // 📊 【送信処理】ガチャ結果ログをスプレッドシートへ送信
            const sendResultLog = async () => {
                try {
                    await fetch(GAS_URL, {
                        method: "POST",
                        mode: "no-cors",
                        body: JSON.stringify({ 
                            shop: shopName, 
                            step: "ガチャ結果", 
                            deviceId: deviceId,
                            gameResult: activePrize.rank + " (" + activePrize.name + ")",
                            time: new Date().toLocaleString('ja-JP')
                        })
                    });
                } catch (e) { console.error("Result log send error:", e); }
            };
            sendResultLog();
        }
      }, [stage, activePrize]); // eslint-disable-line react-hooks/exhaustive-deps

      const handlePlay = () => {
        if (stage !== 'idle') return;

            if (!audioCtxRef.current) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) {
                    audioCtxRef.current = new AudioContext();
                }
            }
            if (audioCtxRef.current && audioCtxRef.current.state === 'suspended') {
                audioCtxRef.current.resume();
            }

            if (navigator.vibrate) {
                navigator.vibrate([100, 50, 100]); 
            }
            
            const prize = drawPrize();
            setPrizeId(prize.id); 
            
            // 🌟 結果を保存しない（リロードで何度でも引けるようにする）
            // localStorage.setItem('beer_app_gacha_result_v2', prize.id.toString());
            setStage('playing_video');
            
            if (videoRef.current) {
                videoRef.current.currentTime = 0;
                videoRef.current.play().catch(e => {
                    console.error("動画の再生に失敗しました:", e);
                    setStage('result'); // プレビュー等で動画がない場合は結果画面へスキップ
                });
            }
          };

          if (!isLoaded) return null;

          return (
            <React.Fragment>
              <style>{customStyles}</style>
              
              {/* 🌟 変更箇所: 背景を黄色からトップ画像に合わせたピンク〜赤系に変更し、泡も馴染ませる */}
              <div className="min-h-screen bg-gradient-to-b from-[#eadddc] via-[#e2a8a6] to-[#d68585] font-sans overflow-x-hidden relative selection:bg-rose-800 selection:text-white">
                
                <div className="fixed inset-0 overflow-hidden pointer-events-none z-0">
                    {bubbles.map((bubble, i) => (
                        <div key={i}
                             className="absolute bottom-0 bg-white/40 rounded-full border border-white/20 backdrop-blur-[2px] shadow-[0_0_8px_rgba(255,255,255,0.4)]"
                             style={{
                                 width: `${bubble.size}px`, height: `${bubble.size}px`, left: `${bubble.left}%`,
                                 animation: `riseUp ${bubble.duration}s linear infinite ${bubble.delay}s`
                             }}
                        />
                    ))}
                    <div className="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-white/40 rounded-full blur-[100px] mix-blend-overlay"></div>
                    <div className="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-rose-600/20 rounded-full blur-[120px] mix-blend-color-burn"></div>
                </div>

                <div className="w-full mx-auto flex flex-col items-center justify-center min-h-[100dvh] relative z-10">
                    <div className="w-full h-[100dvh] flex justify-center items-center">
                        <GachaMachine onPlay={handlePlay} />
                    </div>
                </div>

                <div 
                    className={`fixed inset-0 bg-black z-50 flex items-center justify-center transition-opacity duration-300 ${stage === 'playing_video' ? 'opacity-100 pointer-events-auto' : 'opacity-0 pointer-events-none'}`}
                    style={{ visibility: stage === 'playing_video' ? 'visible' : 'hidden' }}
                >
                    <video 
                        ref={videoRef}
                        src="https://010m-xtech.github.io/TEST2/gacha_043700/ガチャ2.mp4"
                        className="w-full h-full object-contain"
                        playsInline
                        onEnded={() => setStage('result')}
                        onError={() => setStage('result')}
                    ></video>
                </div>

                {stage === 'result' && (
                    <div 
                        className="fixed inset-0 z-50 flex flex-col justify-between items-center p-4 overflow-y-auto min-h-[100dvh]"
                        style={{ backgroundColor: '#000000' }} 
                    >
                        
                        <div className="absolute inset-0 sunburst -z-10 pointer-events-none"></div>
                        
                        {activePrize && (
                            <div className="flex-grow flex flex-col items-center justify-center w-full max-w-[340px] md:max-w-xl py-4 animate-[popZoom_0.6s_cubic-bezier(0.175,0.885,0.32,1.275)_forwards]">
                                
                                {/* 🌟 写真を大きく見せるため、横並び(flex-row)から縦積み(flex-col)に変更 */}
                                <div className="flex flex-col items-center justify-center gap-4 mb-4 relative w-full">
                                    <div className={`w-20 h-20 md:w-24 md:h-24 rounded-full border-4 md:border-6 ${activePrize.border} flex flex-col items-center justify-center bg-zinc-900/95 ${activePrize.glow || 'shadow-[0_10px_40px_rgba(0,0,0,0.8)]'} relative z-10`}>
                                        <div className="absolute inset-0 rounded-full bg-gradient-to-b from-white/20 to-transparent pointer-events-none"></div>
                                        <span 
                                            className={`text-2xl md:text-4xl font-black ${activePrize.text} drop-shadow-[0_0_15px_rgba(255,255,255,0.4)] tracking-tighter`}
                                            style={{ WebkitTextStroke: '1.5px #000', paintOrder: 'stroke fill' }}
                                        >
                                            {activePrize.rank}
                                        </span>
                                    </div>
                                    
                                    {/* 大きな写真用コンテナ (4:3の比率) */}
                                    <div className="relative z-10 flex items-center justify-center w-full max-w-[280px] md:max-w-[400px] aspect-[4/3]">
                                        {activePrize.imgUrl ? (
                                            <img 
                                                src={activePrize.imgUrl} 
                                                alt={activePrize.rank} 
                                                className="w-full h-full object-cover rounded-2xl border-4 border-white/20 filter drop-shadow-[0_15px_25px_rgba(0,0,0,0.8)] animate-[imagePop_0.8s_cubic-bezier(0.175,0.885,0.32,1.275)_forwards]" 
                                            />
                                        ) : (
                                            <div className="w-full h-full filter drop-shadow-[0_15px_25px_rgba(0,0,0,0.8)] bg-zinc-800 rounded-3xl p-1.5 backdrop-blur-sm border border-white/10 relative flex items-center justify-center">
                                                <span className="text-white/50 font-bold">No Image</span>
                                            </div>
                                        )}
                                        <div className="absolute inset-0 bg-yellow-400 mix-blend-overlay animate-pulse rounded-full blur-2xl opacity-20 pointer-events-none"></div>
                                    </div>
                                </div>

                                {/* 商品名の表示領域 */}
                                {activePrize.name && (
                                    <h2 className={`text-2xl md:text-4xl font-black mb-4 drop-shadow-[0_5px_10px_rgba(0,0,0,0.9)] ${activePrize.text} tracking-tight text-center leading-tight`} style={{ WebkitTextStroke: '1.5px #000', paintOrder: 'stroke fill' }}>
                                        {activePrize.name}
                                    </h2>
                                )}
                                
                                <div className="bg-zinc-900/90 px-2 py-4 md:px-12 md:py-6 rounded-2xl border-2 border-amber-500/30 text-center backdrop-blur-md shadow-[0_15px_30px_rgba(0,0,0,0.8)] relative z-10 w-full overflow-hidden">
                                    
                                    <div className="text-xl md:text-4xl font-black text-yellow-400 tracking-tight leading-snug drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)] mb-3 md:mb-4">
                                        {activePrize.resultTitle}
                                    </div>
                                    
                                    <div className="w-full flex items-center justify-center">
                                        {/* 🌟 変更箇所: clampの下限を下げて(0.8rem)、スマホ画面でも左右が絶対に切れないように修正 */}
                                        <div className="font-black gold-text-shimmer tracking-tighter whitespace-nowrap text-[clamp(0.8rem,4vw,2.5rem)] w-full text-center px-1">
                                            {activePrize.giftText}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                        
                        <div className="w-full text-center pb-2 z-50">
                            {activePrize && <RealTimeClock onReset={handleReset} />}
                        </div>
                    </div>
                )}
              </div>
            </React.Fragment>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
