<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3Dカプセルトイ！カプセルステーション</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.6.0/confetti.browser.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body {
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      background: radial-gradient(circle at 50% 30%, #4a0404 0%, #200202 50%, #080000 100%);
    }

    /* 中華風の深紅＆黄金グラデーションと格子文様テクスチャ */
    .chinese-bg-glow {
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(circle at 50% 25%, rgba(136, 19, 55, 0.35) 0%, transparent 60%),
        radial-gradient(circle at 15% 40%, rgba(180, 83, 9, 0.2) 0%, transparent 50%),
        radial-gradient(circle at 85% 40%, rgba(180, 83, 9, 0.2) 0%, transparent 50%),
        radial-gradient(circle at 50% 85%, rgba(110, 11, 20, 0.35) 0%, transparent 60%);
      pointer-events-none;
      z-index: 1;
    }

    /* 中華風の幾何学格子シャドウオーバーレイ */
    .chinese-pattern-overlay {
      position: absolute;
      inset: 0;
      opacity: 0.08;
      background-image: 
        linear-gradient(45deg, #f59e0b 25%, transparent 25%), 
        linear-gradient(-45deg, #f59e0b 25%, transparent 25%), 
        linear-gradient(45deg, transparent 75%, #f59e0b 75%), 
        linear-gradient(-45deg, transparent 75%, #f59e0b 75%);
      background-size: 60px 60px;
      background-position: 0 0, 0 30px, 30px -30px, -30px 0px;
      pointer-events-none;
      z-index: 1;
    }

    .modal-enter {
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.65) translateY(20px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    @keyframes pulseHint {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.05); opacity: 1; filter: drop-shadow(0 0 10px rgba(245, 158, 11, 0.7)); }
    }

    .pulse-peek {
      animation: pulseHint 2.4s infinite;
    }

    /* 【重厚な四角形・濃いえんじ色＆金縁立体メタル銘板ボタン】 */
    .font-mincho {
      font-family: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "HGSMinchoE", "MS PMincho", serif;
    }

    .lux-metal-bezel-rect {
      background: linear-gradient(180deg, #b45309 0%, #78350f 50%, #451a03 100%);
      box-shadow: 
        0 14px 28px rgba(0, 0, 0, 0.85),
        0 0 25px rgba(185, 28, 28, 0.4),
        inset 0 1px 2px rgba(254, 240, 138, 0.7),
        inset 0 -2px 3px rgba(0, 0, 0, 0.9);
      border-radius: 16px;
    }

    .lux-3d-button-rect {
      background: linear-gradient(180deg, #991b1b 0%, #7f1d1d 25%, #4c0519 80%, #29020d 100%);
      box-shadow: 
        0 7px 0 #200208,
        0 10px 20px rgba(0, 0, 0, 0.8),
        inset 0 2px 3px rgba(254, 202, 202, 0.4),
        inset 0 -3px 5px rgba(0, 0, 0, 0.8);
      border: 1.5px solid #f59e0b;
      border-radius: 10px;
      transition: all 0.12s cubic-bezier(0.2, 0.8, 0.4, 1);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9), 0 -1px 1px rgba(254, 240, 138, 0.4);
    }

    .lux-3d-button-rect:hover {
      background: linear-gradient(180deg, #b91c1c 0%, #991b1b 25%, #5d0720 80%, #350311 100%);
      box-shadow: 
        0 7px 0 #200208,
        0 14px 26px rgba(220, 38, 38, 0.5),
        0 10px 20px rgba(0, 0, 0, 0.8),
        inset 0 2px 4px rgba(254, 202, 202, 0.6),
        inset 0 -3px 5px rgba(0, 0, 0, 0.7);
    }

    .lux-3d-button-rect:active {
      transform: scale(0.98);
      box-shadow: 
        0 4px 0 #200208,
        0 6px 10px rgba(0, 0, 0, 0.7),
        inset 0 2px 4px rgba(0, 0, 0, 0.6);
    }

    /* 1〜3等の金色の光線回転エフェクト */
    @keyframes raySpin {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }
    .sunburst {
      animation: raySpin 12s linear infinite;
    }
  </style>
</head>
<body class="w-screen h-screen m-0 p-0 text-white relative">
  <!-- 華やかな中華風背景グラデーション＆文様 -->
  <div class="chinese-bg-glow"></div>
  <div class="chinese-pattern-overlay"></div>

  <!-- 3D Canvas Container -->
  <div id="canvas-container" class="absolute inset-0 w-full h-full cursor-grab active:cursor-grabbing z-10"></div>

  <!-- 【新設】ensyutu.mp4 演出動画オーバーレイ（光の粒子とともにふわっと表示） -->
  <div id="video-overlay" class="fixed inset-0 z-45 flex items-center justify-center pointer-events-none opacity-0 transition-opacity duration-700 bg-black/95 backdrop-blur-md">

  <!-- 1〜3等用の金色の放射光線エフェクト -->
  <div id="gold-ray-overlay" class="fixed inset-0 pointer-events-none z-35 opacity-0 transition-opacity duration-500 flex items-center justify-center overflow-hidden">
    <div class="w-[200vw] h-[200vw] sunburst bg-[radial-gradient(circle,_rgba(251,191,36,0.42)_0%,_rgba(245,158,11,0.20)_35%,_transparent_70%)]"></div>
  </div>

  <!-- 操作ボタンエリア -->
  <!-- 1. Bottom Left: 横からのぞくボタン -->
  <div class="absolute bottom-5 left-4 sm:left-6 z-20">
    <button id="btn-peek" class="pulse-peek font-mincho px-4 py-2.5 rounded-full bg-gradient-to-b from-red-950 via-[#2d0505] to-[#150202] hover:brightness-110 active:scale-95 backdrop-blur-md border border-amber-400/50 text-xs sm:text-sm font-bold text-amber-200 tracking-wider shadow-[0_6px_16px_rgba(0,0,0,0.6)] flex items-center transition-all cursor-pointer">

  <!-- 2. ハンドル直上の真ん中：【濃いえんじ色＆金縁の重厚メタル仕様】明朝体・特大太字固定ボタン -->
  <div class="absolute top-[58%] sm:top-[57%] left-1/2 -translate-x-1/2 -translate-y-1/2 z-20 pointer-events-auto">
    <!-- 外周の重厚な真鍮ベゼル台座（四角形） -->
    <div class="lux-metal-bezel-rect p-2 sm:p-2.5 border-2 border-amber-400/80 shadow-[0_12px_30px_rgba(0,0,0,0.85)]">
      <!-- メインの3D立体大型四角形ボタン（濃いえんじ色＆金文字・特大太字） -->
      <button id="btn-spin" class="lux-3d-button-rect font-mincho px-10 sm:px-14 py-4 sm:py-5 min-w-[260px] sm:min-w-[340px] text-amber-200 font-black text-xl sm:text-2xl tracking-[0.25em] flex items-center justify-center cursor-pointer whitespace-nowrap">
        <span id="btn-spin-text" class="font-black drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)]">タップして回す</span>
      </button>
    </div>
  </div>

  <!-- Capsule Open Result Modal -->
  <div id="reward-modal" class="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center z-55 hidden p-4 cursor-pointer">
    <div class="bg-gradient-to-b from-red-950 via-slate-900 to-black border-2 border-amber-400/50 rounded-3xl p-6 max-w-sm w-full text-center shadow-[0_0_50px_rgba(220,38,38,0.5)] relative modal-enter overflow-hidden pointer-events-auto">
      <div id="modal-glow" class="absolute -inset-20 bg-amber-500/30 rounded-full blur-3xl pointer-events-none"></div>

      <div class="relative z-10 font-mincho">
        <!-- 等級バッジ -->
        <span id="reward-rarity" class="inline-block px-4 py-1.5 rounded-full text-xs font-black tracking-widest uppercase mb-2 bg-gradient-to-r from-amber-400 to-yellow-500 text-slate-950 shadow-lg border border-yellow-200/60">
          1等
        </span>
        <!-- 賞品アイコン -->
        <div id="reward-icon" class="text-7xl my-3 filter drop-shadow-2xl transform transition hover:scale-110 select-none">
          👑
        </div>
        <!-- 賞品名 -->
        <h2 id="reward-name" class="text-2xl font-black tracking-wide text-amber-200 mb-2 drop-shadow">
          1等：超豪華特賞ギフト
        </h2>
        <!-- 説明文 -->
        <p id="reward-flavor" class="text-xs text-amber-100/80 px-2 min-h-[40px] mb-4 leading-relaxed font-sans">
          おめでとうございます！最高峰のプレミアム特賞が当たりました！
        </p>
        
        <div class="text-[11px] text-amber-300/60 animate-pulse">
          タップして閉じる
        </div>
      </div>
    </div>
  </div>

  <script>
    // Confetti burst fallback（等級に応じたカラー展開）
    function triggerConfettiBurst(isGoldTier) {
      const colors = isGoldTier
        ? ['#f59e0b', '#fbbf24', '#fef08a', '#ef4444', '#dc2626', '#ffffff']
        : ['#ffffff', '#fecaca', '#fed7aa', '#fde047', '#f87171'];

      if (typeof confetti === 'function') {
        try {
          confetti({
            particleCount: isGoldTier ? 140 : 75,
            spread: isGoldTier ? 100 : 75,
            origin: { y: 0.6 },
            colors: colors
          });
          return;
        } catch (e) {}
      }

      const canvas = document.createElement('canvas');
      canvas.className = 'fixed inset-0 pointer-events-none z-50';
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      document.body.appendChild(canvas);
      const ctx = canvas.getContext('2d');

      const particles = [];
      const count = isGoldTier ? 110 : 55;
      for (let i = 0; i < count; i++) {
        particles.push({
          x: window.innerWidth * (0.35 + Math.random() * 0.3),
          y: window.innerHeight * 0.6,
          vx: (Math.random() - 0.5) * (isGoldTier ? 16 : 12),
          vy: -(Math.random() * 14 + 6),
          size: Math.random() * 10 + 5,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 360,
          rotSpeed: (Math.random() - 0.5) * 14,
          alpha: 1
        });
      }

      const startTime = performance.now();
      function renderParticles(currentTime) {
        const elapsed = (currentTime - startTime) / 1000;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let hasAlive = false;

        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.38;
          p.rotation += p.rotSpeed;
          if (elapsed > 0.8) p.alpha = Math.max(0, p.alpha - 0.025);
          if (p.alpha > 0) {
            hasAlive = true;
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate((p.rotation * Math.PI) / 180);
            ctx.globalAlpha = p.alpha;
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
            ctx.restore();
          }
        });

        if (hasAlive && elapsed < 2.5) {
          requestAnimationFrame(renderParticles);
        } else if (canvas.parentNode) {
          canvas.parentNode.removeChild(canvas);
        }
      }
      requestAnimationFrame(renderParticles);
    }

    // 等級データ（1等〜5等）
    const ITEMS = [
      {
        id: 'rank1',
        rank: 1,
        rarity: '1等',
        name: '1等：超豪華プレミアム特賞',
        icon: '👑',
        desc: 'おめでとうございます！！燦然と輝く最高峰の超豪華特賞です！',
        color: 0xf59e0b,
        tier: 'gold',
        rate: 5
      },
      {
        id: 'rank2',
        rank: 2,
        rarity: '2等',
        name: '2等：特選ゴールドギフト賞',
        icon: '🏆',
        desc: '大当選！贅沢なひとときをお届けするスペシャル賞品です！',
        color: 0xf59e0b,
        tier: 'gold',
        rate: 10
      },
      {
        id: 'rank3',
        rank: 3,
        rarity: '3等',
        name: '3等：スペシャルセレクト賞',
        icon: '🎁',
        desc: '大当たり！選りすぐりの人気アイテムをプレゼント！',
        color: 0xf59e0b,
        tier: 'gold',
        rate: 15
      },
      {
        id: 'rank4',
        rank: 4,
        rarity: '4等',
        name: '4等：ハッピーギフト賞',
        icon: '🎉',
        desc: '当選おめでとうございます！日常を彩る嬉しいアイテムです！',
        color: 0x38bdf8,
        tier: 'white',
        rate: 35
      },
      {
        id: 'rank5',
        rank: 5,
        rarity: '5等',
        name: '5等：ラッキー参加賞',
        icon: '✨',
        desc: 'ナイスチャレンジ！次回もワクワクをお楽しみに！',
        color: 0xffffff,
        tier: 'white',
        rate: 35
      }
    ];

    const RARITY_INFO = {
      '1等': { label: '★ 1等 特賞 ★', bg: 'bg-gradient-to-r from-amber-400 via-yellow-300 to-amber-500', text: 'text-amber-950', color: 0xf59e0b, glow: 'rgba(251, 191, 36, 0.95)' },
      '2等': { label: '★ 2等 ★', bg: 'bg-gradient-to-r from-amber-400 to-yellow-400', text: 'text-amber-950', color: 0xf59e0b, glow: 'rgba(245, 158, 11, 0.85)' },
      '3等': { label: '★ 3等 ★', bg: 'bg-gradient-to-r from-yellow-300 to-amber-400', text: 'text-amber-950', color: 0xf59e0b, glow: 'rgba(252, 211, 77, 0.75)' },
      '4等': { label: '4等', bg: 'bg-sky-500', text: 'text-white', color: 0x38bdf8, glow: 'rgba(56, 189, 248, 0.6)' },
      '5等': { label: '5等', bg: 'bg-slate-400', text: 'text-slate-950', color: 0xffffff, glow: 'rgba(255, 255, 255, 0.5)' }
    };

    // Tone.js Sound Synthesizer
    let synth, metalSynth, fanfareSynth;
    let audioReady = false;

    function initAudio() {
      if (audioReady) return;
      try {
        if (typeof Tone !== 'undefined') {
          Tone.start();
          synth = new Tone.PolySynth(Tone.Synth, {
            oscillator: { type: "triangle" },
            envelope: { attack: 0.01, decay: 0.1, sustain: 0.1, release: 0.5 }
          }).toDestination();
          synth.volume.value = -6;

          metalSynth = new Tone.MetalSynth({
            frequency: 250,
            envelope: { attack: 0.001, decay: 0.09, release: 0.06 },
            harmonicity: 3.2,
            modulationIndex: 22,
            resonance: 3200,
            octaves: 1.3
          }).toDestination();
          metalSynth.volume.value = -9;

          fanfareSynth = new Tone.PolySynth(Tone.Synth, {
            oscillator: { type: "sine" },
            envelope: { attack: 0.02, decay: 0.2, sustain: 0.3, release: 0.8 }
          }).toDestination();
          fanfareSynth.volume.value = -3;

          audioReady = true;
        }
      } catch (e) {}
    }

    function playCrankSound() {
      if (!audioReady || !metalSynth) return;
      try { metalSynth.triggerAttackRelease("D3", "16n"); } catch (e) {}
    }

    function playRotorClackSound() {
      if (!audioReady || !metalSynth) return;
      try { metalSynth.triggerAttackRelease("F#3", "32n"); } catch (e) {}
    }

    function playDispenseSound() {
      if (!audioReady || !synth) return;
      try {
        const now = Tone.now();
        synth.triggerAttackRelease("A4", "16n", now);
        synth.triggerAttackRelease("D5", "16n", now + 0.07);
      } catch (e) {}
    }

    function playOpenFanfare(rank) {
      if (!audioReady) return;
      try {
        const now = Tone.now();
        if (rank === 1 && fanfareSynth) {
          fanfareSynth.triggerAttackRelease(["D5", "F#5", "A5", "D6"], "8n", now);
          fanfareSynth.triggerAttackRelease(["E5", "G#5", "B5", "E6"], "8n", now + 0.18);
          fanfareSynth.triggerAttackRelease(["F#5", "A#5", "C#6", "F#6"], "8n", now + 0.36);
          fanfareSynth.triggerAttackRelease(["G5", "B5", "D6", "G6"], "2n", now + 0.54);
        } else if ((rank === 2 || rank === 3) && fanfareSynth) {
          fanfareSynth.triggerAttackRelease(["D5", "F#5", "A5"], "8n", now);
          fanfareSynth.triggerAttackRelease(["G5", "B5", "D6", "G6"], "4n", now + 0.2);
        } else if (rank === 4 && synth) {
          synth.triggerAttackRelease(["E5", "G5", "C6"], "8n", now);
          synth.triggerAttackRelease(["G5", "C6", "E6"], "8n", now + 0.15);
        } else if (synth) {
          synth.triggerAttackRelease(["C5", "E5", "G5"], "16n", now);
        }
      } catch (e) {}
    }

    // -------------------------------------------------------------
    // THREE.JS SCENE SETUP
    // -------------------------------------------------------------
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.outputEncoding = THREE.sRGBEncoding;
    container.appendChild(renderer.domElement);

    // 高級スタジオ環境反射マップ
    function createChineseStudioEnvironment() {
      const pmremGenerator = new THREE.PMREMGenerator(renderer);
      pmremGenerator.compileEquirectangularShader();

      const envScene = new THREE.Scene();
      envScene.background = new THREE.Color(0x200202);

      const lightBoxGeo = new THREE.PlaneGeometry(12, 12);
      const topLight = new THREE.Mesh(lightBoxGeo, new THREE.MeshBasicMaterial({ color: 0xffedd5, side: THREE.DoubleSide }));
      topLight.position.set(0, 10, 0);
      topLight.rotation.x = Math.PI / 2;
      envScene.add(topLight);

      const sideWarmLight = new THREE.Mesh(lightBoxGeo, new THREE.MeshBasicMaterial({ color: 0xf59e0b, side: THREE.DoubleSide }));
      sideWarmLight.position.set(10, 3, 5);
      sideWarmLight.rotation.y = -Math.PI / 2.5;
      envScene.add(sideWarmLight);

      const sideRedLight = new THREE.Mesh(lightBoxGeo, new THREE.MeshBasicMaterial({ color: 0x7f1d1d, side: THREE.DoubleSide }));
      sideRedLight.position.set(-10, 2, -3);
      sideRedLight.rotation.y = Math.PI / 2.5;
      envScene.add(sideRedLight);

      const envMap = pmremGenerator.fromScene(envScene).texture;
      pmremGenerator.dispose();
      return envMap;
    }
    scene.environment = createChineseStudioEnvironment();

    // スタジオ照明群
    const ambientLight = new THREE.AmbientLight(0xffedd5, 0.75);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0xfff1e0, 1.35);
    keyLight.position.set(4.5, 9, 6.5);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.width = 2048;
    keyLight.shadow.mapSize.height = 2048;
    keyLight.shadow.bias = -0.0005;
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0xf59e0b, 0.9);
    rimLight.position.set(-6, 3, -5);
    scene.add(rimLight);

    const spotDownLight = new THREE.SpotLight(0xffeedb, 1.4, 10, Math.PI / 4, 0.4, 1.2);
    spotDownLight.position.set(0, 5, 2.5);
    spotDownLight.target.position.set(0, 0, 0);
    scene.add(spotDownLight);
    scene.add(spotDownLight.target);

    const innerLight = new THREE.PointLight(0xffeedd, 1.4, 4.5);
    innerLight.position.set(0.35, 1.25, -0.2);
    scene.add(innerLight);

    const burstPointLight = new THREE.PointLight(0xffffff, 0, 12);
    burstPointLight.position.set(0, -1.35, 1.7);
    scene.add(burstPointLight);

    // 中華風背景オブジェクト
    const chineseBgGroup = new THREE.Group();
    scene.add(chineseBgGroup);

    // 1. 赤提灯
    const lanterns = [];
    function createChineseLantern(scale = 1.0) {
      const group = new THREE.Group();

      const bodyGeo = new THREE.SphereGeometry(0.38 * scale, 24, 20);
      bodyGeo.scale(1.0, 1.18, 1.0);
      const bodyMat = new THREE.MeshStandardMaterial({
        color: 0x6e0b14,
        roughness: 0.38,
        metalness: 0.08,
        emissive: 0x40050a,
        emissiveIntensity: 0.65
      });
      const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
      group.add(bodyMesh);

      const capGeo = new THREE.CylinderGeometry(0.18 * scale, 0.22 * scale, 0.08 * scale, 20);
      const capMat = new THREE.MeshStandardMaterial({
        color: 0xd97706,
        metalness: 0.85,
        roughness: 0.2
      });

      const topCap = new THREE.Mesh(capGeo, capMat);
      topCap.position.y = 0.44 * scale;
      group.add(topCap);

      const bottomCap = new THREE.Mesh(capGeo, capMat);
      bottomCap.position.y = -0.44 * scale;
      group.add(bottomCap);

    );
    dispensedCapsuleGroup.add(capsuleHitBox);

    const crankTargets = [handleHitBox, handleOuterRim, handleDish, bridge, capSphereA, capSphereB, dialPlate];
    const capsuleTargets = [capsuleHitBox, mainCapsuleTop, mainCapsuleBottom];

    // -------------------------------------------------------------
    // CAMERA & ORBIT (画面ドラッグによる回転を完全無効化し固定)
    // -------------------------------------------------------------
    let cameraAngle = 0;
    let cameraPitch = 0.08;
    let cameraDistance = 6.4;

    let targetAngle = 0;
    let targetPitch = 0.08;
    let targetDistance = 6.4;
    let isPeekingSide = false;

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();

    function updateCamera() {
      camera.position.x = Math.sin(cameraAngle) * cameraDistance * Math.cos(cameraPitch);
      camera.position.z = Math.cos(cameraAngle) * cameraDistance * Math.cos(cameraPitch);
      camera.position.y = 0.35 + cameraDistance * Math.sin(cameraPitch);
      camera.lookAt(0, 0.15, 0);
    }
    updateCamera();

    const btnPeek = document.getElementById('btn-peek');
    const btnPeekText = document.getElementById('btn-peek-text');

    btnPeek.addEventListener('click', (e) => {
      e.stopPropagation();
      initAudio();
      isPeekingSide = !isPeekingSide;

      if (isPeekingSide) {
        targetAngle = 1.36;
        targetPitch = 0.32;
        targetDistance = 4.8;
        btnPeekText.textContent = "正面にもどる";
      } else {
        targetAngle = 0;
        targetPitch = 0.08;
        targetDistance = 6.4;
        btnPeekText.textContent = "横からのぞく";
      }
    });

    });

    window.addEventListener('touchend', (e) => {
      if (e.changedTouches.length > 0) {
        handlePointerTap(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
      }
    }, { passive: true });

    // -------------------------------------------------------------

    let handleRotationTarget = 0;
    let drumRotationTarget = 0;
    let capsuleAnimationState = 'idle';
    let currentDispensedReward = null;
    let dropProgress = 0;
    let openProgress = 0;
    let shakeIntensity = 0;
    let isSpinning = false;

    const flashOverlay = document.getElementById('flash-overlay');
    const goldRayOverlay = document.getElementById('gold-ray-overlay');
    const videoOverlay = document.getElementById('video-overlay');
    const ensyutuVideo = document.getElementById('ensyutu-video');

    const btnSpin = document.getElementById('btn-spin');
    const btnSpinText = document.getElementById('btn-spin-text');

    // ボタンのテキストと状態制御
    function updateSpinButtonState() {
      if (capsuleAnimationState === 'dispensing' || isSpinning) {
        btnSpin.classList.add('cursor-not-allowed', 'pointer-events-none');
      } else if (capsuleAnimationState === 'ready_to_open') {
        btnSpinText.textContent = "タップしてあける";
        btnSpin.classList.remove('cursor-not-allowed', 'pointer-events-none');
      } else {
        btnSpinText.textContent = "タップして回す";
        btnSpin.classList.remove('cursor-not-allowed', 'pointer-events-none');
      }
    }

    btnSpin.addEventListener('click', (e) => {
      e.stopPropagation();
      if (capsuleAnimationState === 'ready_to_open') {
        openCurrentCapsule();
      } else if (!isSpinning && capsuleAnimationState === 'idle') {
        triggerSpin();
      }
    });

    function handlePointerTap(clientX, clientY) {
      pointer.x = (clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);

      if (capsuleAnimationState === 'ready_to_open') {
        const capHits = raycaster.intersectObjects(capsuleTargets, true);
        if (capHits.length > 0) {
          openCurrentCapsule();
          return;
        }
      }

      if (!isSpinning && capsuleAnimationState === 'idle') {
        const crankHits = raycaster.intersectObjects(crankTargets, true);
        if (crankHits.length > 0) {
          triggerSpin();
        }
      }
    }

    function triggerSpin() {
      if (isSpinning || capsuleAnimationState !== 'idle') return;
      initAudio();
      
      isSpinning = true;
      updateSpinButtonState();

      const dispensedCapData = rotorCapsules[activePocketIndex];
      currentDispensedReward = dispensedCapData.item;

      handleRotationTarget -= Math.PI * 2;
      shakeIntensity = 0.09;

      mainCapsuleTop.material.color.setHex(RARITY_INFO[currentDispensedReward.rarity].color);
      mainCapsuleTop.material.metalness = currentDispensedReward.tier === 'gold' ? 0.35 : 0.05;

      playCrankSound();
      setTimeout(playRotorClackSound, 140);
      setTimeout(playCrankSound, 280);

      const targetMesh = dispensedCapData.mesh;
      let fallProgress = 0;
      const originalY = targetMesh.position.y;

      const dropInterval = setInterval(() => {
        fallProgress += 0.18;
        targetMesh.position.y = originalY - fallProgress * 0.45;
        if (fallProgress >= 1.0) {
          clearInterval(dropInterval);
          targetMesh.visible = false;
        }
      }, 16);

      setTimeout(() => {
        drumRotationTarget += STEP_ANGLE;
      }, 120);

      setTimeout(() => {
        dispensedCapsuleGroup.visible = true;
        dispensedCapsuleGroup.position.set(0.44, -1.35, 0.95);
        mainCapsuleTop.position.set(0, 0, 0);
        mainCapsuleBottom.position.set(0, 0, 0);
        mainCapsuleTop.rotation.set(0, 0, 0);
        mainCapsuleBottom.rotation.set(0, 0, 0);
        dropProgress = 0;
        capsuleAnimationState = 'dispensing';
        playDispenseSound();

        setTimeout(() => {
          const newItem = drawItemByRate();
          dispensedCapData.item = newItem;
          targetMesh.topMat.color.setHex(RARITY_INFO[newItem.rarity].color);
          targetMesh.topMat.metalness = newItem.tier === 'gold' ? 0.35 : 0.05;
          targetMesh.position.y = 0.55;
          targetMesh.visible = true;

          activePocketIndex = (activePocketIndex + 1) % NUM_POCKETS;
        }, 340);
      }, 360);

    // 【シームレス演出】カプセル開封 → ensyutu.mp4 → 結果画面
    // =============================================================
    let isVideoPlaying = false;

    function openCurrentCapsule() {
      if (capsuleAnimationState !== 'ready_to_open') return;
      capsuleAnimationState = 'opening';
      openProgress = 0;
      updateSpinButtonState();

      const isGoldTier = currentDispensedReward?.tier === 'gold';

      // 1. カプセルから眩しい光を解き放つ
      burstPointLight.color.setHex(isGoldTier ? 0xfbbf24 : 0xffffff);
      burstPointLight.intensity = isGoldTier ? 7.0 : 4.5;
      burstPointLight.position.set(dispensedCapsuleGroup.position.x, dispensedCapsuleGroup.position.y, dispensedCapsuleGroup.position.z + 0.3);

      // 光のフラッシュアウト（カプセル開封の瞬間）
      if (isGoldTier) {
        flashOverlay.style.background = 'radial-gradient(circle at 50% 65%, rgba(254,240,138,1) 0%, rgba(245,158,11,0.95) 45%, rgba(220,38,38,0.95) 100%)';
        goldRayOverlay.classList.remove('opacity-0');
        goldRayOverlay.classList.add('opacity-100');
      } else {
        flashOverlay.style.background = 'radial-gradient(circle at 50% 65%, rgba(255,255,255,1) 0%, rgba(241,245,249,0.95) 55%, rgba(254,226,226,0.95) 100%)';
      }

      flashOverlay.classList.remove('opacity-0');
      flashOverlay.classList.add('opacity-100');

      // 2. 光の広がりの中から動画（ensyutu.mp4）をふわっとクロスフェード再生
      setTimeout(() => {
        startVideoSequence();
      }, 320);
    }

    function startVideoSequence() {
      if (!currentDispensedReward) return;
      isVideoPlaying = true;
      try {
        ensyutuVideo.currentTime = 0;
      } catch (e) {}

      // 動画再生を試行
      const playPromise = ensyutuVideo.play();

      if (playPromise !== undefined) {
        playPromise
          .then(() => {
            // 動画再生成功：ふわっとオーバーレイを表示
            videoOverlay.classList.remove('opacity-0');
            videoOverlay.classList.add('opacity-100');
            ensyutuVideo.classList.remove('scale-95');
            ensyutuVideo.classList.add('scale-100');

            // 背景フラッシュの光を徐々に引いて動画を際立たせる
            setTimeout(() => {
              flashOverlay.classList.remove('opacity-100');
              flashOverlay.classList.add('opacity-0');
            }, 300);
          })
          .catch((err) => {
            console.warn("動画の自動再生がブロックされたか、ファイルが存在しないためフォールバックします:", err);
            finishSequenceToReward();
          });
      } else {
        finishSequenceToReward();
      }
    }

    // 動画終了イベントハンドラ（再生中のみ処理）
    ensyutuVideo.onended = () => {
      if (isVideoPlaying || capsuleAnimationState === 'opening') {
        finishSequenceToReward();
      }
    };

    // 動画読み込みエラー時の安全フォールバック（初期ロード時の発火を無視し、演出中のみフォールバック）
    ensyutuVideo.onerror = () => {
      if (isVideoPlaying || capsuleAnimationState === 'opening') {
        console.warn("ensyutu.mp4 の読み込みまたは再生に失敗したため、直接結果画面へ遷移します。");
        finishSequenceToReward();
      }
    };

    // 3. 動画終了 → 光のディゾルブとともに結果モーダルへ移行
    function finishSequenceToReward() {
      if (!currentDispensedReward) return;
      if (!isVideoPlaying && capsuleAnimationState !== 'opening' && !rewardModal.classList.contains('hidden')) return;
      isVideoPlaying = false;

      const isGoldTier = currentDispensedReward.tier === 'gold';

      // 動画をふわっとフェードアウト
      videoOverlay.classList.remove('opacity-100');
      videoOverlay.classList.add('opacity-0');
      ensyutuVideo.classList.remove('scale-100');
      ensyutuVideo.classList.add('scale-95');

      // 柔らかな光とともにファンファーレと紙吹雪が炸裂！
      flashOverlay.classList.remove('opacity-0');
      flashOverlay.classList.add('opacity-80');

      playOpenFanfare(currentDispensedReward.rank);
      triggerConfettiBurst(isGoldTier);

      setTimeout(() => {
        burstPointLight.intensity = 0;
        flashOverlay.classList.remove('opacity-80');
        flashOverlay.classList.add('opacity-0');
        goldRayOverlay.classList.remove('opacity-100');
        goldRayOverlay.classList.add('opacity-0');

        // 結果モーダルの表示
        showRewardModal(currentDispensedReward);
      }, 450);
    }

    // Modal UI
    const rewardModal = document.getElementById('reward-modal');
    const rewardRarity = document.getElementById('reward-rarity');
    const rewardIcon = document.getElementById('reward-icon');
    const rewardName = document.getElementById('reward-name');
    const rewardFlavor = document.getElementById('reward-flavor');
    const rewardGlow = document.getElementById('modal-glow');

    function showRewardModal(item) {
      const rarityMeta = RARITY_INFO[item.rarity];
      rewardRarity.textContent = rarityMeta.label;
      rewardRarity.className = `inline-block px-4 py-1.5 rounded-full text-xs font-black tracking-widest uppercase mb-2 ${rarityMeta.bg} ${rarityMeta.text} shadow-lg border border-white/30`;
      rewardIcon.textContent = item.icon;
      rewardName.textContent = item.name;
      rewardFlavor.textContent = item.desc;
      rewardGlow.style.backgroundColor = rarityMeta.glow;

      rewardModal.classList.remove('hidden');
    }

    rewardModal.addEventListener('click', () => {
      rewardModal.classList.add('hidden');
      dispensedCapsuleGroup.visible = false;
      capsuleAnimationState = 'idle';
      isSpinning = false;
      currentDispensedReward = null;
      updateSpinButtonState();
    });

    // -------------------------------------------------------------
    // MAIN ANIMATION LOOP
    // -------------------------------------------------------------
    let clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      const elapsedTime = clock.getElapsedTime();

      cameraAngle += (targetAngle - cameraAngle) * 0.12;
      cameraPitch += (targetPitch - cameraPitch) * 0.12;
      cameraDistance += (targetDistance - cameraDistance) * 0.12;
      updateCamera();

      lanterns.forEach(lnt => {
        const swayX = Math.sin(elapsedTime * 1.8 + lnt.phase) * 0.06;
        const swayZ = Math.cos(elapsedTime * 1.4 + lnt.phase) * 0.04;
        const bounceY = Math.sin(elapsedTime * 2.2 + lnt.phase) * 0.03;
        lnt.group.position.y = lnt.basePos.y + bounceY;
        lnt.group.rotation.z = swayX;
        lnt.group.rotation.x = swayZ;
      });

      const positions = particleGeo.attributes.position.array;
      for (let i = 0; i < particleCount; i++) {
        const bp = particleBasePositions[i];
        const yOffset = Math.sin(elapsedTime * bp.speed + bp.phase) * 0.45;
        const xOffset = Math.cos(elapsedTime * (bp.speed * 0.5) + bp.phase) * 0.25;
        positions[i * 3] = bp.x + xOffset;
        positions[i * 3 + 1] = bp.y + yOffset;
      }
      particleGeo.attributes.position.needsUpdate = true;
      sparkPoints.rotation.y = elapsedTime * 0.015;

      outerStageRing.rotation.z = elapsedTime * 0.18;
      midStageRing.rotation.z = -elapsedTime * 0.25;

      moonGateGroup.position.y = 0.3 + Math.sin(elapsedTime * 0.8) * 0.04;

      rotatingHandle.rotation.z += (handleRotationTarget - rotatingHandle.rotation.z) * 0.14;
      drumRotorGroup.rotation.y += (drumRotationTarget - drumRotorGroup.rotation.y) * 0.12;

      rotorCapsules.forEach(cap => {
        if (cap.mesh.position.y > 0.05) {
          cap.mesh.position.y = Math.max(0.05, cap.mesh.position.y - delta * 2.0);
        }
      });

      if (shakeIntensity > 0.001) {
        gachaMachine.position.x = (Math.random() - 0.5) * shakeIntensity;
        gachaMachine.position.z = (Math.random() - 0.5) * shakeIntensity;
        shakeIntensity *= 0.92;

        stockCapsules.forEach(cap => {
          cap.mesh.position.x = cap.basePos.x + (Math.random() - 0.5) * 0.06;
          cap.mesh.position.y = cap.basePos.y + Math.sin(elapsedTime * 24 + cap.phase) * 0.05;
          cap.mesh.rotation.x += 0.1;
        });
      } else {
        gachaMachine.position.x = 0;
        gachaMachine.position.z = 0;

        stockCapsules.forEach(cap => {
          cap.mesh.position.y = cap.basePos.y + Math.sin(elapsedTime * 1.5 + cap.phase) * 0.008;
        });
      }

      if (capsuleAnimationState === 'dispensing') {
        dropProgress += delta * 2.2;
        const t = Math.min(1.0, dropProgress);
        dispensedCapsuleGroup.position.x = 0.44 - t * 0.44;
        dispensedCapsuleGroup.position.y = -1.45 + Math.sin(t * Math.PI) * 0.28;
        dispensedCapsuleGroup.position.z = 0.95 + t * 0.75;
        dispensedCapsuleGroup.rotation.x = t * Math.PI * 2.8;
        dispensedCapsuleGroup.rotation.y = t * Math.PI;

        if (t >= 1.0) {
          capsuleAnimationState = 'ready_to_open';
          updateSpinButtonState();
        }
      } else if (capsuleAnimationState === 'ready_to_open') {
        dispensedCapsuleGroup.position.y = -1.45 + Math.abs(Math.sin(elapsedTime * 6)) * 0.1;
        dispensedCapsuleGroup.rotation.y += 0.03;
      } else if (capsuleAnimationState === 'opening') {
        openProgress += delta * 3.5;
        const p = Math.min(1.0, openProgress);
        mainCapsuleTop.position.y = p * 0.5;
        mainCapsuleTop.rotation.z = p * 0.8;
        mainCapsuleBottom.position.y = -p * 0.3;
        mainCapsuleBottom.rotation.z = -p * 0.4;
      }

      floorStandGroup.rotation.y += 0.0006;

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    window.onload = function() {
      animate();
      updateSpinButtonState();
    };
  </script>
</body>
</html>
