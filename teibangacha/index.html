<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3Dカプセルトイ！カプセルステーション</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.6.0/confetti.browser.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body {
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #0f172a 45%, #030712 100%);
    }

    /* 華やかな動的ネオンオーロラ背景エフェクト */
    .neon-bg-glow {
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(circle at 20% 30%, rgba(99, 102, 241, 0.22) 0%, transparent 50%),
        radial-gradient(circle at 80% 25%, rgba(236, 72, 153, 0.22) 0%, transparent 50%),
        radial-gradient(circle at 50% 85%, rgba(14, 165, 233, 0.25) 0%, transparent 55%),
        radial-gradient(circle at 50% 45%, rgba(245, 158, 11, 0.12) 0%, transparent 60%);
      animation: auroraShift 10s ease-in-out infinite alternate;
      pointer-events-none;
      z-index: 1;
    }

    @keyframes auroraShift {
      0% { transform: scale(1) rotate(0deg); opacity: 0.85; filter: hue-rotate(0deg); }
      50% { transform: scale(1.08) rotate(1deg); opacity: 1; filter: hue-rotate(15deg); }
      100% { transform: scale(1) rotate(-1deg); opacity: 0.85; filter: hue-rotate(-15deg); }
    }

    .modal-enter {
      animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.6) translateY(20px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    @keyframes pulseHint {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.05); opacity: 1; filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.6)); }
    }

    .pulse-peek {
      animation: pulseHint 2.4s infinite;
    }

    /* 1〜3等の金色の光線回転エフェクト */
    @keyframes raySpin {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }
    .sunburst {
      animation: raySpin 12s linear infinite;
    }
  </style>
</head>
<body class="w-screen h-screen m-0 p-0 text-white relative">
  <!-- 華やかな動的ネオンオーロラ背景レイヤー -->
  <div class="neon-bg-glow"></div>

  <!-- 3D Canvas Container -->
  <div id="canvas-container" class="absolute inset-0 w-full h-full cursor-grab active:cursor-grabbing z-10"></div>

  <!-- 全画面フラッシュアウト演出レイヤー -->
  <div id="flash-overlay" class="fixed inset-0 pointer-events-none z-40 opacity-0 transition-opacity duration-300"></div>

  <!-- 1〜3等用の金色の放射光線エフェクト -->
  <div id="gold-ray-overlay" class="fixed inset-0 pointer-events-none z-35 opacity-0 transition-opacity duration-500 flex items-center justify-center overflow-hidden">
    <div class="w-[200vw] h-[200vw] sunburst bg-[radial-gradient(circle,_rgba(251,191,36,0.38)_0%,_rgba(245,158,11,0.18)_35%,_transparent_70%)]"></div>
  </div>

  <!-- Minimal Guide Overlay -->
  <div id="guide-bubble" class="absolute top-4 left-0 right-0 flex justify-center pointer-events-none z-30 transition-opacity duration-300">
    <div class="px-5 py-2 rounded-full bg-black/75 backdrop-blur-md border border-sky-400/40 text-sm font-bold text-sky-200 shadow-[0_0_20px_rgba(56,189,248,0.25)] flex items-center space-x-2">
      <span class="animate-bounce inline-block">👆</span>
      <span id="guide-text">ハンドルをタップして回そう！</span>
    </div>
  </div>

  <!-- Bottom Left: 横からのぞくボタン -->
  <div class="absolute bottom-6 left-5 z-20">
    <button id="btn-peek" class="pulse-peek px-4 py-2.5 rounded-full bg-slate-900/85 hover:bg-slate-800 active:scale-95 backdrop-blur-md border border-sky-400/50 text-xs sm:text-sm font-bold text-sky-200 shadow-xl flex items-center space-x-2 transition-all cursor-pointer">
      <span class="text-base">👀</span>
      <span id="btn-peek-text">横からのぞく</span>
    </button>
  </div>

  <div class="absolute bottom-6 right-5 text-right text-[11px] text-white/60 pointer-events-none z-20 hidden sm:block bg-black/40 px-3 py-1 rounded-full backdrop-blur-sm border border-white/10">
    ドラッグで視点回転 / スクロール・ピンチでズーム
  </div>

  <!-- Capsule Open Result Modal -->
  <div id="reward-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center z-50 hidden p-4 cursor-pointer">
    <div class="bg-gradient-to-b from-slate-900 via-indigo-950 to-slate-950 border-2 border-white/20 rounded-3xl p-6 max-w-sm w-full text-center shadow-2xl relative modal-enter overflow-hidden pointer-events-auto">
      <div id="modal-glow" class="absolute -inset-20 bg-amber-500/25 rounded-full blur-3xl pointer-events-none"></div>

      <div class="relative z-10">
        <!-- 等級バッジ -->
        <span id="reward-rarity" class="inline-block px-4 py-1.5 rounded-full text-xs font-black tracking-widest uppercase mb-2 bg-gradient-to-r from-amber-400 to-yellow-500 text-slate-950 shadow-lg border border-yellow-200/50">
          1等
        </span>
        <!-- 賞品アイコン -->
        <div id="reward-icon" class="text-7xl my-3 filter drop-shadow-2xl transform transition hover:scale-110 select-none">
          👑
        </div>
        <!-- 賞品名 -->
        <h2 id="reward-name" class="text-2xl font-black tracking-wide text-white mb-2 drop-shadow">
          1等：超豪華特賞ギフト
        </h2>
        <!-- 説明文 -->
        <p id="reward-flavor" class="text-xs text-white/75 px-2 min-h-[40px] mb-4 leading-relaxed">
          おめでとうございます！最高峰のプレミアム特賞が当たりました！
        </p>
        
        <div class="text-[11px] text-white/50 animate-pulse">
          タップして閉じる
        </div>
      </div>
    </div>
  </div>

  <script>
    // Confetti burst fallback（等級に応じたカラー展開）
    function triggerConfettiBurst(isGoldTier) {
      const colors = isGoldTier
        ? ['#f59e0b', '#fbbf24', '#fef08a', '#d97706', '#ffffff', '#eab308']
        : ['#ffffff', '#e2e8f0', '#93c5fd', '#38bdf8', '#cbd5e1'];

      if (typeof confetti === 'function') {
        try {
          confetti({
            particleCount: isGoldTier ? 130 : 70,
            spread: isGoldTier ? 95 : 70,
            origin: { y: 0.6 },
            colors: colors
          });
          return;
        } catch (e) {}
      }

      const canvas = document.createElement('canvas');
      canvas.className = 'fixed inset-0 pointer-events-none z-50';
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      document.body.appendChild(canvas);
      const ctx = canvas.getContext('2d');

      const particles = [];
      const count = isGoldTier ? 100 : 50;
      for (let i = 0; i < count; i++) {
        particles.push({
          x: window.innerWidth * (0.35 + Math.random() * 0.3),
          y: window.innerHeight * 0.6,
          vx: (Math.random() - 0.5) * (isGoldTier ? 16 : 12),
          vy: -(Math.random() * 14 + 6),
          size: Math.random() * 10 + 5,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 360,
          rotSpeed: (Math.random() - 0.5) * 14,
          alpha: 1
        });
      }

      const startTime = performance.now();
      function renderParticles(currentTime) {
        const elapsed = (currentTime - startTime) / 1000;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let hasAlive = false;

        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.38;
          p.rotation += p.rotSpeed;
          if (elapsed > 0.8) p.alpha = Math.max(0, p.alpha - 0.025);
          if (p.alpha > 0) {
            hasAlive = true;
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate((p.rotation * Math.PI) / 180);
            ctx.globalAlpha = p.alpha;
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
            ctx.restore();
          }
        });

        if (hasAlive && elapsed < 2.5) {
          requestAnimationFrame(renderParticles);
        } else if (canvas.parentNode) {
          canvas.parentNode.removeChild(canvas);
        }
      }
      requestAnimationFrame(renderParticles);
    }

    // =============================================================
    // 等級データ（1等〜5等）
    // =============================================================
    const ITEMS = [
      {
        id: 'rank1',
        rank: 1,
        rarity: '1等',
        name: '1等：超豪華プレミアム特賞',
        icon: '👑',
        desc: 'おめでとうございます！！燦然と輝く最高峰の超豪華特賞です！',
        color: 0xf59e0b,
        tier: 'gold',
        rate: 5
      },
      {
        id: 'rank2',
        rank: 2,
        rarity: '2等',
        name: '2等：特選ゴールドギフト賞',
        icon: '🏆',
        desc: '大当選！贅沢なひとときをお届けするスペシャル賞品です！',
        color: 0xf59e0b,
        tier: 'gold',
        rate: 10
      },
      {
        id: 'rank3',
        rank: 3,
        rarity: '3等',
        name: '3等：スペシャルセレクト賞',
        icon: '🎁',
        desc: '大当たり！選りすぐりの人気アイテムをプレゼント！',
        color: 0xf59e0b,
        tier: 'gold',
        rate: 15
      },
      {
        id: 'rank4',
        rank: 4,
        rarity: '4等',
        name: '4等：ハッピーギフト賞',
        icon: '🎉',
        desc: '当選おめでとうございます！日常を彩る嬉しいアイテムです！',
        color: 0x38bdf8,
        tier: 'white',
        rate: 35
      },
      {
        id: 'rank5',
        rank: 5,
        rarity: '5等',
        name: '5等：ラッキー参加賞',
        icon: '✨',
        desc: 'ナイスチャレンジ！次回もワクワクをお楽しみに！',
        color: 0xffffff,
        tier: 'white',
        rate: 35
      }
    ];

    const RARITY_INFO = {
      '1等': { label: '★ 1等 特賞 ★', bg: 'bg-gradient-to-r from-amber-400 via-yellow-300 to-amber-500', text: 'text-amber-950', color: 0xf59e0b, glow: 'rgba(251, 191, 36, 0.95)' },
      '2等': { label: '★ 2等 ★', bg: 'bg-gradient-to-r from-amber-400 to-yellow-400', text: 'text-amber-950', color: 0xf59e0b, glow: 'rgba(245, 158, 11, 0.85)' },
      '3等': { label: '★ 3等 ★', bg: 'bg-gradient-to-r from-yellow-300 to-amber-400', text: 'text-amber-950', color: 0xf59e0b, glow: 'rgba(252, 211, 77, 0.75)' },
      '4等': { label: '4等', bg: 'bg-sky-500', text: 'text-white', color: 0x38bdf8, glow: 'rgba(56, 189, 248, 0.6)' },
      '5等': { label: '5等', bg: 'bg-slate-400', text: 'text-slate-950', color: 0xffffff, glow: 'rgba(255, 255, 255, 0.5)' }
    };

    // Tone.js Sound Synthesizer
    let synth, metalSynth, fanfareSynth;
    let audioReady = false;

    function initAudio() {
      if (audioReady) return;
      try {
        if (typeof Tone !== 'undefined') {
          Tone.start();
          synth = new Tone.PolySynth(Tone.Synth, {
            oscillator: { type: "triangle" },
            envelope: { attack: 0.01, decay: 0.1, sustain: 0.1, release: 0.5 }
          }).toDestination();
          synth.volume.value = -6;

          metalSynth = new Tone.MetalSynth({
            frequency: 250,
            envelope: { attack: 0.001, decay: 0.09, release: 0.06 },
            harmonicity: 3.2,
            modulationIndex: 22,
            resonance: 3200,
            octaves: 1.3
          }).toDestination();
          metalSynth.volume.value = -9;

          fanfareSynth = new Tone.PolySynth(Tone.Synth, {
            oscillator: { type: "sine" },
            envelope: { attack: 0.02, decay: 0.2, sustain: 0.3, release: 0.8 }
          }).toDestination();
          fanfareSynth.volume.value = -3;

          audioReady = true;
        }
      } catch (e) {}
    }

    function playCrankSound() {
      if (!audioReady || !metalSynth) return;
      try { metalSynth.triggerAttackRelease("D3", "16n"); } catch (e) {}
    }

    function playRotorClackSound() {
      if (!audioReady || !metalSynth) return;
      try { metalSynth.triggerAttackRelease("F#3", "32n"); } catch (e) {}
    }

    function playDispenseSound() {
      if (!audioReady || !synth) return;
      try {
        const now = Tone.now();
        synth.triggerAttackRelease("A4", "16n", now);
        synth.triggerAttackRelease("D5", "16n", now + 0.07);
      } catch (e) {}
    }

    function playOpenFanfare(rank) {
      if (!audioReady) return;
      try {
        const now = Tone.now();
        if (rank === 1 && fanfareSynth) {
          fanfareSynth.triggerAttackRelease(["D5", "F#5", "A5", "D6"], "8n", now);
          fanfareSynth.triggerAttackRelease(["E5", "G#5", "B5", "E6"], "8n", now + 0.18);
          fanfareSynth.triggerAttackRelease(["F#5", "A#5", "C#6", "F#6"], "8n", now + 0.36);
          fanfareSynth.triggerAttackRelease(["G5", "B5", "D6", "G6"], "2n", now + 0.54);
        } else if ((rank === 2 || rank === 3) && fanfareSynth) {
          fanfareSynth.triggerAttackRelease(["D5", "F#5", "A5"], "8n", now);
          fanfareSynth.triggerAttackRelease(["G5", "B5", "D6", "G6"], "4n", now + 0.2);
        } else if (rank === 4 && synth) {
          synth.triggerAttackRelease(["E5", "G5", "C6"], "8n", now);
          synth.triggerAttackRelease(["G5", "C6", "E6"], "8n", now + 0.15);
        } else if (synth) {
          synth.triggerAttackRelease(["C5", "E5", "G5"], "16n", now);
        }
      } catch (e) {}
    }

    // -------------------------------------------------------------
    // THREE.JS SCENE SETUP
    // -------------------------------------------------------------
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    renderer.outputEncoding = THREE.sRGBEncoding;
    container.appendChild(renderer.domElement);

    // 高級スタジオ環境反射マップ
    function createStudioEnvironment() {
      const pmremGenerator = new THREE.PMREMGenerator(renderer);
      pmremGenerator.compileEquirectangularShader();

      const envScene = new THREE.Scene();
      envScene.background = new THREE.Color(0x0f172a);

      const lightBoxGeo = new THREE.PlaneGeometry(12, 12);
      const topLight = new THREE.Mesh(lightBoxGeo, new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide }));
      topLight.position.set(0, 10, 0);
      topLight.rotation.x = Math.PI / 2;
      envScene.add(topLight);

      const sideWarmLight = new THREE.Mesh(lightBoxGeo, new THREE.MeshBasicMaterial({ color: 0xffeedd, side: THREE.DoubleSide }));
      sideWarmLight.position.set(10, 3, 5);
      sideWarmLight.rotation.y = -Math.PI / 2.5;
      envScene.add(sideWarmLight);

      const sideCoolLight = new THREE.Mesh(lightBoxGeo, new THREE.MeshBasicMaterial({ color: 0x38bdf8, side: THREE.DoubleSide }));
      sideCoolLight.position.set(-10, 2, -3);
      sideCoolLight.rotation.y = Math.PI / 2.5;
      envScene.add(sideCoolLight);

      const envMap = pmremGenerator.fromScene(envScene).texture;
      pmremGenerator.dispose();
      return envMap;
    }
    const studioEnvMap = createStudioEnvironment();
    scene.environment = studioEnvMap;

    // スタジオ照明群
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0xfff8ed, 1.25);
    keyLight.position.set(4.5, 9, 6.5);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.width = 2048;
    keyLight.shadow.mapSize.height = 2048;
    keyLight.shadow.bias = -0.0005;
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0x7dd3fc, 0.85);
    rimLight.position.set(-6, 3, -5);
    scene.add(rimLight);

    const spotDownLight = new THREE.SpotLight(0xffeedb, 1.4, 10, Math.PI / 4, 0.4, 1.2);
    spotDownLight.position.set(0, 5, 2.5);
    spotDownLight.target.position.set(0, 0, 0);
    scene.add(spotDownLight);
    scene.add(spotDownLight.target);

    // 内部奥側の穴と次弾カプセルを照らすライト
    const innerLight = new THREE.PointLight(0xffeedd, 1.4, 4.5);
    innerLight.position.set(0.35, 1.25, -0.2);
    scene.add(innerLight);

    // カプセル開封時に放たれるダイナミック光源
    const burstPointLight = new THREE.PointLight(0xffffff, 0, 12);
    burstPointLight.position.set(0, -1.35, 1.7);
    scene.add(burstPointLight);

    // =============================================================
    // 【盛り上がる背景演出】キラキラ光の粒子 ＆ ステージ演出
    // =============================================================
    const bgEffectGroup = new THREE.Group();
    scene.add(bgEffectGroup);

    // 1. 空間を漂うキラキラ光の粒子（スパークルダスト）
    const particleCount = 280;
    const particleGeo = new THREE.BufferGeometry();
    const particlePositions = new Float32Array(particleCount * 3);
    const particleColors = new Float32Array(particleCount * 3);
    const particleBasePositions = [];

    const sparkPalette = [
      new THREE.Color(0xfbbf24), // ゴールド
      new THREE.Color(0x38bdf8), // シアン
      new THREE.Color(0xf472b6), // マゼンタ
      new THREE.Color(0xffffff), // ホワイト
      new THREE.Color(0xa78bfa)  // パープル
    ];

    for (let i = 0; i < particleCount; i++) {
      // マシンの周囲から背景奥にかけてふわふわ広がる範囲
      const x = (Math.random() - 0.5) * 14;
      const y = (Math.random() - 0.5) * 10 + 0.5;
      const z = (Math.random() - 0.5) * 10 - 2.0;

      particlePositions[i * 3] = x;
      particlePositions[i * 3 + 1] = y;
      particlePositions[i * 3 + 2] = z;

      particleBasePositions.push({ x, y, z, phase: Math.random() * Math.PI * 2, speed: 0.8 + Math.random() * 1.5 });

      const col = sparkPalette[i % sparkPalette.length];
      particleColors[i * 3] = col.r;
      particleColors[i * 3 + 1] = col.g;
      particleColors[i * 3 + 2] = col.b;
    }

    particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
    particleGeo.setAttribute('color', new THREE.BufferAttribute(particleColors, 3));

    // 光の粒のテクスチャ（丸くふんわり発光するCanvasプロシージャルテクスチャ）
    function createGlowPointTexture() {
      const cv = document.createElement('canvas');
      cv.width = 64;
      cv.height = 64;
      const c = cv.getContext('2d');
      const grad = c.createRadialGradient(32, 32, 0, 32, 32, 32);
      grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
      grad.addColorStop(0.3, 'rgba(255, 255, 255, 0.8)');
      grad.addColorStop(0.65, 'rgba(255, 255, 255, 0.25)');
      grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
      c.fillStyle = grad;
      c.fillRect(0, 0, 64, 64);
      return new THREE.CanvasTexture(cv);
    }

    const particleMat = new THREE.PointsMaterial({
      size: 0.18,
      map: createGlowPointTexture(),
      vertexColors: true,
      transparent: true,
      opacity: 0.85,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    const sparkPoints = new THREE.Points(particleGeo, particleMat);
    bgEffectGroup.add(sparkPoints);

    // 2. マシン足元に広がる光の特設ステージリング（光彩サークル）
    const stageRingGroup = new THREE.Group();
    stageRingGroup.position.y = -2.26;
    bgEffectGroup.add(stageRingGroup);

    // 発光する同心円リング（ネオンブルー＆マゼンタ）
    const ringMatCyan = new THREE.MeshBasicMaterial({ color: 0x0ea5e9, transparent: true, opacity: 0.55 });
    const ringMatPink = new THREE.MeshBasicMaterial({ color: 0xec4899, transparent: true, opacity: 0.45 });
    const ringMatGold = new THREE.MeshBasicMaterial({ color: 0xf59e0b, transparent: true, opacity: 0.4 });

    const outerStageRing = new THREE.Mesh(new THREE.RingGeometry(3.2, 3.28, 48), ringMatCyan);
    outerStageRing.rotation.x = -Math.PI / 2;
    stageRingGroup.add(outerStageRing);

    const midStageRing = new THREE.Mesh(new THREE.RingGeometry(3.6, 3.65, 48), ringMatPink);
    midStageRing.rotation.x = -Math.PI / 2;
    stageRingGroup.add(midStageRing);

    const accentStageRing = new THREE.Mesh(new THREE.RingGeometry(4.1, 4.14, 48), ringMatGold);
    accentStageRing.rotation.x = -Math.PI / 2;
    stageRingGroup.add(accentStageRing);

    // 3. マシン背面で交差するステージムービングライトビーム（2本の光の柱）
    const beamMat1 = new THREE.MeshBasicMaterial({
      color: 0x6366f1,
      transparent: true,
      opacity: 0.14,
      blending: THREE.AdditiveBlending,
      side: THREE.DoubleSide,
      depthWrite: false
    });
    const beamMat2 = new THREE.MeshBasicMaterial({
      color: 0xec4899,
      transparent: true,
      opacity: 0.12,

    // Handle Dial Texture
    function createHandleDialTexture() {
      const cv = document.createElement('canvas');
      cv.width = 512;
      cv.height = 512;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#f4f1ea';
      ctx.fillRect(0, 0, 512, 512);

      const cx = 256, cy = 256, rOuter = 230, rInner = 160;
      ctx.beginPath();
      ctx.arc(cx, cy, rOuter, 0, Math.PI * 2);
      ctx.arc(cx, cy, rInner, 0, Math.PI * 2, true);
      ctx.fillStyle = '#005bac';
      ctx.fill();

      ctx.strokeStyle = '#ffdd00';
      ctx.lineWidth = 14;
      ctx.beginPath();
      ctx.arc(cx, cy, (rOuter + rInner) / 2, -Math.PI * 0.7, -Math.PI * 0.1);
      ctx.stroke();

      ctx.fillStyle = '#ffdd00';
      ctx.beginPath();
      ctx.moveTo(cx + 175, cy - 80);
      ctx.lineTo(cx + 205, cy - 40);
      ctx.lineTo(cx + 155, cy - 45);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.arc(cx, cy, (rOuter + rInner) / 2, Math.PI * 0.3, Math.PI * 0.9);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(cx - 175, cy + 80);
      ctx.lineTo(cx - 205, cy + 40);
      ctx.lineTo(cx - 155, cy + 45);
      ctx.closePath();
      ctx.fill();

      const tex = new THREE.CanvasTexture(cv);
      tex.encoding = THREE.sRGBEncoding;
      return tex;
    }

    // 【提供画像（鬼滅の刃 ならぶんです。2）の美麗POP台紙テクスチャ】
    function createExactProvidedPopTexture() {
      const cv = document.createElement('canvas');
      cv.width = 1024;

      const ctx = cv.getContext('2d');

      const grad = ctx.createLinearGradient(0, 0, 0, 1280);
      grad.addColorStop(0.0, '#00609d');
      grad.addColorStop(0.2, '#007ebf');
      grad.addColorStop(0.6, '#0b90d4');
      grad.addColorStop(1.0, '#006ea8');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 1024, 1280);

      function drawKamon(x, y, radius, petals = 12, alpha = 0.22) {
        ctx.save();
        ctx.translate(x, y);
        ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
        ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.4})`;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(0, 0, radius * 0.35, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fill();

        for (let i = 0; i < petals; i++) {
          const a = (i / petals) * Math.PI * 2;
          ctx.beginPath();
          ctx.ellipse(Math.cos(a) * radius * 0.65, Math.sin(a) * radius * 0.65, radius * 0.32, radius * 0.14, a, 0, Math.PI * 2);
          ctx.stroke();
          ctx.fill();
        }
        ctx.restore();
      }

      drawKamon(220, 240, 140, 16, 0.22);
      drawKamon(820, 310, 160, 16, 0.20);
      drawKamon(140, 780, 120, 12, 0.16);
      drawKamon(920, 720, 130, 12, 0.18);

      ctx.fillStyle = '#dc2626';
      ctx.beginPath();
      ctx.roundRect(830, 40, 150, 68, 12);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.font = '900 32px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('BANDAI', 905, 87);

      ctx.save();
      ctx.translate(512, 160);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
      ctx.beginPath();
      ctx.arc(0, 0, 68, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#00609d';
      ctx.lineWidth = 4;
      ctx.stroke();
      ctx.fillStyle = '#005082';
      ctx.font = '900 38px "Hiragino Mincho ProN", serif';

      ctx.restore();

      ctx.save();
      ctx.textAlign = 'center';
      ctx.font = '900 76px "Hiragino Kaku Gothic ProN", sans-serif';

      ctx.lineWidth = 14;

      ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';

      ctx.fillText('NARABUNDESU 2', 512, 365);
      ctx.restore();

      const characters = [

        { name: '冨岡 義勇', hair: '#0f172a', haori: '#991b1b', accent: '#eab308' },
        { name: '胡蝶 しのぶ', hair: '#312e81', haori: '#f8fafc', accent: '#c084fc', isSweat: true },
        { name: '時透 無一郎', hair: '#0f172a', haori: '#0f766e', accent: '#2dd4bf' },
        { name: '悲鳴嶼 行冥', hair: '#18181b', haori: '#4d7c0f', accent: '#b91c1c', isGiant: true }
      ];

      const startX = 140;
      const stepX = 186;
      const charBaseY = 560;

      characters.forEach((char, idx) => {
        const cx = startX + idx * stepX;
        const cy = char.isGiant ? charBaseY - 20 : charBaseY;

        ctx.save();
        ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
        ctx.beginPath();
        ctx.ellipse(cx, charBaseY + 130, 56, 18, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = char.haori;
        ctx.beginPath();
        ctx.roundRect(cx - 36, cy + 30, 72, 85, [14, 14, 6, 6]);
        ctx.fill();

        ctx.fillStyle = char.accent;
        ctx.beginPath();
        ctx.roundRect(cx - 16, cy + 38, 32, 70, 4);
        ctx.fill();

        ctx.fillStyle = '#ffe0c8';
        ctx.beginPath();
        ctx.arc(cx, cy - 10, 40, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = char.hair;
        ctx.beginPath();
        ctx.arc(cx, cy - 22, 44, Math.PI * 0.9, Math.PI * 2.1);
        ctx.fill();

        ctx.beginPath();

        ctx.lineTo(cx + 40, cy - 25);
        ctx.closePath();

        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.arc(cx - 14, cy - 6, 5, 0, Math.PI * 2);
        ctx.arc(cx + 14, cy - 6, 5, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(244, 63, 94, 0.4)';
        ctx.beginPath();
        ctx.arc(cx - 22, cy + 6, 6, 0, Math.PI * 2);

        if (char.isSweat) {

          ctx.arc(cx + 38, cy - 6, 4, 0, Math.PI * 2);

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();

        ctx.textAlign = 'center';
        ctx.fillText(char.name, cx, charBaseY + 187);

        ctx.restore();
      });

      const infoY = 880;

      ctx.fillStyle = '#006ea8';
      ctx.beginPath();
      ctx.roundRect(50, infoY + 25, 270, 300, 20);

      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.font = 'bold 28px sans-serif';
      ctx.fillText('メーカー希望小売価格', 185, infoY + 80);
      ctx.font = '900 68px sans-serif';
      ctx.fillText('各300円', 185, infoY + 175);

      ctx.fillText('(税10%込)', 185, infoY + 235);
      ctx.font = 'bold 20px sans-serif';
      ctx.fillText('全5種 1回300円', 185, infoY + 285);

      ctx.fillStyle = '#fef08a';
      ctx.fillRect(350, infoY + 25, 340, 300);
      ctx.strokeStyle = '#ca8a04';
      ctx.lineWidth = 3;
      ctx.strokeRect(350, infoY + 25, 340, 300);

      ctx.fillStyle = '#854d0e';
      ctx.textAlign = 'center';
      ctx.font = '900 28px sans-serif';
      ctx.fillText('▲ 注　意', 520, infoY + 70);
      ctx.textAlign = 'left';
      ctx.font = 'bold 18px sans-serif';
      ctx.fillStyle = '#1e293b';
      ctx.fillText('保護者の方へ 必ずお読みください。', 365, infoY + 115);
      ctx.font = '16px sans-serif';
      ctx.fillText('●小部品があります。誤飲・窒息の', 365, infoY + 155);

      ctx.fillText('　には絶対に与えないでください。', 365, infoY + 215);
      ctx.fillText('●先端が尖っている箇所があります。', 365, infoY + 255);
      ctx.fillText('●カプセルは包装材ですので捨てて下さい。', 365, infoY + 285);

      ctx.fillStyle = '#0f172a';
      ctx.textAlign = 'left';
      ctx.font = '900 32px sans-serif';
      ctx.fillText('全 5 種', 715, infoY + 75);
      ctx.font = 'bold 20px sans-serif';
      ctx.fillText('1カプセル1セット入り', 715, infoY + 115);

      ctx.font = '16px sans-serif';
      ctx.fillStyle = '#475569';
      ctx.fillText('対象年齢 15才以上', 715, infoY + 160);
      ctx.fillText('BANDAI CAPSULE TOY', 715, infoY + 190);

      for (let b = 0; b < 48; b++) {
        if ((b % 5 !== 0) && (b % 7 !== 0)) {
          ctx.fillRect(715 + b * 5, infoY + 225, (b % 3 === 0) ? 3 : 2, 70);
        }
      }

      const tex = new THREE.CanvasTexture(cv);
      tex.encoding = THREE.sRGBEncoding;
      return tex;
    }

    // -------------------------------------------------------------

    // -------------------------------------------------------------
    // 【正面POP台紙】
    // -------------------------------------------------------------
    const POP_MAX_WIDTH = 1.78;

    const providedTexture = createExactProvidedPopTexture();

    const popCardMat = new THREE.MeshBasicMaterial({
      map: providedTexture,
      toneMapped: false
    });

    function updatePopCardLayout(aspectRatio) {
      let finalW = POP_MAX_WIDTH;
      let finalH = POP_MAX_HEIGHT;

      if (aspectRatio > (POP_MAX_WIDTH / POP_MAX_HEIGHT)) {
        finalW = POP_MAX_WIDTH;
        finalH = POP_MAX_WIDTH / aspectRatio;
      } else {
        finalH = POP_MAX_HEIGHT;
        finalW = POP_MAX_HEIGHT * aspectRatio;
      }

      popCard.geometry.dispose();
      popCard.geometry = new THREE.PlaneGeometry(finalW, finalH);
      popCard.position.set(0, POP_BOTTOM_Y + (finalH / 2), 0.76);
    }

    const popCard = new THREE.Mesh(
      new THREE.PlaneGeometry(POP_MAX_HEIGHT * (1024 / 1280), POP_MAX_HEIGHT),
      popCardMat
    );
    gachaMachine.add(popCard);
    updatePopCardLayout(1024 / 1280);

    const popTextureLoader = new THREE.TextureLoader();
    popTextureLoader.load(

        texture.generateMipmaps = true;

        popCardMat.map = texture;
        popCardMat.needsUpdate = true;

        if (texture.image && texture.image.width && texture.image.height) {

    // -------------------------------------------------------------
    // 【内部ドラム機構】
    // -------------------------------------------------------------
    const DRUM_CENTER_Z = -0.22;

    const POCKET_RADIUS = 0.46;

    const drumFloorPlateGeo = new THREE.CylinderGeometry(DRUM_RADIUS + 0.04, DRUM_RADIUS + 0.04, 0.08, 36);
    const drumFloorPlate = new THREE.Mesh(drumFloorPlateGeo, ivoryBevelMat);
    drumFloorPlate.position.set(0, 0.35, DRUM_CENTER_Z);
    gachaMachine.add(drumFloorPlate);

    const DROP_HOLE_ANGLE = -Math.PI * 0.40;
    const dropHolePos = new THREE.Vector3(

    holeRimGeo.rotateX(Math.PI / 2);

    // 内部落下シュート

    const chuteTube = new THREE.Mesh(chuteTubeGeo, chuteTubeMat);
    chuteTube.position.lerpVectors(chuteStart, chuteEnd, 0.5);
    chuteTube.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), chuteEnd.clone().sub(chuteStart).normalize());
    gachaMachine.add(chuteTube);

    // 回転ドラムローター本体
    const drumRotorGroup = new THREE.Group();
    drumRotorGroup.position.set(0, 0.42, DRUM_CENTER_Z);

    const outerRingGeo = new THREE.CylinderGeometry(DRUM_RADIUS, DRUM_RADIUS, 0.26, 36, 1, true);
    const outerRing = new THREE.Mesh(outerRingGeo, rotorPlasticMat);
    drumRotorGroup.add(outerRing);

    const hubGeo = new THREE.CylinderGeometry(0.18, 0.20, 0.32, 24);

    const centralRodGeo = new THREE.CylinderGeometry(0.022, 0.022, 1.4, 16);

    // 5つの仕切りポケット＆金属バネ攪拌アーム
    const NUM_POCKETS = 5;
    const pocketAngles = [];

    for (let i = 0; i < NUM_POCKETS; i++) {
      const angle = (i / NUM_POCKETS) * Math.PI * 2;
      pocketAngles.push(angle);

      const ribGeo = new THREE.BoxGeometry(0.035, 0.26, 0.40);
      const rib = new THREE.Mesh(ribGeo, rotorPlasticMat);
      rib.position.set(
        Math.cos(angle + Math.PI / NUM_POCKETS) * 0.40,

        Math.sin(angle + Math.PI / NUM_POCKETS) * 0.40
      );
      rib.rotation.y = - (angle + Math.PI / NUM_POCKETS);
      drumRotorGroup.add(rib);

      const springArmGeo = new THREE.CylinderGeometry(0.03, 0.03, 0.44, 16);
      springArmGeo.rotateZ(Math.PI / 2);

    // ポケット内カプセル配置（5個）
    const rotorCapsules = [];
    const capSphereRadius = 0.16;
    const capGeoTop = new THREE.SphereGeometry(capSphereRadius, 18, 16, 0, Math.PI * 2, 0, Math.PI / 2);
    const capGeoBottom = new THREE.SphereGeometry(capSphereRadius, 18, 16, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2);
    const capBottomSharedMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.25 });

    function drawItemByRate() {
      const rand = Math.random() * 100;
      let accumulated = 0;
      for (const item of ITEMS) {
        accumulated += item.rate;
        if (rand <= accumulated) {
          return item;
        }
      }
      return ITEMS[ITEMS.length - 1];
    }

    function createRotorCapsule(item) {
      const grp = new THREE.Group();
      const topMat = new THREE.MeshStandardMaterial({
        color: RARITY_INFO[item.rarity].color,
        roughness: 0.2,
        metalness: item.tier === 'gold' ? 0.35 : 0.05
      });
      grp.add(new THREE.Mesh(capGeoTop, topMat));
      grp.add(new THREE.Mesh(capGeoBottom, capBottomSharedMat));
      grp.topMat = topMat;
      return grp;
    }

    const STEP_ANGLE = (Math.PI * 2) / NUM_POCKETS;
    const baseOffset = DROP_HOLE_ANGLE;

    for (let i = 0; i < NUM_POCKETS; i++) {
      const item = drawItemByRate();

      const angle = baseOffset + (i * STEP_ANGLE);

      capMesh.position.set(
        Math.cos(angle) * POCKET_RADIUS,
        0.05,
        Math.sin(angle) * POCKET_RADIUS
      );

      drumRotorGroup.add(capMesh);
      rotorCapsules.push({

      });

    // ストックカプセル群（95個）
    const stockCapsules = [];
    const stockColors = [
      0xf59e0b, 0xfbbf24, 0x38bdf8, 0xffffff, 0x60a5fa, 0xe2e8f0,

    ];
    const numStockCapsules = 95;

    for (let i = 0; i < numStockCapsules; i++) {
      const capGrp = new THREE.Group();

      capGrp.position.set(x, y, z);
      capGrp.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);

      const color = stockColors[i % stockColors.length];
      const isGold = color === 0xf59e0b || color === 0xfbbf24 || color === 0xd97706;
      const topMat = new THREE.MeshStandardMaterial({
        color: color,

        metalness: isGold ? 0.35 : 0.05
      });
      capGrp.add(new THREE.Mesh(capGeoTop, topMat));
      capGrp.add(new THREE.Mesh(capGeoBottom, capBottomSharedMat));

      gachaMachine.add(capGrp);
      stockCapsules.push({
        mesh: capGrp,
        basePos: new THREE.Vector3(x, y, z),
        phase: Math.random() * 30
      });
    }

    // パネル操作部ディテール
    const slotRimGeo = new THREE.CylinderGeometry(0.125, 0.125, 0.045, 28);
    slotRimGeo.rotateX(Math.PI / 2);
    const slotRim = new THREE.Mesh(slotRimGeo, chromeMat);
    slotRim.position.set(0.42, -0.16, 0.935);
    gachaMachine.add(slotRim);

    const slotHole = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.14, 0.05), darkPlasticMat);
    slotHole.position.set(0.42, -0.16, 0.95);

    const ejectRing = new THREE.Mesh(new THREE.TorusGeometry(0.055, 0.012, 12, 24), goldAccentMat);

    keyHoleRim.rotation.x = Math.PI / 2;
    keyHoleRim.position.set(-0.76, 0.02, 0.935);
    gachaMachine.add(keyHoleRim);

    const keySlot = new THREE.Mesh(new THREE.BoxGeometry(0.01, 0.045, 0.03), darkPlasticMat);
    keySlot.position.set(-0.76, 0.02, 0.945);
    gachaMachine.add(keySlot);

    const windowScopeGeo = new THREE.SphereGeometry(0.24, 28, 20, 0, Math.PI * 2, 0, Math.PI / 2);
    windowScopeGeo.rotateX(Math.PI / 2);
    const windowScope = new THREE.Mesh(

    );

    const windowRim = new THREE.Mesh(new THREE.TorusGeometry(0.245, 0.016, 16, 36), chromeMat);
    windowRim.position.set(-0.48, -1.45, 0.925);

    const chuteBezel = new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.58, 0.04), brushedMetalMat);
    chuteBezel.position.set(0.44, -1.45, 0.915);
    gachaMachine.add(chuteBezel);

    const chuteCavity = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.52, 0.35), darkPlasticMat);
    chuteCavity.position.set(0.44, -1.45, 0.82);
    gachaMachine.add(chuteCavity);

    const flapGeo = new THREE.BoxGeometry(0.38, 0.32, 0.02);
    const flapMat = new THREE.MeshPhysicalMaterial({ color: 0x334155, transmission: 0.5, transparent: true, roughness: 0.2 });
    const chuteFlap = new THREE.Mesh(flapGeo, flapMat);
    chuteFlap.position.set(0.44, -1.35, 0.91);
    chuteFlap.rotation.x = -0.2;
    gachaMachine.add(chuteFlap);

    // ハンドルユニット
    const handleMountGroup = new THREE.Group();
    handleMountGroup.position.set(0, -0.68, 0.92);
    gachaMachine.add(handleMountGroup);

    const dialPlate = new THREE.Mesh(
      new THREE.CircleGeometry(0.46, 40),
      new THREE.MeshStandardMaterial({ map: createHandleDialTexture(), roughness: 0.25, metalness: 0.2 })
    );
    dialPlate.position.z = 0.005;
    handleMountGroup.add(dialPlate);

    const dialMetalRing = new THREE.Mesh(new THREE.TorusGeometry(0.465, 0.016, 16, 48), chromeMat);
    dialMetalRing.position.z = 0.01;
    handleMountGroup.add(dialMetalRing);

    const rotatingHandle = new THREE.Group();
    rotatingHandle.position.set(0, 0, 0.015);
    handleMountGroup.add(rotatingHandle);

    const handleOuterRimGeo = new THREE.CylinderGeometry(0.33, 0.35, 0.08, 36);
    handleOuterRimGeo.rotateX(Math.PI / 2);
    const handleOuterRim = new THREE.Mesh(handleOuterRimGeo, ivoryBevelMat);
    rotatingHandle.add(handleOuterRim);

    const handleDishGeo = new THREE.CylinderGeometry(0.29, 0.29, 0.06, 32);
    handleDishGeo.rotateX(Math.PI / 2);
    const handleDish = new THREE.Mesh(handleDishGeo, brushedMetalMat);
    handleDish.position.z = 0.02;
    rotatingHandle.add(handleDish);

    const gripLength = 0.54;
    const gripRadius = 0.07;
    const bridge = new THREE.Mesh(new THREE.CylinderGeometry(gripRadius, gripRadius, gripLength, 28), ivoryMat);
    bridge.position.z = 0.09;
    rotatingHandle.add(bridge);

    const ringGeo = new THREE.TorusGeometry(gripRadius + 0.005, 0.012, 12, 24);
    const goldRingA = new THREE.Mesh(ringGeo, goldAccentMat);
    goldRingA.position.set(0, gripLength / 2 - 0.04, 0.09);

    const goldRingB = new THREE.Mesh(ringGeo, goldAccentMat);
    goldRingB.position.set(0, -gripLength / 2 + 0.04, 0.09);

    const handleHitBox = new THREE.Mesh(

    );
    handleHitBox.position.set(0, -0.68, 0.95);
    gachaMachine.add(handleHitBox);

    // 重厚な鋳鉄ダイキャストベーススタンド
    const floorStandGroup = new THREE.Group();
    floorStandGroup.position.y = -2.15;
    gachaMachine.add(floorStandGroup);

    const standBaseGeo = new THREE.CylinderGeometry(2.35, 2.65, 0.32, 40);

    });

    const standRing = new THREE.Mesh(standRingGeo, chromeMat);
    standRing.position.y = -0.06;
    floorStandGroup.add(standRing);

    const footGeo = new THREE.CylinderGeometry(0.16, 0.18, 0.08, 20);
    for (let f = 0; f < 4; f++) {
      const fAngle = (f / 4) * Math.PI * 2 + Math.PI / 4;
      const foot = new THREE.Mesh(footGeo, brushedMetalMat);
      foot.position.set(Math.cos(fAngle) * 2.05, -0.18, Math.sin(fAngle) * 2.05);
      floorStandGroup.add(foot);
    }

    // 排出されたカプセル
    const dispensedCapsuleGroup = new THREE.Group();
    dispensedCapsuleGroup.visible = false;
    scene.add(dispensedCapsuleGroup);

    const mainCapScale = 0.34;
    const mainCapsuleTop = new THREE.Mesh(
      new THREE.SphereGeometry(mainCapScale, 28, 20, 0, Math.PI * 2, 0, Math.PI / 2),
      new THREE.MeshStandardMaterial({ color: 0xf59e0b, roughness: 0.2, metalness: 0.3 })
    );
    const mainCapsuleBottom = new THREE.Mesh(
      new THREE.SphereGeometry(mainCapScale, 28, 20, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2),
      new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2, metalness: 0.1 })
    );
    dispensedCapsuleGroup.add(mainCapsuleTop);
    dispensedCapsuleGroup.add(mainCapsuleBottom);

    const capsuleHitBox = new THREE.Mesh(
      new THREE.SphereGeometry(mainCapScale * 1.6, 16, 16),
      new THREE.MeshBasicMaterial({ visible: false })
    );
    dispensedCapsuleGroup.add(capsuleHitBox);

    const crankTargets = [handleHitBox, handleOuterRim, handleDish, bridge, capSphereA, capSphereB, dialPlate];
    const capsuleTargets = [capsuleHitBox, mainCapsuleTop, mainCapsuleBottom];

    // -------------------------------------------------------------
    // CAMERA & ORBIT
    // -------------------------------------------------------------
    let isDragging = false;
    let previousPointerPosition = { x: 0, y: 0 };
    let cameraAngle = 0;
    let cameraPitch = 0.08;
    let cameraDistance = 6.4;
    let hasMovedMuch = false;

    let targetAngle = 0;
    let targetPitch = 0.08;
    let targetDistance = 6.4;
    let isPeekingSide = false;

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();

    function updateCamera() {
      camera.position.x = Math.sin(cameraAngle) * cameraDistance * Math.cos(cameraPitch);
      camera.position.z = Math.cos(cameraAngle) * cameraDistance * Math.cos(cameraPitch);
      camera.position.y = 0.35 + cameraDistance * Math.sin(cameraPitch);
      camera.lookAt(0, 0.15, 0);
    }
    updateCamera();

    const btnPeek = document.getElementById('btn-peek');
    const btnPeekText = document.getElementById('btn-peek-text');

    btnPeek.addEventListener('click', (e) => {
      e.stopPropagation();
      initAudio();
      isPeekingSide = !isPeekingSide;

      if (isPeekingSide) {
        targetAngle = 1.36;
        targetPitch = 0.32;
        targetDistance = 4.8;
        btnPeekText.textContent = "正面にもどる";
        updateGuide("👀 カプセルのすきまから、穴の上にあるカプセルが見えるよ！");
      } else {
        targetAngle = 0;
        targetPitch = 0.08;
        targetDistance = 6.4;
        btnPeekText.textContent = "横からのぞく";
        updateGuide("ハンドルをタップして回そう！");
      }
    });

    window.addEventListener('mousedown', (e) => {
      isDragging = true;
      hasMovedMuch = false;
      previousPointerPosition = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const deltaX = e.clientX - previousPointerPosition.x;
      const deltaY = e.clientY - previousPointerPosition.y;
      if (Math.abs(deltaX) > 4 || Math.abs(deltaY) > 4) hasMovedMuch = true;

      targetAngle -= deltaX * 0.007;
      targetPitch = Math.max(-0.15, Math.min(0.85, targetPitch + deltaY * 0.006));
      previousPointerPosition = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('mouseup', (e) => {
      if (!hasMovedMuch && isDragging) handlePointerTap(e.clientX, e.clientY);
      isDragging = false;
    });

    let initialTouchDist = 0;
    window.addEventListener('touchstart', (e) => {
      initAudio();
      if (e.touches.length === 1) {
        isDragging = true;
        hasMovedMuch = false;
        previousPointerPosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      } else if (e.touches.length === 2) {
        isDragging = false;
        initialTouchDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
      }
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length === 1 && isDragging) {
        const deltaX = e.touches[0].clientX - previousPointerPosition.x;
        const deltaY = e.touches[0].clientY - previousPointerPosition.y;
        if (Math.abs(deltaX) > 5 || Math.abs(deltaY) > 5) hasMovedMuch = true;
        targetAngle -= deltaX * 0.007;
        targetPitch = Math.max(-0.15, Math.min(0.85, targetPitch + deltaY * 0.006));
        previousPointerPosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      } else if (e.touches.length === 2) {
        const dist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        targetDistance = Math.max(3.8, Math.min(8.5, targetDistance + (initialTouchDist - dist) * 0.01));
        initialTouchDist = dist;
      }
    }, { passive: false });

    window.addEventListener('touchend', (e) => {
      if (!hasMovedMuch && isDragging && e.changedTouches.length > 0) {
        handlePointerTap(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
      }
      isDragging = false;
    });

    window.addEventListener('wheel', (e) => {
      targetDistance = Math.max(3.8, Math.min(8.5, targetDistance + e.deltaY * 0.004));
    }, { passive: true });

    // -------------------------------------------------------------
    // GACHA LOGIC & ROTOR LINKAGE
    // -------------------------------------------------------------
    let handleRotationTarget = 0;
    let drumRotationTarget = 0;
    let capsuleAnimationState = 'idle';
    let currentDispensedReward = null;
    let dropProgress = 0;
    let openProgress = 0;
    let shakeIntensity = 0;
    let isSpinning = false;

    let activePocketIndex = 0;

    const guideText = document.getElementById('guide-text');
    const flashOverlay = document.getElementById('flash-overlay');
    const goldRayOverlay = document.getElementById('gold-ray-overlay');

    function updateGuide(text) {
      guideText.textContent = text;
    }

    function handlePointerTap(clientX, clientY) {
      pointer.x = (clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);

      if (capsuleAnimationState === 'ready_to_open') {
        const capHits = raycaster.intersectObjects(capsuleTargets, true);
        if (capHits.length > 0) {
          openCurrentCapsule();
          return;
        }
      }

      if (!isSpinning && capsuleAnimationState === 'idle') {
        const crankHits = raycaster.intersectObjects(crankTargets, true);
        if (crankHits.length > 0) {
          triggerSpin();
        }
      }
    }

    function triggerSpin() {
      if (isSpinning || capsuleAnimationState !== 'idle') return;
      initAudio();
      
      isSpinning = true;
      updateGuide("ガシャガシャ...！");

      const dispensedCapData = rotorCapsules[activePocketIndex];
      currentDispensedReward = dispensedCapData.item;

      handleRotationTarget -= Math.PI * 2;
      shakeIntensity = 0.09;

      mainCapsuleTop.material.color.setHex(RARITY_INFO[currentDispensedReward.rarity].color);
      mainCapsuleTop.material.metalness = currentDispensedReward.tier === 'gold' ? 0.35 : 0.05;

      playCrankSound();
      setTimeout(playRotorClackSound, 140);
      setTimeout(playCrankSound, 280);

      const targetMesh = dispensedCapData.mesh;
      let fallProgress = 0;
      const originalY = targetMesh.position.y;

      const dropInterval = setInterval(() => {
        fallProgress += 0.18;
        targetMesh.position.y = originalY - fallProgress * 0.45;
        if (fallProgress >= 1.0) {
          clearInterval(dropInterval);
          targetMesh.visible = false;
        }
      }, 16);

      setTimeout(() => {
        drumRotationTarget += STEP_ANGLE;
      }, 120);

      setTimeout(() => {
        dispensedCapsuleGroup.visible = true;
        dispensedCapsuleGroup.position.set(0.44, -1.35, 0.95);
        mainCapsuleTop.position.set(0, 0, 0);
        mainCapsuleBottom.position.set(0, 0, 0);
        mainCapsuleTop.rotation.set(0, 0, 0);
        mainCapsuleBottom.rotation.set(0, 0, 0);
        dropProgress = 0;
        capsuleAnimationState = 'dispensing';
        playDispenseSound();

        setTimeout(() => {
          const newItem = drawItemByRate();
          dispensedCapData.item = newItem;
          targetMesh.topMat.color.setHex(RARITY_INFO[newItem.rarity].color);
          targetMesh.topMat.metalness = newItem.tier === 'gold' ? 0.35 : 0.05;
          targetMesh.position.y = 0.55;
          targetMesh.visible = true;

          activePocketIndex = (activePocketIndex + 1) % NUM_POCKETS;
        }, 340);
      }, 360);
    }

    // =============================================================
    // 【豪華演出】カプセル開封＆等級別フラッシュアウト
    // =============================================================
    function openCurrentCapsule() {
      if (capsuleAnimationState !== 'ready_to_open') return;
      capsuleAnimationState = 'opening';
      openProgress = 0;
      updateGuide("パカッ！！");

      const isGoldTier = currentDispensedReward.tier === 'gold';

      burstPointLight.color.setHex(isGoldTier ? 0xfbbf24 : 0xffffff);
      burstPointLight.intensity = isGoldTier ? 7.0 : 4.5;
      burstPointLight.position.set(dispensedCapsuleGroup.position.x, dispensedCapsuleGroup.position.y, dispensedCapsuleGroup.position.z + 0.3);

      if (isGoldTier) {
        flashOverlay.style.background = 'radial-gradient(circle at 50% 65%, rgba(254,240,138,1) 0%, rgba(245,158,11,0.95) 45%, rgba(255,255,255,1) 100%)';
        goldRayOverlay.classList.remove('opacity-0');
        goldRayOverlay.classList.add('opacity-100');
      } else {
        flashOverlay.style.background = 'radial-gradient(circle at 50% 65%, rgba(255,255,255,1) 0%, rgba(241,245,249,0.95) 55%, rgba(255,255,255,1) 100%)';
      }

      flashOverlay.classList.remove('opacity-0');
      flashOverlay.classList.add('opacity-100');

      playOpenFanfare(currentDispensedReward.rank);
      triggerConfettiBurst(isGoldTier);

      setTimeout(() => {
        burstPointLight.intensity = 0;
        flashOverlay.classList.remove('opacity-100');
        flashOverlay.classList.add('opacity-0');
        goldRayOverlay.classList.remove('opacity-100');
        goldRayOverlay.classList.add('opacity-0');

        showRewardModal(currentDispensedReward);
      }, 550);
    }

    // Modal UI
    const rewardModal = document.getElementById('reward-modal');
    const rewardRarity = document.getElementById('reward-rarity');
    const rewardIcon = document.getElementById('reward-icon');
    const rewardName = document.getElementById('reward-name');
    const rewardFlavor = document.getElementById('reward-flavor');
    const rewardGlow = document.getElementById('modal-glow');

    function showRewardModal(item) {
      const rarityMeta = RARITY_INFO[item.rarity];
      rewardRarity.textContent = rarityMeta.label;
      rewardRarity.className = `inline-block px-4 py-1.5 rounded-full text-xs font-black tracking-widest uppercase mb-2 ${rarityMeta.bg} ${rarityMeta.text} shadow-lg border border-white/30`;
      rewardIcon.textContent = item.icon;
      rewardName.textContent = item.name;
      rewardFlavor.textContent = item.desc;
      rewardGlow.style.backgroundColor = rarityMeta.glow;

      rewardModal.classList.remove('hidden');
    }

    rewardModal.addEventListener('click', () => {
      rewardModal.classList.add('hidden');
      dispensedCapsuleGroup.visible = false;
      capsuleAnimationState = 'idle';
      isSpinning = false;
      updateGuide(isPeekingSide ? "👀 横からのぞくと、奥の穴と次に出るカプセルが見えるよ！" : "ハンドルをタップして回そう！");
    });

    // -------------------------------------------------------------
    // MAIN ANIMATION LOOP
    // -------------------------------------------------------------
    let clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      const elapsedTime = clock.getElapsedTime();

      // カメラ補間
      cameraAngle += (targetAngle - cameraAngle) * 0.12;
      cameraPitch += (targetPitch - cameraPitch) * 0.12;
      cameraDistance += (targetDistance - cameraDistance) * 0.12;
      updateCamera();

      // =============================================================
      // 【背景の盛り上がるアニメーション】
      // =============================================================
      // 1. スパークル粒子の浮遊＆きらめきアニメーション
      const positions = particleGeo.attributes.position.array;
      for (let i = 0; i < particleCount; i++) {
        const bp = particleBasePositions[i];
        // 縦方向にゆっくり浮遊し、サイン波で揺らぐ
        const yOffset = Math.sin(elapsedTime * bp.speed + bp.phase) * 0.45;
        const xOffset = Math.cos(elapsedTime * (bp.speed * 0.6) + bp.phase) * 0.25;
        positions[i * 3] = bp.x + xOffset;
        positions[i * 3 + 1] = bp.y + yOffset;
      }
      particleGeo.attributes.position.needsUpdate = true;
      sparkPoints.rotation.y = elapsedTime * 0.025; // 空間全体がゆっくり旋回

      // 2. 特設ステージリングのネオン回転
      outerStageRing.rotation.z = elapsedTime * 0.25;
      midStageRing.rotation.z = -elapsedTime * 0.35;
      accentStageRing.rotation.z = elapsedTime * 0.15;

      // 3. 背面のサーチライト・ムービングビームの交差スイング
      const spinSpeed = isSpinning ? 2.5 : 1.0;
      stageBeam1.rotation.z = -0.28 + Math.sin(elapsedTime * 0.9 * spinSpeed) * 0.22;
      stageBeam1.rotation.x = Math.cos(elapsedTime * 0.7 * spinSpeed) * 0.15;
      stageBeam2.rotation.z = 0.28 - Math.sin(elapsedTime * 0.85 * spinSpeed) * 0.22;
      stageBeam2.rotation.x = -Math.cos(elapsedTime * 0.75 * spinSpeed) * 0.15;

      // 回転中の背景ビーム発光強化
      if (isSpinning) {
        beamMat1.opacity = 0.26 + Math.sin(elapsedTime * 12) * 0.08;
        beamMat2.opacity = 0.24 + Math.cos(elapsedTime * 12) * 0.08;
      } else {
        beamMat1.opacity = 0.14;
        beamMat2.opacity = 0.12;
      }

      // マシン本体の制御
      rotatingHandle.rotation.z += (handleRotationTarget - rotatingHandle.rotation.z) * 0.14;
      drumRotorGroup.rotation.y += (drumRotationTarget - drumRotorGroup.rotation.y) * 0.12;

      rotorCapsules.forEach(cap => {
        if (cap.mesh.position.y > 0.05) {
          cap.mesh.position.y = Math.max(0.05, cap.mesh.position.y - delta * 2.0);
        }
      });

      if (shakeIntensity > 0.001) {
        gachaMachine.position.x = (Math.random() - 0.5) * shakeIntensity;
        gachaMachine.position.z = (Math.random() - 0.5) * shakeIntensity;
        shakeIntensity *= 0.92;

        stockCapsules.forEach(cap => {
          cap.mesh.position.x = cap.basePos.x + (Math.random() - 0.5) * 0.06;
          cap.mesh.position.y = cap.basePos.y + Math.sin(elapsedTime * 24 + cap.phase) * 0.05;
          cap.mesh.rotation.x += 0.1;
        });
      } else {
        gachaMachine.position.x = 0;
        gachaMachine.position.z = 0;

        stockCapsules.forEach(cap => {
          cap.mesh.position.y = cap.basePos.y + Math.sin(elapsedTime * 1.5 + cap.phase) * 0.008;
        });
      }

      if (capsuleAnimationState === 'dispensing') {
        dropProgress += delta * 2.2;
        const t = Math.min(1.0, dropProgress);
        dispensedCapsuleGroup.position.x = 0.44 - t * 0.44;
        dispensedCapsuleGroup.position.y = -1.45 + Math.sin(t * Math.PI) * 0.28;
        dispensedCapsuleGroup.position.z = 0.95 + t * 0.75;
        dispensedCapsuleGroup.rotation.x = t * Math.PI * 2.8;
        dispensedCapsuleGroup.rotation.y = t * Math.PI;

        if (t >= 1.0) {
          capsuleAnimationState = 'ready_to_open';
          updateGuide("カプセルをタップして開けよう！");
        }
      } else if (capsuleAnimationState === 'ready_to_open') {
        dispensedCapsuleGroup.position.y = -1.45 + Math.abs(Math.sin(elapsedTime * 6)) * 0.1;
        dispensedCapsuleGroup.rotation.y += 0.03;
      } else if (capsuleAnimationState === 'opening') {
        openProgress += delta * 3.5;
        const p = Math.min(1.0, openProgress);
        mainCapsuleTop.position.y = p * 0.5;
        mainCapsuleTop.rotation.z = p * 0.8;
        mainCapsuleBottom.position.y = -p * 0.3;
        mainCapsuleBottom.rotation.z = -p * 0.4;
      }

      floorStandGroup.rotation.y += 0.0006;

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    window.onload = function() {
      animate();
    };
  </script>
</body>
</html>
