<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>顔はめゲーム - アクション</title>
    <style>
        /* 画面全体のデザイン（飲食店向けの温かい色合い） */
        body {
            margin: 0;
            overflow: hidden; 
            background-color: #ffedd6; /* 温かいクリーム色 */
            color: #5c3a21; /* こげ茶色 */
            font-family: 'Hiragino Maru Gothic ProN', 'Rounded M+ 1c', sans-serif; /* 丸みのあるフォント */
            -webkit-tap-highlight-color: transparent; 
            width: 100vw;
            height: 100vh;
        }

        /* --- 1. 撮影画面 --- */
        #shooting-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 100;
            background-color: #ffedd6; 
        }

        #camera-wrapper {
            width: 250px; 
            height: 250px;
            border-radius: 50%; 
            border: 6px solid #ff9800; /* オレンジ色の枠 */
            overflow: hidden;
            position: relative;
            background-color: #000;
            margin-bottom: 40px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        #webcam {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            transform: scaleX(-1); 
        }

        .btn {
            padding: 15px 50px;
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
            background-color: #ff9800; /* 美味しそうなオレンジ */
            border: none;
            border-radius: 40px;
            box-shadow: 0 5px 15px rgba(255, 152, 0, 0.4);
            cursor: pointer;
            transition: transform 0.1s;
        }
        .btn:active {
            transform: scale(0.95);
        }

        /* --- 2. プレイ画面 --- */
        #playing-screen {
            display: none; 
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            /* 背景画像を「引き」で全体表示（見切れなく）する設定 */
            background-size: contain; /* ★ここを cover から contain に変更 */
            background-position: bottom center; /* 画像の下部を基準に表示 */
            background-repeat: no-repeat;
            background-color: #87ceeb; /* ★画像が収まって隙間ができた時用の背景色（空色） */
            /* 背景が切り替わるときにフワッと変わるアニメーション（お好みで） */
            transition: background-image 0.5s ease-in-out;
        }

        /* テーブルクロス柄の地面は削除し、背景画像に任せるか、必要に応じて透明にする */
        #ground {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 80px; /* キャラクターが着地する基準の高さ（画像に合わせて調整） */
            background-color: transparent; /* 透明にして見えない床にする */
            z-index: 5;
        }
        @keyframes scrollBg {
            from { background-position: 0 0; }
            to { background-position: -120px 0; }
        }

        /* テーブルクロス柄の地面 */
        #ground {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100px;
            background-color: #fff;
            /* 赤白チェック柄のCSSグラデーション */
            background-image: 
                linear-gradient(45deg, #ff9999 25%, transparent 25%, transparent 75%, #ff9999 75%, #ff9999), 
                linear-gradient(45deg, #ff9999 25%, transparent 25%, transparent 75%, #ff9999 75%, #ff9999);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            z-index: 5;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.1);
            /* 地面も左に流す */
            animation: scrollGround 1.5s linear infinite;
        }
        @keyframes scrollGround {
            from { background-position: 0 0, 20px 20px; }
            to { background-position: -40px 0, -20px 20px; }
        }

        /* キャラクター */
        #character {
            position: absolute;
            pointer-events: none;
            z-index: 10; /* 地面より前に表示 */
        }

        #face-frame {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 6px solid #ff9800; /* 顔の枠もオレンジに */
            overflow: hidden;
            position: absolute; 
            z-index: 2;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            top: -40px;  
            left: 50%;   
            transform: translateX(-50%); 
        }

        #photo-canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); 
        }

        #body-part {
            width: 200px; 
            height: auto; 
            margin-top: -40px; 
            z-index: 1;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.4));
        }

        /* やり直しボタン（ジャンプの邪魔にならないよう右上に） */
        #retry-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            font-size: 1rem;
            background-color: #e74c3c; 
            color: white;
            z-index: 20;
        }

        /* ジャンプを促すテキスト */
        #jump-hint {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.5rem;
            font-weight: bold;
            color: #d35400;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 5px 20px;
            border-radius: 20px;
            z-index: 15;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- ステップ1: 撮影画面 -->
    <div id="shooting-screen">
        <h2 style="margin-bottom: 20px;">丸い枠に顔を合わせてね！</h2>
        <div id="camera-wrapper">
            <video id="webcam" autoplay playsinline></video>
        </div>
        <button id="shoot-btn" class="btn">撮影する！</button>
    </div>

    <!-- ステップ2: プレイ画面（マリオ風アクション） -->
    <div id="playing-screen">
        <div id="jump-hint">画面タップでジャンプ！</div>
        
        <!-- キャラクター -->
        <div id="character">
            <img id="body-part" src="maccho.png" alt="体">
            <div id="face-frame">
                <canvas id="photo-canvas"></canvas>
            </div>
        </div>
        
        <!-- テーブルクロスの地面 -->
        <div id="ground"></div>

        <button id="retry-btn" class="btn">やり直す</button>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('photo-canvas');
        const ctx = canvas.getContext('2d');
        
        const shootingScreen = document.getElementById('shooting-screen');
        const playingScreen = document.getElementById('playing-screen');
        const shootBtn = document.getElementById('shoot-btn');
        const retryBtn = document.getElementById('retry-btn');
        const character = document.getElementById('character');
        const ground = document.getElementById('ground');

        let animationId; 

        // 1. カメラ起動
        navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: "user" }, 
            audio: false
        })
        .then(function(stream) {
            video.srcObject = stream;
        })
        .catch(function(err) {
            console.error("カメラエラー:", err);
            alert("カメラの起動に失敗しました。");
        });

        // 2. 撮影ボタン
        shootBtn.addEventListener('click', function() {
            if (video.videoWidth === 0) return; 
            
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            shootingScreen.style.display = 'none';
            playingScreen.style.display = 'block';

            startActionGame(); // アクションゲーム開始！
        });

        // 3. やり直すボタン
        retryBtn.addEventListener('click', function() {
            cancelAnimationFrame(animationId); 
            playingScreen.style.display = 'none';
            shootingScreen.style.display = 'flex';
        });


        // --- 4. マリオ風アクションの物理演算と動き ---
        
        let x = 0; // 横の位置
        let y = 0; // 縦の位置
        let velocityY = 0; // 縦方向のスピード（落下速度）
        const gravity = 0.8; // 重力（大きいほど早く落ちる）
        const jumpPower = -15; // ジャンプ力（マイナス方向が上）
        let groundY = 0; // 地面の高さ（Y座標）

        // --- 背景画像のリスト（準備したファイル名をここに追加します） ---
        const backgroundImages = [
            "haikei1.jpg", // 1ステージ目の背景
            "haikei2.jpg"  // 2ステージ目の背景
        ];
        let currentBgIndex = 0; // 今何枚目の背景を表示しているか

        function startActionGame() {
            const charHeight = character.offsetHeight || 250; 
            
            // 地面の上端のY座標を計算
            groundY = window.innerHeight - ground.offsetHeight;
            
            // スタート位置
            x = 20; // 左端の少し右から
            y = groundY - charHeight; // 地面の上にピッタリ乗せる
            velocityY = 0;

            // 最初の背景を設定
            currentBgIndex = 0;
            playingScreen.style.backgroundImage = `url("${backgroundImages[currentBgIndex]}")`;

            function update() {
                const currentHeight = character.offsetHeight;
                
                // --- 縦の動き（重力で落ちる） ---
                velocityY += gravity;
                y += velocityY;

                let isGrounded = false; // 地面に足がついているかの判定

                // 床に着地したかどうかの判定
                if (y + currentHeight >= groundY) {
                    y = groundY - currentHeight; // 床にめり込まないように補正
                    velocityY = 0; // 落下ストップ
                    isGrounded = true; // 「地面にいる」状態にする
                }

                // --- 横の動き（自動で右へ進む） ---
                x += 4.5; // スピードを少し上げて躍動感をアップ（3.5 -> 4.5）
                
                // 画面の右端を通り過ぎたら、左端から再登場し、背景を切り替える
                if (x > window.innerWidth) {
                    x = -character.offsetWidth; 
                    
                    // 背景を次の画像に進める
                    currentBgIndex++;
                    
                    // 用意した背景画像をすべて使い切ったら、最初(0番目)の画像に戻す（ループ）
                    if (currentBgIndex >= backgroundImages.length) {
                        currentBgIndex = 0; 
                    }
                    
                    // 新しい背景画像を適用
                    playingScreen.style.backgroundImage = `url("${backgroundImages[currentBgIndex]}")`;
                }

                // --- ★躍動感を出すための「回転（傾き）」処理★ ---
                let rotation = 0;
                if (isGrounded) {
                    // 走っている時は、左右にペコペコ傾く（サイン波という波の計算を使用）
                    rotation = Math.sin(x * 0.15) * 12; // -12度 〜 +12度の間を揺れる
                } else {
                    // ジャンプ中は、上がっている時は上を向き(-15度)、落ちている時は下を向く(15度)
                    rotation = velocityY < 0 ? -15 : 15; 
                }

                // キャラクターの位置(translate)と、傾き(rotate)を画面に反映
                character.style.transform = `translate(${x}px, ${y}px) rotate(${rotation}deg)`;

                // 次のコマを予約
                animationId = requestAnimationFrame(update);
            }
            update();
        }

        // --- 5. タップでジャンプする処理 ---
        function jump(e) {
            // やり直しボタンを押した時はジャンプさせない
            if (e.target.id === 'retry-btn') return;
            
            // プレイ画面の時だけ
            if (playingScreen.style.display === 'block') {
                const currentHeight = character.offsetHeight;
                
                // 「地面に足がついている時」だけジャンプできるようにする
                // (少しの隙間 -5px くらいは許容してジャンプしやすくしています)
                if (y + currentHeight >= groundY - 5) {
                    velocityY = jumpPower; // 上に向かって力を加える
                }
            }
        }

        // 画面のどこを触ってもジャンプするように設定
        window.addEventListener('touchstart', jump); // スマホ用
        window.addEventListener('mousedown', jump);  // PCクリック用

    </script>
</body>
</html>
