<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <!-- スマホで適切なサイズで表示するための超重要タグ -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>顔はめゲーム</title>
    <style>
        /* 画面全体のデザイン */
        body {
            margin: 0;
            overflow: hidden; /* スクロールバーを消す */
            background-color: #2c3e50; /* 背景色 */
            color: white;
            font-family: sans-serif;
            -webkit-tap-highlight-color: transparent; 
            width: 100vw;
            height: 100vh;
        }

        /* --- 1. 撮影画面（ステップ1） --- */
        #shooting-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 100;
            background-color: rgba(44, 62, 80, 1); /* 背景色をしっかりつける */
        }

        /* 撮影時のカメラ枠（大きく表示） */
        #camera-wrapper {
            width: 250px; /* スマホ画面に合わせてかなり大きく */
            height: 250px;
            border-radius: 50%; /* 丸く切り抜く */
            border: 6px solid #fff;
            overflow: hidden;
            position: relative;
            background-color: #000;
            margin-bottom: 40px;
            box-shadow: 0 0 20px rgba(255,255,255,0.3);
        }

        #webcam {
            width: 100%;
            height: 100%;
            object-fit: cover; /* 枠いっぱいに映像を広げる */
            transform: scaleX(-1); /* 鏡のように左右反転 */
        }

        /* 撮影・やり直しボタンのデザイン */
        .btn {
            padding: 15px 50px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #2c3e50;
            background-color: #f1c40f;
            border: none;
            border-radius: 40px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: transform 0.1s;
        }
        .btn:active {
            transform: scale(0.95); /* 押した時に少し凹むアニメーション */
        }

        /* --- 2. プレイ画面（ステップ2） --- */
        #playing-screen {
            display: none; /* 最初は隠しておく */
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* キャラクター全体 */
        #character {
            position: absolute;
            /* widthとheightを削除。サイズは中の要素で決まるようにします */
            /* アニメーション中はタップイベントを無視 */
            pointer-events: none;
        }

        /* キャラクターの体（画像を表示するように変更） */
        #body-part {
            width: 200px; /* 体の横幅を基準にします */
            height: auto;
            position: relative; /* 顔を配置する基準位置にします */
            z-index: 1;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.5));
        }

        /* 動くキャラクターの顔枠 */
        #face-frame {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 6px solid #fff;
            overflow: hidden;
            position: absolute; /* 絶対配置に変更 */
            z-index: 2;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            
            /* --- 重要な位置調整部分 --- */
            /* 体(body-part)の左上を基準に、顔をどこに置くか決めます */
            /* top: 上からの位置, left: 左からの位置 */
            top: -40px;  /* マイナスにすると体より上に飛び出します */
            left: 50%;   /* 横幅の中央に配置 */
            transform: translateX(-50%); /* 中央揃えのための必須設定 */
            /* --------------------------- */
        }

        /* 撮影した写真を貼り付けるキャンバス */
        #photo-canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* カメラ映像と同じく反転させておく */
        }

        /* キャラクターの体（画像を表示するように変更） */
        #body-part {
            width: 200px; /* 体の横幅（マッチョ画像に合わせて調整してください） */
            height: auto; /* 画像の縦横比を保つ */
            margin-top: -40px; /* 顔と体の重なり具合（マイナスの数値を大きくすると深く重なります） */
            z-index: 1;
            /* 画像の形に合わせて影をつける */
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.5));
        }

        /* プレイ画面用のやり直しボタン */
        #retry-btn {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 30px;
            font-size: 1.2rem;
            background-color: #e74c3c; /* 赤系の色に */
            color: white;
            z-index: 10;
        }
    </style>
</head>
<body>

    <!-- ステップ1: 撮影画面 -->
    <div id="shooting-screen">
        <h2 style="margin-bottom: 20px;">丸い枠に顔を合わせてね！</h2>
        <div id="camera-wrapper">
            <video id="webcam" autoplay playsinline></video>
        </div>
        <button id="shoot-btn" class="btn">撮影する！</button>
    </div>

    <!-- ステップ2: プレイ画面（はめ込み後） -->
    <div id="playing-screen">
        <div id="character">
            <!-- 体を基準にするため、HTMLの順番を体が先になるように変更してもOKですが、z-indexで重なりは制御しています。
                 今回は絶対配置なので順番は影響しにくくなりました。 -->
            <img id="body-part" src="maccho.png" alt="マッチョの体">
            
            <div id="face-frame">
                <!-- ここに撮影した写真が描画されます -->
                <canvas id="photo-canvas"></canvas>
            </div>
        </div>
        <button id="retry-btn" class="btn">やり直す</button>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('photo-canvas');
        const ctx = canvas.getContext('2d');
        
        const shootingScreen = document.getElementById('shooting-screen');
        const playingScreen = document.getElementById('playing-screen');
        const shootBtn = document.getElementById('shoot-btn');
        const retryBtn = document.getElementById('retry-btn');
        const character = document.getElementById('character');

        let animationId; // アニメーションを止めるためのID

        // 1. スマホのインカメラを起動
        navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: "user" }, // インカメラを指定
            audio: false
        })
        .then(function(stream) {
            video.srcObject = stream;
        })
        .catch(function(err) {
            console.error("カメラエラー:", err);
            alert("カメラの起動に失敗しました。ブラウザのカメラ許可設定を確認してください。");
        });

        // 2. 「撮影する！」ボタンを押した時の処理
        shootBtn.addEventListener('click', function() {
            // まだカメラの準備ができていない場合は無視
            if (video.videoWidth === 0) return; 
            
            // キャンバスのサイズをカメラの実際の解像度に合わせる
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            // 現在のカメラ映像をキャンバスに1枚の絵として描き込む（写真を撮る）
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // 画面を「プレイ画面」に切り替える
            shootingScreen.style.display = 'none';
            playingScreen.style.display = 'block';

            // キャラクターを動かし始める
            startAnimation();
        });

        // 3. 「やり直す」ボタンを押した時の処理
        retryBtn.addEventListener('click', function() {
            // 動いているキャラクターを止める
            cancelAnimationFrame(animationId); 
            
            // 画面を「撮影画面」に戻す
            playingScreen.style.display = 'none';
            shootingScreen.style.display = 'flex';
        });

        // 4. キャラクターをバウンドさせて動かす処理
        let x = 50;
        let y = 50;
        let speedX = 4; // 横のスピード
        let speedY = 4; // 縦のスピード

        function startAnimation() {
            // 出現位置をランダムにする
            x = Math.random() * (window.innerWidth - 200) + 50;
            y = Math.random() * (window.innerHeight - 300) + 50;

            function move() {
                const charWidth = character.offsetWidth;
                const charHeight = character.offsetHeight;

                // 画面の左右の端にぶつかったら跳ね返る
                if (x + charWidth >= window.innerWidth || x <= 0) {
                    speedX *= -1;
                }
                // 画面の上下の端にぶつかったら跳ね返る（下のボタンに被らないよう少し上で反射）
                if (y + charHeight >= window.innerHeight - 100 || y <= 0) {
                    speedY *= -1;
                }

                // 位置を更新
                x += speedX;
                y += speedY;

                // キャラクターを移動させる
                character.style.transform = `translate(${x}px, ${y}px)`;

                // 次のコマでも動かすように予約する
                animationId = requestAnimationFrame(move);
            }
            // アニメーションループ開始
            move();
        }
    </script>
</body>
</html>
