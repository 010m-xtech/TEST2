<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>顔はめ＆落書きアクションゲーム</title>
    <style>
        body {
            margin: 0;
            overflow: hidden; 
            background-color: #ffedd6; /* 撮影時の背景色 */
            color: #5c3a21; 
            font-family: 'Hiragino Maru Gothic ProN', sans-serif; 
            -webkit-tap-highlight-color: transparent; 
            width: 100vw;
            height: 100vh;
        }

        /* --- 撮影＆お絵描き画面のレイアウト --- */
        #setup-screen {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            position: absolute;
            top: 0; left: 0;
            z-index: 100;
        }

        #character-area {
            flex: 1; /* 上部の余白をすべて使う */
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        #character {
            width: 300px; 
            height: 420px; /* 高さを伸ばして体を描くスペースを確保！ */
            position: relative;
            pointer-events: none; /* 撮影時は触れない */
        }
        
        /* ゲーム中のキャラクター設定 */
        #character.playing-mode {
            position: absolute;
            z-index: 10;
        }

        #face-frame {
            width: 120px; /* 顔枠の幅 */
            height: 160px; /* 顔枠の高さ（縦長） */
            /* 修正：上が広く、下がシャープな逆三角形・卵型にする！ */
            border-radius: 50% 50% 50% 50% / 25% 25% 75% 75%;
            border: 5px solid transparent; /* ★修正：枠線を完全に透明にしました */
            overflow: hidden;
            position: absolute;
            top: 20px; /* キャンバスの上の方に配置して、下を広く空ける */
            left: 50%;
            transform: translateX(-50%);
            background-color: #000;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            z-index: 2;
        }

        #webcam, #photo-canvas {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            transform: scaleX(-1); 
        }

        #drawing-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 5;
            transition: background-color 0.3s;
        }

        /* お絵描きモードの時のキャンバス（描ける範囲をわかりやすく） */
        #character.drawing-mode {
            pointer-events: auto;
        }
        #character.drawing-mode #drawing-canvas {
            background-color: rgba(255,255,255,0.4);
            border: 3px dashed #ff9800;
            border-radius: 30px; /* 角を少し丸く */
        }

        #ui-area {
            background: #fff;
            padding: 20px;
            border-top-left-radius: 30px;
            border-top-right-radius: 30px;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .btn {
            padding: 15px 30px;
            font-size: 1.3rem;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            cursor: pointer;
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.95); }
        .btn.small { padding: 10px 20px; font-size: 1rem; }

        .color-btn {
            width: 40px; height: 40px;
            border-radius: 50%;
            border: 4px solid #f0f0f0;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(0,0,0,0.2);
        }
        .color-btn.active {
            border-color: #333;
            transform: scale(1.15);
        }

        /* 線の太さボタン */
        .size-btn-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px;
            margin-bottom: 20px;
            background: #f8f9fa;
            padding: 10px 20px;
            border-radius: 20px;
        }
        .size-btn {
            background-color: #555;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.2s;
            border: 2px solid transparent;
        }
        .size-btn.active {
            background-color: #ff9800;
            transform: scale(1.3);
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        #playing-screen {
            display: none; 
            width: 100%; height: 100%;
            position: absolute;
            top: 0; left: 0;
            background-size: cover; 
            background-position: center bottom;
            background-repeat: no-repeat;
            background-color: #87ceeb; /* 空色 */
        }

        #ground {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%; height: 80px; 
            background-color: transparent; 
            z-index: 5;
        }

        #jump-hint {
            position: absolute;
            top: 30px; left: 50%;
            transform: translateX(-50%);
            font-size: 1.5rem; font-weight: bold;
            color: #d35400; background-color: rgba(255, 255, 255, 0.8);
            padding: 5px 20px; border-radius: 20px;
            z-index: 15; pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="setup-screen">
        <div id="character-area">
            <div id="character">
                <!-- 高さを伸ばしたキャンバス -->
                <canvas id="drawing-canvas" width="300" height="420"></canvas>
                <div id="face-frame">
                    <video id="webcam" autoplay playsinline></video>
                    <canvas id="photo-canvas" style="display:none;"></canvas>
                </div>
            </div>
        </div>

        <div id="ui-area">
            <!-- 撮影時のボタン -->
            <div id="ui-shooting" style="text-align:center;">
                <h2 style="margin:0 0 15px 0; color:#d35400; font-size:1.2rem;">顔の形に合わせて撮影！</h2>
                <button id="shoot-btn" class="btn" style="background-color:#ff9800; width:200px;">📸 撮影する！</button>
            </div>

            <!-- 撮影後のお絵描きパレットとボタン -->
            <div id="ui-drawing" style="display:none; width:100%; max-width:350px;">
                <!-- 5色のパレット -->
                <div id="color-palette" style="display:flex; justify-content:space-around; margin-bottom:15px;">
                    <div class="color-btn active" data-color="#000000" style="background-color:#000;"></div>
                    <div class="color-btn" data-color="#e74c3c" style="background-color:#e74c3c;"></div>
                    <div class="color-btn" data-color="#3498db" style="background-color:#3498db;"></div>
                    <div class="color-btn" data-color="#2ecc71" style="background-color:#2ecc71;"></div>
                    <div class="color-btn" data-color="#f1c40f" style="background-color:#f1c40f;"></div>
                </div>

                <!-- 線の太さパレット -->
                <div class="size-btn-wrapper">
                    <span style="font-size:0.9rem; font-weight:bold; color:#777;">太さ</span>
                    <div class="size-btn" data-size="5" style="width:8px; height:8px;"></div>
                    <div class="size-btn active" data-size="12" style="width:16px; height:16px;"></div>
                    <div class="size-btn" data-size="25" style="width:26px; height:26px;"></div>
                </div>

                <!-- ★修正：ここに「1つ戻す」ボタンを追加し、3つ横並びにしました -->
                <div style="display:flex; justify-content:space-between; gap: 5px; margin-bottom:15px;">
                    <button id="retake-btn" class="btn small" style="flex:1; background-color:#95a5a6; padding:10px 0; font-size:0.9rem;">撮り直す</button>
                    <button id="undo-btn" class="btn small" style="flex:1; background-color:#34495e; padding:10px 0; font-size:0.9rem;">1つ戻す</button>
                    <button id="clear-btn" class="btn small" style="flex:1; background-color:#e74c3c; padding:10px 0; font-size:0.9rem;">全消し</button>
                </div>
                
                <button id="start-btn" class="btn" style="width:100%; background-color:#2ecc71; padding:15px;">✨ 完成！遊ぶ！ ✨</button>
            </div>
        </div>
    </div>

    <div id="playing-screen">
        <div id="jump-hint">画面タップでジャンプ！</div>
        <button id="retry-game-btn" class="btn small" style="position:absolute; top:20px; right:20px; background-color:#e74c3c; z-index:20;">やり直す</button>
        <div id="ground"></div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const photoCanvas = document.getElementById('photo-canvas');
        const pCtx = photoCanvas.getContext('2d');
        
        const drawCanvas = document.getElementById('drawing-canvas');
        const dCtx = drawCanvas.getContext('2d');
        
        const character = document.getElementById('character');
        const setupScreen = document.getElementById('setup-screen');
        const playingScreen = document.getElementById('playing-screen');
        
        const uiShooting = document.getElementById('ui-shooting');
        const uiDrawing = document.getElementById('ui-drawing');

        // 背景画像のリスト
        const backgroundImages = [
            "haikei1.jpg", 
            "haikei2.jpg"
        ];
        let currentBgIndex = 0;
        let animationId; 

        // カメラ起動
        navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: "user" }, audio: false
        })
        .then(stream => { video.srcObject = stream; video.play(); })
        .catch(err => { alert("カメラの起動に失敗しました。"); });

        // 1. 撮影ボタン
        document.getElementById('shoot-btn').addEventListener('click', () => {
            if (video.videoWidth === 0) return; 
            
            photoCanvas.width = video.videoWidth;
            photoCanvas.height = video.videoHeight;
            pCtx.drawImage(video, 0, 0, photoCanvas.width, photoCanvas.height);
            
            video.style.display = 'none';
            photoCanvas.style.display = 'block';
            uiShooting.style.display = 'none';
            uiDrawing.style.display = 'block';
            character.classList.add('drawing-mode');
        });

        // 2. 撮り直すボタン
        document.getElementById('retake-btn').addEventListener('click', resetToShooting);

        // お絵描きの履歴（1つ戻す機能のため）
        let drawingHistory = [];

        // 2.5 1つ戻すボタンの動作
        document.getElementById('undo-btn').addEventListener('click', () => {
            if (drawingHistory.length > 0) {
                // 履歴から1つ前の状態を取り出して復元する
                const previousState = drawingHistory.pop();
                dCtx.putImageData(previousState, 0, 0);
            } else {
                // 履歴がこれ以上ない場合は全消し状態に戻す
                dCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
            }
        });

        // 3. 全消しボタン
        document.getElementById('clear-btn').addEventListener('click', () => {
            dCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
            drawingHistory = []; // 全消ししたら履歴もリセット
        });

        // 4. スタート（完成）ボタン
        document.getElementById('start-btn').addEventListener('click', () => {
            character.classList.remove('drawing-mode');
            setupScreen.style.display = 'none';
            playingScreen.style.display = 'block';
            
            document.body.appendChild(character);
            character.classList.add('playing-mode');
            
            startActionGame();
        });

        // 5. ゲーム中のやり直しボタン
        document.getElementById('retry-game-btn').addEventListener('click', () => {
            cancelAnimationFrame(animationId);
            document.getElementById('character-area').appendChild(character);
            character.classList.remove('playing-mode');
            
            playingScreen.style.display = 'none';
            setupScreen.style.display = 'flex';
            resetToShooting();
        });

        function resetToShooting() {
            video.style.display = 'block';
            photoCanvas.style.display = 'none';
            uiShooting.style.display = 'block';
            uiDrawing.style.display = 'none';
            character.classList.remove('drawing-mode');
            dCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
            drawingHistory = []; // 撮り直す時も履歴をリセット
            video.play();
        }

        let isDrawing = false;
        let currentColor = '#000000';
        let currentSize = 12; // 初期のペンの太さ

        function getPos(e) {
            const rect = drawCanvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const scaleX = drawCanvas.width / rect.width;
            const scaleY = drawCanvas.height / rect.height;
            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        function startDrawing(e) {
            if (!character.classList.contains('drawing-mode')) return;
            e.preventDefault(); 
            isDrawing = true;

            // 描く直前のキャンバスの状態を履歴に保存する
            drawingHistory.push(dCtx.getImageData(0, 0, drawCanvas.width, drawCanvas.height));
            // メモリを使いすぎないよう、戻せるのは直近の20回までにする
            if (drawingHistory.length > 20) drawingHistory.shift();

            const pos = getPos(e);
            dCtx.beginPath();
            dCtx.moveTo(pos.x, pos.y);
        }

        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault();
            const pos = getPos(e);
            dCtx.lineTo(pos.x, pos.y);
            dCtx.strokeStyle = currentColor;
            dCtx.lineWidth = currentSize; // 選んだ太さを適用
            dCtx.lineCap = 'round';
            dCtx.lineJoin = 'round';
            dCtx.stroke();
        }

        function endDrawing() { isDrawing = false; }

        drawCanvas.addEventListener('touchstart', startDrawing, {passive: false});
        drawCanvas.addEventListener('touchmove', draw, {passive: false});
        drawCanvas.addEventListener('touchend', endDrawing);
        drawCanvas.addEventListener('mousedown', startDrawing);
        drawCanvas.addEventListener('mousemove', draw);
        drawCanvas.addEventListener('mouseup', endDrawing);
        drawCanvas.addEventListener('mouseout', endDrawing);

        // 色変更
        document.querySelectorAll('.color-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentColor = this.dataset.color;
            });
        });

        // 太さ変更
        document.querySelectorAll('.size-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentSize = parseInt(this.dataset.size);
            });
        });

        let x = 0; let y = 0;
        let velocityY = 0; 
        const gravity = 0.8; 
        const jumpPower = -15; 
        let groundY = 0; 
        const gameScale = 0.5; // ★追加：遊ぶ時のキャラクターの大きさ（0.5 = 半分）

        function startActionGame() {
            const ground = document.getElementById('ground');
            groundY = window.innerHeight - ground.offsetHeight;
            
            x = 20; 
            // 修正：小さくなったサイズを考慮して初期位置を計算
            y = groundY - (character.offsetHeight * gameScale); 
            velocityY = 0;
            currentBgIndex = 0;
            playingScreen.style.backgroundImage = `url("${backgroundImages[currentBgIndex]}")`;

            function update() {
                // 修正：見た目のサイズに合わせて計算用の幅と高さを調整
                const charWidth = character.offsetWidth * gameScale;
                const charHeight = character.offsetHeight * gameScale;

                velocityY += gravity;
                y += velocityY;

                if (y + charHeight >= groundY) {
                    y = groundY - charHeight;
                    velocityY = 0;
                }

                x += 3.5; 
                
                if (x > window.innerWidth) {
                    x = -charWidth; 
                    currentBgIndex++;
                    if (currentBgIndex >= backgroundImages.length) currentBgIndex = 0; 
                    playingScreen.style.backgroundImage = `url("${backgroundImages[currentBgIndex]}")`;
                }

                // 修正：scale(gameScale) を追加して画面上で小さく表示！
                character.style.transform = `translate(${x}px, ${y}px) scale(${gameScale})`;
                animationId = requestAnimationFrame(update);
            }
            update();
        }

        function jump(e) {
            if (e.target.id === 'retry-game-btn' || setupScreen.style.display !== 'none') return;
            
            const charHeight = character.offsetHeight * gameScale;
            // 修正：小さくなった足元の位置でジャンプ判定
            if (y + charHeight >= groundY - 5) {
                velocityY = jumpPower; 
            }
        }

        window.addEventListener('touchstart', jump);
        window.addEventListener('mousedown', jump);
    </script>
</body>
</html>
