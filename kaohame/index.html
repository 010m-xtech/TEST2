<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>顔はめゲーム</title>
    <style>
        /* 画面全体のデザイン */
        body {
            margin: 0;
            overflow: hidden; /* スクロールバーを消す */
            background-color: #2c3e50; /* 背景色（暗めのブルー） */
            color: white;
            font-family: sans-serif;
            /* スマホでタップした時のハイライトを消す */
            -webkit-tap-highlight-color: transparent; 
        }

        /* キャラクター全体をまとめる箱 */
        #character {
            position: absolute;
            width: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none; 
        }

        /* 顔（カメラ）を丸く切り抜く枠 */
        #face-frame {
            width: 80px;
            height: 80px;
            border-radius: 50%; /* ここで丸くしています */
            border: 4px solid #fff;
            overflow: hidden;
            position: relative;
            background-color: #000;
            z-index: 2;
        }

        /* カメラの映像 */
        #webcam {
            width: 160px; 
            height: 160px;
            object-fit: cover;
            position: absolute;
            top: 50%;
            left: 50%;
            /* 映像を中央に合わせ、鏡のように左右反転させる */
            transform: translate(-50%, -50%) scaleX(-1);
        }
        
        /* 撮影した写真を表示するキャンバス（最初は非表示） */
        #photo-canvas {
            display: none;
            width: 160px; 
            height: 160px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scaleX(-1);
        }

        /* キャラクターの体 */
        #body-part {
            width: 50px;
            height: 60px;
            background-color: #f1c40f; /* 服の色（黄色） */
            border-radius: 10px;
            margin-top: -10px; /* 顔と少し重ねる */
            z-index: 1;
        }
        
        /* 操作案内のテキスト */
        #instruction {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="instruction">画面をタップして顔を撮影！</div>

    <div id="character">
        <div id="face-frame">
            <video id="webcam" autoplay playsinline></video>
            <!-- 写真を貼り付ける場所 -->
            <canvas id="photo-canvas"></canvas>
        </div>
        <div id="body-part"></div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const character = document.getElementById('character');
        const canvas = document.getElementById('photo-canvas');
        const ctx = canvas.getContext('2d');
        const instruction = document.getElementById('instruction');
        
        let isPhotoTaken = false; // 写真を撮ったかどうかのフラグ

        // 1. カメラを起動する設定 (スマホを考慮し、なるべくインカメラを指定)
        navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: "user" } // スマホのインカメラを優先
        })
            .then(function(stream) {
                video.srcObject = stream;
            })
            .catch(function(err) {
                console.error("カメラエラー:", err);
                instruction.innerText = "カメラの起動に失敗しました";
                // alertの代わりにUIで表示
            });

        // 2. 画面をタップ（クリック）したときの処理（写真撮影）
        document.body.addEventListener('click', function() {
            if (isPhotoTaken) {
                // すでに撮っていたら、もう一度動画に戻す（リセット）
                video.style.display = 'block';
                canvas.style.display = 'none';
                instruction.innerText = "画面をタップして顔を撮影！";
                isPhotoTaken = false;
            } else {
                // 動画のサイズに合わせてキャンバスを設定
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                
                // 現在のカメラ映像をキャンバスに描画（写真を撮る）
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                // 動画を隠して、写真（キャンバス）を表示する
                video.style.display = 'none';
                canvas.style.display = 'block';
                instruction.innerText = "もう一度タップで撮り直し";
                isPhotoTaken = true;
            }
        });

        // 3. キャラクターを画面内で動かす設定（バウンド）
        let x = 100; // 横の位置
        let y = 100; // 縦の位置
        let speedX = 3; // 横のスピード
        let speedY = 3; // 縦のスピード

        function moveCharacter() {
            // キャラクターの幅と高さを取得
            const charWidth = character.offsetWidth;
            const charHeight = character.offsetHeight;

            // 画面の端にぶつかったら跳ね返る（スピードを逆にする）
            if (x + charWidth >= window.innerWidth || x <= 0) {
                speedX *= -1;
            }
            if (y + charHeight >= window.innerHeight || y <= 0) {
                speedY *= -1;
            }

            // 位置を更新
            x += speedX;
            y += speedY;

            // キャラクターに新しい位置を適用
            character.style.transform = `translate(${x}px, ${y}px)`;

            // アニメーションを繰り返す
            requestAnimationFrame(moveCharacter);
        }

        // アニメーションスタート
        moveCharacter();
    </script>
</body>
</html>
