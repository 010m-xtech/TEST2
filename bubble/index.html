<!DOCTYPE html>
<html lang="ja">

  <meta charset="UTF-8">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700;800&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap');

    /* スマホ画面向けのベースリセット */
    html, body {
      font-family: 'Zen Maru Gothic', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow-x: hidden;
    }

    .font-serif-luxury {
      font-family: 'Shippori Mincho', serif;
    }

    /* 通常写真バブルフレーム（1.5倍サイズ用） */
    .bubble-frame-subtle {
      box-shadow: 
        0 8px 20px rgba(0, 0, 0, 0.35),
        inset 0 0 12px rgba(255, 255, 255, 0.85),
        0 0 0 2.5px rgba(255, 255, 255, 0.95);
    }

    /* 撮影写真バブルフレーム（ゴールド輝き＋パルス光） */
    .bubble-frame-user {
      box-shadow: 
        0 10px 30px rgba(234, 179, 8, 0.5),
        0 0 22px rgba(255, 255, 255, 0.85),
        inset 0 0 16px rgba(255, 255, 255, 0.95),
        0 0 0 3.5px rgba(254, 240, 138, 1);
      animation: userBubblePulse 3s ease-in-out infinite alternate;
    }

    @keyframes userBubblePulse {
      0% {
        box-shadow: 0 8px 24px rgba(234, 179, 8, 0.4), inset 0 0 12px rgba(255, 255, 255, 0.85), 0 0 0 3px rgba(254, 240, 138, 0.9);
      }
      100% {
        box-shadow: 0 12px 36px rgba(234, 179, 8, 0.7), 0 0 26px rgba(255, 255, 255, 0.95), inset 0 0 18px rgba(255, 255, 255, 1), 0 0 0 4px rgba(255, 255, 255, 1);
      }
    }

    /* 泡が弾けるアニメーション */
    @keyframes popRing {
      0% { transform: scale(1); opacity: 1; filter: brightness(1); }
      40% { transform: scale(1.35); opacity: 0.9; filter: brightness(1.8); }
      100% { transform: scale(1.7); opacity: 0; filter: brightness(2.2); }
    }
    .pop-animate {
      animation: popRing 0.35s cubic-bezier(0.12, 0.8, 0.32, 1) forwards;
    }

    /* シャッター光エフェクト */
    @keyframes shutterFlash {
      0% { opacity: 0.95; }
      100% { opacity: 0; }
    }
    .flash-active {
      animation: shutterFlash 0.25s ease-out forwards;
    }

    /* おすすめメニュー画面でバブルがふわふわ揺れるアニメーション */
    @keyframes floatMenu {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      33% { transform: translateY(-8px) rotate(-1.5deg); }
      66% { transform: translateY(-3px) rotate(1.5deg); }
    }
    .animate-float-menu {
      animation: floatMenu 4.5s ease-in-out infinite;
    }

    /* スクロールバー非表示 */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>

    let userCapturedBubbleList = [];

    // ==============================================
    // 2. 音響効果（Web Audio API）
    // ==============================================
    let audioCtx = null;
    let isSoundOn = true;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playPopSound() {
      if (!isSoundOn) return;
      initAudio();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const now = audioCtx.currentTime;

        osc.type = 'sine';
        osc.frequency.setValueAtTime(540, now);
        osc.frequency.exponentialRampToValueAtTime(1250, now + 0.08);

        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now);
        osc.stop(now + 0.12);
      } catch (e) {}
    }

    function playShutterSound() {
      if (!isSoundOn) return;
      initAudio();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const now = audioCtx.currentTime;

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(800, now);
        osc.frequency.setValueAtTime(400, now + 0.04);

        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now);
        osc.stop(now + 0.1);
      } catch (e) {}
    }

    // ==============================================
    // 3. 背景のブクブク気泡 Canvas
    // ==============================================
    const appContainer = document.getElementById('appContainer');
    const canvas = document.getElementById('ambientBubbleCanvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let ambientBubbles = [];
    let ringBubbles = [];

    function resizeCanvas() {
      width = canvas.width = appContainer.clientWidth;
      height = canvas.height = appContainer.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class RingBubble {
      constructor(init = false) {
        this.reset(init);
      }
      reset(init = false) {
        this.x = Math.random() * width;
        this.y = init ? Math.random() * height : height + Math.random() * 40;
        this.radius = Math.random() * 20 + 8;
        this.speedY = Math.random() * 0.65 + 0.3;
        this.wobbleSpeed = Math.random() * 0.02 + 0.008;
        this.wobbleAmp = Math.random() * 0.8 + 0.3;
        this.lineWidth = Math.random() * 0.8 + 1.0;
        this.alpha = Math.random() * 0.4 + 0.18;
        this.wobble = Math.random() * Math.PI * 2;
      }
      update() {
        this.y -= this.speedY;
        this.wobble += this.wobbleSpeed;
        this.x += Math.sin(this.wobble) * this.wobbleAmp;
        if (this.y < -this.radius * 2) {
          this.reset(false);
        }
      }
      draw() {
        ctx.save();
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(255, 255, 255, ${this.alpha})`;
        ctx.lineWidth = this.lineWidth;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(this.x - this.radius * 0.35, this.y - this.radius * 0.35, Math.max(this.radius * 0.18, 1), 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha * 0.95})`;
        ctx.fill();
        ctx.restore();
      }
    }

    class AmbientBubble {
      constructor(init = false) {
        this.reset(init);
      }
      reset(init = false) {
        this.x = Math.random() * width;
        this.y = init ? Math.random() * height : height + Math.random() * 50;
        
        this.radius = Math.random() * 4 + 1.5;
        this.speedY = Math.random() * 1.6 + 0.9;
        this.wobbleSpeed = Math.random() * 0.05 + 0.03;
        this.wobbleAmp = Math.random() * 1.8 + 0.6;
        this.alpha = Math.random() * 0.55 + 0.25;
        this.isFilled = Math.random() > 0.4;
        this.wobble = Math.random() * Math.PI * 2;
      }
      update() {
        this.y -= this.speedY;
        this.wobble += this.wobbleSpeed;
        this.x += Math.sin(this.wobble) * this.wobbleAmp;

        if (this.y < -this.radius * 2 || this.x < -15 || this.x > width + 15) {
          this.reset(false);
        }
      }
      draw() {
        ctx.save();
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);

        if (this.isFilled) {
          ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
          ctx.fill();
        } else {
          ctx.strokeStyle = `rgba(255, 255, 255, ${this.alpha})`;
          ctx.lineWidth = 1.1;
          ctx.stroke();
        }
        ctx.restore();
      }
    }

    function initAmbientBubbles() {
      for (let i = 0; i < 22; i++) {
        ringBubbles.push(new RingBubble(true));
      }
      for (let i = 0; i < 65; i++) {
        ambientBubbles.push(new AmbientBubble(true));
      }
    }

    function spawnTouchSparkles(x, y) {
      for (let i = 0; i < 6; i++) {
        const b = new AmbientBubble(false);
        b.x = x + (Math.random() - 0.5) * 30;
        b.y = y + (Math.random() - 0.5) * 30;
        b.speedY = Math.random() * 2.2 + 1.2;
        b.radius = Math.random() * 5 + 2;
        ambientBubbles.push(b);
      }
      if (ambientBubbles.length > 95) {
        ambientBubbles.splice(0, 6);
      }
    }

    window.addEventListener('pointerdown', (e) => {
      const rect = appContainer.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;
      if (clickX >= 0 && clickX <= rect.width && clickY >= 0 && clickY <= rect.height) {
        spawnTouchSparkles(clickX, clickY);
      }
    });

    // ==============================================
    // 4. トップ画面を泳ぐ写真バブル
    // ==============================================
    const photoContainer = document.getElementById('fullPhotoBubblesContainer');
    let floatingBubbles = [];

    class FreePhotoBubble {
      constructor(itemData, laneIndex = 0, delay = 0, startFromBottom = false) {
        this.data = itemData;
        this.isUser = itemData.isUser === true;
        this.isDead = false;

        if (this.isUser) {
          this.size = 138;
        } else {
          const isSmall = itemData.sizeType === 'small';
          this.size = isSmall 
            ? Math.floor(Math.random() * 6 + 74)
            : Math.floor(Math.random() * 10 + 92);
        }
        
        const containerWidth = appContainer.clientWidth || 390;
        const containerHeight = appContainer.clientHeight || window.innerHeight;

        const usableWidth = Math.max(containerWidth - this.size - 24, 20);
        const colWidth = usableWidth / 3;
        this.x = 12 + (laneIndex % 3) * colWidth + Math.random() * (colWidth * 0.85);

        if (startFromBottom) {
          this.y = containerHeight + Math.random() * 40 + 20;
        } else {
          const totalItems = Math.max(bubbleInitialList.length + userCapturedBubbleList.length, 9);
          const step = containerHeight / totalItems;
          const i = delay / 120;
          this.y = step * i + (Math.random() * step * 0.8);
        }

        this.speedY = this.isUser ? 0.34 : (Math.random() * 0.38 + 0.28);
        this.wobble = Math.random() * Math.PI * 2;
        this.wobbleSpeed = Math.random() * 0.016 + 0.008;
        this.wobbleAmp = this.isUser ? 5 : (Math.random() * 4 + 3);
        this.isPopping = false;

        this.createElement();
      }

      createElement() {
        this.el = document.createElement('div');
        this.el.className = 'absolute pointer-events-auto cursor-pointer flex flex-col items-center select-none';
        this.el.style.width = `${this.size}px`;
        this.el.style.willChange = 'transform'; 

        this.el.style.transform = `translate3d(${this.x}px, ${this.y}px, 0)`;

        const frameClass = this.isUser 
          ? 'bubble-frame-user bg-amber-400/30' 
          : 'bubble-frame-subtle bg-white/20';

        const labelTag = this.isUser 
          ? `<span class="mt-1 text-[10px] font-black text-amber-950 px-2.5 py-0.5 rounded-full bg-gradient-to-r from-amber-300 via-yellow-200 to-amber-300 border border-white shadow-md whitespace-nowrap scale-95 flex items-center gap-1 label-span">✨ ${this.data.label}</span>`
          : `<span class="mt-0.5 text-[9.5px] font-bold text-white/95 px-2 py-0.5 rounded-full bg-black/50 backdrop-blur-xs border border-white/25 whitespace-nowrap shadow-xs scale-90 label-span">${this.data.label}</span>`;

        this.el.innerHTML = `
          <div class="bubble-inner relative w-[${this.size}px] h-[${this.size}px] rounded-full p-1 backdrop-blur-xs ${frameClass} border border-white active:scale-90 transition-transform duration-300">
            <img src="${this.data.img}" class="w-full h-full object-cover rounded-full pointer-events-none" onerror="this.src='https://images.unsplash.com/photo-1535958636474-b021ee887b13?w=300'">
            <div class="absolute top-1.5 left-2 ${this.isUser ? 'w-4 h-2' : 'w-3 h-1.5'} rounded-full bg-white/95 transform -rotate-45 pointer-events-none shadow-sm"></div>
            <div class="absolute bottom-2.5 right-3 ${this.isUser ? 'w-2.5 h-2.5' : 'w-1.5 h-1.5'} rounded-full bg-white/70 pointer-events-none"></div>
          </div>
          ${labelTag}
        `;

        this.el.addEventListener('pointerdown', (e) => {
          e.stopPropagation();
          this.popAndOpen();
        });

        photoContainer.appendChild(this.el);
      }

      update() {
        if (this.isPopping || this.isDead) return;

        this.y -= this.speedY;
        this.wobble += this.wobbleSpeed;
        const currentX = this.x + Math.sin(this.wobble) * this.wobbleAmp;

        this.el.style.transform = `translate3d(${currentX}px, ${this.y}px, 0)`;

        if (this.y < -this.size - 40) {
          this.isDead = true;
        }
      }

      popAndOpen() {
        if (this.isPopping || this.isDead) return;
        this.isPopping = true;

        playPopSound();

        const inner = this.el.querySelector('.bubble-inner');
        inner.classList.add('pop-animate');

        const label = this.el.querySelector('.label-span');
        if (label) {
          label.style.transition = 'opacity 0.2s';
          label.style.opacity = '0';
        }

        spawnTouchSparkles(this.x + this.size / 2, this.y + this.size / 2);

        setTimeout(() => {
          openProductModalById(this.data.menuId !== undefined ? this.data.menuId : 'default_0');
          setTimeout(() => {
            this.isDead = true;
          }, 300);
        }, 220);
      }
    }

    function spawnSingleBubble() {
      let newData;
      if (userCapturedBubbleList.length > 0 && Math.random() < 0.55) {
        newData = userCapturedBubbleList[Math.floor(Math.random() * userCapturedBubbleList.length)];
      } else {
        newData = bubbleInitialList[Math.floor(Math.random() * bubbleInitialList.length)];
      }
      
      const laneIndex = Math.floor(Math.random() * 3);
      const newBubble = new FreePhotoBubble(newData, laneIndex, 0, true);
      floatingBubbles.push(newBubble);
    }

    function initFloatingBubbles() {
      photoContainer.innerHTML = '';
      const pool = [...bubbleInitialList, ...userCapturedBubbleList];
      floatingBubbles = pool.map((item, index) => {
        return new FreePhotoBubble(item, index % 3, index * 120, false);
      });
    }

    const menuListModal = document.getElementById('menuListModal');
    
    function openMenuList() {
      menuListModal.classList.remove('hidden');

        menuListModal.classList.remove('opacity-0');

    // ==============================================
    // 6. アニメーションメインループ
    // ==============================================
    function animate() {
      ctx.clearRect(0, 0, width, height);

      for (let i = 0; i < ringBubbles.length; i++) {
        ringBubbles[i].update();
        ringBubbles[i].draw();
      }

      for (let i = 0; i < ambientBubbles.length; i++) {
        ambientBubbles[i].update();
        ambientBubbles[i].draw();
      }

      for (let i = floatingBubbles.length - 1; i >= 0; i--) {
        floatingBubbles[i].update();

        if (floatingBubbles[i].isDead) {
          floatingBubbles[i].el.remove();
          floatingBubbles.splice(i, 1);
          spawnSingleBubble();
        }
      }

      requestAnimationFrame(animate);
    }

    // ==============================================
    // 7. 商品詳細モーダル制御
    // ==============================================
    const productDetailModal = document.getElementById('productDetailModal');

    function openProductModalById(id) {
      initAudio();
      playPopSound();

      const item = menuData.find(m => m.id === id) || menuData[0];

      document.getElementById('detailTitle').textContent = item.title;
      document.getElementById('detailMainImage').src = item.mainImg;
      
      if (item.category === 'CUSTOMER MEMORY') {
        document.getElementById('detailVerticalText').innerHTML = item.curvedTop;
      } else {
        document.getElementById('detailVerticalText').innerHTML = item.curvedTop.replace('と', 'と<br>').replace('の', 'の<br>').replace('な', 'な<br>');
      }
      
      const descText = `${item.curvedBottom}。<br><br><span class="text-[10px] text-gray-500">${item.review.author}</span><br>${item.review.text}`;
      document.getElementById('detailDescription').innerHTML = descText;

      // 自分が投稿した写真であるか判定（自分が撮った場合のみ削除ボタンを表示）
      const deleteBtn = document.getElementById('deleteBubbleBtn');
      const isMine = (currentUser && item.userId === currentUser.uid) || item.isLocalAuthor === true;

      if (item.category === 'CUSTOMER MEMORY' && isMine) {
        deleteBtn.classList.remove('hidden');
        deleteBtn.onclick = () => deleteUserBubble(item.id);
      } else {
        deleteBtn.classList.add('hidden');
      }

      productDetailModal.classList.remove('hidden');
      productDetailModal.classList.add('flex');
      setTimeout(() => {
        productDetailModal.classList.remove('opacity-0');
      }, 10);
    }

    function closeProductModal() {
      productDetailModal.classList.add('opacity-0');
      setTimeout(() => {
        productDetailModal.classList.add('hidden');
        productDetailModal.classList.remove('flex');
      }, 300);
    }

    productDetailModal.addEventListener('click', (e) => {
      if (e.target === productDetailModal) closeProductModal();
    });

    window.openProductModalById = openProductModalById;
    window.closeProductModal = closeProductModal;

    // ユーザー写真の削除（クラウド＆画面同期）
    async function deleteUserBubble(bubbleId) {
      if (isCloudReady && db) {
        try {
          const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'bubbles', bubbleId);
          await deleteDoc(docRef);
        } catch (err) {
          console.warn("Cloud delete failed:", err);
        }
      }

      // ローカル側の削除フォールバック
      menuData = menuData.filter(m => m.id !== bubbleId);
      userCapturedBubbleList = userCapturedBubbleList.filter(u => u.menuId !== bubbleId);

      floatingBubbles.forEach(bubble => {
        if (bubble.data.menuId === bubbleId) {
          bubble.isDead = true;
          bubble.el.style.opacity = '0';
        }
      });

      renderMenuList();
      closeProductModal();
    }
    window.deleteUserBubble = deleteUserBubble;

    // ==============================================
    // 7.5 他のお客さんとのリアルタイム同期リスナー
    // ==============================================
    function startCloudListener() {
      if (!isCloudReady || !db) return;

      const bubblesCol = collection(db, 'artifacts', appId, 'public', 'data', 'bubbles');

      onSnapshot(bubblesCol, (snapshot) => {
        const now = Date.now();
        const TWO_HOURS = 2 * 60 * 60 * 1000;
        const validList = [];

        snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          if (now - (data.timestamp || 0) < TWO_HOURS) {
            validList.push({
              id: docSnap.id,
              ...data
            });
          } else {
            // 2時間過ぎた泡は自動クリーンアップ
            deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'bubbles', docSnap.id)).catch(() => {});
          }
        });

        updateCloudBubbles(validList);
      }, (error) => {
        console.warn("Cloud bubbles snapshot error:", error);
      });
    }

    function updateCloudBubbles(cloudItems) {
      // 1. デフォルトメニューにクラウドから届いた写真を結合
      const customerMenus = cloudItems.map(item => ({
        id: item.id,
        category: 'CUSTOMER MEMORY',
        title: item.title || 'お客様の思い出スナップ',
        curvedTop: item.comment || '乾杯！',
        curvedBottom: '今夜生まれた最高の瞬間。泡とともに届いた出来立ての1枚です',
        mainImg: item.img,
        price: 'MEMORIES',
        tag: 'NEW',
        userId: item.userId,
        review: {
          author: 'ご来店のお客様',
          text: `「${item.comment}」`
        }
      }));

      menuData = [...defaultMenuData, ...customerMenus];

      // 2. 泡用のリストも更新
      const previousIds = new Set(userCapturedBubbleList.map(b => b.menuId));
      userCapturedBubbleList = cloudItems.map(item => ({
        menuId: item.id,
        img: item.img,
        label: item.comment && item.comment.length > 7 ? item.comment.slice(0, 7) + '…' : (item.comment || '乾杯！'),
        isUser: true,
        userId: item.userId,
        timestamp: item.timestamp
      }));

      // 3. 新しく他のお客さんが流した泡があれば、画面下から湧き上がらせる
      cloudItems.forEach(item => {
        if (!previousIds.has(item.id)) {
          const bubbleData = {
            menuId: item.id,
            img: item.img,
            label: item.comment && item.comment.length > 7 ? item.comment.slice(0, 7) + '…' : (item.comment || '乾杯！'),
            isUser: true,
            userId: item.userId,
            timestamp: item.timestamp
          };
          const newBubble = new FreePhotoBubble(bubbleData, Math.floor(Math.random() * 3), 0, true);
          floatingBubbles.unshift(newBubble);
        }
      });

      // 4. クラウド上で消された泡を画面上からも消去
      const activeIds = new Set(cloudItems.map(item => item.id));
      floatingBubbles.forEach(b => {
        if (b.isUser && !activeIds.has(b.data.menuId)) {
          b.isDead = true;
          b.el.style.opacity = '0';
        }
      });

      renderMenuList();
    }

    // 2時間自動削除タイマー（ローカル環境でも動作）
    function checkExpiredBubbles() {
      const now = Date.now();
      const TWO_HOURS = 2 * 60 * 60 * 1000;
      for (let i = userCapturedBubbleList.length - 1; i >= 0; i--) {
        if (now - userCapturedBubbleList[i].timestamp > TWO_HOURS) {
          deleteUserBubble(userCapturedBubbleList[i].menuId);
        }
      }
    }
    setInterval(checkExpiredBubbles, 60000);

    // ==============================================
    // 8. 外カメラ（リアカメラ）起動 ＆ シャッター撮影
    // ==============================================
    const openCameraBtn = document.getElementById('openCameraBtn');
    const liveCameraModal = document.getElementById('liveCameraModal');
    const cameraVideo = document.getElementById('cameraVideo');
    const captureCanvas = document.getElementById('captureCanvas');
    const shutterFlash = document.getElementById('shutterFlash');
    const cameraFallbackInput = document.getElementById('cameraFallbackInput');
    const photoPreviewModal = document.getElementById('photoPreviewModal');
    const capturedImgPreview = document.getElementById('capturedImgPreview');
    const capturedCommentInput = document.getElementById('capturedCommentInput');

    let videoStream = null;
    let currentFacingMode = 'environment';
    let currentCapturedPhotoData = null;

    async function startCamera(facing = 'environment') {
      try {
        if (videoStream) {
          videoStream.getTracks().forEach(track => track.stop());
        }

        const constraints = {
          video: {
            facingMode: { ideal: facing },
            width: { ideal: 1280 },
            height: { ideal: 1280 }
          },
          audio: false
        };

        videoStream = await navigator.mediaDevices.getUserMedia(constraints);
        cameraVideo.srcObject = videoStream;
        await cameraVideo.play();

        liveCameraModal.classList.remove('hidden');
        liveCameraModal.classList.add('flex');
        setTimeout(() => liveCameraModal.classList.remove('opacity-0'), 10);

      } catch (err) {
        console.warn('Live camera error, falling back to file input:', err);
        cameraFallbackInput.click();
      }
    }

    function closeLiveCamera() {
      liveCameraModal.classList.add('opacity-0');
      setTimeout(() => {
        liveCameraModal.classList.add('hidden');
        liveCameraModal.classList.remove('flex');
        if (videoStream) {
          videoStream.getTracks().forEach(track => track.stop());
          videoStream = null;
        }
      }, 300);
    }

    function toggleCameraFacing() {
      currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
      startCamera(currentFacingMode);
    }

    function takePhoto() {
      if (!cameraVideo.videoWidth) return;

      playShutterSound();

      shutterFlash.classList.add('flash-active');
      setTimeout(() => shutterFlash.classList.remove('flash-active'), 280);

      const video = cameraVideo;
      const minDim = Math.min(video.videoWidth, video.videoHeight);
      const startX = (video.videoWidth - minDim) / 2;
      const startY = (video.videoHeight - minDim) / 2;

      captureCanvas.width = 400;
      captureCanvas.height = 400;
      const cCtx = captureCanvas.getContext('2d');

      if (currentFacingMode === 'user') {
        cCtx.translate(400, 0);
        cCtx.scale(-1, 1);
      }

      cCtx.drawImage(video, startX, startY, minDim, minDim, 0, 0, 400, 400);

      currentCapturedPhotoData = captureCanvas.toDataURL('image/jpeg', 0.72);

      closeLiveCamera();

      setTimeout(() => {
        capturedImgPreview.src = currentCapturedPhotoData;
        capturedCommentInput.value = '';
        photoPreviewModal.classList.remove('hidden');
        photoPreviewModal.classList.add('flex');
        setTimeout(() => photoPreviewModal.classList.remove('opacity-0'), 10);
      }, 350);
    }

    function triggerFileInputFallback() {
      cameraFallbackInput.click();
    }

    cameraFallbackInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          const tempImg = new Image();
          tempImg.onload = () => {
            const minDim = Math.min(tempImg.width, tempImg.height);
            const startX = (tempImg.width - minDim) / 2;
            const startY = (tempImg.height - minDim) / 2;
            captureCanvas.width = 400;
            captureCanvas.height = 400;
            const cCtx = captureCanvas.getContext('2d');
            cCtx.drawImage(tempImg, startX, startY, minDim, minDim, 0, 0, 400, 400);
            currentCapturedPhotoData = captureCanvas.toDataURL('image/jpeg', 0.72);

            closeLiveCamera();
            capturedImgPreview.src = currentCapturedPhotoData;
            capturedCommentInput.value = '';
            photoPreviewModal.classList.remove('hidden');
            photoPreviewModal.classList.add('flex');
            setTimeout(() => photoPreviewModal.classList.remove('opacity-0'), 10);
          };
          tempImg.src = event.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    openCameraBtn.addEventListener('click', () => {
      initAudio();
      startCamera('environment');
    });

    function closeCaptureModal() {
      photoPreviewModal.classList.add('opacity-0');
      setTimeout(() => {
        photoPreviewModal.classList.add('hidden');
        photoPreviewModal.classList.remove('flex');
      }, 300);
      cameraFallbackInput.value = '';
    }

    async function submitCapturedBubble() {
      const comment = capturedCommentInput.value.trim() || '乾杯！';
      const timestamp = Date.now();
      const uniqueId = `bubble_${timestamp}_${Math.random().toString(36).substr(2, 6)}`;

      if (isCloudReady && db && !currentUser) {
        try {
          const cred = await signInAnonymously(auth);
          currentUser = cred.user;
        } catch (e) {}
      }

      const myUserId = currentUser ? currentUser.uid : 'local_user';

      const bubbleDoc = {
        userId: myUserId,
        comment: comment,
        img: currentCapturedPhotoData,
        timestamp: timestamp,
        title: 'お客様の思い出スナップ'
      };

      if (isCloudReady && db) {
        try {
          const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'bubbles', uniqueId);
          await setDoc(docRef, bubbleDoc);
        } catch (err) {
          console.warn("Cloud save failed, using local mode:", err);
        }
      }

      const userBubbleData = {
        menuId: uniqueId,
        img: currentCapturedPhotoData,
        label: comment.length > 7 ? comment.slice(0, 7) + '…' : comment,
        isUser: true,
        userId: myUserId,
        timestamp: timestamp
      };

      menuData.push({
        id: uniqueId,
        category: 'CUSTOMER MEMORY',
        title: 'お客様の思い出スナップ',
        curvedTop: comment,
        curvedBottom: '今夜生まれた最高の瞬間。泡とともに届いた出来立ての1枚です',
        mainImg: currentCapturedPhotoData,
        price: 'MEMORIES',
        tag: 'NEW',
        userId: myUserId,
        isLocalAuthor: true,
        review: {
          author: 'たった今撮影されたお客様',
          text: `「${comment}」`
        }
      });

      userCapturedBubbleList.unshift(userBubbleData);

      const newBubble = new FreePhotoBubble(userBubbleData, Math.floor(Math.random() * 3), 0, true);
      newBubble.speedY = 0.9;
      setTimeout(() => {
        newBubble.speedY = 0.32;
      }, 2500);

      floatingBubbles.unshift(newBubble);

      renderMenuList();
      closeCaptureModal();
      playPopSound();
    }

    window.closeLiveCamera = closeLiveCamera;
    window.toggleCameraFacing = toggleCameraFacing;
    window.takePhoto = takePhoto;
    window.triggerFileInputFallback = triggerFileInputFallback;
    window.closeCaptureModal = closeCaptureModal;
    window.submitCapturedBubble = submitCapturedBubble;

    function ensureVideoPlayback() {
      const bgVideo = document.getElementById('bgVideo');
      if (!bgVideo) return;

      bgVideo.muted = true;
      bgVideo.defaultMuted = true;

      const playPromise = bgVideo.play();
      if (playPromise !== undefined) {
        playPromise.catch(() => {
          const onFirstTouch = () => {
            bgVideo.muted = true;
            bgVideo.play();
            document.removeEventListener('touchstart', onFirstTouch);
            document.removeEventListener('click', onFirstTouch);
          };
          document.addEventListener('touchstart', onFirstTouch, { once: true });
          document.addEventListener('click', onFirstTouch, { once: true });
        });
      }
    }

    // ==============================================
    // 9. 初期化
    // ==============================================
    window.addEventListener('load', () => {
      lucide.createIcons();
      resizeCanvas();
      renderMenuList();
      animate();
      ensureVideoPlayback();
      initAuth();

      // --- イントロダクションの演出 ---
      const introOverlay = document.getElementById('introOverlay');
      const introText = document.getElementById('introText');
      const uiElements = document.getElementById('uiElements');

      setTimeout(() => {
        introText.classList.remove('opacity-0', 'scale-95', 'translate-y-4');
        introText.classList.add('opacity-100', 'scale-100', 'translate-y-0');
      }, 400);

      setTimeout(() => {
        introText.classList.remove('opacity-100', 'scale-100', 'translate-y-0');
        introText.classList.add('opacity-0', 'scale-105', '-translate-y-2');
      }, 3500);

      setTimeout(() => {
        introOverlay.classList.remove('opacity-100');
        introOverlay.classList.add('opacity-0');

        initAmbientBubbles();
        initFloatingBubbles();

        uiElements.classList.remove('opacity-0');
        uiElements.classList.add('opacity-100');
        
        setTimeout(() => {
          introOverlay.classList.add('hidden');
        }, 1000);
      }, 4500);
    });
  </script>
</body>
</html>
