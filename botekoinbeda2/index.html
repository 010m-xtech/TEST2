<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>スペースサバイバー</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        /* HTMLとBODY全体を画面に強制固定 */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #05050f; /* 深い宇宙の黒 */
            color: #e2e8f0;
            font-family: 'Rajdhani', sans-serif;
            touch-action: none; 
            letter-spacing: 2px;
            user-select: none;
            -webkit-user-select: none;
        }
        
        .panel {
            background: rgba(10, 15, 30, 0.85);
            border: 1px solid #38bdf8;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            pointer-events: auto;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.25);
            backdrop-filter: blur(10px);
            max-width: 90%;
            width: 450px;
        }
        
        .btn {
            background: transparent;
            color: #38bdf8;
            border: 1px solid #38bdf8;
            padding: 12px 40px;
            font-size: 1.2rem;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.2s ease-out;
            font-family: 'Rajdhani', sans-serif;
            text-transform: uppercase;
            letter-spacing: 4px;
            width: 100%;
            box-sizing: border-box;
        }
        
        .btn:hover {
            background: rgba(56, 189, 248, 0.15);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.5), inset 0 0 10px rgba(56, 189, 248, 0.2);
            text-shadow: 0 0 5px #38bdf8;
        }
        
        .btn:active {
            transform: scale(0.98);
        }
        
        .hidden {
            display: none !important;
        }

        @keyframes glitchBlink {
            0% { opacity: 1; transform: scale(1) translateX(0); }
            50% { opacity: 0.8; transform: scale(1.02) translateX(2px); }
            100% { opacity: 0.9; transform: scale(0.98) translateX(-2px); }
        }
    </style>
</head>
<body class="bg-[#05050f]">

    <!-- キャンバス (画面に強制固定) -->
    <canvas id="gameCanvas" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; display: block; background-color: #05050f;"></canvas>
    
    <!-- ボスHPバー (画面に強制固定) -->
    <div id="bossHpContainer" style="position: fixed; top: 30px; left: 50%; transform: translateX(-50%); width: 60%; height: 12px; border: 1px solid #475569; background: rgba(0, 0, 0, 0.8); display: none; overflow: hidden; box-shadow: 0 0 15px rgba(239, 68, 68, 0.6); border-radius: 6px; z-index: 30;">
        <div id="bossHpBar" style="width: 100%; height: 100%; background: linear-gradient(90deg, #ef4444, #f87171); transition: width 0.1s linear;"></div>
    </div>
    
    <!-- 警告メッセージ (画面に強制固定) -->
    <div id="warning" style="position: fixed; top: 35%; left: 0; width: 100%; text-align: center; font-size: 2.5rem; font-weight: bold; color: #ef4444; letter-spacing: 10px; text-shadow: 0 0 15px #ef4444, 0 0 30px #dc2626; animation: glitchBlink 0.3s infinite alternate; display: none; z-index: 30;">きけん：ボスがちかづいているぞ！</div>

    <!-- UIレイヤー (画面に強制固定して中央揃え) -->
    <div id="uiLayer" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 20;">
        
        <!-- スタート画面 -->
        <div id="startPanel" class="panel">
            <h1 class="text-4xl mb-6 text-sky-400 tracking-widest font-bold" style="text-shadow: 0 0 10px rgba(56,189,248,0.5);">スペースサバイバー</h1>
            
            <!-- 通常のスタート表示 -->
            <div id="startContent">
                <p class="mb-2 text-lg text-slate-300">そうさ：マウスやタッチで さゆうにうごくよ</p>
                <p class="mb-6 text-sm text-slate-400 leading-relaxed">たまは じどうで うつよ！<br>てきや いんせきを こわそう！<br>もくひょう：ボスを たおせ！<br><span class="text-yellow-400 font-bold mt-2 inline-block">お好み焼きアイテムをとったらつよくなるよ！！</span></p>
                <button id="startBtn" class="btn">スタート！</button>
            </div>

            <!-- プレイ済みの場合の表示 -->
            <div id="playedContent" class="hidden">
                <p class="text-red-400 text-2xl font-bold mt-4 mb-4" style="text-shadow: 0 0 10px rgba(239,68,68,0.5);">すでにプレイ済みです</p>
                <p class="text-slate-400 text-sm">※もう一度遊ぶには、特定のページから<br>アクセスしてください。</p>
            </div>
        </div>

        <!-- ゲームオーバー画面 -->
        <div id="gameOverPanel" class="panel hidden">
            <h1 class="text-4xl mb-4 text-red-500 tracking-widest font-bold" style="text-shadow: 0 0 10px rgba(239,68,68,0.5);">ゲームオーバー</h1>
            <p class="mb-6 text-lg text-slate-400">やられてしまった...</p>
        </div>

        <!-- クリア画面 -->
        <div id="gameClearPanel" class="panel hidden">
            <h1 class="text-4xl md:text-5xl mb-6 text-emerald-400 tracking-widest font-bold leading-tight" style="text-shadow: 0 0 15px rgba(52,211,153,0.8);">
                おめでとう！<br>ゲームクリア！！
            </h1>
            <div class="mt-6 p-4 bg-yellow-400/20 border-2 border-yellow-400 rounded-lg animate-pulse shadow-[0_0_20px_rgba(250,204,21,0.5)]">
                <span class="text-yellow-400 text-2xl sm:text-3xl font-bold block leading-relaxed" style="text-shadow: 0 0 10px rgba(250,204,21,0.8);">
                    この画面を<br>スタッフに見せてね♪
                </span>
            </div>
        </div>
    </div>

    <script>
        // === プレイ履歴のチェックとリセット処理 ===
        const ALLOWED_URL = "https://010m-xtech.github.io/TEST2/boteko/";
        
        // 指定のURLから遷移してきた（リファラが一致する）場合はプレイ履歴を消去
        if (document.referrer.startsWith(ALLOWED_URL)) {
            localStorage.removeItem('spaceSurvivorPlayed');
        }

        const startContent = document.getElementById('startContent');
        const playedContent = document.getElementById('playedContent');

        // プレイ済みかどうかでスタート画面の表示を切り替える
        if (localStorage.getItem('spaceSurvivorPlayed') === 'true') {
            startContent.classList.add('hidden');
            playedContent.classList.remove('hidden');
        }
        // =====================================

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // UI要素
        const startPanel = document.getElementById('startPanel');
        const gameOverPanel = document.getElementById('gameOverPanel');
        const gameClearPanel = document.getElementById('gameClearPanel');
        const startBtn = document.getElementById('startBtn');
        const bossHpContainer = document.getElementById('bossHpContainer');
        const bossHpBar = document.getElementById('bossHpBar');
        const warningDisplay = document.getElementById('warning');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let gameState = 'START';
        let gamePhase = 1;
        let gameTime = 0;
        let lastTime = 0;
        let animationId;
        
        // アイテムと出現フラグの管理
        let shouldSpawnItem = false;
        let powerUpItem = null;
        let itemSpawnedThisGame = false;
        
        const BOSS_APPEAR_TIME = 15; // 15秒でボス出現

        // 画像の読み込み
        const playerImg = new Image();
        playerImg.src = 'https://github.com/user-attachments/assets/7f92a041-6f05-4aea-8173-46a7f4e23da7';

        const enemyImg = new Image();
        enemyImg.src = 'https://github.com/user-attachments/assets/f78d67f5-6461-4e56-93e1-d092dcd83f7d';

        const meteorImg = new Image();
        meteorImg.src = 'https://github.com/user-attachments/assets/8db36ac2-9934-453f-8da5-3b5ec418d7eb';

        const bossImg = new Image();
        bossImg.src = 'https://github.com/user-attachments/assets/272fe8b9-6edc-4dc3-ab08-9a3a705b9ad1';

        const itemImg = new Image();
        itemImg.src = 'https://i.postimg.cc/qB2sdrdG/hua-xiang6.png';

        let particles = [];
        class Particle {
            constructor(x, y, color, speed, radius, lifeDecay) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * speed;
                this.vy = (Math.random() - 0.5) * speed;
                this.color = color;
                this.radius = radius || Math.random() * 3 + 2;
                this.life = 1.0;
                this.decay = lifeDecay || (Math.random() * 0.04 + 0.02);
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
            }
            draw() {
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.rect(this.x - this.radius/2, this.y - this.radius/2, this.radius, this.radius);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }
        }

        function createExplosion(x, y, color, count = 15) {
            for(let i=0; i<count; i++) {
                particles.push(new Particle(x, y, color, 8));
            }
        }

        class PowerUp {
            constructor() {
                this.width = 40;
                this.height = 40;
                this.x = Math.random() * (canvas.width - 100) + 50;
                this.y = -this.height;
                this.speed = 2;
            }
            update() {
                this.y += this.speed;
            }
            draw() {
                if (itemImg.complete) {
                    ctx.drawImage(itemImg, this.x - this.width/2, this.y - this.height/2, this.width, this.height);
                } else {
                    ctx.fillStyle = '#fde047';
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.width/2, 0, Math.PI*2);
                    ctx.fill();
                }
            }
        }

        const player = {
            x: canvas.width / 2,
            y: canvas.height - 100,
            width: 60,
            height: 70,
            targetX: canvas.width / 2,
            bullets: [],
            lastShotTime: 0,
            shotInterval: 120,
            powerLevel: 1,
            
            draw: function() {
                ctx.save();
                ctx.translate(this.x, this.y);
                
                if (playerImg.complete) {
                    const drawW = 90;
                    const drawH = 100;
                    ctx.drawImage(playerImg, -drawW/2, -drawH/2, drawW, drawH);
                } else {
                    ctx.fillStyle = '#cbd5e1';
                    ctx.beginPath();
                    ctx.moveTo(0, -this.height/2);
                    ctx.lineTo(this.width/2, this.height/2);
                    ctx.lineTo(-this.width/2, this.height/2);
                    ctx.closePath();
                    ctx.fill();
                }
                
                ctx.restore();
            },
            
            update: function() {
                const dx = this.targetX - this.x;
                this.x += dx * 0.2;
                
                if (this.x < this.width / 2) this.x = this.width / 2;
                if (this.x > canvas.width - this.width / 2) this.x = canvas.width - this.width / 2;
                this.y = canvas.height - 100;
                
                const now = Date.now();
                if (now - this.lastShotTime > this.shotInterval) {
                    if (this.powerLevel === 1) {
                        this.bullets.push(new PlayerBullet(this.x, this.y - this.height/2));
                    } else {
                        this.bullets.push(new PlayerBullet(this.x, this.y - this.height/2));
                        this.bullets.push(new PlayerBullet(this.x - 20, this.y - this.height/2));
                        this.bullets.push(new PlayerBullet(this.x + 20, this.y - this.height/2));
                        this.bullets.push(new PlayerBullet(this.x - 30, this.y - this.height/2 + 10, -3, -14));
                        this.bullets.push(new PlayerBullet(this.x + 30, this.y - this.height/2 + 10, 3, -14));
                    }
                    particles.push(new Particle(this.x, this.y - this.height/2, '#38bdf8', 2, 2, 0.15));
                    this.lastShotTime = now;
                }
                
                for (let i = this.bullets.length - 1; i >= 0; i--) {
                    this.bullets[i].update();
                    this.bullets[i].draw();
                    if (this.bullets[i].y < 0) {
                        this.bullets.splice(i, 1);
                    }
                }
            }
        };

        class PlayerBullet {
            constructor(x, y, vx = 0, vy = -15) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.width = 3;
                this.height = 20;
            }
            update() { 
                this.x += this.vx; 
                this.y += this.vy; 
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                const angle = Math.atan2(this.vy, this.vx) + Math.PI / 2;
                ctx.rotate(angle);
                
                ctx.fillStyle = '#38bdf8';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#38bdf8';
                ctx.fillRect(-this.width/2, 0, this.width, this.height);
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(-1, 5, 2, 10);
                ctx.shadowBlur = 0;
                
                ctx.restore();
            }
        }

        let meteors = [];
        class Meteor {
            constructor() {
                this.radius = Math.random() * 20 + 30;
                this.x = Math.random() * canvas.width;
                this.y = -this.radius;
                this.speed = Math.random() * 1.5 + 1.5 + (gameTime * 0.02);
                this.hp = Math.floor(this.radius / 10);
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.05;
                this.vertices = Math.floor(Math.random() * 4) + 5;
                this.offsets = [];
                for(let i=0; i<this.vertices; i++){
                    this.offsets.push(Math.random() * 0.4 + 0.6);
                }
                const tones = ['#1e293b', '#334155', '#475569'];
                this.color = tones[Math.floor(Math.random() * tones.length)];
            }
            update() {
                this.y += this.speed;
                this.rotation += this.rotationSpeed;
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                
                if (meteorImg.complete) {
                    const drawSize = this.radius * 2.5;
                    ctx.drawImage(meteorImg, -drawSize/2, -drawSize/2, drawSize, drawSize);
                } else {
                    ctx.fillStyle = this.color;
                    ctx.strokeStyle = '#64748b';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    for (let i = 0; i < this.vertices; i++) {
                        const angle = (i / this.vertices) * Math.PI * 2;
                        const r = this.radius * this.offsets[i];
                        const px = Math.cos(angle) * r;
                        const py = Math.sin(angle) * r;
                        if (i === 0) ctx.moveTo(px, py);
                        else ctx.lineTo(px, py);
                    }
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                }
                ctx.restore();
            }
        }

        let enemies = [];
        let enemyBullets = [];
        class Enemy {
            constructor() {
                this.radius = 30;
                this.x = Math.random() * (canvas.width - 60) + 30;
                this.y = -this.radius;
                this.speed = Math.random() * 1.0 + 1.0;
                this.hp = 3;
                this.color = '#ef4444';
                this.lastShotTime = Date.now() + Math.random() * 1000;
            }
            update() {
                this.y += this.speed;
                const now = Date.now();
                if (now - this.lastShotTime > 2500) {
                    const dx = player.x - this.x;
                    const dy = player.y - this.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    enemyBullets.push(new EnemyBullet(this.x, this.y + 10, (dx/dist)*3, (dy/dist)*3)); 
                    this.lastShotTime = now;
                }
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                
                if (enemyImg.complete) {
                    const drawW = 75;
                    const drawH = 75;
                    ctx.drawImage(enemyImg, -drawW/2, -drawH/2, drawW, drawH);
                } else {
                    ctx.fillStyle = '#1e293b';
                    ctx.strokeStyle = this.color;
                    ctx.lineWidth = 2;
                    
                    ctx.beginPath();
                    ctx.moveTo(0, -this.radius);
                    ctx.lineTo(this.radius, 0);
                    ctx.lineTo(0, this.radius);
                    ctx.lineTo(-this.radius, 0);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();

                    ctx.fillStyle = '#f87171';
                    ctx.beginPath();
                    ctx.arc(0, 0, 4, 0, Math.PI*2);
                    ctx.fill();
                }
                
                ctx.restore();
            }
        }

        class EnemyBullet {
            constructor(x, y, vx, vy) {
                this.x = x; this.y = y;
                this.vx = vx; this.vy = vy;
                this.radius = 4;
            }
            update() {
                this.x += this.vx; this.y += this.vy;
            }
            draw() {
                ctx.fillStyle = '#f87171';
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#ef4444';
                ctx.beginPath(); 
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2); 
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        let boss = null;
        class Boss {
            constructor() {
                this.width = 220;
                this.height = 140;
                this.x = canvas.width / 2;
                this.y = -this.height;
                this.targetY = 150;
                this.speed = 2;
                this.maxHp = 150;
                this.hp = this.maxHp;
                this.moveTimer = 0;
                this.lastShotTime = 0;
            }
            
            update() {
                if (this.y < this.targetY) {
                    this.y += this.speed;
                    return;
                }
                
                this.moveTimer += 0.05;
                this.x = canvas.width / 2 + Math.sin(this.moveTimer) * (canvas.width / 2.5);
                
                const now = Date.now();
                if (now - this.lastShotTime > 350) {
                    if (Math.random() < 0.6) {
                        for(let i = -4; i <= 4; i++) {
                            enemyBullets.push(new EnemyBullet(this.x, this.y + this.height/2 - 20, i * 2, 7 + Math.random() * 2));
                        }
                    } else {
                        const dx = player.x - this.x;
                        const dy = player.y - (this.y + this.height/2);
                        const dist = Math.hypot(dx, dy) || 1;
                        enemyBullets.push(new EnemyBullet(this.x, this.y + this.height/2, (dx/dist)*12, (dy/dist)*12));
                        enemyBullets.push(new EnemyBullet(this.x - 30, this.y + this.height/2, (dx/dist)*10, (dy/dist)*10));
                        enemyBullets.push(new EnemyBullet(this.x + 30, this.y + this.height/2, (dx/dist)*10, (dy/dist)*10));
                    }
                    this.lastShotTime = now;
                }
                bossHpBar.style.width = `${(this.hp / this.maxHp) * 100}%`;
            }
            
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);

                if (bossImg.complete) {
                    const drawW = 250;
                    const drawH = 250;
                    ctx.drawImage(bossImg, -drawW/2, -drawH/2, drawW, drawH);
                } else {
                    ctx.fillStyle = '#0f172a';
                    ctx.strokeStyle = '#475569';
                    ctx.lineWidth = 3;
                    
                    ctx.beginPath();
                    ctx.moveTo(-this.width/2, -this.height/2);
                    ctx.lineTo(this.width/2, -this.height/2);
                    ctx.lineTo(this.width/2 + 20, 0);
                    ctx.lineTo(this.width/2, this.height/2);
                    ctx.lineTo(-this.width/2, this.height/2);
                    ctx.lineTo(-this.width/2 - 20, 0);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();

                    ctx.fillStyle = '#1e293b';
                    ctx.beginPath();
                    ctx.moveTo(-this.width/2 + 20, -this.height/2 + 20);
                    ctx.lineTo(this.width/2 - 20, -this.height/2 + 20);
                    ctx.lineTo(this.width/2 - 10, 0);
                    ctx.lineTo(this.width/2 - 20, this.height/2 - 20);
                    ctx.lineTo(-this.width/2 + 20, this.height/2 - 20);
                    ctx.lineTo(-this.width/2 + 10, 0);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();

                    ctx.strokeStyle = '#ef4444';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(-this.width/2 + 20, 0);
                    ctx.lineTo(-10, 0);
                    ctx.moveTo(10, 0);
                    ctx.lineTo(this.width/2 - 20, 0);
                    ctx.stroke();

                    ctx.fillStyle = '#ef4444';
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = '#ef4444';
                    ctx.beginPath();
                    ctx.arc(0, 0, 15 + Math.sin(this.moveTimer * 5) * 3, 0, Math.PI*2);
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    ctx.fillStyle = '#334155';
                    ctx.fillRect(-40, this.height/2, 10, 15);
                    ctx.fillRect(30, this.height/2, 10, 15);
                }
                
                ctx.restore();
            }
        }

        const stars = [];
        for (let i = 0; i < 100; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2 + 0.5,
                speed: Math.random() * 2 + 0.5,
                color: Math.random() > 0.3 ? '#94a3b8' : '#38bdf8'
            });
        }
        
        function drawStars() {
            stars.forEach(star => {
                ctx.fillStyle = star.color;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size/2, 0, Math.PI*2);
                ctx.fill();
                star.y += star.speed + (gamePhase === 2 ? 5 : 0);
                if (star.y > canvas.height) {
                    star.y = 0;
                    star.x = Math.random() * canvas.width;
                }
            });
        }

        function handleInput(e) {
            if (gameState !== 'PLAYING') return;
            let clientX;
            if (e.type.startsWith('touch')) {
                clientX = e.touches[0].clientX;
            } else {
                clientX = e.clientX;
            }
            player.targetX = clientX;
        }

        canvas.addEventListener('mousemove', handleInput);
        canvas.addEventListener('touchmove', handleInput, { passive: false });
        canvas.addEventListener('touchstart', handleInput, { passive: false });

        function checkCollision() {
            if (gameState !== 'PLAYING') return;
            const pHitR = 10;

            for (let i = player.bullets.length - 1; i >= 0; i--) {
                const b = player.bullets[i];
                let bulletHit = false;

                for (let j = meteors.length - 1; j >= 0; j--) {
                    const m = meteors[j];
                    const dist = Math.hypot(b.x - m.x, b.y - m.y);
                    if (dist < m.radius + b.width) {
                        m.hp--;
                        bulletHit = true;
                        createExplosion(b.x, b.y, '#38bdf8', 5);
                        if (m.hp <= 0) {
                            createExplosion(m.x, m.y, m.color, 20);
                            meteors.splice(j, 1);
                        }
                        break;
                    }
                }

                if (!bulletHit) {
                    for (let j = enemies.length - 1; j >= 0; j--) {
                        const e = enemies[j];
                        const dist = Math.hypot(b.x - e.x, b.y - e.y);
                        if (dist < e.radius + b.width) {
                            e.hp--;
                            bulletHit = true;
                            createExplosion(b.x, b.y, '#38bdf8', 5);
                            if (e.hp <= 0) {
                                createExplosion(e.x, e.y, e.color, 20);
                                enemies.splice(j, 1);
                            }
                            break;
                        }
                    }
                }

                if (!bulletHit && gamePhase === 2 && boss) {
                    if (Math.abs(b.x - boss.x) < boss.width/2 && Math.abs(b.y - boss.y) < boss.height/2) {
                        boss.hp--;
                        bulletHit = true;
                        createExplosion(b.x, b.y, '#ef4444', 5);
                        if (boss.hp <= 0) {
                            createExplosion(boss.x, boss.y, '#ef4444', 60);
                            gameClear();
                            return;
                        }
                    }
                }

                if (bulletHit) {
                    player.bullets.splice(i, 1);
                }
            }

            if (powerUpItem) {
                const dist = Math.hypot(player.x - powerUpItem.x, player.y - powerUpItem.y);
                if (dist < player.width/2 + powerUpItem.width/2) {
                    player.powerLevel = 2;
                    player.shotInterval = 85;
                    createExplosion(powerUpItem.x, powerUpItem.y, '#fde047', 30);
                    powerUpItem = null;
                }
            }

            for (let i = 0; i < meteors.length; i++) {
                if (Math.hypot(player.x - meteors[i].x, player.y - meteors[i].y) < meteors[i].radius + pHitR) {
                    gameOver(); return;
                }
            }
            for (let i = 0; i < enemies.length; i++) {
                if (Math.hypot(player.x - enemies[i].x, player.y - enemies[i].y) < enemies[i].radius + pHitR) {
                    gameOver(); return;
                }
            }
            for (let i = 0; i < enemyBullets.length; i++) {
                if (Math.hypot(player.x - enemyBullets[i].x, player.y - enemyBullets[i].y) < enemyBullets[i].radius + pHitR) {
                    gameOver(); return;
                }
            }
            if (gamePhase === 2 && boss) {
                if (Math.abs(player.x - boss.x) < boss.width/2 && Math.abs(player.y - boss.y) < boss.height/2) {
                    gameOver(); return;
                }
            }
        }

        function initGame() {
            // ゲーム開始時にプレイ済みのフラグを保存する
            localStorage.setItem('spaceSurvivorPlayed', 'true');

            shouldSpawnItem = true; 
            
            player.powerLevel = 1;
            player.shotInterval = 120;
            
            player.x = canvas.width / 2;
            player.targetX = canvas.width / 2;
            player.bullets = [];
            meteors = [];
            enemies = [];
            enemyBullets = [];
            particles = [];
            powerUpItem = null;
            itemSpawnedThisGame = false;
            boss = null;
            gameTime = 0;
            gamePhase = 1;
            lastTime = performance.now();
            
            bossHpContainer.style.display = 'none';
            warningDisplay.style.display = 'none';
            
            gameState = 'PLAYING';
            startPanel.classList.add('hidden');
            gameOverPanel.classList.add('hidden');
            gameClearPanel.classList.add('hidden');
            
            animate(lastTime);
        }

        function gameOver() {
            gameState = 'GAMEOVER';
            createExplosion(player.x, player.y, '#38bdf8', 50); 
            
            setTimeout(() => {
                cancelAnimationFrame(animationId);
                gameOverPanel.classList.remove('hidden');
                bossHpContainer.style.display = 'none';
            }, 500);
        }
        
        function gameClear() {
            gameState = 'CLEAR';
            setTimeout(() => {
                cancelAnimationFrame(animationId);
                gameClearPanel.classList.remove('hidden');
                bossHpContainer.style.display = 'none';
            }, 1000);
        }

        function triggerBossPhase() {
            gamePhase = 2;
            warningDisplay.style.display = 'block';
            
            setTimeout(() => {
                warningDisplay.style.display = 'none';
                boss = new Boss();
                bossHpContainer.style.display = 'block';
            }, 3000);
        }

        function animate(timestamp) {
            if (gameState === 'GAMEOVER' && particles.length === 0) return;
            if (gameState === 'CLEAR' && particles.length === 0) return;

            const dt = (timestamp - lastTime) / 1000;
            lastTime = timestamp;
            if(gameState === 'PLAYING') gameTime += dt;

            ctx.fillStyle = '#05050f';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawStars();
            
            if (gameState === 'PLAYING') {
                if (gamePhase === 1 && gameTime > BOSS_APPEAR_TIME) {
                    triggerBossPhase();
                }
                
                if (shouldSpawnItem && !itemSpawnedThisGame && gameTime > 4) {
                    powerUpItem = new PowerUp();
                    itemSpawnedThisGame = true;
                }
                
                if (gamePhase === 1) {
                    if (Math.random() < 0.02 + (gameTime * 0.0005)) { 
                        meteors.push(new Meteor());
                    }
                    if (Math.random() < 0.004 + (gameTime * 0.0001)) {
                        enemies.push(new Enemy());
                    }
                }
            }

            [meteors, enemies, enemyBullets].forEach(arr => {
                for (let i = arr.length - 1; i >= 0; i--) {
                    arr[i].update();
                    arr[i].draw();
                    if (arr[i].y > canvas.height + 50) arr.splice(i, 1);
                    else if (arr[i].x < -50 || arr[i].x > canvas.width + 50) arr.splice(i, 1);
                }
            });
            
            if (gamePhase === 2 && boss) {
                boss.update();
                boss.draw();
            }

            if (powerUpItem) {
                powerUpItem.update();
                powerUpItem.draw();
                if (powerUpItem.y > canvas.height + 50) {
                    powerUpItem = null;
                }
            }

            if (gameState === 'PLAYING') {
                player.update();
                player.draw();
                checkCollision();
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].life <= 0) {
                    particles.splice(i, 1);
                }
            }

            animationId = requestAnimationFrame(animate);
        }

        startBtn.addEventListener('click', initGame);

        function drawStartScreen() {
            if (gameState === 'START') {
                ctx.fillStyle = '#05050f';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                drawStars();
                requestAnimationFrame(drawStartScreen);
            }
        }
        drawStartScreen();

    </script>
</body>
</html>
