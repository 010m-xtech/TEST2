main{max-width:520px;margin:0 auto;padding:20px 22px 64px}
h1,h2{text-shadow:1px 2px 3px rgba(0,0,0,.28);text-wrap:balance;font-weight:800;line-height:1.4;margin:0}
h1{font-size:28px}
h1 .sub-title{display:block;font-size:20px;margin-top:4px}
h2{text-wrap:balance;font-size:26px;margin:6px 0 14px}
p{margin:0 0 1em}
.pg{text-align:center;font-size:16px;color:var(--mut);margin-bottom:26px}
.pg b{font-size:28px;font-weight:800;color:var(--fg);letter-spacing:.08em}
.why{border-left:3px solid var(--acc);padding:2px 0 2px 14px;margin:0 0 22px;color:var(--mut);font-size:14px;line-height:1.8}
.ln{display:block;white-space:nowrap;font-size:clamp(10px, calc((100vw - 110px) / 20.5), 20px);letter-spacing:-0.02em}
.why .ln b{color:var(--fg)}
.ln2{display:block;white-space:nowrap;font-size:min(17px,3.5vw)}
.why b{color:var(--acc)}
button{font:inherit;cursor:pointer}
.rv{display:none;margin-top:16px}
.rv.show{display:block}
.rv .lb{font-size:14px;color:var(--acc);font-weight:700;margin:0 0 2px}
.taste{border-top:1px solid var(--line);padding-top:16px;margin-top:6px}
.btn{display:block;width:100%;background:var(--acc);color:var(--bg);border:0;border-radius:6px;padding:14px;font-weight:700;font-size:18px;margin-top:22px}
.btn.ghost{background:none;color:var(--mut);border:1px solid var(--line);font-size:15px;font-weight:400}
:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.lead{font-size:18px}
.small{font-size:14px;color:var(--mut)}
.greeting-text{font-size:clamp(13px, calc((100vw - 44px) / 21.5), 20px);white-space:nowrap;letter-spacing:-0.05em;}
.special-text{font-size:clamp(13px, calc((100vw - 44px) / 20.5), 21px);white-space:nowrap;letter-spacing:-0.05em;margin:0 0 1em}
.course-title{display:block;white-space:nowrap;font-size:clamp(10px, calc((100vw - 110px) / 18.5), 23px);letter-spacing:-0.05em;color:var(--acc);margin-bottom:12px}
.glass-box{background:var(--card);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:12px;padding:26px 14px;margin:28px 0;box-shadow:0 8px 24px rgba(0,0,0,0.06);text-align:center}
.glass-box .ln b{color:var(--fg)}
.code{background:var(--acc);color:var(--fg);border-radius:6px;text-align:center;padding:16px 8px;margin:18px 0;font-size:28px;font-weight:800;letter-spacing:.15em}
[hidden]{display:none!important}
.cd{display:grid;width:100%;background:none;border:0;padding:0;perspective:900px;text-align:left;color:inherit;margin:8px 0 20px}
.fc{grid-area:1/1;display:flex;flex-direction:column;justify-content:center;gap:8px;padding:22px 18px;min-height:190px;border-radius:6px;border:1px solid var(--line);backface-visibility:hidden;transition:transform .6s}
.fr{background:var(--card);font-size:18px}.fr small{color:var(--acc);font-size:14px}
.bk{background:var(--acc);color:var(--bg);transform:rotateY(180deg);font-size:16px;line-height:1.8}
.cd.on .fr{transform:rotateY(-180deg)}.cd.on .bk{transform:rotateY(0)}
.bl{margin:8px 0 20px}
.blank{background:none;border:0;border-bottom:2px dashed var(--acc);color:var(--acc);font-weight:700;padding:0 4px;margin:0 2px}
.blank.ans{border-bottom-style:solid;color:var(--fg)}
.stp{padding-left:1.5em;margin:8px 0 14px}.stp li{font-weight:700;margin:0 0 8px}
.nt{margin:0 0 20px;color:var(--mut);font-size:15px}
.seg{display:flex;gap:10px;margin:8px 0 12px}
.seg button{flex:1;background:none;color:var(--fg);border:1.5px solid var(--fg);border-radius:6px;padding:10px 4px;font-size:16px}
.seg .act{background:var(--acc);border-color:var(--acc);color:var(--bg)}
.cbox{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px;margin:0 0 20px;min-height:84px}
.pcs{display:flex;gap:4px;position:relative;margin:12px 0}
.pcs::before{content:"";position:absolute;left:-6px;right:-6px;top:50%;height:3px;background:var(--stick)}
.pcs button{position:relative;flex:1;height:58px;border:0;border-radius:12px;color:#fff;font-weight:700;font-size:16px}
.pcs .m{background:#a85a2c}.pcs .n{background:#6f8f4a}
@media (prefers-reduced-motion:reduce){.fc{transition:none}}
.fr{border:2px solid var(--acc);background:var(--tint)}
.fr small{align-self:flex-start;background:var(--acc);color:var(--bg);padding:2px 12px;border-radius:999px;font-weight:700}
.blank{background:var(--tint);border:0;border-bottom:2px solid var(--acc);border-radius:4px 4px 0 0;padding:2px 12px}
.blank.ans{background:none}
.seg button{border-color:var(--acc);background:var(--tint)}
.seg .act{background:var(--acc)}
.hero-container{display:flex;flex-direction:column;align-items:center;margin:24px 0 16px}
.hero-image{width:140px;height:140px;border-radius:50%;object-fit:cover;border:3px solid var(--acc);background:var(--tint);margin-bottom:24px;box-shadow:0 8px 24px rgba(0,0,0,0.12)}
.msg-window{width:100%;background:var(--msg-bg);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border:1px solid var(--line);border-radius:16px;padding:24px 16px;box-shadow:0 8px 24px rgba(0,0,0,0.06);position:relative}
.msg-window::before{content:"";position:absolute;top:-14px;left:50%;transform:translateX(-50%);border-width:0 14px 14px 14px;border-style:solid;border-color:transparent transparent var(--line) transparent}
.msg-window::after{content:"";position:absolute;top:-12px;left:50%;transform:translateX(-50%);border-width:0 12px 12px 12px;border-style:solid;border-color:transparent transparent var(--msg-bg) transparent}
.msg-window p{margin:0 0 1.2em}
.msg-window p:last-child{margin-bottom:0}
.type-cursor::after{content:" |";font-weight:normal;color:var(--mut);animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.msg-window .lead{font-size:clamp(14px, calc((100vw - 60px) / 17), 18px);white-space:nowrap;letter-spacing:-0.05em}
.msg-window .greeting-text{font-size:clamp(12px, calc((100vw - 60px) / 21.5), 20px)}
.anim-fade{opacity:0;animation:fadeIn 1s ease-out forwards}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.pass{background:linear-gradient(135deg,#f0d283,#b8862b 50%,#f0d283);padding:3px;border-radius:10px;margin:18px 0;box-shadow:0 6px 18px rgba(120,80,10,.35)}
.pass-in{position:relative;background:#1c1a17;color:#f1d58a;text-align:center;padding:20px 8px 14px;border-radius:8px;border:1px solid #b8862b}
.pass-in small{display:block;font-size:13px;letter-spacing:.2em}
.pass-in .pw{display:block;font-size:32px;letter-spacing:.2em;margin:4px 0 6px;color:#f7e3a6}
.pass-in .pd{font-size:12px;opacity:.8}
.seal{position:absolute;right:10px;top:10px;width:34px;height:34px;border:2px solid #d9503f;color:#e8665a;border-radius:4px;font-style:normal;font-weight:800;font-size:18px;display:grid;place-items:center;transform:rotate(-12deg)}
.noren{position:fixed;inset:0;z-index:99;display:flex;animation:fadeOnly .3s}
@keyframes fadeOnly{from{opacity:0}}
.noren div{flex:1;background:linear-gradient(#26375c,#1b2848);display:flex;align-items:center;font-size:84px;font-weight:800;color:#f1ece0;transition:transform 1s cubic-bezier(.7,0,.3,1);box-shadow:0 0 40px rgba(0,0,0,.4)}
.noren .l{justify-content:flex-end;padding-right:12px;border-right:2px solid #c9a24a}
.noren .r{justify-content:flex-start;padding-left:12px}
.noren.open .l{transform:translateX(-102%)}.noren.open .r{transform:translateX(102%)}
@media (prefers-reduced-motion:reduce){.anim-fade{animation-duration:.01s;animation-delay:0s!important}}
</style>
</head>

{n:"砂肝",c:"歯ごたえは、切り方で決まる",r:"食感の魅力が、いちばん伝わる一本。",
i:"砂肝は、鶏が石をのみ込んで食べ物をすりつぶす胃の一部。つまりほぼ筋肉のかたまりで、そのまま焼くと硬くなりがちです。|うちでは、焼く前にひと手間かけています。",
w:["flip","焼く前のひと手間とは？","タップして裏返す","銀皮を丁寧に取って、切り込みを入れます。|噛みきれない硬さだけを取り除くと、噛んだ瞬間の「コリッ」だけが残ります。"],
t:"最初の一口は、噛み始めの「コリッ」に集中してみてください。"},
{n:"せせり",c:"少ししかとれないから、火を急がない",r:"少ししかとれない、脂の旨みの塊。",
i:"せせりは、鶏が絶えず動かしている首まわりの肉。|よく動く筋肉なので、脂と肉の旨みが濃いのが特徴です。",
w:["blank","1羽からとれる量は、","ほんのわずか","。貴重な部位だからこそ、脂を落としすぎず、焼き切りもしない火加減にこだわっています。"],
t:"噛むほどに広がる脂の甘さを、ゆっくり味わってください。"},
{n:"手羽先",c:"パリッと、じゅわっと、両立させる",r:"パリッとじゅわっと、両方味わえる。",

w:["steps",["焼く前に、表面の余分な水分を抜く","串に打って、じっくり焼く","皮はパリッ、中はじゅわっ"],"水分が残っていると皮が蒸されてしまうので、最初の水抜きがいちばん大事です。"],
t:"一口目は、皮を割る音と香りを楽しんでください。"},
{n:"心臓",c:"「内臓は苦手」を、変える一本",r:"「内臓は苦手」が変わる一本。",

if(matchMedia("(prefers-reduced-motion:reduce)").matches){cb();return}

function intro(){
    v.innerHTML='<h1>炭火焼 なみひら<br><span class="sub-title">大将から、ご挨拶</span></h1>'+
    '<div class="hero-container">'+
      '<img src="'+EDA+'" class="hero-image" alt="大将" onerror="this.style.display=\'none\'">'+
      '<div class="msg-window">'+
        '<p class="lead" id="m1"></p>'+
        '<p class="lead" id="m2"></p>'+
        '<p class="greeting-text" id="m3"></p>'+'<p class="small" id="hint" style="text-align:center;margin:14px 0 0;opacity:.6">タップで全文表示</p>'+
      '</div>'+
    '</div>'+
    '<div id="st-wrap" style="opacity:0; transition: opacity 1s ease-out; margin-top: 24px">'+
      '<p class="small" style="text-align:center;margin:0 0 16px"><b>読み終えるまで、3〜4分ほどです。</b></p>'+
      '<button class="btn" id="st" style="margin-top:0">はじめる</button>'+
    '</div>';

    document.getElementById("st").onclick=function(){go(0)};
    skipFlag=seenIntro||matchMedia("(prefers-reduced-motion:reduce)").matches;
    document.querySelector(".msg-window").onclick=function(){skipFlag=true};
    if(skipFlag)document.getElementById("hint").hidden=true;

    var texts = [
      '<b>ご来店ありがとうございます。<br>大将の江田です。</b>',
      '<b>お料理の提供まで、<br>「まずはこれを食べてほしい」と思う<br><span style="color:var(--acc)">５本の焼き鳥</span>を紹介させてください。</b>',
      '<b>お料理の提供をお待ちいただく間に、<br>少しでも<span style="color:var(--acc)">こだわり</span>を知っていただき、<br>より美味しくお召し上がりいただけたら幸いです。</b>'
    ];

    var m1 = document.getElementById('m1');
    var m2 = document.getElementById('m2');
    var m3 = document.getElementById('m3');

    // タイピング中に要素の高さがガタガタ動かないよう、あらかじめ高さを確保します
    m1.innerHTML = texts[0]; m2.innerHTML = texts[1]; m3.innerHTML = texts[2];
    m1.style.minHeight = m1.offsetHeight + 'px';
    m2.style.minHeight = m2.offsetHeight + 'px';
    m3.style.minHeight = m3.offsetHeight + 'px';
    m1.innerHTML = ''; m2.innerHTML = ''; m3.innerHTML = '';

    // 1文字ずつ表示するタイピング処理
    function typeHTML(el, html, cb) {
      el.classList.add('type-cursor'); // カーソルの点滅を追加
      var parts = html.split(/(<[^>]+>)/g);
      var arr = [];
      parts.forEach(function(p){
        if(p.startsWith('<')) arr.push({t:'tag', c:p});
        else {
          for(var i=0; i<p.length; i++) arr.push({t:'char', c:p[i]});
        }
      });
      
      var idx = 0;
      function next() {
        if(skipFlag){el.innerHTML=html;el.classList.remove('type-cursor');setTimeout(cb,0);return}
        if(idx < arr.length) {
          var htmlStr = "";
          for(var j=0; j<=idx; j++) htmlStr += arr[j].c;
          el.innerHTML = htmlStr;
          idx++;
          // 人間が打っているようなランダムな遅延を加える
          var delay = arr[idx-1].t === 'tag' ? 0 : 40 + Math.random() * 60;
          setTimeout(next, delay);
        } else {
          el.classList.remove('type-cursor'); // 打ち終わったらカーソルを消す
          setTimeout(cb, 400); // 次の文章までの少しの間
        }
      }
      setTimeout(next, 200);
    }

    // 順番にタイピングを実行 (画面表示から1.5秒後に開始)
    setTimeout(function() {
      typeHTML(m1, texts[0], function(){
        typeHTML(m2, texts[1], function(){
          typeHTML(m3, texts[2], function(){
            var stWrap = document.getElementById('st-wrap');
            stWrap.style.opacity = 1; seenIntro=true; var hn=document.getElementById('hint'); if(hn) hn.hidden=true;
            setTimeout(function() {
              stWrap.scrollIntoView({ behavior: 'smooth', block: 'end' });
            }, 200); // ボタンが表示されてから少しだけ待って自然にスクロール
          });
        });
      });
    }, skipFlag?0:1500);
}
