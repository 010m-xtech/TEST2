<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>オハラマーラーStorybook - こだわりのひとさらを</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&family=Shippori+Mincho:wght@400;600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['"Shippori Mincho"', '"Noto Serif JP"', 'serif'],
            sans: ['"Inter"', 'sans-serif'],
          },
          colors: {
            sumi: '#1c1b1a',
            washi: '#fcfaf6',
            kinari: '#f4efe6',
            accent: '#c85a32',
            sakeGold: '#d4af37',
            bengara: '#b84433',
            bengaraDark: '#9e3626',
            bengaraLight: '#c9513f',
          }
        }
      }
    }
  </script>
  <style>
    /* 縦書きテキスト用 */
    .vertical-rl {
      writing-mode: vertical-rl;
      text-orientation: mixed;
    }
    /* 深みのある朱赤・テラコッタ背景 */
    body {
      background-color: #a43425;
      color: #2b2826;
      background-image: 
        radial-gradient(rgba(0, 0, 0, 0.08) 0.8px, transparent 0.8px),
        linear-gradient(160deg, #c54e3c 0%, #b84433 45%, #9b3223 100%);
      background-size: 18px 18px, 100% 100%;
      background-attachment: fixed;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .terracotta-bg {
      background-color: #b84433;
      background-image: 
        radial-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1px),
        linear-gradient(175deg, #c64d3b 0%, #b84433 50%, #a83a2b 100%);
      background-size: 20px 20px, 100% 100%;
    }
    html {
      scroll-behavior: smooth;
    }
    
    /* モーダル表示アニメーション */
    .modal-enter {
      animation: modalFadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes modalFadeIn {
      from { opacity: 0; transform: translateY(20px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .magazine-shadow {
      box-shadow: 0 20px 45px -15px rgba(28, 27, 26, 0.28), 0 0 1px 1px rgba(0, 0, 0, 0.05);
    }
    /* バブルの影とタッチエフェクト */
    .bubble-item {
      touch-action: none;
      transition: transform 0.08s ease-out;
      will-change: transform;
    }
    .bubble-item:active {
      transform: scale(0.92);
    }

    /* 導入動画フェードアウト */
    .video-fade-out {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease-out;
    }
  </style>
</head>
<body class="font-sans antialiased min-h-screen flex flex-col items-center">

  <!-- ======================================================== -->
  <!-- 導入オープニング動画オーバーレイ (dounyuu.mp4) -->
  <!-- ======================================================== -->
  <div id="introOverlay" class="fixed inset-0 z-50 bg-black flex items-center justify-center overflow-hidden transition-opacity duration-500">
    <video 
      id="introVideo" 
      src="dounyuu.mp4" 
      playsinline 
      webkit-playsinline 
      autoplay 
      muted 
      class="w-full h-full object-cover"
    ></video>

    <!-- わかりやすいスキップボタン（右上に配置） -->
    <button 
      id="skipVideoBtn" 
      onclick="endIntroVideo()"
      class="absolute top-5 right-5 z-20 px-4 py-2.5 bg-black/60 hover:bg-black/80 text-white rounded-full text-xs font-serif font-bold tracking-widest border border-white/40 shadow-xl backdrop-blur-md flex items-center gap-1.5 active:scale-95 transition-all"
    >
      <span>スキップ</span>
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7"/>
      </svg>
    </button>

    <!-- 下部インフォメーション -->
    <div class="absolute bottom-6 left-1/2 -translate-x-1/2 z-20 text-center pointer-events-none px-4">
      <span class="text-white/80 font-serif text-[11px] tracking-[0.25em] bg-black/40 px-3 py-1.5 rounded-full border border-white/15 backdrop-blur-xs">
        オハラマーラーStorybook
      </span>
    </div>
  </div>

  <!-- スマホ枠コンテナ -->
  <div class="w-full max-w-md min-h-screen terracotta-bg shadow-2xl relative flex flex-col pb-20 border-x border-orange-950/20 text-stone-900">

    <!-- トップヘッダー（左側に logo-footer.png ＋ タイトル） -->
    <header class="sticky top-0 z-30 bg-[#b84433]/90 backdrop-blur-md border-b border-orange-950/20 px-4 py-3 flex items-center shadow-sm">
      <div class="flex items-center gap-2.5 min-w-0">
        <!-- ヘッダーロゴ（logo-footer.png） -->
        <div class="w-10 h-10 rounded-full overflow-hidden shrink-0 border border-white/40 p-0.5 bg-white shadow-sm flex items-center justify-center">
          <img 
            id="headerLogoImg"
            src="logo-footer.png" 
            alt="オハラマーラ ロゴ" 
            class="w-full h-full object-contain rounded-full"
            onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1541544741938-0af808871cc0?auto=format&fit=crop&w=150&q=80';"
          >
        </div>
        <div class="min-w-0">
          <span class="text-[10px] tracking-[0.2em] text-white/90 font-serif font-semibold block truncate leading-tight">こだわりのひとさらを</span>
          <h1 class="font-serif text-lg font-bold text-white tracking-wider drop-shadow-sm truncate leading-snug">オハラマーラーStorybook</h1>
        </div>
      </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="flex-1 p-4 space-y-6">

      <!-- 動的バブルステージ（大きくなった丸アイコンが優雅に動き回るエリア） -->
      <section class="relative rounded-2xl bg-[#f5f3ef] p-4 overflow-hidden border border-white/80 shadow-lg">
        <div class="flex justify-between items-baseline mb-2">
          <div class="flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-[#b84433] animate-ping"></span>
            <span class="text-xs font-bold tracking-widest text-[#b84433] font-serif">公開中！名物と逸品</span>
          </div>
          <span class="text-[11px] text-stone-500 font-serif">タップでこだわりを開く</span>
        </div>

        <!-- 丸が元気に動き回るインタラクティブステージ -->
        <div id="bubbleStage" style="height: 380px; min-height: 380px;" class="relative w-full rounded-xl overflow-hidden bg-[#ece8e1]/60 border border-stone-200/80 cursor-grab active:cursor-grabbing">
          <!-- 背景装飾文字 -->
          <div class="absolute inset-0 flex flex-col items-center justify-center opacity-10 pointer-events-none select-none">
            <span class="font-serif text-4xl font-extrabold tracking-[0.35em] text-stone-900">OHARA MALA</span>
            <span class="text-xs font-serif tracking-[0.2em] text-stone-700 mt-1">麻辣・旬味探訪</span>
          </div>

          <!-- バブル要素群（12個の大きめ円形写真） -->
          <div id="bubblesContainer" class="absolute inset-0"></div>
        </div>

        <!-- 操作ガイドの補足 -->
        <div class="mt-2.5 flex items-center justify-between text-[11px] text-stone-600 font-serif border-t border-stone-200/90 pt-2">
          <span class="flex items-center gap-1">
            <span class="inline-block w-1.5 h-1.5 rounded-full bg-[#b84433]"></span>
            指で弾いて遊べます
          </span>
          <span class="text-[#b84433] font-semibold">気になる丸を押してみてね ↗</span>
        </div>
      </section>

      <!-- コンセプト案内バナー（待機時間に読んでもらうための導入） -->
      <section class="bg-washi/95 rounded-xl p-4 border border-orange-950/10 shadow-md">
        <div class="flex items-start gap-3.5">
          <!-- お店ロゴエリア（logo-footer.png） -->
          <div class="w-12 h-12 rounded-full overflow-hidden shrink-0 border-2 border-[#b84433]/30 p-0.5 bg-white shadow-sm flex items-center justify-center">
            <img 
              id="shopLogoImg"
              src="logo-footer.png" 
              alt="オハラマーラ ロゴ" 
              class="w-full h-full object-contain rounded-full"
              onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1541544741938-0af808871cc0?auto=format&fit=crop&w=150&q=80';"
            >
          </div>

          <div class="flex-1 min-w-0">
            <h2 class="text-xs font-bold text-sumi tracking-wider mb-1.5 font-serif">
              「待つ時間」を、いちばん贅沢なひとときに。
            </h2>
            <p class="text-[12px] text-stone-700 leading-relaxed font-serif">
              痺れるほど美味しい創作中華。<br>お時間ある際当店自慢のこだわりを覗いてください。
            </p>
          </div>
        </div>
      </section>

      <!-- 雑誌スタイル・メニューカード一覧（全12品の2分割グリッドレイアウト） -->
      <section class="space-y-3">
        <!-- 見出しと注釈エリア（中央揃え） -->
        <div class="border-b border-white/25 pb-2.5 text-center flex flex-col items-center justify-center">
          <h3 class="font-serif font-bold text-base text-white flex items-center justify-center gap-2 drop-shadow-sm">
            <span class="w-1.5 h-4 bg-amber-300 rounded-full inline-block"></span>
            こだわりメニュー
          </h3>
          <!-- 注釈メッセージ（中央揃え） -->
          <div class="mt-2 inline-flex items-center justify-center gap-1.5 bg-black/15 backdrop-blur-xs border border-white/15 px-3 py-1.5 rounded-lg text-orange-100 mx-auto">
            <span class="text-amber-300 font-bold text-xs shrink-0 leading-tight">※</span>
            <p class="text-[11px] leading-tight font-serif text-white/90 text-center">
              こちらからは注文できませんのでご注意ください。
            </p>
          </div>
        </div>

        <!-- 2列に並ぶボタンメニューグリッド（全12品） -->
        <div id="menuCardsList" class="grid grid-cols-2 gap-2.5">
          <!-- JSで12品のメニューカードを動的生成 -->
        </div>
      </section>

    </main>

    <!-- 雑誌風こだわり解説モーダル -->
    <div id="detailModal" class="fixed inset-0 z-50 bg-black/65 backdrop-blur-sm hidden flex items-center justify-center p-3 sm:p-4 overflow-y-auto">
      <div id="modalCard" class="bg-washi w-full max-w-md rounded-2xl overflow-hidden magazine-shadow relative my-auto modal-enter border border-stone-200 flex flex-col max-h-[90vh]">

        <!-- 右上の閉じる「×」ボタン -->
        <button onclick="closeModal()" aria-label="閉じる" class="absolute top-3.5 right-3.5 z-30 w-8 h-8 rounded-full bg-stone-100/90 backdrop-blur-sm flex items-center justify-center hover:bg-stone-200 text-stone-700 transition-colors shadow-sm">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>

        <!-- モーダル本文 -->
        <div class="overflow-y-auto flex-1 p-5 space-y-4 font-serif">

          <!-- タイトル＆ペアリング酒名 -->
          <div class="border-b border-stone-300 pb-2.5 pr-9">
            <h2 id="modalTitle" class="text-2xl font-extrabold text-sumi tracking-tight mb-1"></h2>
            <div class="flex items-center gap-2">
              <span class="text-xs font-bold text-[#b84433] tracking-wider">ペアリング酒・相性：</span>
              <span id="modalPairingName" class="text-xs font-semibold text-stone-800"></span>
            </div>
          </div>

          <!-- 料理ビジュアル＆エモーショナルコピーエリア -->
          <div class="relative rounded-xl overflow-hidden shadow-md bg-stone-900">
            <img id="modalImage" src="" alt="料理写真" class="w-full h-56 object-cover opacity-90 transition-transform duration-700 hover:scale-105" onerror="this.src='https://placehold.co/600x400/222/fff?text=料理写真'">
            <!-- 縦書き詩的コピー -->
            <div class="absolute top-3 right-3 bg-black/55 backdrop-blur-sm p-3 rounded-lg border border-white/15 text-white shadow-lg">
              <p id="modalVerticalPoem" class="vertical-rl text-xs font-medium tracking-widest leading-loose max-h-44"></p>
            </div>
          </div>

          <!-- ストーリー＆味の調和解説 -->
          <div class="bg-kinari/60 p-4 rounded-xl border border-stone-200">
            <p id="modalStory" class="text-xs text-stone-700 leading-relaxed text-justify"></p>
          </div>

          <!-- ペアリング地酒・ドリンクのディテール -->
          <div class="flex items-center gap-3.5 bg-white p-3.5 rounded-xl border border-stone-200">
            <div class="w-16 h-20 bg-stone-100 rounded-lg flex items-center justify-center p-1 shrink-0 overflow-hidden">
              <img id="modalSakeImage" src="" alt="お酒" class="max-h-full object-contain" onerror="this.src='https://placehold.co/100x200/eee/333?text=地酒'">
            </div>
            <div class="flex-1 min-w-0">
              <span class="text-[10px] text-amber-700 font-bold tracking-widest block mb-0.5">RECOMMENDED PAIRING</span>
              <h4 id="modalSakeTitle" class="text-sm font-bold text-sumi truncate"></h4>
              <p id="modalSakeBrewery" class="text-[11px] text-stone-500 mb-1"></p>
              <p id="modalSakeDesc" class="text-[11px] text-stone-600 line-clamp-2 leading-snug"></p>
            </div>
          </div>

        </div>

        <!-- フッターアクション -->
        <div class="p-3 bg-stone-50 border-t border-stone-200 flex gap-2">
          <button onclick="closeModal()" class="flex-1 py-2.5 rounded-xl bg-sumi text-white text-xs font-serif font-bold tracking-wider hover:bg-stone-800 active:scale-95 transition-all">
            メニュー一覧へ戻る
          </button>
        </div>

      </div>
    </div>

  </div>

  <script>

    // オープニング動画の制御（スキップ & 再生完了でメインへ）
    // ========================================================
    const introOverlay = document.getElementById("introOverlay");
    const introVideo = document.getElementById("introVideo");
    let isIntroEnded = false;

    function endIntroVideo() {
      if (isIntroEnded) return;
      isIntroEnded = true;
      introOverlay.classList.add("video-fade-out");
      setTimeout(() => {
        introOverlay.style.display = "none";
        try { introVideo.pause(); } catch(e){}
        // 動画終了時にステージのサイズを同期・再描画
        initFloatingBubbles();
      }, 500);
    }

    introVideo.addEventListener("ended", endIntroVideo);
    introVideo.addEventListener("error", () => {
      console.warn("dounyuu.mp4の読み込みができなかったためスキップします");
      endIntroVideo();
    });

    // ========================================================
    // 大きくなった丸が枠内を元気に跳ね回る物理シミュレーション
    // ========================================================
    let bubbles = [];
    let animationFrameId = null;
    let stageWidth = 320;
    let stageHeight = 380;
    const BUBBLE_RADIUS = 35;
    const BUBBLE_DIAMETER = BUBBLE_RADIUS * 2;

    class DynamicBubble {
      constructor(item, index, total) {
        this.item = item;
        this.radius = BUBBLE_RADIUS;
        
        // 12個の初期配置
        const padding = 12;
        const cols = 4;
        const col = index % cols;
        const row = Math.floor(index / cols);
        
        const usableW = Math.max(160, stageWidth - padding * 2 - this.radius * 2);
        const usableH = Math.max(180, stageHeight - padding * 2 - this.radius * 2);

        this.x = padding + this.radius + col * (usableW / (cols - 1 || 1)) + (Math.random() * 6 - 3);
        this.y = padding + this.radius + row * (usableH / 2) + (Math.random() * 6 - 3);

        // 浮遊・跳ね回り速度
        const speed = 1.0 + Math.random() * 0.6;
        const angle = Math.random() * Math.PI * 2;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;

        this.noiseOffset = Math.random() * 100;

        this.isDragging = false;
        this.dragStartX = 0;
        this.dragStartY = 0;
        this.hasMoved = false;

        // DOM要素
        this.element = document.createElement("div");
        this.element.className = "bubble-item absolute select-none cursor-pointer";
        this.element.style.width = `${BUBBLE_DIAMETER}px`;
        this.element.style.height = `${BUBBLE_DIAMETER}px`;

        const fallback = fallbackImages[item.id] || 'https://placehold.co/140x140/b84433/fff?text=逸品';

        this.element.innerHTML = `
          <div class="relative w-full h-full rounded-full bg-white p-[2.5px] shadow-[0_5px_15px_rgba(0,0,0,0.22)] border-2 border-white hover:border-[#b84433] hover:shadow-[0_8px_22px_rgba(184,68,51,0.4)] transition-all overflow-hidden">
            <img 
              src="${item.image}" 
              alt="${item.title}" 
              class="w-full h-full object-cover rounded-full pointer-events-none filter saturate-[1.08]" 
              onerror="this.onerror=null; this.src='${fallback}';"
            >
          </div>
        `;

        this.setupEvents();
      }

      setupEvents() {
        let startClientX = 0;
        let startClientY = 0;

        const onPointerDown = (e) => {
          this.isDragging = true;
          this.hasMoved = false;
          const point = e.touches ? e.touches[0] : e;
          startClientX = point.clientX;
          startClientY = point.clientY;
          this.dragStartX = point.clientX;
          this.dragStartY = point.clientY;
        };

        const onPointerMove = (e) => {
          if (!this.isDragging) return;
          const point = e.touches ? e.touches[0] : e;
          const dx = point.clientX - this.dragStartX;
          const dy = point.clientY - this.dragStartY;
          
          if (Math.hypot(point.clientX - startClientX, point.clientY - startClientY) > 6) {
            this.hasMoved = true;
          }

          this.x += dx;
          this.y += dy;
          this.vx = dx * 0.4;
          this.vy = dy * 0.4;

          this.dragStartX = point.clientX;
          this.dragStartY = point.clientY;
        };

        const onPointerUp = () => {
          if (this.isDragging) {
            this.isDragging = false;
            if (!this.hasMoved) {
              openModal(this.item.id);
            }
          }
        };

        this.element.addEventListener("mousedown", onPointerDown);
        window.addEventListener("mousemove", onPointerMove);
        window.addEventListener("mouseup", onPointerUp);

        this.element.addEventListener("touchstart", onPointerDown, { passive: true });
        window.addEventListener("touchmove", onPointerMove, { passive: true });
        window.addEventListener("touchend", onPointerUp);
      }

      update() {
        if (!this.isDragging) {
          this.noiseOffset += 0.02;
          this.vx += Math.sin(this.noiseOffset) * 0.04;
          this.vy += Math.cos(this.noiseOffset) * 0.04;

          const speed = Math.hypot(this.vx, this.vy);
          if (speed > 2.2) {
            this.vx = (this.vx / speed) * 2.2;
            this.vy = (this.vy / speed) * 2.2;
          } else if (speed < 0.5) {
            this.vx = (this.vx / (speed || 1)) * 0.7;
            this.vy = (this.vy / (speed || 1)) * 0.7;
          }

          this.x += this.vx;
          this.y += this.vy;

          const leftWall = this.radius;
          const rightWall = stageWidth - this.radius;
          const topWall = this.radius;
          const bottomWall = stageHeight - this.radius;

          if (this.x < leftWall) {
            this.x = leftWall;
            this.vx = Math.abs(this.vx) * 0.95;
          } else if (this.x > rightWall) {
            this.x = rightWall;
            this.vx = -Math.abs(this.vx) * 0.95;
          }

          if (this.y < topWall) {
            this.y = topWall;
            this.vy = Math.abs(this.vy) * 0.95;
          } else if (this.y > bottomWall) {
            this.y = bottomWall;
            this.vy = -Math.abs(this.vy) * 0.95;
          }
        }

        const left = this.x - this.radius;
        const top = this.y - this.radius;
        this.element.style.transform = `translate3d(${left}px, ${top}px, 0)`;
      }
    }

    // バブル同士のふんわり衝突・反発処理
    function resolveBubbleCollisions() {
      for (let i = 0; i < bubbles.length; i++) {
        for (let j = i + 1; j < bubbles.length; j++) {
          const b1 = bubbles[i];
          const b2 = bubbles[j];
          const dx = b2.x - b1.x;
          const dy = b2.y - b1.y;
          const dist = Math.hypot(dx, dy);
          const minDist = b1.radius + b2.radius + 3;

          if (dist < minDist && dist > 0) {
            const overlap = (minDist - dist) * 0.5;
            const nx = dx / dist;
            const ny = dy / dist;

            if (!b1.isDragging) {
              b1.x -= nx * overlap;
              b1.y -= ny * overlap;
              b1.vx -= nx * 0.3;
              b1.vy -= ny * 0.3;
            }
            if (!b2.isDragging) {
              b2.x += nx * overlap;
              b2.y -= ny * overlap;
              b2.vx += nx * 0.3;
              b2.vy -= ny * 0.3;
            }
          }
        }
      }
    }

    // アニメーションループ
    function startBubbleLoop() {
      function loop() {
        resolveBubbleCollisions();
        bubbles.forEach(b => b.update());
        animationFrameId = requestAnimationFrame(loop);
      }
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      animationFrameId = requestAnimationFrame(loop);
    }

    // ステージ初期化
    function initFloatingBubbles() {
      const stage = document.getElementById("bubbleStage");
      const container = document.getElementById("bubblesContainer");
      if (!stage || !container) return;
      
      container.innerHTML = '';
      bubbles = [];

      stageWidth = stage.clientWidth || 320;
      stageHeight = stage.clientHeight || 380;

      menuData.forEach((item, index) => {
        const bubble = new DynamicBubble(item, index, menuData.length);
        bubbles.push(bubble);
        container.appendChild(bubble.element);
      });

      startBubbleLoop();
    }

    // メニューカード一覧の描画
    function renderMenuCards() {
      const container = document.getElementById("menuCardsList");
      if (!container) return;
      container.innerHTML = '';

      menuData.forEach((item) => {
        const card = document.createElement("article");
        card.className = "group bg-white rounded-xl p-2.5 border border-stone-200 shadow-sm hover:shadow-md transition-all active:scale-[0.97] cursor-pointer flex flex-col justify-between overflow-hidden";
        
        const fallback = fallbackImages[item.id] || 'https://placehold.co/300x225/b84433/fff?text=逸品';

        card.innerHTML = `
          <!-- 四角形（角丸長方形）のお料理写真 -->
          <div class="w-full aspect-[4/3] rounded-lg overflow-hidden shrink-0 relative bg-stone-100 border border-stone-100 shadow-inner mb-2.5">
            <img 
              src="${item.image}" 
              alt="${item.title}" 
              class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105" 
              onerror="this.onerror=null; this.src='${fallback}';"
            >
          </div>

          <!-- メニュー名 -->
          <div class="w-full mb-2 text-center">
            <h4 class="font-serif font-bold text-sumi text-xs leading-snug line-clamp-2">
              ${item.title}
            </h4>
          </div>

          <!-- こだわりを読む -->
          <div class="w-full pt-1.5 border-t border-stone-100 flex items-center justify-center mt-auto">
            <span class="text-[10.5px] font-bold text-[#b84433] font-serif flex items-center gap-0.5 group-hover:underline">
              こだわりを読む
              <svg class="w-2.5 h-2.5 inline shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
              </svg>
            </span>
          </div>
        `;

        card.addEventListener("click", () => {
          openModal(item.id);
        });

        container.appendChild(card);
      });
    }

    // モーダルオープン処理
    function openModal(id) {
      const item = menuData.find(m => m.id === id);
      if (!item) return;

      document.getElementById("modalTitle").innerText = item.title;
      document.getElementById("modalPairingName").innerText = item.pairingName;
      
      const modalImg = document.getElementById("modalImage");
      modalImg.src = item.image;
      modalImg.onerror = () => {
        modalImg.onerror = null;
        modalImg.src = fallbackImages[item.id] || 'https://placehold.co/600x400/222/fff?text=料理写真';
      };

      document.getElementById("modalStory").innerText = item.story;
      document.getElementById("modalVerticalPoem").innerText = item.verticalPoem;

      // お酒情報
      document.getElementById("modalSakeTitle").innerText = item.sake.title;
      document.getElementById("modalSakeBrewery").innerText = item.sake.brewery;
      document.getElementById("modalSakeDesc").innerText = item.sake.desc;
      document.getElementById("modalSakeImage").src = item.sake.image;

      // モーダル表示
      const modal = document.getElementById("detailModal");
      modal.classList.remove("hidden");
      document.body.style.overflow = "hidden";
    }

    // モーダルクローズ
    function closeModal() {
      const modal = document.getElementById("detailModal");
      modal.classList.add("hidden");
      document.body.style.overflow = "";
    }

    document.getElementById("detailModal").addEventListener("click", (e) => {
      if (e.target.id === "detailModal") {
        closeModal();
      }
    });

    window.addEventListener("resize", () => {
      const stage = document.getElementById("bubbleStage");
      if (stage) {
        stageWidth = stage.clientWidth || 320;
        stageHeight = stage.clientHeight || 380;
      }
    });

    window.addEventListener("DOMContentLoaded", () => {
      initFloatingBubbles();
      renderMenuCards();
    });
  </script>
