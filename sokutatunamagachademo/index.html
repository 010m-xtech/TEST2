<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>速達生ビールガチャ</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black select-none" style="-webkit-tap-highlight-color: transparent;">
    <div id="root"></div>

    <script type="text/babel" data-type="module" data-presets="react">
        const { useState, useMemo, useEffect, useRef } = React;

        // --- 景品データ定義 (アンケート関連文言を削除) ---
        const PRIZES = [
          { 
            id: 1, rank: '1等', prob: 5, 
            border: 'border-yellow-300', text: 'text-yellow-400',
            resultTitle: '1等当選おめでとう！', 
            giftLine1: '次回使える',
            giftLine2: 'ビール半額券',
            giftLine3: '3枚プレゼント！',
            imgUrl: 'https://i.postimg.cc/zvKxRHM9/hua-xiang5.png',
            soundType: 'fanfare'
          },
          { 
            id: 2, rank: '2等', prob: 15, 
            border: 'border-gray-400', text: 'text-gray-300',
            resultTitle: '2等当選おめでとう！', 
            giftLine1: '次回使える',
            giftLine2: 'ビール半額券',
            giftLine3: '2枚プレゼント！',
            imgUrl: null,
            soundType: 'fanfare'
          },
          { 
            id: 3, rank: '3等', prob: 80, 
            border: 'border-amber-600', text: 'text-amber-500',
            resultTitle: '3等当選おめでとう！', 
            giftLine1: '次回使える',
            giftLine2: 'ビール半額券',
            giftLine3: '1枚プレゼント！',
            imgUrl: null,
            soundType: 'fanfare'
          }
        ];

        // --- 黄金に輝くテキスト用スタイル ---
        const customStyles = `
        @keyframes floatUp {
          0% { transform: translateY(80px) scale(0.6); opacity: 0; }
          100% { transform: translateY(0) scale(1); opacity: 1; }
        }
        @keyframes shake {
          0%, 100% { transform: translateX(0); }
          25% { transform: translateX(-8px) rotate(-5deg); }
          75% { transform: translateX(8px) rotate(5deg); }
        }
        @keyframes popZoom {
          0% { transform: scale(0.5); opacity: 0; }
          70% { transform: scale(1.1); opacity: 1; }
          100% { transform: scale(1); opacity: 1; }
        }
        @keyframes imagePop {
          0% { transform: scale(0.1) translateY(100px) rotate(-10deg); opacity: 0; }
          60% { transform: scale(1.1) translateY(-20px) rotate(5deg); opacity: 1; }
          80% { transform: scale(0.95) translateY(10px) rotate(-2deg); }
          100% { transform: scale(1) translateY(0) rotate(0deg); opacity: 1; }
        }
        @keyframes riseUp {
          0% { transform: translateY(100vh) scale(0.3); opacity: 0; }
          10% { opacity: 0.8; }
          90% { opacity: 0.8; }
          100% { transform: translateY(-20vh) scale(1.5); opacity: 0; }
        }
        
        /* 🌟 変更箇所：透明度を使わず、直接濃い色で塗りつぶした完全な静止画サンバースト */
        .sunburst {
          background: repeating-conic-gradient(
            from 0deg,
            #000000 0deg,
            #000000 10deg,
            #3d2500 10deg,
            #211400 20deg
          );
        }
        
        .glass-highlight {
          background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0) 100%);
        }
        
        .gold-text-shimmer {
          background: linear-gradient(to bottom, #fff 0%, #fede53 30%, #f1ad04 70%, #9a6500 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          filter: drop-shadow(0px 2px 4px rgba(0, 0, 0, 0.8));
        }
        `;

        // --- ビールグラスを描画するSVGコンポーネント ---
        const BeerGlass = ({ rank }) => {
            const fillColors = {
                '1等': ['#FEF08A', '#EAB308', '#A16207'],
                '2等': ['#E5E7EB', '#9CA3AF', '#4B5563'],
                '3等': ['#FCD34D', '#D97706', '#92400E'],
            };
            const colors = fillColors[rank] || fillColors['1等'];

            return (
                <svg viewBox="0 0 100 100" className="w-full h-full drop-shadow-xl overflow-visible">
                    <defs>
                        <linearGradient id={`grad-${rank}`} x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stopColor={colors[0]} />
                            <stop offset="50%" stopColor={colors[1]} />
                            <stop offset="100%" stopColor={colors[2]} />
                        </linearGradient>
                    </defs>
                    <path d="M75 40 C 100 40, 100 75, 75 75" fill="none" stroke="rgba(255,255,255,0.4)" strokeWidth="6" strokeLinecap="round" />
                    <path d="M25 25 C 25 25, 20 85, 35 90 C 50 95, 60 95, 75 90 C 90 85, 85 25, 85 25 Z" fill={`url(#grad-${rank})`} stroke="rgba(255,255,255,0.6)" strokeWidth="3" />
                    <path d="M35 30 Q 30 60 40 85" fill="none" stroke="rgba(255,255,255,0.3)" strokeWidth="4" strokeLinecap="round" />
                    <React.Fragment>
                        <path d="M20 25 Q 30 5 55 15 Q 75 5 90 25 Q 95 35 85 40 Q 55 45 25 40 Q 15 35 20 25 Z" fill="#FFFFFF" />
                        <circle cx="35" cy="15" r="8" fill="#FFFFFF" />
                        <circle cx="65" cy="12" r="10" fill="#FFFFFF" />
                        <circle cx="50" cy="8" r="12" fill="#FFFFFF" />
                        <path d="M 75 15 L 80 10 M 80 20 L 85 18 M 70 20 L 68 15" stroke="yellow" strokeWidth="2" strokeLinecap="round" />
                    </React.Fragment>
                </svg>
            );
        };

        // --- ガチャマシンのコンポーネント ---
        const GachaMachine = ({ onPlay }) => {
            const [isImageLoaded, setIsImageLoaded] = useState(false);

            useEffect(() => {
                const timer = setTimeout(() => setIsImageLoaded(true), 3000);
                return () => clearTimeout(timer);
            }, []);

            return (
                <div 
                    className="flex flex-col items-center justify-center cursor-pointer group w-full h-[100dvh] touch-manipulation select-none" 
                    onClick={onPlay}
                >
                    <div className="relative w-full h-full transition-transform duration-300 active:scale-95 md:group-hover:scale-[1.02] flex items-center justify-center">
                        {!isImageLoaded && (
                            <div className="absolute inset-0 flex flex-col items-center justify-center z-20 bg-zinc-900/50 backdrop-blur-sm">
                                <div className="w-12 h-12 border-4 border-amber-500 border-t-transparent rounded-full animate-spin mb-4 shadow-[0_0_15px_rgba(245,158,11,0.5)]"></div>
                                <p className="text-amber-400 font-bold animate-pulse drop-shadow-md">ガチャ準備中...</p>
                            </div>
                        )}

                        <img 
                            src="https://github.com/user-attachments/assets/a3f56b5a-4215-4063-b622-80f7e6953db6" 
                            alt="速達生ビールガチャ" 
                            className={`w-full h-full max-h-[100dvh] object-cover drop-shadow-[0_20px_50px_rgba(0,0,0,0.8)] transition-opacity duration-700 ease-in-out ${isImageLoaded ? 'opacity-100' : 'opacity-0'}`}
                            onLoad={() => setIsImageLoaded(true)}
                            onError={(e) => {
                                e.target.onerror = null;
                                e.target.src = "https://placehold.co/1080x1080/27272a/f59e0b?text=Tap+to+Start!%5Cn(Your+Image+Here)";
                                setIsImageLoaded(true);
                            }}
                        />
                        <div className="absolute inset-0 bg-white opacity-0 active:opacity-10 md:group-hover:opacity-10 transition-opacity duration-300 pointer-events-none"></div>
                    </div>
                </div>
            );
        };

        // --- 詐欺対策用の現在時刻表示コンポーネント ---
        const RealTimeClock = () => {
            const [time, setTime] = useState(new Date());
            useEffect(() => {
                const timer = setInterval(() => setTime(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);
            
            const formattedTime = time.toLocaleString('ja-JP', { 
                year: 'numeric', month: '2-digit', day: '2-digit', 
                hour: '2-digit', minute: '2-digit', second: '2-digit' 
            });

            return (
                <div 
                    className="text-white font-mono text-xl sm:text-2xl md:text-3xl font-black tracking-widest drop-shadow-[0_3px_6px_rgba(0,0,0,0.95)] whitespace-nowrap"
                    style={{ WebkitTextStroke: '0.8px black', paintOrder: 'stroke fill' }}
                >
                    {formattedTime}
                </div>
            );
        };

        // --- アプリケーションのメイン ---
        const App = () => {
          const [stage, setStage] = useState('idle');
          const [prizeId, setPrizeId] = useState(null);
          const [isLoaded, setIsLoaded] = useState(false); 
          const [shopName, setShopName] = useState("店舗");

          const videoRef = useRef(null);
          const audioCtxRef = useRef(null);

          const activePrize = useMemo(() => {
              if (!prizeId) return null;
              return PRIZES.find(p => p.id === prizeId) || PRIZES[2];
          }, [prizeId]);

          useEffect(() => {
              const urlParams = new URLSearchParams(window.location.search);
              
              if (urlParams.get('action') === 'reset') {
                  localStorage.removeItem('beer_app_gacha_result_v2');
                  localStorage.removeItem('beer_app_gacha_result');
                  
                  const shopParam = urlParams.get('shop');
                  const newUrl = window.location.pathname + (shopParam ? `?shop=${shopParam}` : '');
                  window.history.replaceState({}, document.title, newUrl);
              }

              setShopName(urlParams.get('shop') || "店舗");

              // 古いデータのクリーンアップ
              if (localStorage.getItem('beer_app_gacha_result')) {
                  localStorage.removeItem('beer_app_gacha_result');
                  localStorage.removeItem('beer_app_survey_completed');
              }

              const savedPrizeId = localStorage.getItem('beer_app_gacha_result_v2');
              if (savedPrizeId) {
                  setPrizeId(parseInt(savedPrizeId, 10));
                  setStage('result');
              }
              
              setIsLoaded(true);
          }, []);

          const bubbles = useMemo(() => {
            return Array.from({ length: 400 }).map((_, i) => {
                const size = Math.random() * 20 + 5; 
                const left = Math.random() * 100;
                const duration = Math.random() * 4 + 2; 
                const delay = Math.random() * -10; 
                return { size, left, duration, delay };
            });
          }, []);

          const drawPrize = () => {
            const rand = Math.random() * 100;
            let sum = 0;
            for (const prize of PRIZES) {
                sum += prize.prob;
                if (rand <= sum) return prize;
            }
            return PRIZES[PRIZES.length - 1];
          };

          const playFanfare = (ctx) => {
              if (!ctx) return;
              try {
                  const playNote = (freq, startTime, duration) => {
                      const osc = ctx.createOscillator();
                      const gain = ctx.createGain();
                      osc.connect(gain);
                      gain.connect(ctx.destination);
                      osc.type = 'triangle'; 
                      osc.frequency.value = freq;
                      
                      gain.gain.setValueAtTime(0, startTime);
                      gain.gain.linearRampToValueAtTime(0.2, startTime + 0.05);
                      gain.gain.setValueAtTime(0.2, startTime + duration - 0.05);
                      gain.gain.linearRampToValueAtTime(0, startTime + duration);
                      
                      osc.start(startTime);
                      osc.stop(startTime + duration);
                  };
                  
                  const now = ctx.currentTime;
                  playNote(523.25, now, 0.15);
                  playNote(659.25, now + 0.15, 0.15);
                  playNote(783.99, now + 0.30, 0.15);
                  playNote(1046.50, now + 0.45, 0.5);
              } catch (e) {
                  console.error("Audio playback error:", e);
              }
          };

          useEffect(() => {
            if (stage === 'result' && activePrize && activePrize.soundType === 'fanfare') {
                playFanfare(audioCtxRef.current);
            }
          }, [stage, activePrize]);

          const handlePlay = () => {
            if (stage !== 'idle') return;

            if (!audioCtxRef.current) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) {
                    audioCtxRef.current = new AudioContext();
                }
            }
            if (audioCtxRef.current && audioCtxRef.current.state === 'suspended') {
                audioCtxRef.current.resume();
            }

            if (navigator.vibrate) {
                navigator.vibrate([100, 50, 100]); 
            }
            
            const prize = drawPrize();
            setPrizeId(prize.id);
            localStorage.setItem('beer_app_gacha_result_v2', prize.id.toString());
            setStage('playing_video');
            
            if (videoRef.current) {
                videoRef.current.currentTime = 0;
                videoRef.current.play().catch(e => console.error("動画の再生に失敗しました:", e));
            }
          };

          if (!isLoaded) return null;

          return (
            <React.Fragment>
              <style>{customStyles}</style>
              
              <div className="min-h-screen bg-gradient-to-b from-yellow-100 via-yellow-400 to-amber-600 font-sans overflow-x-hidden relative selection:bg-amber-800 selection:text-white">
                
                <div className="fixed inset-0 overflow-hidden pointer-events-none z-0">
                    {bubbles.map((bubble, i) => (
                        <div key={i}
                             className="absolute bottom-0 bg-white/50 rounded-full border border-white/40 backdrop-blur-[2px] shadow-[0_0_8px_rgba(255,255,255,0.6)]"
                             style={{
                                 width: `${bubble.size}px`, height: `${bubble.size}px`, left: `${bubble.left}%`,
                                 animation: `riseUp ${bubble.duration}s linear infinite ${bubble.delay}s`
                             }}
                        />
                    ))}
                    <div className="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-white/60 rounded-full blur-[100px] mix-blend-overlay"></div>
                    <div className="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-orange-600/30 rounded-full blur-[120px] mix-blend-color-burn"></div>
                </div>

                <div className="w-full mx-auto flex flex-col items-center justify-center min-h-[100dvh] relative z-10">
                    <div className="w-full h-[100dvh] flex justify-center items-center">
                        <GachaMachine onPlay={handlePlay} />
                    </div>
                </div>

                <div 
                    className={`fixed inset-0 bg-black z-50 flex items-center justify-center transition-opacity duration-300 ${stage === 'playing_video' ? 'opacity-100 pointer-events-auto' : 'opacity-0 pointer-events-none'}`}
                    style={{ visibility: stage === 'playing_video' ? 'visible' : 'hidden' }}
                >
                    <video 
                        ref={videoRef}
                        src="https://github.com/user-attachments/assets/e6cba716-a806-4e82-84cb-618aa012f1f2"
                        className="w-full h-full object-contain"
                        playsInline
                        onEnded={() => setStage('result')}
                    ></video>
                </div>

                {stage === 'result' && (
                    /* 🌟 変更箇所: 背景を強制的に真っ黒で塗りつぶし、後ろの映像が透けるのを完全に防ぐ */
                    <div 
                        className="fixed inset-0 z-50 flex flex-col justify-between items-center p-4 overflow-y-auto min-h-[100dvh]"
                        style={{ backgroundColor: '#000000' }} 
                    >
                        
                        {/* 🌟 変更箇所: 透明度を使わない静止画の濃いサンバーストを配置 */}
                        <div className="absolute inset-0 sunburst -z-10 pointer-events-none"></div>
                        
                        {activePrize && (
                            <div className="flex-grow flex flex-col items-center justify-center w-full max-w-[340px] md:max-w-xl py-4 animate-[popZoom_0.6s_cubic-bezier(0.175,0.885,0.32,1.275)_forwards]">
                                
                                <div className="flex items-center justify-center gap-3 md:gap-8 mb-4 relative">
                                    <div className={`w-20 h-20 md:w-36 md:h-36 rounded-full border-4 md:border-8 ${activePrize.border} flex flex-col items-center justify-center bg-zinc-900/95 ${activePrize.glow || 'shadow-[0_10px_40px_rgba(0,0,0,0.8)]'} relative z-10`}>
                                        <div className="absolute inset-0 rounded-full bg-gradient-to-b from-white/20 to-transparent pointer-events-none"></div>
                                        <span 
                                            className={`text-2xl md:text-5xl font-black ${activePrize.text} drop-shadow-[0_0_15px_rgba(255,255,255,0.4)] tracking-tighter`}
                                            style={{ WebkitTextStroke: '1.5px #000', paintOrder: 'stroke fill' }}
                                        >
                                            {activePrize.rank}
                                        </span>
                                        <React.Fragment>
                                            <span className="absolute -top-6 md:-top-8 text-3xl md:text-6xl drop-shadow-[0_10px_20px_rgba(0,0,0,0.8)] animate-bounce">👑</span>
                                            <span className="absolute top-1 left-1 text-base animate-ping">✨</span>
                                            <span className="absolute bottom-2 right-1 text-xl animate-pulse">✨</span>
                                        </React.Fragment>
                                    </div>
                                    
                                    <div className="relative z-10 flex items-center justify-center w-20 h-20 md:w-36 md:h-36">
                                        {activePrize.imgUrl ? (
                                            <img 
                                                src={activePrize.imgUrl} 
                                                alt={activePrize.rank} 
                                                className="w-full h-full object-contain filter drop-shadow-[0_15px_25px_rgba(0,0,0,0.8)] animate-[imagePop_0.8s_cubic-bezier(0.175,0.885,0.32,1.275)_forwards]" 
                                            />
                                        ) : (
                                            <div className="w-full h-full filter drop-shadow-[0_15px_25px_rgba(0,0,0,0.8)] bg-white/5 rounded-3xl p-1.5 backdrop-blur-sm border border-white/10 relative">
                                                <BeerGlass rank={activePrize.rank} />
                                            </div>
                                        )}
                                        <div className="absolute inset-0 bg-yellow-400 mix-blend-overlay animate-pulse rounded-full blur-2xl opacity-20 pointer-events-none"></div>
                                    </div>
                                </div>

                                {activePrize.name && (
                                    <h2 className={`text-2xl md:text-4xl font-black mb-2 drop-shadow-[0_5px_10px_rgba(0,0,0,0.9)] ${activePrize.text} tracking-tight text-center`} style={{ WebkitTextStroke: '1.5px #000', paintOrder: 'stroke fill' }}>
                                        {activePrize.name}
                                    </h2>
                                )}
                                
                                <div className="bg-zinc-900/90 px-4 py-4 md:px-12 md:py-6 rounded-2xl border-2 border-amber-500/30 text-center backdrop-blur-md shadow-[0_15px_30px_rgba(0,0,0,0.8)] relative z-10 w-full">
                                    <div className="text-xl md:text-3xl font-black text-yellow-400 tracking-tight leading-snug drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)] mb-2">
                                        {activePrize.resultTitle}
                                    </div>
                                    
                                    <div className="text-xl md:text-3xl font-black gold-text-shimmer tracking-tight leading-snug px-1">
                                        <div>{activePrize.giftLine1}</div>
                                        <div className="text-2xl md:text-4xl font-extrabold my-1">{activePrize.giftLine2}</div>
                                        <div className="text-3xl md:text-5xl font-black mt-1">
                                            {activePrize.giftLine3}
                                        </div>
                                    </div>
                                    
                                    <div className="mt-5 flex flex-col gap-2.5 items-center justify-center w-full">
                                        <div className="py-2.5 px-3 bg-gradient-to-r from-green-500 to-green-600 rounded-xl border-2 border-green-300 shadow-[0_0_20px_rgba(34,197,94,0.5)] w-full">
                                            <p className="text-base md:text-xl font-black text-white drop-shadow-md leading-snug">
                                                会計時にこの画面を見せて<br />
                                                景品をもらってね！
                                            </p>
                                        </div>
                                        <p className="text-yellow-300 font-black text-xs md:text-base drop-shadow-[0_2px_5px_rgba(0,0,0,0.9)] whitespace-nowrap tracking-wide">
                                            ※スクショか写真を撮って後で見せてください
                                        </p>
                                    </div>
                                </div>
                            </div>
                        )}
                        
                        <div className="w-full text-center pb-2 z-50">
                            {activePrize && <RealTimeClock />}
                        </div>
                    </div>
                )}
              </div>
            </React.Fragment>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
