    // エアホッケー物理シミュレーション
    let bubbles = [];
    let animationFrameId = null;
    let stageWidth = 320;
    let stageHeight = 380;
    const BUBBLE_RADIUS = 35; // 直径70px
    const BUBBLE_DIAMETER = BUBBLE_RADIUS * 2;

    class DynamicBubble {
      constructor(data, index, total) {
        this.data = data;
        this.isBrand = data.isBrand || false;
        this.radius = BUBBLE_RADIUS;
        
        const padding = 12;
        const cols = 4;
        const col = index % cols;
        const row = Math.floor(index / cols);
        
        const usableW = Math.max(160, stageWidth - padding * 2 - this.radius * 2);
        const usableH = Math.max(180, stageHeight - padding * 2 - this.radius * 2);

        this.x = padding + this.radius + col * (usableW / (cols - 1 || 1)) + (Math.random() * 6 - 3);
        this.y = padding + this.radius + row * (usableH / Math.max(1, Math.ceil(total / cols) - 1)) + (Math.random() * 6 - 3);

        this.baseSpeed = 0.95 + Math.random() * 0.35;
        const angle = Math.random() * Math.PI * 2;
        this.vx = Math.cos(angle) * this.baseSpeed;
        this.vy = Math.sin(angle) * this.baseSpeed;

        this.isDragging = false;
        this.dragStartX = 0;
        this.dragStartY = 0;
        this.hasMoved = false;

        this.element = document.createElement("div");
        this.element.className = "bubble-item absolute select-none cursor-pointer";
        this.element.style.width = `${BUBBLE_DIAMETER}px`;
        this.element.style.height = `${BUBBLE_DIAMETER}px`;

        if (this.isBrand) {
          this.element.innerHTML = `
            <div class="relative w-full h-full rounded-full bg-white p-[2.5px] shadow-[0_5px_15px_rgba(0,0,0,0.22)] border-2 border-amber-300 hover:border-[#b84433] hover:shadow-[0_8px_22px_rgba(184,68,51,0.4)] transition-all overflow-hidden flex items-center justify-center">
              <img 
                src="logo-footer.png" 
                alt="好味家" 
                class="w-full h-full object-contain rounded-full pointer-events-none p-1" 
                onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1541544741938-0af808871cc0?auto=format&fit=crop&w=150&q=80';"
              >
            </div>
          `;
        } else {
          const isVideo = data.mediaType === 'video' || (data.image && data.image.endsWith('.mp4'));
          const fallbackSrc = fallbackImages[data.id] || 'https://placehold.co/140x140/b84433/fff?text=逸品';
          const mediaHtml = isVideo
            ? `<video src="${data.image}" autoplay loop muted playsinline webkit-playsinline class="w-full h-full object-cover rounded-full pointer-events-none" onerror="this.onerror=null; this.outerHTML='<img src=\\'${fallbackSrc}\\' class=\\'w-full h-full object-cover rounded-full pointer-events-none\\'>';"></video>`
            : `<img src="${data.image}" alt="${data.title}" class="w-full h-full object-cover rounded-full pointer-events-none filter saturate-[1.08]" onerror="this.onerror=null; this.src='${fallbackSrc}';">`;

          this.element.innerHTML = `
            <div class="relative w-full h-full rounded-full bg-white p-[2.5px] shadow-[0_5px_15px_rgba(0,0,0,0.22)] border-2 border-white hover:border-[#b84433] hover:shadow-[0_8px_22px_rgba(184,68,51,0.4)] transition-all overflow-hidden flex items-center justify-center">
              ${mediaHtml}
            </div>
          `;
        }

        this.setupEvents();
      }

      setupEvents() {
        let startClientX = 0;
        let startClientY = 0;

        const onPointerDown = (e) => {
          this.isDragging = true;
          this.hasMoved = false;
          const point = e.touches ? e.touches[0] : e;
          startClientX = point.clientX;
          startClientY = point.clientY;
          this.dragStartX = point.clientX;
          this.dragStartY = point.clientY;
        };

        const onPointerMove = (e) => {
          if (!this.isDragging) return;
          const point = e.touches ? e.touches[0] : e;
          const dx = point.clientX - this.dragStartX;
          const dy = point.clientY - this.dragStartY;
          
          if (Math.hypot(point.clientX - startClientX, point.clientY - startClientY) > 6) {
            this.hasMoved = true;
          }

          this.x += dx;
          this.y += dy;
          this.vx = dx * 0.35;
          this.vy = dy * 0.35;

          this.dragStartX = point.clientX;
          this.dragStartY = point.clientY;
        };

        const onPointerUp = () => {
          if (this.isDragging) {
            this.isDragging = false;
            if (!this.hasMoved) {
              if (this.isBrand) {
                openBrandModal();
              } else {
                openModal(this.data.id);
              }
            }
          }
        };

        this.element.addEventListener("mousedown", onPointerDown);
        window.addEventListener("mousemove", onPointerMove);
        window.addEventListener("mouseup", onPointerUp);

        this.element.addEventListener("touchstart", onPointerDown, { passive: true });
        window.addEventListener("touchmove", onPointerMove, { passive: true });
        window.addEventListener("touchend", onPointerUp);
      }

      update() {
        if (!this.isDragging) {
          let speed = Math.hypot(this.vx, this.vy);

          if (speed < 0.05) {
            const angle = Math.random() * Math.PI * 2;
            this.vx = Math.cos(angle) * this.baseSpeed;
            this.vy = Math.sin(angle) * this.baseSpeed;
            speed = this.baseSpeed;
          }

          if (speed > this.baseSpeed) {
            this.vx *= 0.985;
            this.vy *= 0.985;
          } else if (speed < this.baseSpeed * 0.9) {
            const ratio = this.baseSpeed / speed;
            this.vx = this.vx * 0.98 + (this.vx * ratio) * 0.02;
            this.vy = this.vy * 0.98 + (this.vy * ratio) * 0.02;
          }

          this.x += this.vx;
          this.y += this.vy;

          const leftWall = this.radius;
          const rightWall = stageWidth - this.radius;
          const topWall = this.radius;
          const bottomWall = stageHeight - this.radius;

          if (this.x < leftWall) {
            this.x = leftWall;
            this.vx = Math.abs(this.vx);
          } else if (this.x > rightWall) {
            this.x = rightWall;
            this.vx = -Math.abs(this.vx);
          }

          if (this.y < topWall) {
            this.y = topWall;
            this.vy = Math.abs(this.vy);
          } else if (this.y > bottomWall) {
            this.y = bottomWall;
            this.vy = -Math.abs(this.vy);
          }
        }

        const left = this.x - this.radius;
        const top = this.y - this.radius;
        this.element.style.transform = `translate3d(${left}px, ${top}px, 0)`;
      }
    }

    function resolveBubbleCollisions() {
      for (let i = 0; i < bubbles.length; i++) {
        for (let j = i + 1; j < bubbles.length; j++) {
          const b1 = bubbles[i];
          const b2 = bubbles[j];
          const dx = b2.x - b1.x;
          const dy = b2.y - b1.y;
          const dist = Math.hypot(dx, dy);
          const minDist = b1.radius + b2.radius;

          if (dist < minDist && dist > 0) {
            const overlap = (minDist - dist) * 0.5;
            const nx = dx / dist;
            const ny = dy / dist;

            if (!b1.isDragging) {
              b1.x -= nx * overlap;
              b1.y -= ny * overlap;
            }
            if (!b2.isDragging) {
              b2.x += nx * overlap;
              b2.y += ny * overlap;
            }

            const kx = b1.vx - b2.vx;
            const ky = b1.vy - b2.vy;
            const p = 2 * (nx * kx + ny * ky) / 2;

            if (!b1.isDragging) {
              b1.vx -= p * nx * 0.98;
              b1.vy -= p * ny * 0.98;
            }
            if (!b2.isDragging) {
              b2.vx += p * nx * 0.98;
              b2.vy += p * ny * 0.98;
            }
          }
        }
      }
    }

    function startBubbleLoop() {
      function loop() {
        resolveBubbleCollisions();
        bubbles.forEach(b => b.update());
        animationFrameId = requestAnimationFrame(loop);
      }
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      animationFrameId = requestAnimationFrame(loop);
    }

    function initFloatingBubbles() {
      const stage = document.getElementById("bubbleStage");
      const container = document.getElementById("bubblesContainer");
      if (!stage || !container) return;
      
      container.innerHTML = '';
      bubbles = [];

      stageWidth = stage.clientWidth || 320;
      stageHeight = stage.clientHeight || 380;

      const allBubbleItems = [...menuData];
      allBubbleItems.splice(4, 0, { id: "brand_1", isBrand: true, title: "好味家" });

      allBubbleItems.forEach((item, index) => {
        const bubble = new DynamicBubble(item, index, allBubbleItems.length);
        bubbles.push(bubble);
        container.appendChild(bubble.element);
      });

      startBubbleLoop();
    }

    function renderMenuCards() {
      const container = document.getElementById("menuCardsList");
      if (!container) return;
      container.innerHTML = '';

      menuData.forEach((item) => {
        const card = document.createElement("article");
        card.className = "group bg-white rounded-xl p-2.5 border border-stone-200 shadow-sm hover:shadow-md transition-all active:scale-[0.97] cursor-pointer flex flex-col justify-between overflow-hidden";
        
        const isVideo = item.mediaType === 'video' || (item.image && item.image.endsWith('.mp4'));
        const fallbackSrc = fallbackImages[item.id] || 'https://placehold.co/300x225/b84433/fff?text=逸品';
        const mediaHtml = isVideo
          ? `<video src="${item.image}" autoplay loop muted playsinline webkit-playsinline class="w-full h-full object-cover pointer-events-none" onerror="this.onerror=null; this.outerHTML='<img src=\\'${fallbackSrc}\\' class=\\'w-full h-full object-cover transition-transform duration-300 group-hover:scale-105\\'>';"></video>`
          : `<img src="${item.image}" alt="${item.title}" class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105" onerror="this.onerror=null; this.src='${fallbackSrc}';">`;

        card.innerHTML = `
          <div class="w-full aspect-[4/3] rounded-lg overflow-hidden shrink-0 relative bg-stone-100 border border-stone-100 shadow-inner mb-2.5 flex items-center justify-center">
            ${mediaHtml}
          </div>

          <div class="w-full mb-2 text-center px-0.5">
            <h4 class="font-serif font-bold text-sumi text-xs leading-snug line-clamp-2 auto-phrase text-balance">
              ${item.title}
            </h4>
          </div>

          <div class="w-full pt-1.5 border-t border-stone-100 flex items-center justify-center mt-auto">
            <span class="text-[10.5px] font-bold text-[#b84433] font-serif flex items-center gap-0.5 group-hover:underline">
              こだわりを読む
              <svg class="w-2.5 h-2.5 inline shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
              </svg>
            </span>
          </div>
        `;

        card.addEventListener("click", () => {
          openModal(item.id);
        });

        container.appendChild(card);
      });
    }

    function openModal(id) {
      const item = menuData.find(m => m.id === id);
      if (!item) return;

      document.getElementById("modalTitle").innerText = item.title;
      
      const modalImg = document.getElementById("modalImage");
      const modalVid = document.getElementById("modalVideo");
      const isVideo = item.mediaType === 'video' || (item.image && item.image.endsWith('.mp4'));

      if (isVideo) {
        modalImg.classList.add("hidden");
        modalVid.classList.remove("hidden");
        modalVid.src = item.image;
        modalVid.onerror = () => {
          modalVid.classList.add("hidden");
          modalImg.classList.remove("hidden");
          modalImg.src = fallbackImages[item.id] || 'https://placehold.co/600x400/222/fff?text=料理写真';
        };
        const playPromise = modalVid.play();
        if (playPromise !== undefined) {
          playPromise.catch(() => {
            modalVid.classList.add("hidden");
            modalImg.classList.remove("hidden");
            modalImg.src = fallbackImages[item.id] || 'https://placehold.co/600x400/222/fff?text=料理写真';
          });
        }
      } else {
        modalVid.classList.add("hidden");
        try { modalVid.pause(); } catch(e){}
        modalImg.classList.remove("hidden");
        modalImg.className = "w-full h-full object-cover opacity-90 transition-transform duration-700 hover:scale-105";
        modalImg.src = item.image;
        modalImg.onerror = () => {
          modalImg.onerror = null;
          modalImg.src = fallbackImages[item.id] || 'https://placehold.co/600x400/222/fff?text=料理写真';
        };
      }

      document.getElementById("modalStory").innerText = item.story;
      document.getElementById("modalVerticalPoem").innerText = item.verticalPoem;

      const modal = document.getElementById("detailModal");
      modal.classList.remove("hidden");
      document.body.style.overflow = "hidden";
    }

    function openBrandModal() {
      document.getElementById("modalTitle").innerText = "好味家について";

      const modalImg = document.getElementById("modalImage");
      const modalVid = document.getElementById("modalVideo");
      if (modalVid) {
        modalVid.classList.add("hidden");
        try { modalVid.pause(); } catch(e){}
      }
      modalImg.classList.remove("hidden");
      modalImg.className = "w-full h-full object-contain p-6 bg-stone-900";
      modalImg.src = "logo-footer.png";
      modalImg.onerror = () => {
        modalImg.onerror = null;
        modalImg.src = 'https://images.unsplash.com/photo-1541544741938-0af808871cc0?auto=format&fit=crop&w=600&q=80';
      };

      document.getElementById("modalStory").innerText = "昭和三十二年に創業の好味家。本場関西仕込みのお好み焼をはじめ、ご当地グルメ「へきなん焼きそば」や「チーズお好み焼き」もおすすめメニュー。温かな接客でお腹も心も満たすよう心掛けています。";
      document.getElementById("modalVerticalPoem").innerText = "昭和三十二年創業の\n伝統ある味と空間を\nお楽しみください";

      const modal = document.getElementById("detailModal");
      modal.classList.remove("hidden");
      document.body.style.overflow = "hidden";
    }

    function closeModal() {
      const modal = document.getElementById("detailModal");
      const modalVid = document.getElementById("modalVideo");
      if (modalVid) {
        try { modalVid.pause(); } catch(e){}
      }
      if (modal) {
        modal.classList.add("hidden");
        document.body.style.overflow = "";
      }
    }

    document.getElementById("detailModal").addEventListener("click", (e) => {
      if (e.target.id === "detailModal") {
        closeModal();
      }
    });

    window.addEventListener("resize", () => {
      const stage = document.getElementById("bubbleStage");
      if (stage) {
        stageWidth = stage.clientWidth || 320;
        stageHeight = stage.clientHeight || 380;
      }
    });

    window.addEventListener("DOMContentLoaded", () => {
      initFloatingBubbles();
      renderMenuCards();
    });
  </script>
</body>
</html>
